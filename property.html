<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>매물 상세 | 옆커폰부동산에듀</title>
<meta name="description" content="경매 매물 상세 페이지로 이동합니다." />
<meta name="robots" content="noindex, follow" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/style.css">
<script>
  /* 매물 상세는 검색엔진이 읽을 수 있도록 /property/{글번호} 서버 렌더 주소로 옮겼다.
     예전에 뿌려진 property.html?id=... 링크가 계속 살아 있도록 여기서 넘겨준다. */
  (function () {
    var id = new URLSearchParams(location.search).get("id");
    location.replace(id ? "/property/" + encodeURIComponent(id) : "/");
  })();
</script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/"><img src="assets/logo-dark.png" alt="옆커폰부동산에듀"></a>
    <nav class="nav-menu">
      <a href="/">홈</a>
      <a href="/area">지역별 물건</a>
      <a href="https://blog.naver.com/ykphone_edu" target="_blank" rel="noopener">블로그</a>
    </nav>
    <a class="btn btn-gold" href="tel:010-6419-0759">전화상담</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>매물 페이지로 이동 중입니다</h1>
    <p class="lead">자동으로 넘어가지 않으면 아래 버튼을 눌러주세요.</p>
    <p style="margin-top:20px">
      <a class="btn btn-gold" href="/" id="fallback">매물 목록으로</a>
    </p>
  </div>
</section>

<script>
  var id = new URLSearchParams(location.search).get("id");
  if (id) {
    var a = document.getElementById("fallback");
    a.href = "/property/" + encodeURIComponent(id);
    a.textContent = "매물 상세 보기";
  }
</script>
</body>
</html>
