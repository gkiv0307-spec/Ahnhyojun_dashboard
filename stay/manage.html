      return '<div class="fileitem">📄 ' + UI.esc(f.name) + ' <span class="muted">(' + Math.round(f.size/1024) + 'KB)</span>' +
        '<span class="sp"></span><button type="button" class="btn btn-sm btn-ghost" data-rm="' + i + '">삭제</button></div>';
    }).join('');
  }
  UI.on(root, 'click', '[data-rm]', function(){ files.splice(Number(this.dataset.rm),1); renderFiles(); });

  UI.qs('#cancel').onclick = function(){ NAV.href='#/index'; };

  /* --- 제출 --- */
  f.onsubmit = function(e){
    e.preventDefault();
    var fd = new FormData(f);
    var loId = fd.get('lodgingId');
    var n = calcNights();
    if (!n) { UI.toast('체크아웃 날짜는 체크인 이후여야 합니다.', 'bad'); UI.qs('#checkOut').focus(); return; }
    if (loId === '__etc' && !String(fd.get('lodgingNameEtc')||'').trim()) {
      UI.toast('숙소명을 직접 입력해주세요.', 'bad'); return; }
    var applicant = isStaff
      ? { id:null, name:String(fd.get('applicantName') || '').trim() }
      : (Store.user(fd.get('applicantId')) || user);
    if (isStaff && !applicant.name) { UI.toast('신청자명을 입력해주세요.', 'bad'); return; }
    if (isStaff && !fd.get('branch')) { UI.toast('소속 지점을 선택해주세요.', 'bad'); return; }
    /* 처리 로그에 남길 사람. 직원용은 로그인이 없으므로 입력한 신청자 정보를 그대로 쓴다. */
    var actor = isStaff
      ? { id:'guest', name:applicant.name, role:'applicant', branch:fd.get('branch') }
      : user;
    var isProxyOn = proxy && proxy.checked;

    var reqDate = fd.get('requestedDate');
    var reqAt = (reqDate === STAY.ymd(new Date()))
      ? new Date().toISOString()
      : new Date(reqDate + 'T09:00:00').toISOString();

    var b = Store.createBooking({
      requestedAt: reqAt,
      applicantId: applicant.id, applicantName: applicant.name,
      branch: fd.get('branch'), dept: fd.get('dept'), phone: fd.get('phone'),
      purpose: fd.get('purpose'),
      lodgingType: fd.get('lodgingType'),
      lodgingId: loId === '__etc' ? null : loId,
      lodgingName: loId === '__etc' ? fd.get('lodgingNameEtc') : (Store.lodging(loId)||{}).name,
      checkIn: fd.get('checkIn'), checkOut: fd.get('checkOut'),
      adults: fd.get('adults'), children: fd.get('children'), rooms: fd.get('rooms'),
      guestName: fd.get('guestName'), guestPhone: fd.get('guestPhone'),
      estimatedCost: fd.get('estimatedCost'), costBearer: fd.get('costBearer'),
      specialRequest: fd.get('specialRequest'),
      attachments: files,
      proxyBy: isProxyOn ? user.name : null
    }, actor);

    UI.modal({
      title:'예약 신청이 접수되었습니다',
      body:'<div class="note" style="margin-bottom:14px">예약번호 <b style="font-size:17px">' + UI.esc(b.code) + '</b></div>' +
           '<dl class="dl one">' +
           '<div class="dr"><dt>숙소</dt><dd>' + UI.esc(b.lodgingName) + '</dd></div>' +
           '<div class="dr"><dt>일정</dt><dd>' + UI.esc(b.checkIn) + ' ~ ' + UI.esc(b.checkOut) + ' (' + b.nights + '박)</dd></div>' +
           '<div class="dr"><dt>인원/객실</dt><dd>' + b.guests + '명 / ' + b.rooms + '실</dd></div>' +
           '<div class="dr"><dt>예상비용</dt><dd>' + STAY.won(b.estimatedCost) + '</dd></div>' +
           '<div class="dr"><dt>현재상태</dt><dd>' + UI.badge('NEW') + '</dd></div></dl>' +
           '<p class="muted" style="font-size:12.5px;margin:12px 0 0">예약관리팀에 알림이 전달되었습니다.' +
           (isStaff ? ' <b>예약번호를 꼭 메모해두세요.</b> [내 예약 조회]에서 이 번호와 신청자명으로 진행상황을 확인할 수 있습니다.'
                    : ' 진행 상황은 예약 상세 화면에서 확인할 수 있습니다.') + '</p>',
      buttons: isStaff
        ? [ { label:'닫기' },
            { label:'진행상황 보기', cls:'btn-gold',
              onClick:function(){ NAV.href='#/mystay?code=' + encodeURIComponent(b.code); } } ]
        : [ { label:'목록으로', onClick:function(){ NAV.href='#/requests'; } },
            { label:'예약 상세 보기', cls:'btn-gold', onClick:function(){ NAV.href='#/detail?id=' + b.id; } } ]
    });
  };

  fillLodgings();
  calcGuests();
})();

};

PAGES["mystay"] = function(){

(function(){
  var root = UI.shell('mystay', '내 예약 조회', '예약번호와 신청자명으로 진행상황을 확인합니다');
  var ct = Store.settings().contact || { team:'부동산팀', name:'', title:'', phone:'' };
  var RECENT_KEY = 'ykp_stay_recent';
  var found = null;

  /* 조회에 성공한 예약번호만 이 브라우저에 기억한다(다음 방문 시 재입력 줄이기) */
  function recent(){
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e){ return []; }
  }
  function remember(code, name){
    try {
      var list = recent().filter(function(r){ return r.code !== code; });
      list.unshift({ code:code, name:name });
      localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5)));
    } catch(e){}
  }

  /* 예약번호는 대소문자·공백·접두어 유무를 가리지 않고 찾는다 */
  function normalize(code){
    return String(code || '').toUpperCase().replace(/\s/g, '');
  }
  function lookup(code, name){
    var c = normalize(code);
    var n = String(name || '').trim();
    if (!c || !n) return { err:'예약번호와 신청자명을 모두 입력해주세요.' };
    var hit = Store.bookings().filter(function(b){
      var bc = normalize(b.code);
      return bc === c || bc.slice(-4) === c;   /* 뒤 4자리만 입력해도 찾도록 */
    });
    if (!hit.length) return { err:'해당 예약번호를 찾을 수 없습니다. 번호를 다시 확인해주세요.' };
    var mine = hit.filter(function(b){ return b.applicantName === n || b.guestName === n; });
    if (!mine.length) return { err:'예약번호는 있으나 신청자명이 일치하지 않습니다. 신청하실 때 입력한 이름으로 조회해주세요.' };
    return { booking: mine[0] };
  }

  function render(msg){
    var r = recent();
    root.innerHTML =
     '<div class="pagehead"><div><h2>내 예약 진행상황 조회</h2>' +
       '<p>신청할 때 발급받은 <b>예약번호</b>와 <b>신청자명</b>을 입력하면 지금 어느 단계인지 확인할 수 있습니다.</p></div></div>' +

     '<div class="card"><div class="card-b">' +
       '<div class="frow f2" style="align-items:end">' +
         '<div class="field" style="margin:0"><label>예약번호<span class="req">*</span></label>' +
           '<input class="input" id="q_code" placeholder="STAY-2026-0001 (뒤 4자리만 입력해도 됩니다)" autocomplete="off"></div>' +
         '<div class="field" style="margin:0"><label>신청자명<span class="req">*</span></label>' +
           '<div class="btnrow" style="flex-wrap:nowrap">' +
             '<input class="input" id="q_name" placeholder="예) 김도현" autocomplete="off">' +
             '<button class="btn btn-gold" id="q_go" style="flex:none">조회</button></div></div>' +
       '</div>' +
       (r.length ? '<div class="hr"></div><div class="chips">' +
          '<span class="muted" style="font-size:12px;font-weight:700;align-self:center">최근 조회</span>' +
          r.map(function(x){
            return '<button class="chip" data-recent="' + UI.esc(x.code) + '" data-name="' + UI.esc(x.name) + '">' +
              UI.esc(x.code) + '</button>';
          }).join('') + '</div>' : '') +
     '</div></div>' +

     (msg ? '<div class="note bad mt">' + UI.esc(msg) + '</div>' : '') +
     '<div id="result" class="mt"></div>' +

     (found ? '' :
       '<div class="note info mt">예약번호를 잊으셨나요? 신청 직후 화면과 담당자 안내 메시지에 <b>STAY-연도-일련번호</b> 형식으로 안내됩니다. ' +
       '찾기 어려우시면 ' + UI.esc(ct.team) + ' ' + UI.esc(ct.phone) + ' 로 문의해주세요.</div>');

    if (found) drawResult(found);

    UI.qs('#q_go').onclick = doLookup;
    ['#q_code','#q_name'].forEach(function(sel){
      UI.qs(sel).addEventListener('keydown', function(e){ if (e.key === 'Enter') doLookup(); });
    });
  }

  function doLookup(){
    var code = UI.qs('#q_code').value, name = UI.qs('#q_name').value;
    var res = lookup(code, name);
    if (res.err) { found = null; render(res.err); UI.qs('#q_code').value = code; UI.qs('#q_name').value = name; return; }
    found = res.booking;
    remember(found.code, name.trim());
    render();
    UI.qs('#q_code').value = found.code; UI.qs('#q_name').value = name.trim();
  }

  /* ---------------- 결과 ---------------- */
  function drawResult(b){
    var logs = Store.bookingLogs(b.id);
    var lo = b.lodgingId ? Store.lodging(b.lodgingId) : null;
    var r = b.reservation || {};
    var confirmed = ['BOOKED','UPCOMING','USED','SETTLE_WAIT','SETTLING','SETTLED'].indexOf(b.status) >= 0;
    var closed = ['CANCELED','REJECTED'].indexOf(b.status) >= 0;

    /* 신청자에게는 처리 이력 중 '무슨 일이 있었는지'만 보여준다(내부 메모는 제외) */
    var visible = logs.filter(function(l){ return l.action !== '메모 작성'; });

    function dr(k, v){ return '<div class="dr"><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }

    UI.qs('#result').innerHTML =
     '<div class="card"><div class="card-h">' +
       '<h3>' + UI.esc(b.code) + '</h3>' + UI.badge(b.status) +
       '<span class="sp"></span><span class="sub">최종 변경 ' + UI.dtFull(b.updatedAt) + '</span></div>' +
      '<div class="card-b">' + UI.steps(b) + '</div>' +

      '<div class="card-b" style="border-top:1px solid var(--line-2)">' +
        statusMessage(b) +
        '<dl class="dl mt">' +
          dr('이용 숙소', UI.esc(b.lodgingName) + (lo ? ' <span class="tag ' + (lo.ownership==='DIRECT'?'direct':'partner') + '">' +
              UI.esc(STAY.OWNERSHIP[lo.ownership]) + '</span>' : '')) +
          dr('이용 목적', UI.esc(b.purpose)) +
          dr('체크인', UI.dateFull(b.checkIn) + ' ' + UI.dateK(b.checkIn) + (lo ? ' <span class="muted">' + UI.esc(lo.checkInTime) + '~</span>' : '')) +
          dr('체크아웃', UI.dateFull(b.checkOut) + ' ' + UI.dateK(b.checkOut) + (lo ? ' <span class="muted">~' + UI.esc(lo.checkOutTime) + '</span>' : '')) +
          dr('숙박일수', '<b>' + b.nights + '박 ' + (b.nights+1) + '일</b>') +
          dr('인원 / 객실', b.guests + '명 (성인 ' + b.adults + ' / 아동 ' + b.children + ') · ' + b.rooms + '실') +
          dr('신청자', UI.esc(b.applicantName) + ' <span class="muted">' + UI.esc(b.branch) + '</span>') +
          dr('예약자', UI.esc(b.guestName) + ' <span class="muted">' + UI.esc(b.guestPhone) + '</span>') +
          dr('예상 비용', STAY.won(b.estimatedCost) + ' <span class="muted">(' + UI.esc(STAY.COST_BEARER[b.costBearer]) + ')</span>') +
          dr('신청일', UI.dtFull(b.requestedAt)) +
        '</dl>' +
        (b.specialRequest ? '<div class="hr"></div><div class="muted" style="font-size:12.5px;font-weight:800">특별 요청사항</div>' +
          '<div style="margin-top:4px">' + UI.nl2br(b.specialRequest) + '</div>' : '') +
      '</div>' +

      (confirmed ? '<div class="card-b" style="border-top:1px solid var(--line-2);background:#fbfef9">' +
        '<div class="muted" style="font-size:12.5px;font-weight:800;margin-bottom:8px">🏨 예약 확정정보 — 체크인 시 아래 번호를 말씀하세요</div>' +
        '<dl class="dl">' +
          dr('숙소 예약번호', '<b style="font-size:15px">' + UI.esc(r.confirmNo || '-') + '</b>') +
          dr('객실 정보', UI.esc(r.roomInfo || '-')) +
          (lo && lo.managerPhone ? dr('숙소 연락처', UI.esc(lo.managerPhone)) : '') +
          (lo && lo.address ? dr('주소', UI.esc(lo.address)) : '') +
          dr('문의', UI.esc(ct.team) + ' <a href="tel:' + UI.esc(ct.phone) + '" style="text-decoration:underline">' +
             UI.esc(ct.phone) + '</a>') +
        '</dl>' +
        (lo && lo.caution ? '<div class="note warn" style="margin-top:10px">⚠ ' + UI.esc(lo.caution) + '</div>' : '') +
        (lo && lo.cancelPolicy ? '<div class="note mt" style="margin-top:8px">취소규정: ' + UI.esc(lo.cancelPolicy) + '</div>' : '') +
      '</div>' : '') +

      (b.status === 'REJECTED' && b.approval && b.approval.opinion
        ? '<div class="card-b" style="border-top:1px solid var(--line-2)">' +
          '<div class="note bad" style="margin:0">🚫 <b>반려 사유</b><br>' + UI.nl2br(b.approval.opinion) + '</div></div>' : '') +

      ((b.changeRequest && !b.changeRequest.handled) || (b.cancelRequest && !b.cancelRequest.handled)
        ? '<div class="card-b" style="border-top:1px solid var(--line-2)">' +
          '<div class="note warn" style="margin:0">✏️ 요청하신 ' +
          ((b.cancelRequest && !b.cancelRequest.handled) ? '취소' : '수정') +
          ' 건을 담당자가 확인하고 있습니다.</div></div>' : '') +

      (closed ? '' :
        '<div class="card-b no-print" style="border-top:1px solid var(--line-2)">' +
          '<div class="btnrow"><button class="btn" id="reqChange">수정 요청</button>' +
          '<button class="btn btn-danger" id="reqCancel">취소 요청</button>' +
          '<span class="muted" style="font-size:12px;align-self:center">전화하지 마시고 여기로 요청하시면 기록이 남습니다.</span></div>' +
        '</div>') +
     '</div>' +

     '<div class="card mt"><div class="card-h"><h3>🕒 진행 이력</h3><span class="sp"></span>' +
       '<span class="sub">' + visible.length + '건</span></div>' +
      '<div class="card-b"><div class="timeline">' +
        visible.map(function(l, i){
          var isLast = i === visible.length - 1;
          var bad = l.to === 'CANCELED' || l.to === 'REJECTED';
          return '<div class="tl ' + (bad ? 'bad' : (isLast && !closed ? 'now' : 'done')) + '">' +
            '<div class="td">' + UI.dtFull(l.at) + '</div>' +
            '<div class="tt">' + UI.esc(l.action) +
              (l.to ? ' <span class="badge b-' + l.to + '" style="font-size:10.5px"><i class="d"></i>' + STAY.STATUS[l.to].label + '</span>' : '') + '</div>' +
            '<div class="tm">' + UI.esc(l.userName) + ' <span class="muted">' + UI.esc(STAY.ROLES[l.role].short) + '</span>' +
            (l.memo ? '<br>' + UI.nl2br(l.memo) : '') + '</div></div>';
        }).join('') +
      '</div></div></div>';

    var rc = UI.qs('#reqChange');
    if (rc) rc.onclick = function(){
      UI.prompt('예약 수정 요청', '어떤 내용을 수정하고 싶으신가요?', { required:true, okLabel:'요청 보내기',
        placeholder:'예) 체크인을 하루 늦춰주세요 (8/21 → 8/22). 인원도 2명 추가됩니다.' }).then(function(v){

        UI.toast('수정 요청을 보냈습니다. 부동산팀이 확인 후 연락드립니다.', 'ok');

      });
    };
    var cc = UI.qs('#reqCancel');

      UI.prompt('예약 취소 요청', '취소 사유를 입력해주세요', { required:true, danger:true, okLabel:'취소 요청',
        hint:'숙소 취소규정에 따라 위약금이 발생할 수 있습니다.',
        placeholder:'예) 출장 일정이 취소되었습니다.' }).then(function(v){
        if (v == null) return;
        Store.requestChange(b.id, 'cancel', v, requester(b));
        UI.toast('취소 요청을 보냈습니다.', 'ok');
        found = Store.booking(b.id); render();
      });
    };
  }

  /* 요청 기록에 남길 사람 — 로그인이 없으므로 예약에 적힌 신청자를 그대로 쓴다 */
  function requester(b){
    return Store.user(b.applicantId) ||
      { id:b.applicantId || 'guest', name:b.applicantName, role:'applicant', branch:b.branch };
  }

  /* 지금 단계에서 신청자가 무엇을 기다리면 되는지 한 줄로 */
  function statusMessage(b){
    var M = {
      NEW:              ['info', '신청이 접수 대기 중입니다. 부동산팀이 확인하면 접수완료로 바뀝니다.'],
      RECEIVED:         ['info', '부동산팀이 접수했습니다. 신청 내용을 검토하고 있습니다.'],
      REVIEWING:        ['info', '신청 내용을 확인하고 있습니다. 추가 정보가 필요하면 연락드립니다.'],
      APPROVAL_PENDING: ['warn', '부동산팀 승인을 기다리고 있습니다.'],
      APPROVED:         ['info', '승인되었습니다. 부동산팀이 숙소에 예약을 진행할 예정입니다.'],
      BOOKING:          ['info', '부동산팀이 숙소에 예약을 진행하고 있습니다.'],
      BOOKED:           ['',     '예약이 확정되었습니다. 아래 숙소 예약번호로 체크인하시면 됩니다.'],
      UPCOMING:         ['',     '이용 예정입니다. 체크인 날짜를 확인해주세요.'],
      USED:             ['info', '숙박 이용이 끝났습니다. 부동산팀 정산이 진행됩니다.'],
      SETTLE_WAIT:      ['info', '정산 대기 중입니다. 신청자가 따로 하실 일은 없습니다.'],
      SETTLING:         ['info', '부동산팀이 정산 처리 중입니다.'],
      SETTLED:          ['',     '정산까지 모두 완료된 건입니다.'],
      CANCELED:         ['bad',  '취소된 예약입니다.'],
      REJECTED:         ['bad',  '반려된 예약입니다. 사유를 확인하고 조정 후 다시 신청해주세요.']
    };
    var m = M[b.status] || ['', ''];
    return '<div class="note ' + m[0] + '" style="margin:0">' +
      STAY.STATUS[b.status].icon + ' <b>' + UI.esc(STAY.STATUS[b.status].label) + '</b> — ' + UI.esc(m[1]) + '</div>';
  }

  UI.on(root, 'click', '[data-recent]', function(){
    UI.qs('#q_code').value = this.dataset.recent;
    UI.qs('#q_name').value = this.dataset.name || '';
    doLookup();
  });

  render();

  /* 신청 직후 안내 화면에서 넘어온 경우 예약번호를 미리 채워둔다 */
  var pre = UI.param('code');
  if (pre) {
    UI.qs('#q_code').value = pre;
    var last = recent().filter(function(x){ return x.code === pre; })[0];
    if (last) { UI.qs('#q_name').value = last.name; doLookup(); }
    else UI.qs('#q_name').focus();
  }
})();

};

PAGES["requests"] = function(){

(function(){
  var user = Auth.current();
  var root = UI.shell('requests', '예약 관리', '전체 숙박 예약 신청 목록');
  var today = STAY.ymd(new Date());
  var P = new URLSearchParams(NAV.search);

  /* 대시보드 "내 할일" 진입용 프리셋 */
  var TODO_FILTERS = {
    '접수해야 할 신규 신청': function(b){ return b.status==='NEW'; },
    '검토·승인요청 필요':   function(b){ return ['RECEIVED','REVIEWING'].indexOf(b.status)>=0; },
    '숙소 예약 진행 필요':  function(b){ return ['APPROVED','BOOKING'].indexOf(b.status)>=0; },
    '오늘 체크인':          function(b){ return b.checkIn===today && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; },
    '오늘 체크아웃':        function(b){ return b.checkOut===today; },
    '이용완료 처리 필요':   function(b){ return b.status==='UPCOMING' && b.checkOut < today; },
    '신청자 수정·취소 요청':function(b){ return (b.changeRequest && !b.changeRequest.handled) || (b.cancelRequest && !b.cancelRequest.handled); },
    '승인 대기':            function(b){ return b.status==='APPROVAL_PENDING'; },
    '접수 대기 신규 신청':  function(b){ return b.status==='NEW'; },
    '정산 필요':            function(b){ return ['SETTLE_WAIT','SETTLING'].indexOf(b.status)>=0; },
    '정산대기 (결제확인 필요)': function(b){ return b.status==='SETTLE_WAIT'; },
    '정산중 (증빙 확인 필요)':  function(b){ return b.status==='SETTLING'; },
    '반려된 내 신청':       function(b){ return b.status==='REJECTED' && b.applicantId===user.id; },
    '진행 중인 내 신청':    function(b){ return b.applicantId===user.id && ['NEW','RECEIVED','REVIEWING','APPROVAL_PENDING','APPROVED','BOOKING'].indexOf(b.status)>=0; },
    '예약 확정 · 이용예정': function(b){ return b.applicantId===user.id && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; },
    '내가 승인한 진행 건':  function(b){ return b.approval && b.approval.approverId===user.id && ['APPROVED','BOOKING','BOOKED','UPCOMING'].indexOf(b.status)>=0; }
  };

  var st = {
    q: P.get('q') || '',
    from: P.get('from') || '', to: P.get('to') || '',
    branch: P.get('branch') || '', applicant: P.get('applicant') || '',
    lodging: P.get('lodging') || '', status: P.get('status') || '',
    assignee: P.get('assignee') || '', pay: P.get('pay') || '',
    ci: P.get('ci') || '', co: P.get('co') || '', month: P.get('month') || '',
    todo: P.get('todo') || '',
    sort: 'requestedAt', dir: -1, page: 1, size: 20
  };

  var scopeNote = user.role === 'applicant'
    ? '<div class="note info" style="margin-bottom:14px">🔒 일반 신청자 권한입니다. <b>본인이 신청한 건과 ' + UI.esc(user.branch) + ' 소속 건</b>만 표시됩니다.</div>' : '';

  root.innerHTML = scopeNote +
   '<div class="pagehead"><div><h2>예약 관리</h2><p id="cntline"></p></div>' +
     '<div class="sp"></div><div class="btnrow">' +
       '<button class="btn" id="csv">CSV 내보내기</button>' +
       '<a class="btn btn-gold" href="#/new">＋ 신규 예약 신청</a></div></div>' +

   '<div class="card"><div class="card-b">' +
     '<div class="filterbar">' +
       '<div class="field"><label>통합검색</label><input class="input" id="f_q" placeholder="예약번호·신청자·숙소·목적" value="' + UI.esc(st.q) + '"></div>' +
       '<div class="field"><label>신청 기간 (부터)</label><input class="input" type="date" id="f_from" value="' + st.from + '"></div>' +
       '<div class="field"><label>신청 기간 (까지)</label><input class="input" type="date" id="f_to" value="' + st.to + '"></div>' +
       '<div class="field"><label>지점</label><select class="select" id="f_branch"><option value="">전체</option>' +
         branchOptions().map(function(b){ return '<option' + (b===st.branch?' selected':'') + '>' + UI.esc(b) + '</option>'; }).join('') + '</select></div>' +
       '<div class="field"><label>신청자</label><select class="select" id="f_applicant"><option value="">전체</option>' +
         Store.users().map(function(u){ return '<option value="' + u.id + '"' + (u.id===st.applicant?' selected':'') + '>' + UI.esc(u.name) + '</option>'; }).join('') + '</select></div>' +
       '<div class="field"><label>숙소</label><select class="select" id="f_lodging"><option value="">전체</option>' +
         Store.lodgings().map(function(l){ return '<option value="' + l.id + '"' + (l.id===st.lodging?' selected':'') + '>' + UI.esc(l.name) + '</option>'; }).join('') + '</select></div>' +
       '<div class="field"><label>예약상태</label><select class="select" id="f_status"><option value="">전체</option>' +
         STAY.STATUS_ORDER.map(function(k){ return '<option value="' + k + '"' + (k===st.status?' selected':'') + '>' + STAY.STATUS[k].label + '</option>'; }).join('') + '</select></div>' +
       '<div class="field"><label>담당자</label><select class="select" id="f_assignee"><option value="">전체</option><option value="__none"' + (st.assignee==='__none'?' selected':'') + '>미지정</option>' +
         Store.users().filter(function(u){ return u.role==='booker'||u.role==='admin'; }).map(function(u){
           return '<option value="' + u.id + '"' + (u.id===st.assignee?' selected':'') + '>' + UI.esc(u.name) + '</option>'; }).join('') + '</select></div>' +
       '<div class="field"><label>결제상태</label><select class="select" id="f_pay"><option value="">전체</option>' +
         Object.keys(STAY.PAY_STATUS).map(function(k){ return '<option value="' + k + '"' + (k===st.pay?' selected':'') + '>' + STAY.PAY_STATUS[k] + '</option>'; }).join('') + '</select></div>' +
       '<div class="field"><label>체크인 날짜</label><input class="input" type="date" id="f_ci" value="' + st.ci + '"></div>' +
       '<div class="field"><label>체크아웃 날짜</label><input class="input" type="date" id="f_co" value="' + st.co + '"></div>' +
       '<div class="field"><label>&nbsp;</label><div class="btnrow"><button class="btn btn-primary" id="apply">검색</button>' +
         '<button class="btn" id="reset">초기화</button></div></div>' +
     '</div>' +
     '<div class="hr"></div>' +
     '<div class="chips" id="quick"></div>' +
   '</div></div>' +

   '<div class="card mt"><div class="card-b tight"><div class="tablewrap"><table class="tbl sticky-ends" id="tbl">' +
     '<thead><tr>' +
       '<th class="sortable" data-s="code">예약번호</th>' +
       '<th class="sortable" data-s="requestedAt">신청일</th>' +
       '<th>신청자</th><th class="sortable" data-s="branch">지점</th>' +
       '<th>이용 숙소</th>' +
       '<th class="sortable" data-s="checkIn">체크인</th>' +
       '<th class="sortable" data-s="checkOut">체크아웃</th>' +
       '<th class="num">인원/객실</th>' +
       '<th class="sortable num" data-s="amount">예약금액</th>' +
       '<th>담당자</th><th class="sortable" data-s="status">현재상태</th><th>결제상태</th>' +
       '<th>숙소 예약번호</th>' +
       '<th class="sortable" data-s="updatedAt">최종수정</th>' +
       '<th></th>' +
     '</tr></thead><tbody></tbody></table></div>' +
     '<div class="pager" id="pager"></div>' +
   '</div></div>';

  /* 지점 목록이 확정되기 전이므로 실제 신청에 쓰인 지점명까지 필터에 넣는다 */
  function branchOptions(){
    var set = {};
    Store.branches().forEach(function(b){ set[b.name] = 1; });
    Store.bookings().forEach(function(b){ if (b.branch) set[b.branch] = 1; });
    return Object.keys(set).sort();
  }
  function amount(b){ return (b.reservation && b.reservation.amount) || b.estimatedCost || 0; }
  /* 7일 이내만 상대시간 표기 (그 이상은 날짜와 중복되므로 생략) */
  function relSub(at){
    var rel = UI.ago(at);
    return (rel && rel !== UI.dateFull(at)) ? '<div class="sub">' + rel + '</div>' : '';
  }

  function filtered(){
    var rows = Store.visibleBookings(user);
    if (st.todo && TODO_FILTERS[st.todo]) rows = rows.filter(TODO_FILTERS[st.todo]);
    if (st.q) {
      var q = st.q.toLowerCase();
      rows = rows.filter(function(b){
        return [b.code, b.applicantName, b.lodgingName, b.purpose, b.branch, b.guestName,
                (b.reservation||{}).confirmNo, b.assigneeName]
          .some(function(v){ return v && String(v).toLowerCase().indexOf(q) >= 0; });
      });
    }
    if (st.from)   rows = rows.filter(function(b){ return STAY.ymd(b.requestedAt) >= st.from; });
    if (st.to)     rows = rows.filter(function(b){ return STAY.ymd(b.requestedAt) <= st.to; });
    if (st.month)  rows = rows.filter(function(b){ return STAY.ymd(b.requestedAt).slice(0,7) === st.month; });
    if (st.branch) rows = rows.filter(function(b){ return b.branch === st.branch; });
    if (st.applicant) rows = rows.filter(function(b){ return b.applicantId === st.applicant; });
    if (st.lodging)   rows = rows.filter(function(b){ return b.lodgingId === st.lodging; });
    if (st.status)    rows = rows.filter(function(b){ return b.status === st.status; });
    if (st.assignee)  rows = rows.filter(function(b){ return st.assignee==='__none' ? !b.assigneeId : b.assigneeId === st.assignee; });
    if (st.pay)       rows = rows.filter(function(b){ return (b.payment||{}).status === st.pay; });
    if (st.ci)        rows = rows.filter(function(b){ return b.checkIn === st.ci; });
    if (st.co)        rows = rows.filter(function(b){ return b.checkOut === st.co; });
    rows.sort(function(a,b){
      var x = st.sort === 'amount' ? amount(a) : a[st.sort];
      var y = st.sort === 'amount' ? amount(b) : b[st.sort];
      if (st.sort === 'status') { x = STAY.STATUS[a.status].no; y = STAY.STATUS[b.status].no; }
      if (x === y) return 0;
      return (x > y ? 1 : -1) * st.dir;
    });
    return rows;
  }

  /* 빠른 필터 칩 */
  function renderQuick(){
    var all = Store.visibleBookings(user);
    var defs = [
      { k:'', label:'전체' },
      { k:'NEW', label:'신규신청' },
      { k:'APPROVAL_PENDING', label:'승인대기' },
      { k:'BOOKING', label:'예약진행중' },
      { k:'BOOKED', label:'예약완료' },
      { k:'UPCOMING', label:'이용예정' },
      { k:'SETTLE_WAIT', label:'정산대기' },
      { k:'SETTLED', label:'정산완료' },
      { k:'CANCELED', label:'취소' },
      { k:'REJECTED', label:'반려' }
    ];
    UI.qs('#quick').innerHTML = defs.map(function(d){
      var n = d.k ? all.filter(function(b){ return b.status===d.k; }).length : all.length;
      return '<button class="chip' + (st.status===d.k && !st.todo ?' on':'') + '" data-st="' + d.k + '">' +
        d.label + '<span class="n">' + n + '</span></button>';
    }).join('') +
    (st.todo ? '<button class="chip on" data-clear-todo="1">🎯 ' + UI.esc(st.todo) + ' ✕</button>' : '');
  }

  function render(){
    var rows = filtered();
    var totalAmt = rows.reduce(function(s,b){ return s + ((b.status==='CANCELED'||b.status==='REJECTED')?0:amount(b)); }, 0);
    UI.qs('#cntline').innerHTML = '검색결과 <b>' + rows.length + '</b>건 · 금액합계 <b>' + STAY.won(totalAmt) +
      '</b> <span class="muted">(취소·반려 제외)</span>';
    var pages = Math.max(1, Math.ceil(rows.length / st.size));
    if (st.page > pages) st.page = pages;
    var page = rows.slice((st.page-1)*st.size, st.page*st.size);
    var tb = UI.qs('#tbl tbody');

    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="15">' + UI.empty('조건에 맞는 예약이 없습니다. 필터를 조정해보세요.') + '</td></tr>';
    } else {
      tb.innerHTML = page.map(function(b){
        var closed = ['CANCELED','REJECTED'].indexOf(b.status) >= 0;
        var next = nextAction(b);
        var alert = (b.changeRequest && !b.changeRequest.handled) || (b.cancelRequest && !b.cancelRequest.handled);
        return '<tr data-b="' + b.id + '" class="' + (closed?'dim':'') + '">' +
          '<td data-l="예약번호" class="code">' + UI.esc(b.code) + (alert?' <span class="tag" style="color:var(--red);border-color:#f3c9c6">요청</span>':'') + '</td>' +
          '<td data-l="신청일" class="m-hide">' + UI.dateFull(b.requestedAt) + relSub(b.requestedAt) + '</td>' +
          '<td data-l="신청자">' + UI.esc(b.applicantName) + '<div class="sub">' + UI.esc(b.dept) + '</div></td>' +
          '<td data-l="지점">' + UI.esc(b.branch) + '</td>' +
          '<td data-l="숙소" class="wrapcell">' + UI.esc(b.lodgingName) +
            '<div class="sub">' + UI.esc(STAY.LODGING_TYPE[b.lodgingType]) + ' · ' + UI.esc(b.purpose||'') + '</div></td>' +
          '<td data-l="일정">' + UI.dateFull(b.checkIn) + '<div class="sub">~' + UI.dateFull(b.checkOut) + ' · ' + b.nights + '박' +
            (b.checkIn===today?' <b style="color:var(--green)">오늘 체크인</b>':'') + '</div></td>' +
          '<td data-l="체크아웃" class="m-hide">' + UI.dateFull(b.checkOut) + '<div class="sub">' + b.nights + '박</div></td>' +
          '<td data-l="인원/객실" class="num">' + b.guests + '명<div class="sub">' + b.rooms + '실</div></td>' +
          '<td data-l="예약금액" class="num">' + STAY.won(amount(b)) +
            '<div class="sub">' + UI.esc(STAY.COST_BEARER[b.costBearer]||'') + '</div></td>' +
          '<td data-l="담당자" class="m-hide">' + (b.assigneeName ? UI.esc(b.assigneeName) : '<span class="muted">미지정</span>') + '</td>' +
          '<td data-l="상태">' + UI.badge(b.status) + '</td>' +
          '<td data-l="결제상태">' + UI.payBadge(b.payment) + '</td>' +
          '<td data-l="숙소 예약번호" class="m-hide">' + ((b.reservation&&b.reservation.confirmNo) ? UI.esc(b.reservation.confirmNo) : '<span class="muted">-</span>') + '</td>' +
          '<td data-l="최종수정" class="m-hide">' + UI.dtFull(b.updatedAt) + '</td>' +
          '<td class="no-print">' + (next ? '<button class="btn btn-sm btn-gold" data-go="' + b.id + '" data-to="' + next.to + '">' +
            UI.esc(next.action) + '</button>' : '') + '</td>' +
        '</tr>';
      }).join('');
    }

    /* 페이저 */
    var pg = '';
    pg += '<button ' + (st.page<=1?'disabled':'') + ' data-p="' + (st.page-1) + '">‹</button>';
    var s = Math.max(1, st.page-2), e = Math.min(pages, s+4); s = Math.max(1, e-4);
    for (var i=s;i<=e;i++) pg += '<button class="' + (i===st.page?'on':'') + '" data-p="' + i + '">' + i + '</button>';
    pg += '<button ' + (st.page>=pages?'disabled':'') + ' data-p="' + (st.page+1) + '">›</button>';
    pg += '<span class="muted" style="margin-left:10px;font-size:12px">' + st.page + ' / ' + pages + ' 페이지</span>';
    UI.qs('#pager').innerHTML = rows.length > st.size ? pg : '';
    renderQuick();
  }

  /* 목록에서 바로 처리 가능한 다음 액션 (클릭 최소화) */
  function nextAction(b){
    var opts = STAY.FLOW[b.status] || [];
    var main = opts.filter(function(o){ return o.to !== 'CANCELED' && o.to !== 'REJECTED'; })[0];
    if (!main) return null;
    if (main.roles.indexOf(user.role) < 0) return null;
    return main;
  }

  UI.on(root, 'click', 'tr[data-b]', function(e){
    if (e.target.closest('[data-go]')) return;
    NAV.href = '#/detail?id=' + this.dataset.b;
  });
  UI.on(root, 'click', '[data-go]', function(e){
    e.stopPropagation();
    var id = this.dataset.go, to = this.dataset.to;
    var b = Store.booking(id);
    var chk = Store.canTransition(b, to, user);
    if (!chk.ok) {
      UI.confirm('추가 입력이 필요합니다', chk.msg + '\n\n상세 화면에서 정보를 입력하시겠습니까?', '상세로 이동')
        .then(function(ok){ if (ok) NAV.href = '#/detail?id=' + id; });
      return;
    }
    UI.confirm(chk.opt.action, b.code + ' 건을 「' + STAY.STATUS[to].label + '」 상태로 변경합니다.\n계속하시겠습니까?', chk.opt.action)
      .then(function(ok){
        if (!ok) return;
        var r = Store.transition(id, to, user);
        if (r.ok) { UI.toast(chk.opt.action + ' 처리했습니다.', 'ok'); render(); }
        else UI.toast(r.msg, 'bad');
      });
  });
  UI.on(root, 'click', '.chip[data-st]', function(){ st.status = this.dataset.st; st.todo=''; st.page=1; render(); });
  UI.on(root, 'click', '[data-clear-todo]', function(){ st.todo=''; st.page=1; render(); });
  UI.on(root, 'click', '#pager button[data-p]', function(){ st.page = Number(this.dataset.p); render(); window.scrollTo(0,0); });
  UI.on(root, 'click', 'th.sortable', function(){
    var s = this.dataset.s;
    if (st.sort === s) st.dir *= -1; else { st.sort = s; st.dir = -1; }
    render();
  });
  UI.qs('#apply').onclick = function(){
    st.q = UI.qs('#f_q').value.trim(); st.from = UI.qs('#f_from').value; st.to = UI.qs('#f_to').value;
    st.branch = UI.qs('#f_branch').value; st.applicant = UI.qs('#f_applicant').value;
    st.lodging = UI.qs('#f_lodging').value; st.status = UI.qs('#f_status').value;
    st.assignee = UI.qs('#f_assignee').value; st.pay = UI.qs('#f_pay').value;
    st.ci = UI.qs('#f_ci').value; st.co = UI.qs('#f_co').value;
    st.month = ''; st.page = 1; render();
  };
  UI.qs('#f_q').addEventListener('keydown', function(e){ if (e.key==='Enter') UI.qs('#apply').click(); });
  UI.qs('#reset').onclick = function(){ NAV.href = '#/requests'; };
  UI.qs('#csv').onclick = function(){
    var rows = filtered();
    var head = ['예약번호','신청일','신청자','지점','부서','연락처','이용목적','숙박유형','숙소','체크인','체크아웃','숙박일수',
                '성인','아동','인원','객실수','예약자명','예약자연락처','예상비용','예약금액','비용구분','담당자','상태',
                '결제상태','결제방법','실결제금액','숙소예약번호','최종수정'];
    var body = rows.map(function(b){
      return [b.code, UI.dtFull(b.requestedAt), b.applicantName, b.branch, b.dept, b.phone, b.purpose,
              STAY.LODGING_TYPE[b.lodgingType], b.lodgingName, b.checkIn, b.checkOut, b.nights,
              b.adults, b.children, b.guests, b.rooms, b.guestName, b.guestPhone,
              b.estimatedCost, amount(b), STAY.COST_BEARER[b.costBearer], b.assigneeName||'',
              STAY.STATUS[b.status].label, STAY.PAY_STATUS[(b.payment||{}).status]||'',
              (b.payment||{}).method||'', (b.payment||{}).paidAmount||0,
              (b.reservation||{}).confirmNo||'', UI.dtFull(b.updatedAt)];
    });
    UI.download('숙박예약_' + today + '.csv', UI.toCsv([head].concat(body)));
  };

  render();
})();

};

PAGES["detail"] = function(){

(function(){
  var user = Auth.current();
  var id = UI.param('id');
  var root = UI.shell('requests', '예약 상세', '예약 진행 과정 전체 보기');
  var b = Store.booking(id);

  if (!b) { root.innerHTML = UI.empty('예약을 찾을 수 없습니다. 목록에서 다시 선택해주세요.', '🔍') +
    '<div class="center"><a class="btn btn-primary" href="#/requests">예약 목록으로</a></div>'; return; }
  if (!Auth.canSee(b, user)) { root.innerHTML = UI.empty('이 예약을 볼 권한이 없습니다. 본인 또는 소속 지점 예약만 조회할 수 있습니다.', '🔒') +
    '<div class="center"><a class="btn btn-primary" href="#/requests">예약 목록으로</a></div>'; return; }

  var today = STAY.ymd(new Date());
  function amount(){ return (b.reservation && b.reservation.amount) || b.estimatedCost || 0; }
  function reload(){ b = Store.booking(id); render(); }

  function render(){
    var closed = ['SETTLED','CANCELED','REJECTED'].indexOf(b.status) >= 0;
    var logs = Store.bookingLogs(b.id);
    var lo = b.lodgingId ? Store.lodging(b.lodgingId) : null;

    /* ---------- 헤더 ---------- */
    var head =
     '<div class="pagehead">' +
       '<div><div class="btnrow" style="margin-bottom:4px">' +
         '<a class="btn btn-sm btn-ghost no-print" href="#/requests">‹ 목록</a>' +
         UI.badge(b.status) + UI.payBadge(b.payment) +
         (b.proxyBy ? '<span class="tag">☎ ' + UI.esc(b.proxyBy) + ' 대리접수</span>' : '') +
       '</div>' +
       '<h2>' + UI.esc(b.code) + ' · ' + UI.esc(b.lodgingName) + '</h2>' +
       '<p>' + UI.esc(b.branch) + ' ' + UI.esc(b.applicantName) + ' · ' + UI.esc(b.purpose) +
         ' · 신청 ' + UI.dtFull(b.requestedAt) + '</p></div>' +
       '<div class="sp"></div><div class="btnrow no-print">' +
         '<button class="btn" onclick="window.print()">인쇄</button>' +
         (Auth.canRequestChange(b, user) ?
           '<button class="btn" id="reqChange">수정 요청</button>' +
           '<button class="btn btn-danger" id="reqCancel">취소 요청</button>' : '') +
       '</div>' +
     '</div>' +
     '<div class="card" style="margin-bottom:14px"><div class="card-b">' + UI.steps(b) + '</div></div>';

    /* ---------- 요청 알림 ---------- */
    var alerts = '';
    if (b.changeRequest && !b.changeRequest.handled)
      alerts += '<div class="note warn" style="margin-bottom:12px">✏️ <b>신청자 수정 요청</b> (' + UI.dtFull(b.changeRequest.at) + ' · ' +
        UI.esc(b.changeRequest.by) + ')<br>' + UI.nl2br(b.changeRequest.reason) +
        (Auth.can('editReservation') ? ' <button class="btn btn-sm no-print" id="handleChange" style="margin-left:8px">처리완료</button>' : '') + '</div>';
    if (b.cancelRequest && !b.cancelRequest.handled)
      alerts += '<div class="note bad" style="margin-bottom:12px">⛔ <b>신청자 취소 요청</b> (' + UI.dtFull(b.cancelRequest.at) + ' · ' +
        UI.esc(b.cancelRequest.by) + ')<br>' + UI.nl2br(b.cancelRequest.reason) +
        (Auth.can('cancelBooking') ? ' <button class="btn btn-sm btn-danger no-print" id="doCancel" style="margin-left:8px">취소 처리</button>' : '') + '</div>';
    if (b.status === 'REJECTED' && b.approval.opinion)
      alerts += '<div class="note bad" style="margin-bottom:12px">🚫 <b>반려됨</b> — ' + UI.esc(b.approval.approverName||'') +
        ' (' + UI.dtFull(b.approval.decidedAt) + ')<br>' + UI.nl2br(b.approval.opinion) + '</div>';

    /* ---------- 기본 정보 ---------- */
    function dr(k, v, cls){ return '<div class="dr"><dt>' + k + '</dt><dd class="' + (cls||'') + '">' + v + '</dd></div>'; }
    var info =
     '<div class="card"><div class="card-h"><h3>📄 기본 예약정보</h3><span class="sp"></span>' +
       (Auth.can('editReservation') && !closed ? '<button class="btn btn-sm no-print" id="editBasic">정보 수정</button>' : '') + '</div>' +
      '<div class="card-b"><dl class="dl">' +
        dr('예약번호', '<b>' + UI.esc(b.code) + '</b>') +
        dr('신청일', UI.dtFull(b.requestedAt)) +
        dr('신청자', UI.esc(b.applicantName) + ' <span class="muted">(' + UI.esc(b.dept) + ')</span>') +
        dr('소속 지점', UI.esc(b.branch)) +
        dr('연락처', UI.esc(b.phone)) +
        dr('이용 목적', UI.esc(b.purpose)) +
        dr('숙박 유형', UI.esc(STAY.LODGING_TYPE[b.lodgingType])) +
        dr('이용 숙소', UI.esc(b.lodgingName) + (lo ? ' <span class="tag ' + (lo.ownership==='DIRECT'?'direct':'partner') + '">' +
            UI.esc(STAY.OWNERSHIP[lo.ownership]) + '</span>' : '')) +
        dr('체크인', UI.dateFull(b.checkIn) + ' ' + UI.dateK(b.checkIn) + (lo ? ' <span class="muted">' + UI.esc(lo.checkInTime) + '~</span>' : '')) +
        dr('체크아웃', UI.dateFull(b.checkOut) + ' ' + UI.dateK(b.checkOut) + (lo ? ' <span class="muted">~' + UI.esc(lo.checkOutTime) + '</span>' : '')) +
        dr('숙박일수', '<b>' + b.nights + '박 ' + (b.nights+1) + '일</b>') +
        dr('이용 인원', b.guests + '명 <span class="muted">(성인 ' + b.adults + ' / 아동 ' + b.children + ')</span>') +
        dr('객실 수', b.rooms + '실') +
        dr('예약자명', UI.esc(b.guestName)) +
        dr('예약자 연락처', UI.esc(b.guestPhone)) +
        dr('예상 비용', STAY.won(b.estimatedCost)) +
        dr('비용 구분', UI.esc(STAY.COST_BEARER[b.costBearer])) +
        dr('예약 담당자', b.assigneeName ? UI.esc(b.assigneeName) : '<span class="muted">미지정</span>') +
        dr('최종 수정', UI.dtFull(b.updatedAt)) +
      '</dl>' +
      (b.specialRequest ? '<div class="hr"></div><div><div class="muted" style="font-size:12.5px;font-weight:800">특별 요청사항</div>' +
        '<div style="margin-top:5px">' + UI.nl2br(b.specialRequest) + '</div></div>' : '') +
      (b.attachments && b.attachments.length ? '<div class="hr"></div>' +
        '<div class="muted" style="font-size:12.5px;font-weight:800;margin-bottom:6px">첨부파일 ' + b.attachments.length + '건</div>' +
        '<div class="filelist">' + b.attachments.map(function(f){
          return '<div class="fileitem">📄 <a href="' + f.dataUrl + '" download="' + UI.esc(f.name) + '">' + UI.esc(f.name) + '</a>' +
            ' <span class="muted">(' + Math.round(f.size/1024) + 'KB)</span></div>'; }).join('') + '</div>' : '') +
      '</div></div>';

    /* ---------- 예약 진행 정보 ---------- */
    var r = b.reservation || {};
    var canBook = Auth.can('doReservation') && !closed;
    var resv =
     '<div class="card mt"><div class="card-h"><h3>🏨 숙소 예약 진행</h3><span class="sp"></span>' +
       (canBook ? '<button class="btn btn-sm no-print" id="editResv">예약정보 입력·수정</button>' : '') + '</div>' +
      '<div class="card-b">' +
        (r.confirmNo || r.roomInfo || r.amount ?
          '<dl class="dl">' +
            dr('숙소 예약번호', '<b>' + UI.esc(r.confirmNo||'-') + '</b>') +
            dr('객실 정보', UI.esc(r.roomInfo||'-')) +
            dr('확정 예약금액', '<b>' + STAY.won(r.amount) + '</b>') +
            dr('예약 완료일시', UI.dtFull(r.reservedAt)) +
            (r.note ? dr('비고', UI.esc(r.note)) : '') +
          '</dl>'
          : '<div class="note info" style="margin:0">아직 숙소 예약이 진행되지 않았습니다.' +
            (canBook ? ' 예약을 완료한 뒤 <b>예약번호·객실정보·금액</b>을 입력해주세요.' : '') + '</div>') +
        (lo ? '<div class="hr"></div><div class="muted" style="font-size:12.5px;font-weight:800;margin-bottom:6px">숙소 연락처 · 규정</div>' +
          '<dl class="dl">' +
            dr('담당자', UI.esc(lo.managerName) + ' / ' + UI.esc(lo.managerPhone)) +
            dr('지역·주소', UI.esc(lo.region) + ' · ' + UI.esc(lo.address)) +
            dr('취소규정', UI.esc(lo.cancelPolicy)) +
            dr('이용방법', UI.esc(lo.usage)) +
          '</dl>' +
          (lo.caution ? '<div class="note warn" style="margin-top:8px">⚠ ' + UI.esc(lo.caution) + '</div>' : '') : '') +
      '</div></div>';

    /* ---------- 승인 정보 ---------- */
    var ap = b.approval || {};
    var approvalCard =
     '<div class="card mt"><div class="card-h"><h3>✅ 승인</h3><span class="sp"></span>' +
       (ap.result ? '<span class="tag ' + (ap.result==='APPROVED'?'gold':'') + '">' +
          (ap.result==='APPROVED'?'승인완료':'반려') + '</span>' : '<span class="tag">미처리</span>') + '</div>' +
      '<div class="card-b">' +
        (ap.requestedAt || ap.result ? '<dl class="dl one">' +
          dr('승인 요청일시', UI.dtFull(ap.requestedAt)) +
          dr('승인 담당자', ap.approverName ? UI.esc(ap.approverName) : '<span class="muted">-</span>') +
          dr('처리일시', UI.dtFull(ap.decidedAt)) +
          dr('승인 의견', ap.opinion ? UI.nl2br(ap.opinion) : '<span class="muted">-</span>') +
        '</dl>' : '<div class="muted">아직 승인 요청 전입니다.</div>') +
      '</div></div>';

    /* ---------- 정산 정보 ---------- */
    var p = b.payment || {};
    var canSettle = Auth.can('settle') && ['SETTLE_WAIT','SETTLING','USED','SETTLED'].indexOf(b.status) >= 0;
    var settleCard =
     '<div class="card mt"><div class="card-h"><h3>💳 결제 · 정산 <span class="sub">(회계팀)</span></h3><span class="sp"></span>' +
       (canSettle && b.status !== 'SETTLED' ? '<button class="btn btn-sm no-print" id="editPay">정산정보 입력</button>' : '') + '</div>' +
      '<div class="card-b">' +
        '<dl class="dl">' +
          dr('결제상태', UI.payBadge(p)) +
          dr('결제방법', p.method ? UI.esc(p.method) : '<span class="muted">-</span>') +
          dr('예약금액', STAY.won(amount())) +
          dr('실제 결제금액', p.paidAmount ? '<b>' + STAY.won(p.paidAmount) + '</b>' : '<span class="muted">-</span>') +
          dr('결제일', p.paidAt ? UI.dateFull(p.paidAt) : '<span class="muted">-</span>') +
          dr('비용 부담주체', UI.esc(STAY.COST_BEARER[b.costBearer])) +
          dr('세금계산서', p.taxInvoice ? '✔ 확인' : '<span class="muted">미확인</span>') +
          dr('영수증/카드전표', p.receipt ? '✔ 확인' : '<span class="muted">미확인</span>') +
          dr('회계 담당자', p.financeName ? UI.esc(p.financeName) : '<span class="muted">-</span>') +
          dr('정산완료일', p.settledAt ? UI.dtFull(p.settledAt) : '<span class="muted">-</span>') +
        '</dl>' +
        (p.evidence && p.evidence.length ? '<div class="hr"></div>' +
          '<div class="muted" style="font-size:12.5px;font-weight:800;margin-bottom:6px">증빙파일 ' + p.evidence.length + '건</div>' +
          '<div class="filelist">' + p.evidence.map(function(f){
            return '<div class="fileitem">🧾 <a href="' + f.dataUrl + '" download="' + UI.esc(f.name) + '">' + UI.esc(f.name) + '</a></div>';
          }).join('') + '</div>' : '') +
        (p.note ? '<div class="hr"></div>' + UI.nl2br(p.note) : '') +
      '</div></div>';

    /* ---------- 타임라인 ---------- */
    var future = [];
    if (!closed) {
      var curNo = STAY.STATUS[b.status].no;
      STAY.MAIN_PATH.forEach(function(k){
        if (STAY.STATUS[k].no > curNo) future.push(k);
      });
    }
    var tlHtml = logs.map(function(l, i){
      var isLast = i === logs.length-1;
      var bad = l.to === 'CANCELED' || l.to === 'REJECTED';
      return '<div class="tl ' + (bad ? 'bad' : (isLast && !closed ? 'now' : 'done')) + '">' +
        '<div class="td">' + UI.dtFull(l.at) + '</div>' +
        '<div class="tt">' + UI.esc(l.action) +
          (l.to ? ' <span class="badge b-' + l.to + '" style="font-size:10.5px"><i class="d"></i>' + STAY.STATUS[l.to].label + '</span>' : '') + '</div>' +
        '<div class="tm"><b>' + UI.esc(l.userName) + '</b> <span class="muted">' + UI.esc(STAY.ROLES[l.role].short) +
          ' · ' + UI.esc(l.branch) + '</span>' + (l.memo ? '<br>' + UI.nl2br(l.memo) : '') + '</div></div>';
    }).join('');
    var futureHtml = future.map(function(k){
      var s = STAY.STATUS[k];
      return '<div class="tl future"><div class="td">예정</div>' +
        '<div class="tt">' + s.icon + ' ' + UI.esc(s.label) +
        ' <span class="muted" style="font-weight:600">— ' + (s.owner==='-'?'':UI.esc(STAY.ROLES[s.owner].label)) + '</span></div></div>';
    }).join('');
    var timeline =
     '<div class="card"><div class="card-h"><h3>🕒 진행 타임라인</h3><span class="sp"></span>' +
       '<span class="sub">' + logs.length + '건 기록</span></div>' +
      '<div class="card-b"><div class="timeline">' + tlHtml + futureHtml + '</div></div></div>';

    /* ---------- 처리 패널 ---------- */
    var opts = (STAY.FLOW[b.status] || []).filter(function(o){ return o.roles.indexOf(user.role) >= 0; });
    var actionCard =
     '<div class="card no-print"><div class="card-h"><h3>⚡ 처리하기</h3><span class="sp"></span>' +
       '<span class="sub">' + UI.esc(STAY.ROLES[user.role].label) + ' 권한</span></div>' +
      '<div class="card-b">' +
        '<div class="note info" style="margin-bottom:12px">현재 <b>' + UI.esc(STAY.STATUS[b.status].label) + '</b> · 담당 ' +
          (STAY.STATUS[b.status].owner === '-' ? '종료' : UI.esc(STAY.ROLES[STAY.STATUS[b.status].owner].label)) + '</div>' +
        (opts.length ? '<div class="btnrow">' + opts.map(function(o){
            var cls = (o.to==='CANCELED'||o.to==='REJECTED') ? 'btn-danger' : 'btn-gold';
            return '<button class="btn ' + cls + '" data-to="' + o.to + '">' + UI.esc(o.action) + '</button>';
          }).join('') + '</div>'
          : '<div class="muted">현재 단계에서 ' + UI.esc(STAY.ROLES[user.role].label) + '가 처리할 항목이 없습니다.</div>') +
        (Auth.can('assign') && !closed ?
          '<div class="hr"></div><div class="field" style="margin:0"><label>예약 담당자 지정</label>' +
          '<div class="btnrow"><select class="select" id="assignSel" style="max-width:220px"><option value="">미지정</option>' +
            Store.users().filter(function(u){ return u.role==='booker'||u.role==='admin'; }).map(function(u){
              return '<option value="' + u.id + '"' + (u.id===b.assigneeId?' selected':'') + '>' + UI.esc(u.name) + ' (' + UI.esc(u.dept) + ')</option>';
            }).join('') + '</select><button class="btn" id="doAssign">지정</button></div></div>' : '') +
        (Auth.can('requestInfo') && !closed ?
          '<div class="hr"></div><button class="btn" id="askInfo">신청자에게 추가정보 요청</button>' : '') +
      '</div></div>';

    /* ---------- 메모 ---------- */
    var memoCard =
     '<div class="card mt"><div class="card-h"><h3>💬 메모</h3><span class="sp"></span>' +
       '<span class="sub">' + (b.memos||[]).length + '건</span></div>' +
      '<div class="card-b tight"><div class="list">' +
        ((b.memos||[]).length ? b.memos.slice().reverse().map(function(m){
          return '<div class="li" style="cursor:default;align-items:flex-start">' +
            '<span class="avatar">' + UI.esc(UI.initials(m.userName)) + '</span>' +
            '<span class="tx"><span class="t1">' + UI.esc(m.userName) + ' <span class="muted" style="font-weight:600">' +
              UI.esc(STAY.ROLES[m.role].short) + ' · ' + UI.dtFull(m.at) + '</span></span>' +
            '<span class="t2" style="white-space:pre-wrap;color:var(--text)">' + UI.esc(m.text) + '</span></span></div>';
        }).join('') : UI.empty('작성된 메모가 없습니다.', '💬')) +
      '</div>' +
      '<div class="card-b no-print" style="border-top:1px solid var(--line-2)">' +
        '<div class="field" style="margin:0"><textarea class="textarea" id="memoTx" placeholder="내부 메모를 남기세요. 처리 로그에도 함께 기록됩니다."></textarea>' +
        '<div class="btnrow" style="margin-top:8px;justify-content:flex-end"><button class="btn btn-primary" id="memoAdd">메모 등록</button></div></div>' +
      '</div></div>';

    /* ---------- 처리 로그 (표) ---------- */
    var logCard =
     '<div class="card mt"><div class="card-h"><h3>📜 처리 로그 (Activity Log)</h3><span class="sp"></span>' +
       '<span class="sub">누가 · 언제 · 무엇을</span></div>' +
      '<div class="card-b tight"><div class="tablewrap"><table class="tbl"><thead><tr>' +
        '<th>일시</th><th>처리자</th><th>권한</th><th>처리내용</th><th>상태변경</th><th>메모</th>' +
      '</tr></thead><tbody>' +
        logs.slice().reverse().map(function(l){
          return '<tr style="cursor:default">' +
            '<td data-l="일시">' + UI.dtFull(l.at) + '</td>' +
            '<td data-l="처리자">' + UI.esc(l.userName) + '<div class="sub">' + UI.esc(l.branch) + '</div></td>' +
            '<td data-l="권한">' + UI.esc(STAY.ROLES[l.role].label) + '</td>' +
            '<td data-l="처리내용"><b>' + UI.esc(l.action) + '</b></td>' +
            '<td data-l="상태변경">' + (l.from ? UI.badge(l.from) + ' → ' : '') + (l.to ? UI.badge(l.to) : '<span class="muted">-</span>') + '</td>' +
            '<td data-l="메모" class="wrapcell">' + (l.memo ? UI.esc(l.memo) : '<span class="muted">-</span>') + '</td></tr>';
        }).join('') +
      '</tbody></table></div></div></div>';

    root.innerHTML = head + alerts +
      '<div class="grid g-2-1">' +
        '<div>' + info + resv + approvalCard + settleCard + '</div>' +
        '<div>' + actionCard + timeline + memoCard + '</div>' +
      '</div>' + logCard;

    bind();
  }

  /* ================= 이벤트 =================
   * 위임(delegated) 리스너는 최초 1회만 등록한다. render() 안에서 등록하면
   * 다시 그릴 때마다 누적되어 한 번의 클릭이 여러 번 처리된다. */
  function bindOnce(){
    UI.on(root, 'click', '[data-to]', function(){
      doTransition(this.dataset.to);
    });
  }

  /* 매 렌더마다 새로 만들어지는 개별 버튼은 onclick 으로 연결 (덮어쓰기라 누적되지 않음) */
  function bind(){
    var assign = UI.qs('#doAssign');
    if (assign) assign.onclick = function(){
      var uid2 = UI.qs('#assignSel').value;
      var u2 = uid2 ? Store.user(uid2) : null;
      Store.updateBooking(b.id, { assigneeId: uid2||null, assigneeName: u2?u2.name:null }, user,
        '담당자 지정', u2 ? ('예약 담당자: ' + u2.name) : '담당자 해제');
      UI.toast('담당자를 저장했습니다.', 'ok'); reload();
    };

    var ask = UI.qs('#askInfo');
    if (ask) ask.onclick = function(){
      UI.prompt('추가정보 요청', '신청자에게 요청할 내용', { required:true, okLabel:'요청 보내기',
        placeholder:'예) 동반 인원 명단과 정확한 체크인 시각을 알려주세요.' }).then(function(v){
        if (v == null) return;
        Store.addMemo(b.id, '[추가정보 요청] ' + v, user);
        Notify.send('INFO_REQUESTED', b, user, v);
        UI.toast('추가정보를 요청했습니다.', 'ok'); reload();
      });
    };

    var memoAdd = UI.qs('#memoAdd');
    if (memoAdd) memoAdd.onclick = function(){
      var t = UI.qs('#memoTx').value.trim();
      if (!t) { UI.toast('메모 내용을 입력해주세요.', 'bad'); return; }
      Store.addMemo(b.id, t, user); UI.toast('메모를 등록했습니다.', 'ok'); reload();
    };

    var rc = UI.qs('#reqChange');
    if (rc) rc.onclick = function(){
      UI.prompt('예약 수정 요청', '어떤 내용을 수정하고 싶으신가요?', { required:true, okLabel:'요청 보내기',
        placeholder:'예) 체크인을 하루 늦춰주세요 (8/21 → 8/22). 인원도 2명 추가됩니다.' }).then(function(v){
        if (v == null) return;
        Store.requestChange(b.id, 'change', v, user);
        UI.toast('수정 요청을 보냈습니다. 예약 담당자가 확인합니다.', 'ok'); reload();
      });
    };
    var cc = UI.qs('#reqCancel');
    if (cc) cc.onclick = function(){
      UI.prompt('예약 취소 요청', '취소 사유를 입력해주세요', { required:true, danger:true, okLabel:'취소 요청',
        hint:'숙소별 취소 규정에 따라 위약금이 발생할 수 있습니다.',
        placeholder:'예) 출장 일정이 취소되었습니다.' }).then(function(v){
        if (v == null) return;
        Store.requestChange(b.id, 'cancel', v, user);
        UI.toast('취소 요청을 보냈습니다.', 'ok'); reload();
      });
    };
    var hc = UI.qs('#handleChange');
    if (hc) hc.onclick = function(){
      Store.updateBooking(b.id, { changeRequest: Object.assign({}, b.changeRequest, {handled:true}) }, user,
        '수정 요청 처리완료', b.changeRequest.reason);
      UI.toast('수정 요청을 처리완료로 표시했습니다.', 'ok'); reload();
    };
    var dc = UI.qs('#doCancel');
    if (dc) dc.onclick = function(){ doTransition('CANCELED'); };

    var eb = UI.qs('#editBasic'); if (eb) eb.onclick = editBasic;
    var er = UI.qs('#editResv');  if (er) er.onclick = editResv;
    var ep = UI.qs('#editPay');   if (ep) ep.onclick = editPay;
  }

  function doTransition(to){
    var chk = Store.canTransition(b, to, user);
    if (!chk.ok) {
      var need = { BOOKED: editResv, SETTLING: editPay, SETTLED: editPay,
                   APPROVAL_PENDING: editBasic }[to];
      UI.confirm('처리할 수 없습니다', chk.msg + (need ? '\n\n지금 입력하시겠습니까?' : ''), need?'입력하기':'확인')
        .then(function(ok){ if (ok && need) need(); });
      return;
    }
    var needOpinion = (to === 'APPROVED' || to === 'REJECTED');
    var needReason  = (to === 'CANCELED');
    if (needOpinion || needReason) {
      UI.prompt(chk.opt.action, needOpinion ? '승인 의견' : '취소 사유',
        { required: to !== 'APPROVED', okLabel: chk.opt.action, danger: to !== 'APPROVED',
          placeholder: to==='APPROVED' ? '예) 이용 목적 확인. 승인합니다.' :
                       to==='REJECTED' ? '예) 인원 대비 객실 수가 과다합니다. 조정 후 재신청 바랍니다.' :
                                         '예) 신청자 요청으로 취소 (위약금 없음)' })
        .then(function(v){
          if (v == null) return;
          apply(to, v);
        });
      return;
    }
    UI.confirm(chk.opt.action, b.code + ' 건을 「' + STAY.STATUS[to].label + '」 상태로 변경합니다.', chk.opt.action)
      .then(function(ok){ if (ok) apply(to, ''); });
  }
  function apply(to, memo){
    var r = Store.transition(b.id, to, user, memo);
    if (!r.ok) { UI.toast(r.msg, 'bad'); return; }
    UI.toast(STAY.STATUS[to].label + ' 처리했습니다.', 'ok');
    reload();
  }

  /* ---------- 편집 모달 ---------- */
  function editBasic(){
    var m = UI.modal({
      title:'예약 기본정보 수정', wide:true,
      body:'<div class="frow f2">' +
        fld('이용 목적','purpose', b.purpose) +
        fld('이용 숙소','lodgingName', b.lodgingName) +
        fld('체크인','checkIn', b.checkIn, 'date') +
        fld('체크아웃','checkOut', b.checkOut, 'date') +
        fld('객실 수','rooms', b.rooms, 'number') +
        fld('성인 인원','adults', b.adults, 'number') +
        fld('아동 인원','children', b.children, 'number') +
        fld('예상 비용','estimatedCost', b.estimatedCost, 'number') +
        fld('예약자명','guestName', b.guestName) +
        fld('예약자 연락처','guestPhone', b.guestPhone) +
        '<div class="field"><label>비용 구분</label><select class="select" name="costBearer">' +
          UI.optionList(STAY.COST_BEARER, b.costBearer) + '</select></div>' +
      '</div>' +
      '<div class="field"><label>특별 요청사항</label><textarea class="textarea" name="specialRequest">' +
        UI.esc(b.specialRequest||'') + '</textarea></div>',
      buttons:[{label:'취소'},{label:'저장', cls:'btn-primary', keepOpen:true, onClick:function(mm, close){
        var patch = collect(mm);
        if (STAY.nights(patch.checkIn, patch.checkOut) <= 0) { UI.toast('체크아웃은 체크인 이후여야 합니다.', 'bad'); return false; }
        ['rooms','adults','children','estimatedCost'].forEach(function(k){ patch[k] = Number(patch[k])||0; });
        Store.updateBooking(b.id, patch, user, '예약정보 수정');
        close(); UI.toast('저장했습니다.', 'ok'); reload();
      }}]
    });
  }
  function editResv(){
    var r = b.reservation || {};
    UI.modal({
      title:'숙소 예약정보 입력', wide:true,
      body:'<div class="note info" style="margin-bottom:14px">숙소에 실제로 예약을 완료한 뒤 발급받은 정보를 입력해주세요. ' +
           '세 항목이 모두 입력되어야 <b>예약완료</b> 처리가 가능합니다.</div>' +
        '<div class="frow f2">' +
          fld('숙소 예약번호 *','confirmNo', r.confirmNo) +
          fld('확정 예약금액 *','amount', r.amount, 'number') +
        '</div>' +
        fld('객실 정보 *','roomInfo', r.roomInfo, 'text', '예) 디럭스 트윈 2실 / 2박, 조식 포함') +
        '<div class="field"><label>비고</label><textarea class="textarea" name="note">' + UI.esc(r.note||'') + '</textarea></div>',
      buttons:[{label:'취소'},{label:'저장', cls:'btn-primary', keepOpen:true, onClick:function(mm, close){
        var v = collect(mm);
        v.amount = Number(v.amount)||0;
        Store.updateBooking(b.id, { reservation: v }, user, '예약정보 등록',
          '예약번호 ' + (v.confirmNo||'-') + ' / ' + (v.roomInfo||'-') + ' / ' + STAY.won(v.amount));
        close(); UI.toast('예약정보를 저장했습니다.', 'ok'); reload();
      }}]
    });
  }
  function editPay(){
    var p = b.payment || {};
    var ev = (p.evidence||[]).slice();
    var m = UI.modal({
      title:'결제 · 정산정보 입력', wide:true,
      body:'<div class="frow f2">' +
          '<div class="field"><label>결제방법</label><select class="select" name="method"><option value="">선택</option>' +
            STAY.PAY_METHOD.map(function(x){ return '<option' + (x===p.method?' selected':'') + '>' + x + '</option>'; }).join('') + '</select></div>' +
          fld('실제 결제금액','paidAmount', p.paidAmount || amount(), 'number') +
          fld('결제일','paidAt', p.paidAt || '', 'date') +
          fld('회계 담당자','financeName', p.financeName || user.name) +
        '</div>' +
        '<div class="field"><label>증빙 확인</label><div class="radios">' +
          '<label class="check" style="margin-right:16px"><input type="checkbox" name="taxInvoice"' + (p.taxInvoice?' checked':'') + '> 세금계산서 확인</label>' +
          '<label class="check"><input type="checkbox" name="receipt"' + (p.receipt?' checked':'') + '> 영수증 / 카드전표 확인</label>' +
        '</div></div>' +
        '<div class="field"><label>증빙파일</label>' +
          '<div class="drop" id="evDrop">📎 클릭해서 증빙 파일 첨부 (세금계산서·카드전표·영수증)</div>' +
          '<input type="file" id="evInput" multiple class="sr"><div class="filelist" id="evList"></div></div>' +
        '<div class="field"><label>정산 메모</label><textarea class="textarea" name="note">' + UI.esc(p.note||'') + '</textarea></div>',
      buttons:[{label:'취소'},{label:'저장', cls:'btn-primary', keepOpen:true, onClick:function(mm, close){
        var v = collect(mm);
        v.paidAmount = Number(v.paidAmount)||0;
        v.taxInvoice = !!UI.qs('[name=taxInvoice]', mm).checked;
        v.receipt = !!UI.qs('[name=receipt]', mm).checked;
        v.evidence = ev;
        v.financeId = user.id;
        v.status = v.paidAmount ? (v.paidAmount >= amount() ? 'PAY_DONE' : 'PAY_PARTIAL')
                                : (b.status==='SETTLE_WAIT' ? 'PAY_WAIT' : (p.status||'PAY_NONE'));
        Store.updateBooking(b.id, { payment: v }, user, '정산정보 입력',
          '결제방법 ' + (v.method||'-') + ' / ' + STAY.won(v.paidAmount) +
          ' / 세금계산서 ' + (v.taxInvoice?'확인':'미확인') + ' / 영수증 ' + (v.receipt?'확인':'미확인'));
        close(); UI.toast('정산정보를 저장했습니다.', 'ok'); reload();
      }}],
      onOpen:function(mm){
        function draw(){
          UI.qs('#evList', mm).innerHTML = ev.map(function(f,i){
            return '<div class="fileitem">🧾 ' + UI.esc(f.name) + '<span class="sp"></span>' +
              '<button type="button" class="btn btn-sm btn-ghost" data-ev="' + i + '">삭제</button></div>'; }).join('');
        }
        UI.qs('#evDrop', mm).onclick = function(){ UI.qs('#evInput', mm).click(); };
        UI.qs('#evInput', mm).onchange = function(){
          Array.prototype.forEach.call(this.files, function(file){
            if (file.size > 2*1024*1024) { UI.toast(file.name + ' : 2MB 초과', 'bad'); return; }
            var fr = new FileReader();
            fr.onload = function(){ ev.push({name:file.name, size:file.size, type:file.type, dataUrl:fr.result}); draw(); };
            fr.readAsDataURL(file);
          });
          this.value='';
        };
        UI.on(mm, 'click', '[data-ev]', function(){ ev.splice(Number(this.dataset.ev),1); draw(); });
        draw();
      }
    });
  }
  function fld(label, name, val, type, ph){
    return '<div class="field"><label>' + UI.esc(label) + '</label>' +
      '<input class="input" type="' + (type||'text') + '" name="' + name + '" value="' + UI.esc(val===0?0:(val||'')) + '"' +
      (ph ? ' placeholder="' + UI.esc(ph) + '"' : '') + '></div>';
  }
  function collect(mm){
    var out = {};
    UI.qsa('[name]', mm).forEach(function(i){
      if (i.type === 'checkbox') return;
      out[i.name] = i.value;
    });
    return out;
  }

  bindOnce();
  render();
})();

};

PAGES["approvals"] = function(){

(function(){
  var user = Auth.current();
  var root = UI.shell('approve', '승인 관리', '회사 비용이 발생하는 예약을 승인/반려합니다');
  var canDecide = Auth.can('decideApproval');
  var tab = 'pending';

  function amount(b){ return (b.reservation && b.reservation.amount) || b.estimatedCost || 0; }
  function data(){
    var all = Store.visibleBookings(user);
    return {
      pending: all.filter(function(b){ return b.status==='APPROVAL_PENDING'; })
                  .sort(function(a,b){ return a.approval.requestedAt < b.approval.requestedAt ? -1 : 1; }),
      approved: all.filter(function(b){ return b.approval && b.approval.result==='APPROVED'; })
                   .sort(function(a,b){ return a.approval.decidedAt < b.approval.decidedAt ? 1 : -1; }),
      rejected: all.filter(function(b){ return b.approval && b.approval.result==='REJECTED'; })
                   .sort(function(a,b){ return a.approval.decidedAt < b.approval.decidedAt ? 1 : -1; })
    };
  }

  function render(){
    var d = data();
    var pendingSum = d.pending.reduce(function(s,b){ return s + amount(b); }, 0);
    root.innerHTML =
     '<div class="pagehead"><div><h2>승인 관리</h2>' +
       '<p>' + (canDecide ? '부동산팀원 누구나 승인할 수 있습니다. 처리하면 신청자와 예약 담당자에게 자동으로 알림이 전달됩니다.'
                          : '읽기 전용입니다. 승인/반려는 승인 권한이 있는 부동산팀원만 처리할 수 있습니다.') + '</p></div></div>' +

     '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">' +
       '<div class="kpi k-orange"><div class="lb">승인 대기</div><div class="vl">' + d.pending.length + '<small>건</small></div>' +
         '<div class="sub">대기 금액 ' + STAY.won(pendingSum) + '</div></div>' +
       '<div class="kpi k-green"><div class="lb">승인 완료 (누적)</div><div class="vl">' + d.approved.length + '<small>건</small></div>' +
         '<div class="sub">' + STAY.won(d.approved.reduce(function(s,b){return s+amount(b);},0)) + '</div></div>' +
       '<div class="kpi k-red"><div class="lb">반려 (누적)</div><div class="vl">' + d.rejected.length + '<small>건</small></div>' +
         '<div class="sub">반려 사유는 상세에서 확인</div></div>' +
     '</div>' +

     '<div class="card mt"><div class="card-h" style="padding:0 18px">' +
       '<div class="tabs" style="border:none">' +
         '<button data-t="pending" class="' + (tab==='pending'?'on':'') + '">승인대기 ' + d.pending.length + '</button>' +
         '<button data-t="approved" class="' + (tab==='approved'?'on':'') + '">승인완료 ' + d.approved.length + '</button>' +
         '<button data-t="rejected" class="' + (tab==='rejected'?'on':'') + '">반려 ' + d.rejected.length + '</button>' +
       '</div></div>' +
       '<div class="card-b tight" id="body"></div></div>';

    var rows = d[tab];
    var body = UI.qs('#body');
    if (!rows.length) { body.innerHTML = UI.empty(
      tab==='pending' ? '승인 대기 중인 예약이 없습니다. 👍' : '해당하는 내역이 없습니다.',
      tab==='pending' ? '✨' : '🗂'); return; }

    body.innerHTML = '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      '<th>예약번호</th><th>신청자 / 지점</th><th>이용 숙소</th><th>일정</th><th class="num">인원/객실</th>' +
      '<th class="num">예상비용</th><th>비용구분</th><th>담당자</th>' +
      (tab==='pending' ? '<th>승인요청</th><th class="no-print">처리</th>'
                       : '<th>처리자</th><th>처리일시</th><th class="wrapcell">의견</th>') +
      '</tr></thead><tbody>' +
      rows.map(function(b){
        var over = amount(b) >= (Store.settings().approvalThreshold||100000)*5;
        return '<tr data-b="' + b.id + '">' +
          '<td data-l="예약번호" class="code">' + UI.esc(b.code) + '</td>' +
          '<td data-l="신청자">' + UI.esc(b.applicantName) + '<div class="sub">' + UI.esc(b.branch) + ' · ' + UI.esc(b.dept) + '</div></td>' +
          '<td data-l="숙소" class="wrapcell">' + UI.esc(b.lodgingName) + '<div class="sub">' + UI.esc(b.purpose) + '</div></td>' +
          '<td data-l="일정">' + UI.dateFull(b.checkIn) + ' ~ ' + UI.dateFull(b.checkOut) + '<div class="sub">' + b.nights + '박</div></td>' +
          '<td data-l="인원/객실" class="num">' + b.guests + '명<div class="sub">' + b.rooms + '실</div></td>' +
          '<td data-l="예상비용" class="num"><b>' + STAY.won(amount(b)) + '</b>' + (over?'<div class="sub" style="color:var(--red)">고액</div>':'') + '</td>' +
          '<td data-l="비용구분">' + UI.esc(STAY.COST_BEARER[b.costBearer]) + '</td>' +
          '<td data-l="담당자">' + UI.esc(b.assigneeName||'-') + '</td>' +
          (tab==='pending'
            ? '<td data-l="승인요청">' + UI.dtFull(b.approval.requestedAt) + '<div class="sub">' + UI.ago(b.approval.requestedAt) + '</div></td>' +
              '<td class="no-print">' + (canDecide
                ? '<div class="btnrow"><button class="btn btn-sm btn-gold" data-ok="' + b.id + '">승인</button>' +
                  '<button class="btn btn-sm btn-danger" data-no="' + b.id + '">반려</button></div>'
                : '<span class="muted">권한 없음</span>') + '</td>'
            : '<td data-l="처리자">' + UI.esc(b.approval.approverName||'-') + '</td>' +
              '<td data-l="처리일시">' + UI.dtFull(b.approval.decidedAt) + '</td>' +
              '<td data-l="의견" class="wrapcell">' + UI.esc(b.approval.opinion||'-') + '</td>') +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  UI.on(root, 'click', '.tabs button[data-t]', function(){ tab = this.dataset.t; render(); });
  UI.on(root, 'click', 'tr[data-b]', function(e){
    if (e.target.closest('button')) return;
    NAV.href = '#/detail?id=' + this.dataset.b;
  });
  UI.on(root, 'click', '[data-ok]', function(e){
    e.stopPropagation(); decide(this.dataset.ok, 'APPROVED');
  });
  UI.on(root, 'click', '[data-no]', function(e){
    e.stopPropagation(); decide(this.dataset.no, 'REJECTED');
  });
  function decide(id, to){
    var b = Store.booking(id);
    var isOk = to === 'APPROVED';
    UI.prompt(isOk ? '예약 승인' : '예약 반려',
      (isOk ? '승인 의견 (선택)' : '반려 사유 (필수)'),
      { required:!isOk, danger:!isOk, okLabel: isOk?'승인':'반려',
        hint: b.code + ' · ' + b.lodgingName + ' · ' + STAY.won(amount(b)) + ' · ' + b.branch + ' ' + b.applicantName,
        placeholder: isOk ? '예) 이용 목적 확인. 승인합니다.' : '예) 인원 대비 객실 수 과다. 조정 후 재신청 바랍니다.' })
      .then(function(v){
        if (v == null) return;
        var r = Store.transition(id, to, user, v);
        if (r.ok) { UI.toast(isOk?'승인했습니다.':'반려했습니다.', isOk?'ok':'bad'); render(); }
        else UI.toast(r.msg, 'bad');
      });
  }
  render();
})();

};

PAGES["settlement"] = function(){

(function(){
  var user = Auth.current();
  var root = UI.shell('settle', '정산 관리', '회계팀 — 결제 확인 · 증빙 · 비용처리 · 정산완료');
  var canSettle = Auth.can('settle');
  var now = new Date();
  var st = { tab:'wait', month:'', branch:'', bearer:'', q:'' };

  /* 지점 목록이 확정되기 전이므로 실제 신청에 쓰인 지점명까지 필터에 넣는다 */
  function branchOptions(){
    var set = {};
    Store.branches().forEach(function(b){ set[b.name] = 1; });
    Store.bookings().forEach(function(b){ if (b.branch) set[b.branch] = 1; });
    return Object.keys(set).sort();
  }
  function amount(b){ return (b.reservation && b.reservation.amount) || b.estimatedCost || 0; }
  function pool(){
    return Store.visibleBookings(user).filter(function(b){
      return ['USED','SETTLE_WAIT','SETTLING','SETTLED'].indexOf(b.status) >= 0;
    });
  }
  function tabRows(t){
    var rows = pool();
    if (t==='wait')     rows = rows.filter(function(b){ return b.status==='SETTLE_WAIT'; });
    if (t==='doing')    rows = rows.filter(function(b){ return b.status==='SETTLING'; });
    if (t==='done')     rows = rows.filter(function(b){ return b.status==='SETTLED'; });
    if (t==='used')     rows = rows.filter(function(b){ return b.status==='USED'; });
    if (st.month)  rows = rows.filter(function(b){ return (b.checkOut||'').slice(0,7) === st.month; });
    if (st.branch) rows = rows.filter(function(b){ return b.branch === st.branch; });
    if (st.bearer) rows = rows.filter(function(b){ return b.costBearer === st.bearer; });

      rows = rows.filter(function(b){ return [b.code,b.lodgingName,b.applicantName,b.guestName,(b.reservation||{}).confirmNo]

    return rows.sort(function(a,b){ return a.checkOut < b.checkOut ? 1 : -1; });
  }

  var months = [];

  function render(){

    var used = p.filter(function(b){ return b.status==='USED'; });

     '<div class="pagehead"><div><h2>정산 관리</h2>' +

       '<div class="sp"></div><button class="btn" id="csv">정산내역 CSV</button></div>' +

     '<div class="kpis">' +
       '<div class="kpi k-orange"><div class="lb">정산대기</div><div class="vl">' + wait.length + '<small>건</small></div>' +

       '<div class="kpi k-gold"><div class="lb">정산중</div><div class="vl">' + doing.length + '<small>건</small></div>' +
         '<div class="sub">증빙 확인 필요</div></div>' +
       '<div class="kpi k-green"><div class="lb">이번 달 정산완료</div><div class="vl">' + doneMonth.length + '<small>건</small></div>' +
         '<div class="sub">' + STAY.won(doneMonth.reduce(function(s,b){return s+(b.payment.paidAmount||0);},0)) + '</div></div>' +
       '<div class="kpi k-ink"><div class="lb">누적 정산금액</div><div class="vl">' +
         STAY.wonShort(done.reduce(function(s,b){return s+(b.payment.paidAmount||0);},0)) + '<small>원</small></div>' +
         '<div class="sub">정산완료 ' + done.length + '건</div></div>' +
     '</div>' +

     '<div class="card mt"><div class="card-b">' +
       '<div class="filterbar">' +
         '<div class="field"><label>검색</label><input class="input" id="f_q" value="' + UI.esc(st.q) + '" placeholder="예약번호·숙소·이용자"></div>' +
         '<div class="field"><label>정산 월 (체크아웃 기준)</label><select class="select" id="f_month"><option value="">전체</option>' +
           months.map(function(m){ return '<option' + (m===st.month?' selected':'') + '>' + m + '</option>'; }).join('') + '</select></div>' +
         '<div class="field"><label>지점</label><select class="select" id="f_branch"><option value="">전체</option>' +
           branchOptions().map(function(b){ return '<option' + (b===st.branch?' selected':'') + '>' + UI.esc(b) + '</option>'; }).join('') + '</select></div>' +
         '<div class="field"><label>비용 부담주체</label><select class="select" id="f_bearer"><option value="">전체</option>' +
           UI.optionList(STAY.COST_BEARER, st.bearer) + '</select></div>' +
       '</div>' +
     '</div>' +
     '<div class="card-h" style="padding:0 18px;border-top:1px solid var(--line-2)">' +

         '<button data-t="used" class="' + (st.tab==='used'?'on':'') + '">이용완료(정산요청 전) ' + used.length + '</button>' +

    var rows = tabRows(st.tab);

      '</tr></thead><tbody>' +

                 : b.status==='SETTLING' ? {to:'SETTLED', label:'정산 완료'} : null;
        var allowed = next && Store.canTransition(b, next.to, user).ok !== undefined &&
                      (STAY.FLOW[b.status]||[]).some(function(o){ return o.to===next.to && o.roles.indexOf(user.role)>=0; });
        return '<tr data-b="' + b.id + '">' +
          '<td data-l="예약번호" class="code">' + UI.esc(b.code) + '</td>' +
          '<td data-l="숙소" class="wrapcell">' + UI.esc(b.lodgingName) +

          '<td data-l="비용부담" class="m-hide">' + UI.esc(STAY.COST_BEARER[b.costBearer]) + '</td>' +
          '<td data-l="세금계산서" class="m-hide">' + (p.taxInvoice ? '✔' : '<span class="muted">-</span>') + '</td>' +
          '<td data-l="영수증" class="m-hide">' + (p.receipt ? '✔' : '<span class="muted">-</span>') + '</td>' +
          '<td data-l="증빙" class="m-hide">' + ((p.evidence||[]).length ? (p.evidence.length + '건') : '<span class="muted">-</span>') + '</td>' +

          '<td data-l="정산완료일" class="m-hide">' + (p.settledAt ? UI.dateFull(p.settledAt) : '<span class="muted">-</span>') + '</td>' +
          '<td class="no-print">' + (next && allowed
            ? '<button class="btn btn-sm btn-gold" data-go="' + b.id + '" data-to="' + next.to + '">' + next.label + '</button>'
            : '') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
    bind();
  }

  function bind(){
    ['#f_q','#f_month','#f_branch','#f_bearer'].forEach(function(sel){
      var e = UI.qs(sel); if (!e) return;
      e.oninput = e.onchange = function(){
        st.q = UI.qs('#f_q').value.trim(); st.month = UI.qs('#f_month').value;
        st.branch = UI.qs('#f_branch').value; st.bearer = UI.qs('#f_bearer').value;
        render();
      };
    });
  }

  UI.on(root, 'click', '.tabs button[data-t]', function(){ st.tab = this.dataset.t; render(); });
  UI.on(root, 'click', 'tr[data-b]', function(e){
    if (e.target.closest('button')) return;
    NAV.href = '#/detail?id=' + this.dataset.b;
  });
  UI.on(root, 'click', '[data-go]', function(e){
    e.stopPropagation();
    var id = this.dataset.go, to = this.dataset.to;
    var b = Store.booking(id);
    var chk = Store.canTransition(b, to, user);
    if (!chk.ok) {
      UI.confirm('추가 입력이 필요합니다', chk.msg + '\n\n상세 화면에서 정산정보를 입력하시겠습니까?', '상세로 이동')
        .then(function(ok){ if (ok) NAV.href = '#/detail?id=' + id; });
      return;
    }
    UI.confirm(chk.opt.action, b.code + ' → ' + STAY.STATUS[to].label, chk.opt.action).then(function(ok){
      if (!ok) return;
      var r = Store.transition(id, to, user);
      if (r.ok) { UI.toast(chk.opt.action + ' 처리했습니다.', 'ok'); render(); } else UI.toast(r.msg, 'bad');
    });
  });
  UI.on(root, 'click', '#csv', function(){
    var rows = tabRows(st.tab);
    var head = ['예약번호','숙소','이용자','지점','체크인','체크아웃','예약금액','실제결제금액','결제일','결제방법',
                '비용부담주체','세금계산서','영수증','증빙파일수','회계담당자','정산상태','정산완료일'];
    var body = rows.map(function(b){ var p=b.payment||{};
      return [b.code, b.lodgingName, b.guestName||b.applicantName, b.branch, b.checkIn, b.checkOut,
              amount(b), p.paidAmount||0, p.paidAt||'', p.method||'', STAY.COST_BEARER[b.costBearer],
              p.taxInvoice?'Y':'N', p.receipt?'Y':'N', (p.evidence||[]).length, p.financeName||'',
              STAY.STATUS[b.status].label, p.settledAt ? UI.dateFull(p.settledAt) : ''];
    });
    UI.download('정산내역_' + STAY.ymd(new Date()) + '.csv', UI.toCsv([head].concat(body)));
  });

  render();
})();

};

PAGES["admin"] = function(){

(function(){
  var user = Auth.current();
  var root = UI.shell('admin', '관리자', '사용자·권한 · 처리로그 · 통계 · 시스템 설정');
  if (user.role !== 'admin') {
    root.innerHTML = UI.empty('관리자 권한이 필요한 화면입니다.', '🔒') +
      '<div class="center"><a class="btn btn-primary" href="#/index">대시보드로</a></div>';
    return;
  }
  var tab = UI.param('tab') || 'stats';
  var logF = { q:'', user:'', action:'', from:'', to:'' };

  function amount(b){ return (b.reservation && b.reservation.amount) || b.estimatedCost || 0; }

  function render(){
    root.innerHTML =
     '<div class="pagehead"><div><h2>관리자</h2><p>전체 예약 · 사용자 · 권한 · 숙소 · 비용 · 로그 · 설정</p></div>' +
       '<div class="sp"></div><div class="btnrow">' +
       '<button class="btn" id="exportAll">전체 데이터 내보내기(JSON)</button>' +
       '<button class="btn btn-danger" id="resetDb">데모 데이터 초기화</button></div></div>' +
     '<div class="card"><div class="card-h" style="padding:0 18px"><div class="tabs" style="border:none">' +
       [['stats','📈 통계'],['users','👥 사용자·권한'],['logs','📜 처리 로그'],['perm','🔐 권한 매트릭스'],['settings','⚙️ 시스템 설정']]
         .map(function(t){ return '<button data-t="' + t[0] + '" class="' + (tab===t[0]?'on':'') + '">' + t[1] + '</button>'; }).join('') +
     '</div></div><div class="card-b" id="pane"></div></div>';
    ({ stats:paneStats, users:paneUsers, logs:paneLogs, perm:panePerm, settings:paneSettings }[tab])();
  }

  /* ---------------- 통계 ---------------- */
  function paneStats(){
    var all = Store.bookings();
    var active = all.filter(function(b){ return ['CANCELED','REJECTED'].indexOf(b.status)<0; });
    var now = new Date();
    var months = [];
    for (var i=11;i>=0;i--){ var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key:d.getFullYear()+'-'+STAY.pad(d.getMonth()+1), label:(d.getMonth()+1)+'월' }); }
    months.forEach(function(m){
      var rows = active.filter(function(b){ return (b.checkIn||'').slice(0,7) === m.key; });
      m.cnt = rows.length; m.sum = rows.reduce(function(s,b){ return s+amount(b); },0);
      m.nights = rows.reduce(function(s,b){ return s+(b.nights||0); },0);
    });
    var maxSum = Math.max.apply(null, months.map(function(m){return m.sum;}).concat([1]));

    var byBranch = {}, byLodging = {}, byBearer = {}, byApplicant = {};
    active.forEach(function(b){
      agg(byBranch, b.branch, b); agg(byLodging, b.lodgingName, b);
      agg(byBearer, STAY.COST_BEARER[b.costBearer], b); agg(byApplicant, b.applicantName + ' (' + b.branch + ')', b);
    });
    function agg(o,k,b){ if(!k) return; if(!o[k]) o[k]={n:0,sum:0,nights:0};
      o[k].n++; o[k].sum+=amount(b); o[k].nights+=(b.nights||0); }
    function rank(o, limit){
      return Object.keys(o).map(function(k){ return {k:k, v:o[k]}; })
        .sort(function(a,b){ return b.v.sum - a.v.sum; }).slice(0, limit||99);
    }
    function barTable(title, arr, unit){
      var mx = Math.max.apply(null, arr.map(function(x){return x.v.sum;}).concat([1]));
      return '<div class="card"><div class="card-h"><h3>' + title + '</h3></div><div class="card-b"><div class="bars">' +
        (arr.length ? arr.map(function(x){
          return '<div class="bar-row"><span class="nm" title="' + UI.esc(x.k) + '">' + UI.esc(x.k) + '</span>' +
            '<span class="tr"><span class="fi gold" style="width:' + (x.v.sum/mx*100) + '%"></span></span>' +
            '<span class="vv">' + x.v.n + unit + ' · ' + STAY.wonShort(x.v.sum) + '</span></div>';
        }).join('') : UI.empty('데이터 없음')) + '</div></div></div>';
    }

    var totalCost = active.reduce(function(s,b){ return s+amount(b); },0);
    var settled = all.filter(function(b){ return b.status==='SETTLED'; });
    var cancelRate = all.length ? Math.round(all.filter(function(b){ return b.status==='CANCELED'; }).length / all.length * 100) : 0;
    var rejectRate = all.length ? Math.round(all.filter(function(b){ return b.status==='REJECTED'; }).length / all.length * 100) : 0;
    var avgNight = active.length ? (active.reduce(function(s,b){return s+(b.nights||0);},0)/active.length).toFixed(1) : 0;

    UI.qs('#pane').innerHTML =
     '<div class="kpis">' +
       kpiBox('k-ink','전체 예약', all.length + '<small>건</small>', '유효 ' + active.length + '건') +
       kpiBox('k-gold','누적 숙박비용', STAY.wonShort(totalCost) + '<small>원</small>', '취소·반려 제외') +
       kpiBox('k-green','정산완료', settled.length + '<small>건</small>', STAY.won(settled.reduce(function(s,b){return s+(b.payment.paidAmount||0);},0))) +
       kpiBox('k-red','취소율 / 반려율', cancelRate + '<small>%</small> / ' + rejectRate + '<small>%</small>', '평균 ' + avgNight + '박') +
     '</div>' +
     '<div class="card mt"><div class="card-h"><h3>📈 월별 숙박비용 (최근 12개월)</h3><span class="sp"></span>' +
       '<span class="sub">체크인 월 기준</span></div><div class="card-b"><div class="cols" style="height:180px">' +
       months.map(function(m){
         return '<div class="col"><span class="cv">' + (m.sum?STAY.wonShort(m.sum):'') + '</span>' +
           '<span class="cb" style="height:' + Math.max(3, m.sum/maxSum*100) + '%"></span>' +
           '<span class="cl">' + m.label + '</span></div>';
       }).join('') + '</div>' +
       '<div class="hr"></div><div class="tablewrap"><table class="tbl"><thead><tr><th>월</th>' +
         months.map(function(m){ return '<th class="num">' + m.label + '</th>'; }).join('') + '</tr></thead><tbody>' +
         '<tr style="cursor:default"><td>건수</td>' + months.map(function(m){ return '<td class="num">' + m.cnt + '</td>'; }).join('') + '</tr>' +
         '<tr style="cursor:default"><td>박수</td>' + months.map(function(m){ return '<td class="num">' + m.nights + '</td>'; }).join('') + '</tr>' +
         '<tr style="cursor:default"><td>비용</td>' + months.map(function(m){ return '<td class="num">' + (m.sum?STAY.wonShort(m.sum):'-') + '</td>'; }).join('') + '</tr>' +
       '</tbody></table></div></div></div>' +
     '<div class="grid g2 mt">' +
       barTable('🏢 지점별 이용현황', rank(byBranch), '건') +
       barTable('🏨 숙소별 이용현황', rank(byLodging), '건') +
