<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>공지 · 이용지침 | 옆커폰 숙박 예약관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/stay.css">
</head>
<body>
<script src="assets/gate.js"></script>
<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
  var user = Auth.current();
  var root = UI.shell('notice', '공지 · 이용지침', '숙박 예약 신청방법 · 규정 · FAQ');
  var ct = Store.settings().contact || { team:'부동산팀', name:'', title:'', phone:'' };
  var canEdit = !Deploy.isStaff() && Auth.can('manageNotice');
  var cat = '';

  function render(){
    var all = Store.notices();
    var list = cat ? all.filter(function(n){ return n.category === cat; }) : all;

    root.innerHTML =
     '<div class="pagehead"><div><h2>공지 · 이용지침</h2>' +
       '<p>처음 오신 지점장·신규 직원도 <b>담당자에게 전화하지 않고</b> 이 문서만으로 예약 방법을 알 수 있도록 정리했습니다.</p></div>' +
       '<div class="sp"></div>' + (canEdit ? '<button class="btn btn-gold" id="add">＋ 공지 등록</button>' : '') + '</div>' +

     '<div class="card" style="margin-bottom:14px"><div class="card-b">' +
       '<div class="grid g4" style="gap:10px">' +
         step('1', '예약 신청', '좌측 [예약 신청] 메뉴에서 신청서를 작성합니다. 체크인·체크아웃만 넣으면 숙박일수는 자동 계산됩니다.') +
         step('2', '접수 · 승인', '부동산팀이 접수하고 내용을 확인합니다. 승인은 부동산팀원 누구나 할 수 있어 담당자 부재로 지연되지 않습니다.') +
         step('3', '예약 완료', '부동산팀이 숙소에 예약하고 예약번호·객실정보를 등록하면 신청자에게 알림이 갑니다.') +
         step('4', '이용 · 정산', '숙박 이용 후 부동산팀 회계 담당이 결제·증빙을 확인하고 정산을 완료합니다.') +
       '</div>' +
       '<div class="hr"></div>' +
       '<div class="note">☎️ <b>예약 신청은 전화·카카오톡이 아니라 이 시스템으로 넣어주세요.</b> ' +
         '개인에게 요청이 몰리면 누락·중복 예약이 발생합니다. 부득이하게 전화로 요청하신 경우에도 ' +
         '부동산팀이 시스템에 대신 등록하며, <b>등록되지 않은 요청은 처리·정산되지 않습니다.</b><br>' +
         '문의는 <b>' + UI.esc(ct.team) + ' ' + UI.esc(ct.phone) + '</b> 한 곳으로 주시면 됩니다.</div>' +
     '</div></div>' +

     '<div class="grid g-1-2">' +
       '<div><div class="card"><div class="card-h"><h3>📇 문의 창구</h3></div>' +
         '<div class="card-b">' +
           '<div class="note" style="margin:0">' +
             '<div style="font-size:13px;font-weight:800;color:#7a5800">숙박 예약 관련 모든 문의</div>' +
             '<div style="font-size:20px;font-weight:900;margin:6px 0 2px;color:var(--ink)">' + UI.esc(ct.team) + '</div>' +
             '<a href="tel:' + UI.esc(ct.phone) + '" style="font-size:17px;font-weight:900;color:var(--ink);text-decoration:underline">' +
               UI.esc(ct.phone) + '</a>' +
             '<div style="font-size:12.5px;margin-top:4px;color:#7a5800">' + UI.esc(ct.name) +
               (ct.title ? ' ' + UI.esc(ct.title) : '') + '</div>' +
           '</div>' +
           '<p class="muted" style="font-size:12.5px;margin:12px 0 0">접수·승인·예약·정산은 부동산팀 안에서 나눠 처리합니다. ' +
             '어느 단계인지 몰라도 위 한 곳으로 문의하시면 됩니다. 팀원 개개인에게 따로 연락하실 필요가 없습니다.</p>' +
         '</div></div>' +
         '<div class="card mt"><div class="card-h"><h3>🗂 분류</h3></div><div class="card-b">' +
           '<div class="chips"><button class="chip' + (cat===''?' on':'') + '" data-c="">전체<span class="n">' + all.length + '</span></button>' +
           STAY.NOTICE_CAT.map(function(c){
             var n = all.filter(function(x){ return x.category===c; }).length;
             return '<button class="chip' + (cat===c?' on':'') + '" data-c="' + UI.esc(c) + '">' + UI.esc(c) +
               '<span class="n">' + n + '</span></button>';
           }).join('') + '</div></div></div>' +
       '</div>' +

       '<div id="docs">' +
         (list.length ? list.map(function(n){
           return '<details class="acc"' + (n.pinned ? ' open' : '') + '>' +
             '<summary>' + (n.pinned ? '<span class="tag gold">중요</span>' : '') +
               '<span class="tag">' + UI.esc(n.category) + '</span>' +
               '<span>' + UI.esc(n.title) + '</span></summary>' +
             '<div class="accb">' + UI.esc(n.body) + '</div>' +
             '<div class="accb" style="padding-top:0;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center">' +
               '작성 ' + UI.esc(n.author) + ' · ' + UI.dateFull(n.createdAt) +
               (canEdit ? '<span style="margin-left:auto"></span>' +
                 '<button class="btn btn-sm" data-ed="' + n.id + '">수정</button>' +
                 '<button class="btn btn-sm btn-danger" data-del="' + n.id + '">삭제</button>' : '') +
             '</div></details>';
         }).join('') : '<div class="card"><div class="card-b">' + UI.empty('등록된 공지가 없습니다.','📢') + '</div></div>') +
       '</div>' +
     '</div>';
  }
  function step(no, t, d){
    return '<div style="border:1px solid var(--line);border-radius:12px;padding:14px">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
      '<span style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--gold);' +
      'display:grid;place-items:center;font-weight:900;font-size:12px">' + no + '</span>' +
      '<b style="font-size:14px">' + t + '</b></div>' +
      '<div style="font-size:12.5px;color:var(--text-2);line-height:1.6">' + d + '</div></div>';
  }

  function editModal(n){
    n = n || { category:STAY.NOTICE_CAT[0], pinned:false, author:user.name };
    UI.modal({
      title: n.id ? '공지 수정' : '공지 등록', wide:true,
      body:'<div class="frow f2">' +
          '<div class="field"><label>분류</label><select class="select" name="category">' +
            STAY.NOTICE_CAT.map(function(c){ return '<option' + (c===n.category?' selected':'') + '>' + UI.esc(c) + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field"><label>상단 고정</label><select class="select" name="pinned">' +
            '<option value="false"' + (!n.pinned?' selected':'') + '>일반</option>' +
            '<option value="true"' + (n.pinned?' selected':'') + '>중요 (상단 고정)</option></select></div>' +
        '</div>' +
        '<div class="field"><label>제목</label><input class="input" name="title" value="' + UI.esc(n.title||'') + '"></div>' +
        '<div class="field"><label>내용</label><textarea class="textarea" name="body" style="min-height:220px">' + UI.esc(n.body||'') + '</textarea></div>',
      buttons:[{label:'취소'},{label:'저장', cls:'btn-primary', keepOpen:true, onClick:function(mm, close){
        var out = { id:n.id, author:n.author || user.name };
        UI.qsa('[name]', mm).forEach(function(i){ out[i.name] = i.value; });
        if (!out.title.trim()) { UI.toast('제목을 입력해주세요.','bad'); return false; }
        out.pinned = out.pinned === 'true';
        Store.saveNotice(out); close(); UI.toast('저장했습니다.','ok'); render();
      }}]
    });
  }

  UI.on(root, 'click', '.chip[data-c]', function(){ cat = this.dataset.c; render(); });
  UI.on(root, 'click', '#add', function(){ editModal(null); });
  UI.on(root, 'click', '[data-ed]', function(e){
    e.preventDefault();
    var n = Store.notices().filter(function(x){ return x.id === this.dataset.ed; }.bind(this))[0];
    editModal(n);
  });
  UI.on(root, 'click', '[data-del]', function(e){
    e.preventDefault();
    var id = this.dataset.del;
    UI.confirm('공지 삭제', '이 공지를 삭제합니다.', '삭제', true).then(function(ok){
      if (!ok) return; Store.removeNotice(id); UI.toast('삭제했습니다.','ok'); render();
    });
  });
  render();
})();
</script>
</body>
</html>
