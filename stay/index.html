<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>숙박 예약관리 대시보드 | 옆커폰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/stay.css">
</head>
<body>
<script src="assets/gate.js"></script>
<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
  var user = Auth.current();
  var root = UI.shell('dash', '숙박 예약관리 대시보드', '옆커폰 내부 업무시스템 · 호텔/펜션 통합 예약');
  var all  = Store.visibleBookings(user);
  var today = STAY.ymd(new Date());
  var tomorrow = STAY.ymd(STAY.addDays(new Date(), 1));
  var now = new Date();
  var thisMonth = now.getFullYear() + '-' + STAY.pad(now.getMonth()+1);

  function amount(b){ return (b.reservation && b.reservation.amount) || b.estimatedCost || 0; }
  function inMonth(ds, m){ return ds && ds.slice(0,7) === m; }
  var active = all.filter(function(b){ return b.status!=='CANCELED' && b.status!=='REJECTED'; });

  /* ---------- KPI ---------- */
  var kMonthReq   = all.filter(function(b){ return inMonth(STAY.ymd(b.requestedAt), thisMonth); }).length;
  var kMonthStay  = active.filter(function(b){ return inMonth(b.checkIn, thisMonth) && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; }).length;
  var kInToday    = active.filter(function(b){ return b.checkIn===today && ['BOOKED','UPCOMING','USED'].indexOf(b.status)>=0; });
  var kOutToday   = active.filter(function(b){ return b.checkOut===today && ['BOOKED','UPCOMING','USED','SETTLE_WAIT'].indexOf(b.status)>=0; });
  var kApproval   = all.filter(function(b){ return b.status==='APPROVAL_PENDING'; });
  var kBooking    = all.filter(function(b){ return ['APPROVED','BOOKING'].indexOf(b.status)>=0; });
  var kSettle     = all.filter(function(b){ return ['SETTLE_WAIT','SETTLING'].indexOf(b.status)>=0; });
  var kMonthCost  = active.filter(function(b){ return inMonth(b.checkIn, thisMonth); })
                          .reduce(function(s,b){ return s + amount(b); }, 0);

  function kpi(cls, label, val, unit, sub, href){
    return '<a class="kpi ' + cls + '" href="' + href + '">' +
      '<div class="lb">' + label + '</div>' +
      '<div class="vl">' + val + (unit?'<small>'+unit+'</small>':'') + '</div>' +
      '<div class="sub">' + sub + '</div></a>';
  }
  var kpiHtml = '<div class="kpis">' +
    kpi('k-ink','이번 달 예약 건수', kMonthReq, '건', thisMonth + ' 신청 기준', 'requests.html?month=' + thisMonth) +
    kpi('k-blue','이번 달 이용 예정', kMonthStay, '건', '예약완료·이용예정', 'requests.html?status=UPCOMING') +
    kpi('k-green','오늘 체크인', kInToday.length, '건', today, 'requests.html?ci=' + today) +
    kpi('k-green','오늘 체크아웃', kOutToday.length, '건', today, 'requests.html?co=' + today) +
  '</div><div class="kpis" style="margin-top:12px">' +
    kpi('k-orange','승인대기', kApproval.length, '건', kApproval.length ? '지금 승인이 필요합니다' : '대기 건 없음', 'approvals.html') +
    kpi('k-violet','예약진행중', kBooking.length, '건', '승인완료 + 예약진행중', 'requests.html?status=BOOKING') +
    kpi('k-red','정산대기', kSettle.length, '건', '정산대기 + 정산중', 'settlement.html') +
    kpi('k-gold','이번 달 숙박비용', STAY.wonShort(kMonthCost), '원', '체크인 기준 합계', 'settlement.html') +
  '</div>';

  /* ---------- 내 할일 (역할별) ---------- */
  var TODO = {
    applicant: [
      { t:'반려된 내 신청', f:function(b){ return b.status==='REJECTED' && b.applicantId===user.id; }, i:'🚫', h:'재신청이 필요합니다' },
      { t:'진행 중인 내 신청', f:function(b){ return b.applicantId===user.id && ['NEW','RECEIVED','REVIEWING','APPROVAL_PENDING','APPROVED','BOOKING'].indexOf(b.status)>=0; }, i:'⏳', h:'담당자가 처리 중입니다' },
      { t:'예약 확정 · 이용예정', f:function(b){ return b.applicantId===user.id && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; }, i:'🏨', h:'예약번호를 확인하세요' }
    ],
    booker: [
      { t:'접수해야 할 신규 신청', f:function(b){ return b.status==='NEW'; }, i:'📝', h:'접수 처리가 필요합니다' },
      { t:'검토·승인요청 필요', f:function(b){ return ['RECEIVED','REVIEWING'].indexOf(b.status)>=0; }, i:'🔍', h:'내용 확인 후 승인 요청' },
      { t:'숙소 예약 진행 필요', f:function(b){ return ['APPROVED','BOOKING'].indexOf(b.status)>=0; }, i:'📞', h:'숙소에 예약하고 예약번호 등록' },
      { t:'오늘 체크인', f:function(b){ return b.checkIn===today && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; }, i:'🧳', h:'신청자 안내 확인' },
      { t:'이용완료 처리 필요', f:function(b){ return b.status==='UPCOMING' && b.checkOut < today; }, i:'🛏', h:'체크아웃일이 지났습니다' },
      { t:'신청자 수정·취소 요청', f:function(b){ return (b.changeRequest && !b.changeRequest.handled) || (b.cancelRequest && !b.cancelRequest.handled); }, i:'✏️', h:'요청에 응답이 필요합니다' }
    ],
    approver: [
      { t:'승인 대기', f:function(b){ return b.status==='APPROVAL_PENDING'; }, i:'⏳', h:'승인 또는 반려해주세요' },
      { t:'내가 승인한 진행 건', f:function(b){ return b.approval && b.approval.approverId===user.id && ['APPROVED','BOOKING','BOOKED','UPCOMING'].indexOf(b.status)>=0; }, i:'✅', h:'진행 상황 확인' }
    ],
    finance: [
      { t:'정산대기 (결제확인 필요)', f:function(b){ return b.status==='SETTLE_WAIT'; }, i:'💳', h:'결제방법·금액 입력 후 정산 시작' },
      { t:'정산중 (증빙 확인 필요)', f:function(b){ return b.status==='SETTLING'; }, i:'🧾', h:'세금계산서·영수증 확인' }
    ],
    admin: [
      { t:'승인 대기', f:function(b){ return b.status==='APPROVAL_PENDING'; }, i:'⏳', h:'승인담당자 미처리' },
      { t:'접수 대기 신규 신청', f:function(b){ return b.status==='NEW'; }, i:'📝', h:'예약담당자 미접수' },
      { t:'숙소 예약 진행 필요', f:function(b){ return ['APPROVED','BOOKING'].indexOf(b.status)>=0; }, i:'📞', h:'' },
      { t:'정산 필요', f:function(b){ return ['SETTLE_WAIT','SETTLING'].indexOf(b.status)>=0; }, i:'💳', h:'' },
      { t:'오늘 체크인', f:function(b){ return b.checkIn===today && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; }, i:'🧳', h:'' },
      { t:'오늘 체크아웃', f:function(b){ return b.checkOut===today; }, i:'🚪', h:'' }
    ]
  };
  var todos = (TODO[user.role]||[]).map(function(t){
    return { t:t.t, i:t.i, h:t.h, rows:all.filter(t.f) };
  });
  var todoTotal = todos.reduce(function(s,t){ return s + t.rows.length; }, 0);

  var todoHtml =
   '<div class="card">' +
    '<div class="card-h"><h3>🎯 내가 처리해야 할 업무</h3>' +
      '<span class="sub">' + UI.esc(STAY.ROLES[user.role].label) + ' · ' + UI.esc(user.name) + '</span>' +
      '<span class="sp"></span><span class="tag ' + (todoTotal?'gold':'') + '">' + todoTotal + '건</span></div>' +
    '<div class="card-b tight"><div class="list">' +
      (todoTotal === 0
        ? UI.empty('지금 처리할 업무가 없습니다. 👍','✨')
        : todos.filter(function(t){ return t.rows.length; }).map(function(t){
            var codes = t.rows.slice(0,3).map(function(b){ return b.code; }).join(', ');
            return '<div class="li" data-todo="' + encodeURIComponent(t.t) + '">' +
              '<span class="ic">' + t.i + '</span>' +
              '<span class="tx"><span class="t1">' + UI.esc(t.t) + '</span>' +
              '<span class="t2">' + UI.esc(t.h || '') + (codes ? ' · ' + UI.esc(codes) + (t.rows.length>3?' 외 '+(t.rows.length-3)+'건':'') : '') + '</span></span>' +
              '<span class="rt"><b style="font-size:16px">' + t.rows.length + '</b><span class="t2">건</span> ›</span></div>';
          }).join('')) +
    '</div></div></div>';

  /* ---------- 최근 예약 신청 ---------- */
  var recent = all.slice().sort(function(a,b){ return a.requestedAt < b.requestedAt ? 1 : -1; }).slice(0, 8);
  var recentHtml =
   '<div class="card">' +
    '<div class="card-h"><h3>🆕 최근 예약 신청</h3><span class="sp"></span>' +
      '<a class="btn btn-sm" href="requests.html">전체보기</a></div>' +
    '<div class="card-b tight"><div class="list">' +
      (recent.length ? recent.map(function(b){
        return '<div class="li" data-b="' + b.id + '">' +
          '<span class="ic">' + STAY.STATUS[b.status].icon + '</span>' +
          '<span class="tx"><span class="t1">' + UI.esc(b.lodgingName) + ' · ' + UI.esc(b.purpose) + '</span>' +
          '<span class="t2">' + UI.esc(b.code) + ' · ' + UI.esc(b.branch) + ' ' + UI.esc(b.applicantName) +
            ' · ' + UI.dateK(b.checkIn) + '~' + UI.dateK(b.checkOut) + ' (' + b.nights + '박) · ' + UI.ago(b.requestedAt) + '</span></span>' +
          '<span class="rt">' + UI.badge(b.status) + '</span></div>';
      }).join('') : UI.empty('예약 신청 내역이 없습니다.')) +
    '</div></div></div>';

  /* ---------- 상태별 현황 ---------- */
  var statusCounts = STAY.STATUS_ORDER.map(function(k){
    return { k:k, label:STAY.STATUS[k].label, n:all.filter(function(b){ return b.status===k; }).length };
  });
  var maxSt = Math.max.apply(null, statusCounts.map(function(s){ return s.n; }).concat([1]));
  var statusHtml =
   '<div class="card"><div class="card-h"><h3>📌 상태별 예약 현황</h3>' +
     '<span class="sp"></span><span class="sub">전체 ' + all.length + '건</span></div>' +
    '<div class="card-b"><div class="bars">' +
      statusCounts.map(function(s){
        return '<a class="bar-row" href="requests.html?status=' + s.k + '" style="color:inherit">' +
          '<span class="nm">' + UI.esc(s.label) + '</span>' +
          '<span class="tr"><span class="fi' + (s.n?' gold':'') + '" style="width:' + (s.n/maxSt*100) + '%"></span></span>' +
          '<span class="vv" style="width:52px">' + s.n + '건</span></a>';
      }).join('') +
    '</div></div></div>';

  /* ---------- 월별 숙박비용 ---------- */
  var months = [];
  for (var i=5;i>=0;i--){ var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: d.getFullYear()+'-'+STAY.pad(d.getMonth()+1), label:(d.getMonth()+1)+'월' }); }
  months.forEach(function(m){
    var rows = active.filter(function(b){ return inMonth(b.checkIn, m.key); });
    m.cnt = rows.length;
    m.sum = rows.reduce(function(s,b){ return s + amount(b); }, 0);
  });
  var maxSum = Math.max.apply(null, months.map(function(m){ return m.sum; }).concat([1]));
  var monthHtml =
   '<div class="card"><div class="card-h"><h3>📈 월별 숙박비용</h3><span class="sp"></span>' +
     '<span class="sub">체크인 월 기준 · 취소/반려 제외</span></div>' +
    '<div class="card-b"><div class="cols">' +
      months.map(function(m){
        return '<div class="col' + (m.key===thisMonth?' hi':'') + '">' +
          '<span class="cv">' + (m.sum?STAY.wonShort(m.sum):'-') + '</span>' +
          '<span class="cb" style="height:' + Math.max(3, m.sum/maxSum*100) + '%"></span>' +
          '<span class="cl">' + m.label + '</span></div>';
      }).join('') +
    '</div><div class="hr"></div>' +
    '<div class="bar-row" style="font-size:12.5px"><span class="nm">6개월 합계</span>' +
      '<span class="tr" style="background:none"></span>' +
      '<span class="vv" style="width:auto">' + STAY.won(months.reduce(function(s,m){return s+m.sum;},0)) +
      ' · ' + months.reduce(function(s,m){return s+m.cnt;},0) + '건</span></div>' +
    '</div></div>';

  /* ---------- 지점별 이용현황 ---------- */
  var brMap = {};
  active.forEach(function(b){
    if (!brMap[b.branch]) brMap[b.branch] = { n:0, sum:0, nights:0 };
    brMap[b.branch].n++; brMap[b.branch].sum += amount(b); brMap[b.branch].nights += (b.nights||0);
  });
  var brs = Object.keys(brMap).map(function(k){ return { name:k, v:brMap[k] }; })
                  .sort(function(a,b){ return b.v.sum - a.v.sum; });
  var maxBr = Math.max.apply(null, brs.map(function(b){ return b.v.sum; }).concat([1]));
  var branchHtml =
   '<div class="card"><div class="card-h"><h3>🏢 지점별 이용현황</h3><span class="sp"></span>' +
     '<span class="sub">건수 · 비용</span></div>' +
    '<div class="card-b">' + (brs.length ? '<div class="bars">' +
      brs.map(function(b){
        return '<a class="bar-row" href="requests.html?branch=' + encodeURIComponent(b.name) + '" style="color:inherit">' +
          '<span class="nm">' + UI.esc(b.name) + '</span>' +
          '<span class="tr"><span class="fi" style="width:' + (b.v.sum/maxBr*100) + '%"></span></span>' +
          '<span class="vv">' + b.v.n + '건 · ' + STAY.wonShort(b.v.sum) + '</span></a>';
      }).join('') + '</div>' : UI.empty('데이터가 없습니다.')) +
    '</div></div>';

  /* ---------- 오늘 체크인/아웃 ---------- */
  function miniList(title, icon, rows, emptyMsg){
    return '<div class="card"><div class="card-h"><h3>' + icon + ' ' + title + '</h3>' +
      '<span class="sp"></span><span class="tag">' + rows.length + '건</span></div>' +
      '<div class="card-b tight"><div class="list">' +
      (rows.length ? rows.map(function(b){
        return '<div class="li" data-b="' + b.id + '">' +
          '<span class="tx"><span class="t1">' + UI.esc(b.lodgingName) + '</span>' +
          '<span class="t2">' + UI.esc(b.code) + ' · ' + UI.esc(b.branch) + ' ' + UI.esc(b.guestName||b.applicantName) +
          ' · ' + b.rooms + '실 ' + b.guests + '명' +
          (b.reservation && b.reservation.confirmNo ? ' · 예약번호 ' + UI.esc(b.reservation.confirmNo) : '') + '</span></span>' +
          '<span class="rt">' + UI.badge(b.status) + '</span></div>';
      }).join('') : UI.empty(emptyMsg, '🗓')) + '</div></div></div>';
  }

  /* ---------- 안내 배너 ---------- */
  var banner = '<div class="note" style="margin-bottom:16px">' +
    '📌 호텔·펜션 예약은 <b>전화·카카오톡이 아닌 이 시스템</b>으로만 접수됩니다. ' +
    '전화로 받은 요청도 예약 담당자가 반드시 여기에 등록합니다. ' +
    '<a href="notices.html" style="text-decoration:underline">이용지침 보기 ›</a></div>';

  root.innerHTML =
    banner + kpiHtml +
    '<div class="grid g-2-1 mt">' + todoHtml + statusHtml + '</div>' +
    '<div class="grid g-2-1 mt">' + recentHtml +
      '<div class="grid">' + miniList('오늘 체크인', '🧳', kInToday, '오늘 체크인 예정이 없습니다.') +
      miniList('오늘 체크아웃', '🚪', kOutToday, '오늘 체크아웃 예정이 없습니다.') + '</div>' +
    '</div>' +
    '<div class="grid g2 mt">' + monthHtml + branchHtml + '</div>';

  UI.on(root, 'click', '.li[data-b]', function(){ location.href = 'detail.html?id=' + this.dataset.b; });
  UI.on(root, 'click', '.li[data-todo]', function(){
    location.href = 'requests.html?todo=' + this.dataset.todo + '&role=' + user.role;
  });
})();
</script>
</body>
</html>
