<meta charset="utf-8">
<title>옆커폰 숙박 예약 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* 옆커폰 숙박 예약관리 시스템 — 관리자 셸 스타일
   기존 브랜드 토큰(골드/잉크/Pretendard) 재사용 + 업무화면용 밝은 본문 */
:root{
  --gold:#FFC300; --gold-2:#e0a800; --gold-soft:#fff6da;
  --ink:#0c0c0f; --ink-2:#17171c; --ink-3:#232329; --ink-4:#2e2e36;
  --paper:#ffffff; --bg:#f4f5f7; --line:#e4e6ea; --line-2:#eef0f3;
  --text:#1b1c1f; --text-2:#5b606a; --muted:#8a8f99;
  --blue:#2563eb; --green:#0f9d58; --red:#d93b3b; --orange:#e8770a; --violet:#7c3aed;
  --radius:12px; --radius-lg:16px;
  --sb:250px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:800}

/* ---------- 레이아웃 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sb);flex:none;background:var(--ink);color:#d7d8dd;
  position:fixed;inset:0 auto 0 0;z-index:70;display:flex;flex-direction:column;
  border-right:1px solid #000;
}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
.sb-close{display:none;position:absolute;top:12px;right:12px;background:rgba(255,255,255,.1);
  border:none;color:#d7d8dd;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
.sb-close:hover{background:rgba(255,255,255,.2);color:#fff}
.sb-brand img{height:26px}
.sb-brand .sys{margin-top:9px;font-size:13px;font-weight:800;color:#fff;letter-spacing:-.02em}
.sb-brand .sys em{font-style:normal;color:var(--gold)}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.sb-group{margin:14px 0 6px;padding:0 10px;font-size:11px;font-weight:800;color:#6d707a;letter-spacing:.1em}
.sb-nav a{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  font-size:14px;font-weight:600;color:#c6c8ce;margin-bottom:2px;transition:.14s;
}
.sb-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-nav a.on{background:rgba(255,195,0,.14);color:var(--gold)}
.sb-nav a .ic{width:18px;text-align:center;font-size:15px;flex:none}
.sb-nav a .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:grid;place-items:center}
.sb-nav a.on .cnt{background:var(--gold);color:#241c00}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#6d707a}
.sb-foot a{color:#9a9da6;text-decoration:underline}

.main{flex:1;min-width:0;margin-left:var(--sb);display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:0 22px;height:60px;display:flex;align-items:center;gap:14px;
}
.topbar .burger{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:4px}
.topbar h1{font-size:17px}
.topbar .crumb{color:var(--muted);font-size:12.5px;font-weight:600}
.topbar .sp{margin-left:auto}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;width:250px}
.tb-search input{border:none;background:none;outline:none;width:100%;font-size:13.5px}
.tb-icon{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);display:grid;place-items:center;cursor:pointer;font-size:16px}
.tb-icon:hover{border-color:var(--gold-2)}
.tb-icon .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;
  font-weight:800;min-width:17px;height:17px;padding:0 4px;border-radius:999px;display:grid;place-items:center}
.userchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.userchip:hover{border-color:var(--gold-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold);
  display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.userchip .nm{font-weight:700;font-size:13px;line-height:1.2}
.userchip .rl{font-size:11px;color:var(--muted);line-height:1.2}
.content{padding:22px;max-width:1560px;width:100%}

/* ---------- 카드 ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{white-space:nowrap}
.card-h .tag{white-space:nowrap}
.card-h h3{font-size:14.5px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.card-h .sp{margin-left:auto}
.card-b{padding:16px 18px}
.card-b.tight{padding:0}
.grid{display:grid;gap:14px;align-items:start}
/* 그리드 자식의 기본 min-width:auto 때문에 긴 텍스트가 트랙을 밀어내는 것을 방지 */
.grid>*,.kpis>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.mt{margin-top:14px} .mt-lg{margin-top:20px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:block}
.kpi:hover{border-color:var(--gold-2)}
.kpi .lb{font-size:12.5px;color:var(--text-2);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .vl{font-size:26px;font-weight:900;letter-spacing:-.04em;margin-top:6px;line-height:1.15}
.kpi .vl small{font-size:13px;font-weight:700;color:var(--text-2);margin-left:3px}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.k-gold::before{background:var(--gold)}
.kpi.k-blue::before{background:var(--blue)}
.kpi.k-green::before{background:var(--green)}
.kpi.k-red::before{background:var(--red)}
.kpi.k-orange::before{background:var(--orange)}
.kpi.k-violet::before{background:var(--violet)}
.kpi.k-ink::before{background:var(--ink)}

/* ---------- 배지 (상태) ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
  padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.badge .d{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-NEW{background:#eaf1ff;color:#1d4ed8;border-color:#c9dbff}
.b-RECEIVED{background:#e6f4fb;color:#0369a1;border-color:#c2e4f4}
.b-REVIEWING{background:#eef0ff;color:#4338ca;border-color:#d5d9fb}
.b-APPROVAL_PENDING{background:#fff4d9;color:#a16207;border-color:#ffe3a3}
.b-APPROVED{background:#e3f7f2;color:#0d7f68;border-color:#bfeade}
.b-BOOKING{background:#f4ecfe;color:#6d28d9;border-color:#e2d3fb}
.b-BOOKED{background:#e6f7ea;color:#137a37;border-color:#c3ecce}
.b-UPCOMING{background:#e3f6fb;color:#0e7490;border-color:#bde8f2}
.b-USED{background:#eef0f3;color:#475467;border-color:#dfe3e8}
.b-SETTLE_WAIT{background:#fff0e2;color:#c2570a;border-color:#ffdcbd}
.b-SETTLING{background:#fdf3d3;color:#8a6300;border-color:#f5e3a8}
.b-SETTLED{background:#e8efe9;color:#3f6b4c;border-color:#cfe0d4}
.b-CANCELED{background:#f2f3f5;color:#6b7280;border-color:#e2e4e8}
.b-REJECTED{background:#fdeaea;color:#b42318;border-color:#f8cfcc}
/* 결제상태 */
.b-PAY_NONE{background:#f2f3f5;color:#6b7280;border-color:#e2e4e8}
.b-PAY_WAIT{background:#fff0e2;color:#c2570a;border-color:#ffdcbd}
.b-PAY_PARTIAL{background:#fdf3d3;color:#8a6300;border-color:#f5e3a8}
.b-PAY_DONE{background:#e6f7ea;color:#137a37;border-color:#c3ecce}
/* 일반 태그 */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;
  border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--text-2)}
.tag.gold{background:var(--gold-soft);border-color:#f3dc9a;color:#8a6300}
.tag.direct{background:#e8f2ff;border-color:#c9dcf7;color:#1d4ed8}
.tag.partner{background:#f4f1ff;border-color:#ddd6fb;color:#6d28d9}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px;
  padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--paper);cursor:pointer;
  transition:.14s;white-space:nowrap;color:var(--text)}
.btn:hover{border-color:var(--muted);background:#fbfbfc}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#000;border-color:#000}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#241c00}
.btn-gold:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn-danger{background:#fff;border-color:#f3c9c6;color:var(--red)}
.btn-danger:hover{background:#fdf2f2}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-lg{padding:11px 22px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- 폼 ---------- */
.field{display:block;margin-bottom:14px}
.field>label{display:block;font-size:12.5px;font-weight:800;color:var(--text-2);margin-bottom:6px}
.field .req{color:var(--red);margin-left:2px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.input,.select,.textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
  outline:none;transition:.14s;font-size:14px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(255,195,0,.16)}
.input:disabled,.select:disabled{background:var(--bg);color:var(--text-2)}
.textarea{min-height:88px;resize:vertical;line-height:1.6}
.input.err,.select.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,59,59,.12)}
.errmsg{color:var(--red);font-size:11.5px;font-weight:700;margin-top:5px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
  padding:8px 13px;cursor:pointer;font-weight:700;font-size:13.5px;background:var(--paper)}
.radio:hover{border-color:var(--muted)}
.radio input{accent-color:var(--gold-2);margin:0}
.radio.on{border-color:var(--gold-2);background:var(--gold-soft);color:#7a5800}
.check{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;cursor:pointer}
.check input{accent-color:var(--gold-2);width:16px;height:16px}
.fs{border:1px solid var(--line-2);border-radius:var(--radius);padding:16px 18px 4px;margin-bottom:16px}
.fs>legend{font-size:13px;font-weight:900;padding:0 8px;color:var(--ink);letter-spacing:-.02em}
.frow{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.frow.f2{grid-template-columns:1fr 1fr}
.frow.f4{grid-template-columns:repeat(4,1fr)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);
  font-weight:700;font-size:13px;cursor:pointer;background:var(--bg)}
.drop:hover{border-color:var(--gold-2);color:var(--text-2)}
.filelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fileitem{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.fileitem .sp{margin-left:auto}

/* ---------- 필터바 ---------- */
.filterbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.filterbar .field{margin:0}
.filterbar .field>label{font-size:11.5px;margin-bottom:4px}
.filterbar .input,.filterbar .select{padding:7px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-2)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;margin-left:4px;font-weight:800}

/* ---------- 표 ---------- */
.tablewrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  background:#fafbfc;text-align:left;font-weight:800;font-size:11.5px;color:var(--text-2);
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--ink)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:#fffdf5}
table.tbl tbody tr.dim{opacity:.62}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .code{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
table.tbl .sub{font-size:11.5px;color:var(--muted);font-weight:600}
table.tbl .wrapcell{white-space:normal;min-width:150px}
/* 열이 많은 표: 예약번호(좌) · 처리버튼(우) 고정 */
table.tbl.sticky-ends th:first-child,table.tbl.sticky-ends td:first-child{
  position:sticky;left:0;z-index:2;background:var(--paper);box-shadow:1px 0 0 var(--line-2)}
table.tbl.sticky-ends th:first-child{background:#fafbfc;z-index:3}
table.tbl.sticky-ends tbody tr:hover td:first-child{background:#fffdf5}
table.tbl.sticky-ends th:last-child,table.tbl.sticky-ends td:last-child{
  position:sticky;right:0;z-index:2;background:var(--paper);box-shadow:-1px 0 0 var(--line-2)}
table.tbl.sticky-ends th:last-child{background:#fafbfc;z-index:3}
table.tbl.sticky-ends tbody tr:hover td:last-child{background:#fffdf5}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-weight:700;font-size:13.5px}
.empty .em{font-size:30px;display:block;margin-bottom:8px;opacity:.5}
.pager{display:flex;align-items:center;gap:6px;justify-content:center;padding:14px}
.pager button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--paper);
  border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px}
.pager button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pager button[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- 리스트 (할일/최근) ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:#fffdf5}
.li .ic{width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;
  font-size:15px;flex:none}
.li .tx{min-width:0;flex:1}
.li .t1{display:block;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.li .tx{display:flex;flex-direction:column}
.li .rt{margin-left:auto;text-align:right;flex:none;display:flex;align-items:center;gap:8px}
.li.unread{background:#fffaf0}
.li.unread .t1::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--red);margin-right:6px;vertical-align:middle}

/* ---------- 타임라인 ---------- */
.timeline{position:relative;padding:4px 0 4px 4px}
.tl{position:relative;padding:0 0 20px 30px;border-left:2px solid var(--line)}
.tl:last-child{border-left-color:transparent;padding-bottom:0}
.tl::before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:3px solid var(--line)}
.tl.done::before{border-color:var(--green);background:var(--green)}
.tl.now::before{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px rgba(255,195,0,.22)}
.tl.bad::before{border-color:var(--red);background:var(--red)}
.tl .tt{font-weight:800;font-size:13.5px;line-height:1.4}
.tl .td{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tl .tm{font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:pre-wrap}
.tl.future .tt{color:var(--muted)}

/* 진행 스텝바 */
.steps{display:flex;gap:4px;overflow-x:auto;padding:2px 0}
.step{flex:1;min-width:74px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.step .bar{height:5px;border-radius:99px;background:var(--line);margin-bottom:6px}
.step.done .bar{background:var(--green)} .step.done{color:var(--green)}
.step.now .bar{background:var(--gold)} .step.now{color:#8a6300}
.step.bad .bar{background:var(--red)} .step.bad{color:var(--red)}

/* ---------- 정의 목록 ---------- */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.dl.one{grid-template-columns:1fr}
.dl .dr{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;min-width:0}
.dl .dr dt{flex:none;width:96px;color:var(--text-2);font-weight:700;font-size:12.5px}
.dl .dr dd{margin:0;font-weight:700;min-width:0;word-break:break-all}
.dl .dr dd.muted{color:var(--muted);font-weight:600}

/* ---------- 차트 ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.bar-row .nm{width:96px;flex:none;font-weight:700;color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{flex:1;height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar-row .fi{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .4s}
.bar-row .fi.gold{background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.bar-row .vv{width:96px;flex:none;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.col .cb{width:100%;max-width:38px;background:linear-gradient(180deg,var(--gold),var(--gold-2));
  border-radius:6px 6px 0 0;min-height:3px;transition:height .4s;position:relative}

    /* -- 마스터 -- */
    users:    function(){ return _read().users.slice(); },
    user:     function(id){ var f = _read().users.filter(function(u){return u.id===id;}); return f[0]||null; },
    branches: function(){ return _read().branches.slice(); },
    lodgings: function(){ return _read().lodgings.slice(); },
    lodging:  function(id){ var f = _read().lodgings.filter(function(l){return l.id===id;}); return f[0]||null; },
    notices:  function(){ return _read().notices.slice().sort(function(a,b){
                  if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
                  return a.createdAt < b.createdAt ? 1 : -1; }); },
    settings: function(){ return _read().settings; },
    logs:     function(){ return _read().logs.slice(); },

    saveUser: function(u){
      var d = _read();
      if (u.id) { d.users = d.users.map(function(x){ return x.id===u.id ? Object.assign({}, x, u) : x; }); }
      else { u.id = uid('u'); u.active = u.active !== false; d.users.push(u); }
      _write(); return u;
    },
    removeUser: function(id){ var d=_read(); d.users = d.users.filter(function(u){return u.id!==id;}); _write(); },
    saveLodging: function(l){
      var d = _read();
      if (l.id) { d.lodgings = d.lodgings.map(function(x){ return x.id===l.id ? Object.assign({}, x, l) : x; }); }
      else { l.id = uid('lo'); l.active = l.active !== false; d.lodgings.push(l); }
      _write(); return l;
    },
    removeLodging: function(id){ var d=_read(); d.lodgings = d.lodgings.filter(function(l){return l.id!==id;}); _write(); },
    saveNotice: function(n){
      var d = _read(); var now = new Date().toISOString();
      if (n.id) { d.notices = d.notices.map(function(x){ return x.id===n.id ? Object.assign({}, x, n, {updatedAt:now}) : x; }); }
      else { n.id = uid('nc'); n.createdAt = now; n.updatedAt = now; d.notices.push(n); }
      _write(); return n;
    },
    removeNotice: function(id){ var d=_read(); d.notices = d.notices.filter(function(n){return n.id!==id;}); _write(); },
    saveSettings: function(s){ var d=_read(); d.settings = Object.assign({}, d.settings, s); _write(); },

    /* -- 예약 -- */
    bookings: function(){ return _read().bookings.slice(); },
    booking:  function(id){ var f = _read().bookings.filter(function(b){return b.id===id;}); return f[0]||null; },
    byCode:   function(code){ var f = _read().bookings.filter(function(b){return b.code===code;}); return f[0]||null; },

    /** 로그인 사용자가 볼 수 있는 예약만 (applicant = 본인 + 소속지점) */
    visibleBookings: function(user){
      var all = _read().bookings.slice();
      if (!user) return [];
      if (user.role === 'applicant') {
        return all.filter(function(b){ return b.applicantId === user.id || b.branch === user.branch; });
      }
      return all;
    },

    nextCode: function(dt){
      var d = _read(), y = new Date(dt||Date.now()).getFullYear();
      d.seq = d.seq || {};
      d.seq[y] = (d.seq[y]||0) + 1;
      return (d.settings.codePrefix||'STAY') + '-' + y + '-' + ('000'+d.seq[y]).slice(-4);
    },

    createBooking: function(input, actor){
      var d = _read();
      var now = new Date().toISOString();
      var lo = input.lodgingId ? Store.lodging(input.lodgingId) : null;
      var b = {
        id: uid('bk'), code: Store.nextCode(now), requestedAt: input.requestedAt || now,
        applicantId: input.applicantId || actor.id, applicantName: input.applicantName || actor.name,
        branch: input.branch || actor.branch, dept: input.dept || actor.dept, phone: input.phone || actor.phone,
        purpose: input.purpose || '',
        lodgingType: input.lodgingType || 'HOTEL',
        lodgingId: input.lodgingId || null,
        lodgingName: input.lodgingName || (lo ? lo.name : ''),
        checkIn: input.checkIn, checkOut: input.checkOut,
        nights: nights(input.checkIn, input.checkOut),
        adults: Number(input.adults)||0, children: Number(input.children)||0,
        guests: (Number(input.adults)||0) + (Number(input.children)||0),
        rooms: Number(input.rooms)||1,
        guestName: input.guestName || '', guestPhone: input.guestPhone || '',
        estimatedCost: Number(input.estimatedCost)||0,
        costBearer: input.costBearer || 'COMPANY',
        specialRequest: input.specialRequest || '',
        attachments: input.attachments || [],
        status: 'NEW',
        assigneeId: null, assigneeName: null,
        approval: { requestedAt:null, approverId:null, approverName:null, result:null, opinion:'', decidedAt:null },
        reservation: { confirmNo:'', roomInfo:'', amount:0, reservedAt:null, note:'' },
        payment: { status:'PAY_NONE', method:'', paidAmount:0, paidAt:null, taxInvoice:false, receipt:false,
                   evidence:[], financeId:null, financeName:'', settledAt:null, note:'' },
        changeRequest:null, cancelRequest:null, memos:[], updatedAt: now,
        proxyBy: input.proxyBy || null   /* 전화/카톡 요청을 담당자가 대신 등록한 경우 */
      };
      d.bookings.push(b);
      Store.log(b, actor, '신규 예약 신청', (b.proxyBy ? '['+b.proxyBy+' 접수 대행] ' : '') + (b.purpose||''), null, 'NEW');
      _write();
      Notify.send('BOOKING_CREATED', b, actor);
      return b;
    },

    /** 필드 부분 수정 + 변경 내역 로그 */
    updateBooking: function(id, patch, actor, action, memo){
      var d = _read();
      var idx = -1; d.bookings.forEach(function(b,i){ if (b.id===id) idx = i; });
      if (idx < 0) return null;
      var b = d.bookings[idx];
      var before = JSON.parse(JSON.stringify(b));
      deepAssign(b, patch);
      if (b.checkIn && b.checkOut) b.nights = nights(b.checkIn, b.checkOut);
      b.guests = (Number(b.adults)||0) + (Number(b.children)||0);
      b.updatedAt = new Date().toISOString();
      var diff = diffFields(before, b);
      Store.log(b, actor, action || '정보 수정', memo || diff, null, null);
      _write();
      return b;
    },

    /** 상태 전이 — 권한/필수값 검증 + 로그 + 알림 */
    canTransition: function(b, to, user){
      if (!b || !user) return { ok:false, msg:'대상이 없습니다.' };
      var opts = FLOW[b.status] || [];
      var hit = null; opts.forEach(function(o){ if (o.to === to) hit = o; });
      if (!hit) return { ok:false, msg:STATUS[b.status].label + ' → ' + STATUS[to].label + ' 로는 변경할 수 없습니다.' };
      var byRole  = hit.roles.indexOf(user.role) >= 0;
      var byGrant = !!(hit.grant && user[hit.grant]);
      if (!byRole && !byGrant) {
        return { ok:false, msg:'이 처리는 ' + hit.roles.map(function(r){ return ROLES[r].label; }).join(' / ') +
                 (hit.grant === 'canApprove' ? ' 또는 승인 권한을 가진 부동산팀원' : '') + '만 가능합니다.' };
      }
      if (hit.need) { var e = hit.need(b); if (e) return { ok:false, msg:e }; }
      return { ok:true, opt:hit };
    },

    transition: function(id, to, user, memo, extraPatch){
      var b = Store.booking(id);
      var chk = Store.canTransition(b, to, user);
      if (!chk.ok) return chk;
      var d = _read();
      d.bookings.forEach(function(x){
        if (x.id !== id) return;
        if (extraPatch) deepAssign(x, extraPatch);
        var from = x.status;
        x.status = to;
        x.updatedAt = new Date().toISOString();
        if (to === 'APPROVAL_PENDING') x.approval.requestedAt = x.updatedAt;
        if (to === 'APPROVED')  { x.approval.result='APPROVED'; x.approval.approverId=user.id;
                                  x.approval.approverName=user.name; x.approval.decidedAt=x.updatedAt;
                                  if (memo) x.approval.opinion = memo; }
        if (to === 'REJECTED')  { x.approval.result='REJECTED'; x.approval.approverId=user.id;
                                  x.approval.approverName=user.name; x.approval.decidedAt=x.updatedAt;
                                  if (memo) x.approval.opinion = memo; }
        if (to === 'BOOKED' && !x.reservation.reservedAt) x.reservation.reservedAt = x.updatedAt;
        if (to === 'SETTLE_WAIT' && x.payment.status === 'PAY_NONE') x.payment.status = 'PAY_WAIT';
        if (to === 'SETTLED') { x.payment.settledAt = x.updatedAt; if (x.payment.paidAmount) x.payment.status = 'PAY_DONE'; }
        if (to === 'CANCELED' && x.cancelRequest) x.cancelRequest.handled = true;
        Store.log(x, user, chk.opt.action, memo || '', from, to);
        b = x;
      });
      _write();
      var evt = { APPROVAL_PENDING:'APPROVAL_REQUESTED', APPROVED:'APPROVED', REJECTED:'REJECTED',
                  BOOKED:'BOOKING_CONFIRMED', CANCELED:'BOOKING_CANCELED', SETTLE_WAIT:'SETTLE_WAITING' }[to];
      if (evt) Notify.send(evt, b, user, memo);
      return { ok:true, booking:b };
    },

    addMemo: function(id, text, user){
      var d = _read(), hit = null;
      d.bookings.forEach(function(b){
        if (b.id !== id) return;
        b.memos.push({ at:new Date().toISOString(), userId:user.id, userName:user.name, role:user.role, text:text });
        b.updatedAt = new Date().toISOString();
        Store.log(b, user, '메모 작성', text, null, null);
        hit = b;
      });
      _write(); return hit;
    },

    requestChange: function(id, kind, reason, user){
      var d = _read(), hit=null;
      d.bookings.forEach(function(b){
        if (b.id !== id) return;
        var rec = { at:new Date().toISOString(), reason:reason, by:user.name, handled:false };
        if (kind === 'cancel') b.cancelRequest = rec; else b.changeRequest = rec;
        b.updatedAt = rec.at;
        Store.log(b, user, kind==='cancel' ? '예약 취소 요청' : '예약 수정 요청', reason, null, null);
        hit = b;
      });
      _write();
      if (hit) Notify.send(kind==='cancel' ? 'BOOKING_CANCELED' : 'BOOKING_CHANGED', hit, user, reason, true);
      return hit;
    },

    log: function(b, user, action, memo, from, to){
      var d = _read();
      d.logs.unshift({ id:uid('lg'), at:new Date().toISOString(), bookingId:b.id, bookingCode:b.code,
                       userId:user.id, userName:user.name, role:user.role, branch:user.branch,
                       action:action, from:from||null, to:to||null, memo:memo||'' });
      if (d.logs.length > 3000) d.logs.length = 3000;
    },
    bookingLogs: function(bookingId){
      return _read().logs.filter(function(l){ return l.bookingId === bookingId; })
                   .sort(function(a,b){ return a.at < b.at ? -1 : 1; });
    },

    /* -- 체크인 전날 알림 자동 생성 (진입 시 1회) -- */
    runDailyJobs: function(){
      var d = _read(), tomorrow = ymd(addDays(new Date(), 1)), made = 0;
      d.bookings.forEach(function(b){
        if (['BOOKED','UPCOMING'].indexOf(b.status) < 0) return;
        if (b.checkIn !== tomorrow) return;
        var dup = d.notifications.some(function(n){ return n.type==='CHECKIN_TOMORROW' && n.bookingId===b.id; });
        if (dup) return;
        Notify.send('CHECKIN_TOMORROW', b, null, '내일 체크인 예정입니다.');
        made++;
      });
      if (made) _write();
      return made;
    }
  };

  function deepAssign(target, patch){
    Object.keys(patch).forEach(function(k){
      var v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
        deepAssign(target[k], v);
      } else { target[k] = v; }
    });
    return target;
  }
  var FIELD_LABEL = {
    checkIn:'체크인', checkOut:'체크아웃', rooms:'객실 수', adults:'성인', children:'아동',
    estimatedCost:'예상비용', lodgingName:'숙소', purpose:'이용목적', assigneeName:'담당자',
    guestName:'예약자명', guestPhone:'예약자 연락처', specialRequest:'특별요청', costBearer:'비용구분',
    'reservation.confirmNo':'숙소 예약번호', 'reservation.roomInfo':'객실정보', 'reservation.amount':'예약금액',
    'payment.method':'결제방법', 'payment.paidAmount':'실결제금액', 'payment.paidAt':'결제일',
    'payment.taxInvoice':'세금계산서', 'payment.receipt':'영수증', 'payment.financeName':'회계담당자'
  };
  function diffFields(a, b){
    var out = [];
    Object.keys(FIELD_LABEL).forEach(function(path){
      var av = path.split('.').reduce(function(o,k){ return o ? o[k] : undefined; }, a);
      var bv = path.split('.').reduce(function(o,k){ return o ? o[k] : undefined; }, b);
      if (av === undefined && bv === undefined) return;
      if (String(av) !== String(bv)) out.push(FIELD_LABEL[path] + ': ' + fmtVal(av) + ' → ' + fmtVal(bv));
    });
    return out.join(' / ');
  }
  function fmtVal(v){
    if (v === true) return '확인';
    if (v === false) return '미확인';
    if (v === null || v === undefined || v === '') return '(없음)';
    return String(v);
  }
  Store.diffFields = diffFields;

  /* =====================================================================
   * 6. 알림 (확장 가능 어댑터 구조)
   * ===================================================================== */
  var Notify = {
    /** 채널 어댑터. 새 채널은 여기에 push 만 하면 된다.
     *  { id, label, send(notification, booking) } */
    channels: [
      { id:'inapp', label:'시스템 내부 알림', send:function(n){
          var d = _read(); d.notifications.unshift(n);
          if (d.notifications.length > 500) d.notifications.length = 500;
        } }
      /* 예) { id:'kakao', label:'카카오톡', send:function(n,b){ fetch('/api/stay/notify/kakao',{method:'POST',body:JSON.stringify(n)}); } } */
    ],
    enabledChannels: function(){
      var conf = _read().settings.channels || [];
      return Notify.channels.filter(function(c){
        var f = conf.filter(function(x){ return x.id === c.id; })[0];
        return !f || f.enabled;
      });
    },
    send: function(type, booking, actor, memo, silentStore){
      var meta = NOTI_TYPE[type] || { label:type, icon:'🔔', roles:[] };
      var n = {
        id: uid('nt'), at: new Date().toISOString(), type: type,
        title: meta.label + ' · ' + booking.code,
        body: booking.branch + ' ' + booking.applicantName + ' / ' + booking.lodgingName +
              ' / ' + booking.checkIn + '~' + booking.checkOut + (memo ? '\n' + memo : ''),
        bookingId: booking.id,
        roles: meta.roles.slice(),
        userIds: [booking.applicantId].concat(booking.assigneeId ? [booking.assigneeId] : []),
        readBy: actor ? [actor.id] : []
      };
      /* 신청자에게도 결과를 알려야 하는 이벤트 */
      if (['APPROVED','REJECTED','BOOKING_CONFIRMED','BOOKING_CANCELED','CHECKIN_TOMORROW'].indexOf(type) >= 0) {
        n.roles = n.roles.concat(['applicant']);
      }
      if (meta.grant) n.grant = meta.grant;
      Notify.enabledChannels().forEach(function(c){ try { c.send(n, booking); } catch(e){ console.warn('[notify]', c.id, e); } });
      if (!silentStore) _write();
      return n;
    },
    listFor: function(user){
      if (!user) return [];
      return _read().notifications.filter(function(n){
        if (user.role === 'admin') return true;
        if (n.userIds && n.userIds.indexOf(user.id) >= 0) return true;
        if (n.grant && user[n.grant]) return true;
        return (n.roles || []).indexOf(user.role) >= 0;
      });
    },
    unreadCount: function(user){
      return Notify.listFor(user).filter(function(n){ return (n.readBy||[]).indexOf(user.id) < 0; }).length;
    },
    markRead: function(id, user){
      var d = _read();
      d.notifications.forEach(function(n){
        if (n.id !== id) return;
        n.readBy = n.readBy || [];
        if (n.readBy.indexOf(user.id) < 0) n.readBy.push(user.id);
      });
      _write();
    },
    markAllRead: function(user){
      var d = _read();
      Notify.listFor(user).forEach(function(n){
        n.readBy = n.readBy || [];
        if (n.readBy.indexOf(user.id) < 0) n.readBy.push(user.id);
      });
      _write();
    }
  };

  global.STAY = STAY;
  global.Store = Store;
  global.Notify = Notify;
})(window);

</script>
<script>
/* 옆커폰 숙박 예약관리 — 세션 / 권한
 * 실제 배포 시 Auth.current() 만 사내 SSO 세션으로 교체하면 나머지 로직은 그대로 동작한다. */
(function (global) {
  'use strict';

  var MENUS = [
    { id:'dash',     href:'#/index',         icon:'📊', label:'대시보드',        roles:'*' },
    { id:'new',      href:'#/new',           icon:'➕', label:'예약 신청',       roles:'*' },
    { id:'mystay',   href:'#/mystay',        icon:'🔎', label:'내 예약 조회',    roles:'*', staffOnly:true },
    { id:'requests', href:'#/requests',      icon:'📋', label:'예약 관리',       roles:'*' },
    { id:'approve',  href:'#/approvals',     icon:'✅', label:'승인 관리',       roles:['approver','admin','booker'], grant:'canApprove' },
    { id:'settle',   href:'#/settlement',    icon:'💳', label:'정산 관리',       roles:['finance','admin','booker'] },
    { id:'lodging',  href:'#/lodgings',      icon:'🏨', label:'숙소 관리',       roles:'*', staffLabel:'숙소 안내' },
    { id:'noti',     href:'#/notifications', icon:'🔔', label:'알림센터',        roles:'*' },
    { id:'notice',   href:'#/notices',       icon:'📢', label:'공지·이용지침',   roles:'*' },
    { id:'admin',    href:'#/admin',         icon:'⚙️', label:'관리자',          roles:['admin'] }
  ];

  /* 행위 권한 매트릭스 */
  var CAN = {
    createBooking:   '*',
    receive:         ['booker','admin'],
    requestInfo:     ['booker','admin'],
    requestApproval: ['booker','admin'],
    decideApproval:  ['approver','admin'],   /* + canApprove 플래그 보유자 (아래 Auth.can 참고) */
    doReservation:   ['booker','admin'],
    editReservation: ['booker','admin'],
    cancelBooking:   ['booker','admin'],
    markUsed:        ['booker','admin'],
    settle:          ['finance','admin'],
    assign:          ['booker','admin'],
    memo:            '*',
    manageLodging:   ['booker','admin'],
    manageNotice:    ['admin'],
    manageUser:      ['admin'],
    viewAllLogs:     ['admin'],
    settings:        ['admin']
  };

  /* ------------------------------------------------------------------
   * 배포 모드
   *  admin : 부동산팀이 쓰는 전체 관리 시스템 (기본값)
   *  staff : 지점 직원에게 배포하는 신청 창구 — 신청 / 내 예약 조회 /
   *          숙소 안내 / 이용지침만 열려 있고 로그인이 없다.
   * 배포할 때 STAY_MODE 전역을 지정한다 (staff 로 두면 직원용):
   *   window.STAY_MODE = 'staff';
   * ------------------------------------------------------------------ */
  var STAFF_MENUS  = ['new', 'mystay', 'lodging', 'notice'];
  var STAFF_ROUTES = ['new', 'mystay', 'lodgings', 'notices'];

  var Deploy = {
    get mode(){ return global.STAY_MODE === 'staff' ? 'staff' : 'admin'; },
    isStaff: function(){ return Deploy.mode === 'staff'; },
    /** 직원용 배포에서 열려 있는 메뉴인지 */
    allowsMenu: function(id){ return !Deploy.isStaff() || STAFF_MENUS.indexOf(id) >= 0; },
    /** 직원용 배포에서 열려 있는 화면인지 (주소를 직접 쳐서 들어오는 경우 차단) */
    allowsRoute: function(page){ return !Deploy.isStaff() || STAFF_ROUTES.indexOf(page) >= 0; },
    /** 배포 모드별 첫 화면 */
    home: function(){ return Deploy.isStaff() ? 'new' : 'index'; }
  };

  /* 직원용 배포에는 로그인이 없다. 신청자가 이름·지점을 직접 입력한다. */
  var GUEST = { id:'guest', name:'', role:'applicant', branch:'', dept:'', phone:'', email:'', guest:true };

  var Auth = {
    MENUS: MENUS,
    Deploy: Deploy,
    GUEST: GUEST,
    current: function () {
      if (Deploy.isStaff()) return GUEST;
      var d = Store.raw();
      var id = (d.session && d.session.userId) || 'u_bk1';
      return Store.user(id) || Store.users()[0];
    },
    switchTo: function (userId) {
      var d = Store.raw();
      d.session = { userId: userId };
      Store._write();
    },
    role: function () { var u = Auth.current(); return u ? u.role : null; },
    roleLabel: function (r) { return (STAY.ROLES[r || Auth.role()] || {}).label || '-'; },
    is: function (r) { return Auth.role() === r; },
    /* 역할과 별개로 계정에 부여된 권한 플래그 */
    GRANTS: { decideApproval: 'canApprove' },
    can: function (action, user) {
      user = user || Auth.current();
      var rule = CAN[action];
      if (!rule) return false;
      if (rule === '*') return true;
      if (rule.indexOf(user.role) >= 0) return true;
      var g = Auth.GRANTS[action];
      return !!(g && user[g]);
    },
    /** 예약 1건에 대한 접근 가능 여부 */
    canSee: function (b, user) {
      user = user || Auth.current();
      if (!b) return false;
      if (user.role !== 'applicant') return true;
      return b.applicantId === user.id || b.branch === user.branch;
    },
    /** 신청자가 본인 건에 대해 요청(수정/취소)을 낼 수 있는지 */
    canRequestChange: function (b, user) {
      user = user || Auth.current();
      if (!b) return false;
      if (STAY.CLOSED.indexOf(b.status) >= 0) return false;
      if (user.role === 'applicant') return b.applicantId === user.id || b.branch === user.branch;
      return true;
    },
    menus: function (user) {
      user = user || Auth.current();
      return MENUS.filter(function (m) {
        if (!Deploy.allowsMenu(m.id)) return false;
        if (m.staffOnly && !Deploy.isStaff()) return false;   /* '내 예약 조회'는 직원용 전용 */
        if (m.roles === '*' || m.roles.indexOf(user.role) >= 0) return true;
        return !!(m.grant && user[m.grant]);
      }).map(function (m) {
        /* 같은 화면이라도 직원용에서는 '관리'가 아니라 '안내'로 보여야 한다 */
        return (Deploy.isStaff() && m.staffLabel) ? Object.assign({}, m, { label: m.staffLabel }) : m;
      });
    }
  };

  global.Auth = Auth;
  global.Deploy = Deploy;
})(window);

</script>
<script>
/* 옆커폰 숙박 예약관리 — 공통 UI (셸/배지/모달/토스트/헬퍼) */
(function (global) {
  'use strict';

  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function qs(sel, root){ return (root||document).querySelector(sel); }
  function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function el(html){ var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function on(root, evt, sel, fn){
    root.addEventListener(evt, function(e){
      var t = e.target.closest(sel);
      if (t && root.contains(t)) fn.call(t, e, t);
    });
  }
  function initials(name){ return (name||'?').slice(-2); }

  var WD = ['일','월','화','수','목','금','토'];
  function dateK(s){ if (!s) return '-'; var d = new Date(s.length<=10 ? s+'T00:00:00' : s);
    return (d.getMonth()+1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
  function dateFull(s){ if (!s) return '-'; return STAY.ymd(s.length<=10 ? s+'T00:00:00' : s); }
  function dtFull(s){ if (!s) return '-'; return STAY.ymdhm(s); }
  function ago(s){
    if (!s) return '';
    var diff = (Date.now() - new Date(s).getTime())/1000;
    if (diff < 60) return '방금';
    if (diff < 3600) return Math.floor(diff/60) + '분 전';
    if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
    if (diff < 86400*7) return Math.floor(diff/86400) + '일 전';
    return STAY.ymd(s);
  }
  function isToday(ds){ return ds === STAY.ymd(new Date()); }

  function badge(status){
    var s = STAY.STATUS[status];
    if (!s) return '<span class="badge">-</span>';
    return '<span class="badge b-' + status + '"><i class="d"></i>' + esc(s.label) + '</span>';
  }
  function payBadge(p){
    var k = (p && p.status) || 'PAY_NONE';
    return '<span class="badge b-' + k + '"><i class="d"></i>' + esc(STAY.PAY_STATUS[k] || '-') + '</span>';
  }

  /* ---------------- 토스트 ---------------- */
  function toast(msg, kind){
    var box = qs('.toasts');
    if (!box) { box = el('<div class="toasts"></div>'); document.body.appendChild(box); }
    var t = el('<div class="toast ' + (kind||'') + '">' +
               (kind==='ok'?'✔':kind==='bad'?'⚠':'ℹ') + ' <span>' + esc(msg) + '</span></div>');
    box.appendChild(t);
    setTimeout(function(){ t.style.opacity='0'; t.style.transition='.25s'; setTimeout(function(){ t.remove(); }, 260); }, 2600);
  }

  /* ---------------- 모달 ---------------- */
  function modal(opt){
    var m = el(
      '<div class="mask"><div class="modal ' + (opt.wide?'wide':'') + '">' +
        '<div class="modal-h"><h3>' + esc(opt.title||'') + '</h3><button class="x" aria-label="닫기">×</button></div>' +
        '<div class="modal-b"></div>' +
        (opt.footer === false ? '' : '<div class="modal-f"></div>') +
      '</div></div>');
    qs('.modal-b', m).innerHTML = opt.body || '';
    var close = function(){ m.remove(); document.body.style.overflow=''; };
    qs('.x', m).onclick = close;
    m.addEventListener('mousedown', function(e){ if (e.target === m) close(); });
    document.addEventListener('keydown', function esckey(e){
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esckey); }
    });
    if (opt.footer !== false) {
      var f = qs('.modal-f', m);
      (opt.buttons || [{label:'닫기'}]).forEach(function(b){
        var btn = el('<button class="btn ' + (b.cls||'') + '">' + esc(b.label) + '</button>');
        btn.onclick = function(){ if (!b.onClick || b.onClick(m, close) !== false) { if (b.keepOpen !== true) close(); } };
        f.appendChild(btn);
      });
    }
    document.body.appendChild(m);
    document.body.style.overflow='hidden';
    if (opt.onOpen) opt.onOpen(m, close);
    return { root:m, close:close };
  }
  function confirmBox(title, msg, okLabel, danger){
    return new Promise(function(res){
      modal({
        title: title,
        body: '<p style="margin:0;font-size:14px;line-height:1.7">' + nl2br(msg) + '</p>',
        buttons: [
          { label:'취소', onClick:function(){ res(false); } },
          { label: okLabel || '확인', cls: danger ? 'btn-danger' : 'btn-primary', onClick:function(){ res(true); } }
        ]
      });
    });
  }
  function promptBox(title, label, opt){
    opt = opt || {};
    return new Promise(function(res){
      var id = 'pb_' + Math.random().toString(36).slice(2,7);
      modal({
        title: title,
        body: '<div class="field"><label>' + esc(label) + (opt.required?'<span class="req">*</span>':'') + '</label>' +
              '<textarea class="textarea" id="' + id + '" placeholder="' + esc(opt.placeholder||'') + '">' + esc(opt.value||'') + '</textarea>' +
              (opt.hint ? '<div class="hint">' + esc(opt.hint) + '</div>' : '') + '</div>',
        onOpen: function(m){ setTimeout(function(){ qs('#'+id, m).focus(); }, 30); },
        buttons: [
          { label:'취소', onClick:function(){ res(null); } },
          { label: opt.okLabel || '확인', cls: opt.danger ? 'btn-danger' : 'btn-primary', keepOpen:true,
            onClick:function(m, close){
              var v = qs('#'+id, m).value.trim();
              if (opt.required && !v) { toast('내용을 입력해주세요.', 'bad'); return false; }
              close(); res(v);
            } }
        ]
      });
    });
  }

  /* ---------------- 셸 ---------------- */
  function counters(user){
    if (Deploy.isStaff()) return { requests:0, approve:0, settle:0, noti:0, todayIn:0 };
    var list = Store.visibleBookings(user);
    var today = STAY.ymd(new Date());
    return {
      requests: list.filter(function(b){ return ['NEW','RECEIVED','REVIEWING'].indexOf(b.status)>=0; }).length,
      approve:  list.filter(function(b){ return b.status==='APPROVAL_PENDING'; }).length,
      settle:   list.filter(function(b){ return ['SETTLE_WAIT','SETTLING'].indexOf(b.status)>=0; }).length,
      noti:     Notify.unreadCount(user),
      todayIn:  list.filter(function(b){ return b.checkIn===today && ['BOOKED','UPCOMING'].indexOf(b.status)>=0; }).length
    };
  }

  function userSwitcher(){
    var cur = Auth.current();
    var body = '<p class="muted" style="margin:0 0 12px;font-size:12.5px">' +
      '데모 환경에서는 계정을 전환해 각 권한의 화면을 확인할 수 있습니다. ' +
      '실제 운영에서는 사내 로그인 계정이 자동으로 적용됩니다.</p>';
    STAY.ROLE_ORDER.forEach(function(role){
      var us = Store.users().filter(function(u){ return u.role === role && u.active !== false; });
      if (!us.length) return;
      body += '<div class="sb-group" style="color:var(--muted);padding:0;margin:14px 0 6px;font-size:11px">' +
              esc(STAY.ROLES[role].label) + ' — ' + esc(STAY.ROLES[role].desc) + '</div>';
      body += '<div class="list" style="border:1px solid var(--line);border-radius:10px;overflow:hidden">' +
        us.map(function(u){
          return '<div class="li' + (u.id===cur.id?' unread':'') + '" data-u="' + u.id + '">' +
            '<span class="avatar">' + esc(initials(u.name)) + '</span>' +
            '<span class="tx"><span class="t1">' + esc(u.name) +
              (u.title ? ' <span class="muted" style="font-weight:600">' + esc(u.title) + '</span>' : '') +
              (u.id===cur.id?' <span class="tag gold">현재</span>':'') +
              (u.sample?' <span class="tag" style="color:var(--orange)">자리표시자</span>':'') + '</span>' +
            '<span class="t2">' + esc(u.branch) + ' · ' + esc(u.dept) + (u.duty ? ' · ' + esc(u.duty) : '') + '</span></span></div>';
        }).join('') + '</div>';
    });
    var m = modal({ title:'사용자 전환 (권한 미리보기)', body:body, buttons:[{label:'닫기'}] });
    on(m.root, 'click', '.li[data-u]', function(){
      Auth.switchTo(this.dataset.u);
      NAV.reload();
    });
  }

  function notifPanel(){
    var old = qs('.pop#npop'); if (old) { old.remove(); return; }
    var user = Auth.current();
    var list = Notify.listFor(user).slice(0, 30);
    var pop = el('<div class="pop" id="npop">' +
      '<div class="ph"><h4>알림</h4><span class="sp" style="margin-left:auto"></span>' +
        '<button class="btn btn-sm btn-ghost" id="allread">모두 읽음</button></div>' +
      '<div class="pb list"></div>' +
      '<div class="pf"><a class="btn btn-sm" href="#/notifications">알림센터 전체보기</a></div></div>');
    var pb = qs('.pb', pop);
    if (!list.length) pb.innerHTML = '<div class="empty"><span class="em">🔔</span>새 알림이 없습니다.</div>';
    else pb.innerHTML = list.map(function(n){
      var unread = (n.readBy||[]).indexOf(user.id) < 0;
      var meta = STAY.NOTI_TYPE[n.type] || {icon:'🔔'};
      return '<div class="li' + (unread?' unread':'') + '" data-n="' + n.id + '" data-b="' + (n.bookingId||'') + '">' +
        '<span class="ic">' + meta.icon + '</span>' +
        '<span class="tx"><span class="t1">' + esc(n.title) + '</span>' +
        '<span class="t2">' + esc((n.body||'').split('\n')[0]) + '</span></span>' +
        '<span class="rt"><span class="t2">' + ago(n.at) + '</span></span></div>';
    }).join('');
    document.querySelector('.main').appendChild(pop);
    qs('#allread', pop).onclick = function(e){ e.stopPropagation(); Notify.markAllRead(user); NAV.reload(); };
    on(pop, 'click', '.li[data-n]', function(){
      Notify.markRead(this.dataset.n, user);
      if (this.dataset.b) NAV.href = '#/detail?id=' + this.dataset.b;
      else NAV.reload();
    });
    setTimeout(function(){
      document.addEventListener('click', function cl(e){
        if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener('click', cl); }
      });
    }, 10);
  }

  /* ---------------- 진행 스텝바 ---------------- */
  function steps(b){
    var path = STAY.MAIN_PATH;
    var closedBad = (b.status==='CANCELED' || b.status==='REJECTED');
    var curNo = STAY.STATUS[b.status].no;
    var groups = [
      { label:'신청',   keys:['NEW'] },
      { label:'접수',   keys:['RECEIVED','REVIEWING'] },
      { label:'승인',   keys:['APPROVAL_PENDING','APPROVED'] },
      { label:'예약',   keys:['BOOKING','BOOKED'] },
      { label:'이용',   keys:['UPCOMING','USED'] },
      { label:'정산',   keys:['SETTLE_WAIT','SETTLING'] },
      { label:'완료',   keys:['SETTLED'] }
    ];
    return '<div class="steps">' + groups.map(function(g){
      var maxNo = Math.max.apply(null, g.keys.map(function(k){ return STAY.STATUS[k].no; }));
      var minNo = Math.min.apply(null, g.keys.map(function(k){ return STAY.STATUS[k].no; }));
      var cls = '';
      if (closedBad) { cls = curNo === 13 ? (minNo <= 6 ? 'done' : '') : (minNo <= 4 ? 'done' : ''); if (!cls) cls=''; }
      if (!closedBad) {
        if (curNo > maxNo) cls = 'done';
        else if (curNo >= minNo) cls = (b.status === 'SETTLED') ? 'done' : 'now';
      }
      return '<div class="step ' + cls + '"><div class="bar"></div>' + g.label + '</div>';
    }).join('') + (closedBad ? '<div class="step bad"><div class="bar"></div>' + STAY.STATUS[b.status].label + '</div>' : '') + '</div>';
  }

  /* ---------------- 기타 헬퍼 ---------------- */
  function empty(msg, icon){
    return '<div class="empty"><span class="em">' + (icon||'🗂') + '</span>' + esc(msg) + '</div>';
  }
  function optionList(obj, sel){
    return Object.keys(obj).map(function(k){
      return '<option value="' + k + '"' + (k===sel?' selected':'') + '>' + esc(obj[k]) + '</option>';
    }).join('');
  }
  /* 파일 저장. 성공/실패 안내까지 여기서 책임진다(호출부가 미리 성공을 알리지 않도록). */
  function download(filename, text, mime){
    var isCsv = /\.csv$/i.test(filename);
    var body = isCsv ? '﻿' + text : text;   /* 엑셀에서 한글이 깨지지 않도록 BOM */
    var a = document.createElement('a');
    a.href = 'data:' + (mime || (isCsv ? 'text/csv' : 'text/plain')) + ';charset=utf-8,' + encodeURIComponent(body);
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { toast('이 미리보기에서는 파일 저장을 지원하지 않습니다.', 'bad'); return null; }
        return dl.save({ filename: filename, data: body }).catch(function (err) {
          /* csv 는 확장 허용목록에 없을 수 있다 — 같은 내용을 .txt 로 다시 제안 */
          if (err && err.code === 'extension_not_enabled' && isCsv) {
            return dl.save({ filename: filename.replace(/\.csv$/i, '.txt'), data: body });
          }
          throw err;
        });
      }).then(function (r) {
        if (r) toast('파일을 저장했습니다.', 'ok');
      }).catch(function (err) {
        if (err && err.code === 'declined') return;              /* 사용자가 취소 */
        toast('파일 저장에 실패했습니다' + (err && err.code ? ' (' + err.code + ')' : '') + '.', 'bad');
      });
      return;
    }
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    toast(filename + ' 파일을 내려받았습니다.', 'ok');
  }
  function toCsv(rows){
    return rows.map(function(r){
      return r.map(function(c){
        c = (c === null || c === undefined) ? '' : String(c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
      }).join(',');
    }).join('\n');
  }
  function param(k){ return new URLSearchParams(NAV.search).get(k) || ''; }

  global.UI = {
    esc:esc, nl2br:nl2br, qs:qs, qsa:qsa, el:el, on:on, initials:initials,
    dateK:dateK, dateFull:dateFull, dtFull:dtFull, ago:ago, isToday:isToday,
    badge:badge, payBadge:payBadge, toast:toast, modal:modal, confirm:confirmBox, prompt:promptBox,
    shell:shell, userSwitcher:userSwitcher, notifPanel:notifPanel, steps:steps,
    empty:empty, optionList:optionList, download:download, toCsv:toCsv, param:param, counters:counters
  };
})(window);

</script>
<script>

/* 해시 라우터 — 원본의 페이지 이동(location.href='x.html?q')을 그대로 흡수한다 */
var PAGES = {};
var CUR = { page:'index', q:'' };

function parseHash(h){
  h = String(h || '').replace(/^#\/?/, '');
  var i = h.indexOf('?');
  return { page: (i < 0 ? h : h.slice(0, i)) || Deploy.home(), q: i < 0 ? '' : h.slice(i + 1) };
}

var NAV = {
  /* 'detail.html?id=x' 같은 원본 형식을 받아 해시로 옮긴다 */
  set href(v){
    var s = String(v).replace(/^[.\/]*/, '').replace(/^#\//, '').replace(/\.html/, '');
    var target = '#/' + s;
    if (location.hash === target) draw();      /* 같은 주소면 이벤트가 안 오므로 직접 다시 그린다 */
    else location.hash = target;
  },
  get href(){ return location.href; },
  get search(){ return CUR.q ? '?' + CUR.q : ''; },
  reload: function(){ draw(); }
};

function draw(){
  CUR = parseHash(location.hash);
  /* 직원용 배포에서 주소를 직접 쳐서 관리 화면으로 들어오는 것을 막는다 */
  if (!Deploy.allowsRoute(CUR.page) || !PAGES[CUR.page]) {
    var home = Deploy.home();
    if (CUR.page !== home) { CUR = { page: home, q: '' }; }
  }
  /* 이전 화면과 떠 있던 오버레이 정리 */
  ['.app', '.pop', '.mask', '.backdrop', '.toasts'].forEach(function(sel){
    Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){ el.remove(); });
  });
  document.body.style.overflow = '';
  var fn = PAGES[CUR.page] || PAGES[Deploy.home()];
  try { fn(); }
  catch (e) {
    console.error('[stay] 화면 오류', CUR.page, e);
    document.getElementById('stay-root').innerHTML =
      '<div style="padding:40px;font-weight:700">화면을 그리는 중 오류가 발생했습니다: ' + CUR.page + '</div>';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', draw);

</script>

  UI.qs('#fileInput').onchange = function(){

      if (file.size > 2*1024*1024) { UI.toast(file.name + ' : 2MB를 초과해 제외했습니다.', 'bad'); return; }
      var fr = new FileReader();
      fr.onload = function(){
        files.push({ name:file.name, size:file.size, type:file.type, dataUrl:fr.result });
        renderFiles();
      };
      fr.readAsDataURL(file);
    });
    this.value = '';
  };
  function renderFiles(){
    UI.qs('#filelist').innerHTML = files.map(function(f, i){
      return '<div class="fileitem">📄 ' + UI.esc(f.name) + ' <span class="muted">(' + Math.round(f.size/1024) + 'KB)</span>' +
        '<span class="sp"></span><button type="button" class="btn btn-sm btn-ghost" data-rm="' + i + '">삭제</button></div>';
    }).join('');
  }
  UI.on(root, 'click', '[data-rm]', function(){ files.splice(Number(this.dataset.rm),1); renderFiles(); });

  UI.qs('#cancel').onclick = function(){ NAV.href='#/new'; };

  /* --- 제출 --- */
  f.onsubmit = function(e){

      ? { id:null, name:String(fd.get('applicantName') || '').trim() }
      : (Store.user(fd.get('applicantId')) || user);

    /* 처리 로그에 남길 사람. 직원용은 로그인이 없으므로 입력한 신청자 정보를 그대로 쓴다. */
    var actor = isStaff
      ? { id:'guest', name:applicant.name, role:'applicant', branch:fd.get('branch') }
      : user;
    var isProxyOn = proxy && proxy.checked;

    var reqDate = fd.get('requestedDate');
    var reqAt = (reqDate === STAY.ymd(new Date()))
      ? new Date().toISOString()
      : new Date(reqDate + 'T09:00:00').toISOString();

    var b = Store.createBooking({

      applicantId: applicant.id, applicantName: applicant.name,
      branch: fd.get('branch'), dept: fd.get('dept'), phone: fd.get('phone'),
      purpose: fd.get('purpose'),
      lodgingType: fd.get('lodgingType'),
      lodgingId: loId === '__etc' ? null : loId,
      lodgingName: loId === '__etc' ? fd.get('lodgingNameEtc') : (Store.lodging(loId)||{}).name,
      checkIn: fd.get('checkIn'), checkOut: fd.get('checkOut'),
      adults: fd.get('adults'), children: fd.get('children'), rooms: fd.get('rooms'),
      guestName: fd.get('guestName'), guestPhone: fd.get('guestPhone'),
      estimatedCost: fd.get('estimatedCost'), costBearer: fd.get('costBearer'),
      specialRequest: fd.get('specialRequest'),
      attachments: files,
      proxyBy: isProxyOn ? user.name : null
    }, actor);

    UI.modal({
      title:'예약 신청이 접수되었습니다',
      body:'<div class="note" style="margin-bottom:14px">예약번호 <b style="font-size:17px">' + UI.esc(b.code) + '</b></div>' +
           '<dl class="dl one">' +
           '<div class="dr"><dt>숙소</dt><dd>' + UI.esc(b.lodgingName) + '</dd></div>' +
           '<div class="dr"><dt>일정</dt><dd>' + UI.esc(b.checkIn) + ' ~ ' + UI.esc(b.checkOut) + ' (' + b.nights + '박)</dd></div>' +
           '<div class="dr"><dt>인원/객실</dt><dd>' + b.guests + '명 / ' + b.rooms + '실</dd></div>' +
           '<div class="dr"><dt>예상비용</dt><dd>' + STAY.won(b.estimatedCost) + '</dd></div>' +
           '<div class="dr"><dt>현재상태</dt><dd>' + UI.badge('NEW') + '</dd></div></dl>' +
           '<p class="muted" style="font-size:12.5px;margin:12px 0 0">예약관리팀에 알림이 전달되었습니다.' +
           (isStaff ? ' <b>예약번호를 꼭 메모해두세요.</b> [내 예약 조회]에서 이 번호와 신청자명으로 진행상황을 확인할 수 있습니다.'
                    : ' 진행 상황은 예약 상세 화면에서 확인할 수 있습니다.') + '</p>',
      buttons: isStaff
        ? [ { label:'닫기' },
            { label:'진행상황 보기', cls:'btn-gold',
              onClick:function(){ NAV.href='#/mystay?code=' + encodeURIComponent(b.code); } } ]
        : [ { label:'목록으로', onClick:function(){ NAV.href='#/requests'; } },
            { label:'예약 상세 보기', cls:'btn-gold', onClick:function(){ NAV.href='#/detail?id=' + b.id; } } ]
    });
  };

  fillLodgings();
  calcGuests();
})();

};

PAGES["mystay"] = function(){

(function(){
  var root = UI.shell('mystay', '내 예약 조회', '예약번호와 신청자명으로 진행상황을 확인합니다');
  var ct = Store.settings().contact || { team:'부동산팀', name:'', title:'', phone:'' };
  var RECENT_KEY = 'ykp_stay_recent';
  var found = null;

  /* 조회에 성공한 예약번호만 이 브라우저에 기억한다(다음 방문 시 재입력 줄이기) */
  function recent(){
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e){ return []; }
  }
  function remember(code, name){
    try {
      var list = recent().filter(function(r){ return r.code !== code; });
      list.unshift({ code:code, name:name });
      localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5)));
    } catch(e){}
  }

  /* 예약번호는 대소문자·공백·접두어 유무를 가리지 않고 찾는다 */
  function normalize(code){
    return String(code || '').toUpperCase().replace(/\s/g, '');
  }
  function lookup(code, name){
    var c = normalize(code);
    var n = String(name || '').trim();
    if (!c || !n) return { err:'예약번호와 신청자명을 모두 입력해주세요.' };
    var hit = Store.bookings().filter(function(b){
      var bc = normalize(b.code);
      return bc === c || bc.slice(-4) === c;   /* 뒤 4자리만 입력해도 찾도록 */
    });
    if (!hit.length) return { err:'해당 예약번호를 찾을 수 없습니다. 번호를 다시 확인해주세요.' };
    var mine = hit.filter(function(b){ return b.applicantName === n || b.guestName === n; });
    if (!mine.length) return { err:'예약번호는 있으나 신청자명이 일치하지 않습니다. 신청하실 때 입력한 이름으로 조회해주세요.' };
    return { booking: mine[0] };
  }

  function render(msg){
    var r = recent();
    root.innerHTML =
     '<div class="pagehead"><div><h2>내 예약 진행상황 조회</h2>' +
       '<p>신청할 때 발급받은 <b>예약번호</b>와 <b>신청자명</b>을 입력하면 지금 어느 단계인지 확인할 수 있습니다.</p></div></div>' +

     '<div class="card"><div class="card-b">' +
       '<div class="frow f2" style="align-items:end">' +
         '<div class="field" style="margin:0"><label>예약번호<span class="req">*</span></label>' +
           '<input class="input" id="q_code" placeholder="STAY-2026-0001 (뒤 4자리만 입력해도 됩니다)" autocomplete="off"></div>' +
         '<div class="field" style="margin:0"><label>신청자명<span class="req">*</span></label>' +
           '<div class="btnrow" style="flex-wrap:nowrap">' +
             '<input class="input" id="q_name" placeholder="예) 김도현" autocomplete="off">' +
             '<button class="btn btn-gold" id="q_go" style="flex:none">조회</button></div></div>' +
       '</div>' +
       (r.length ? '<div class="hr"></div><div class="chips">' +
          '<span class="muted" style="font-size:12px;font-weight:700;align-self:center">최근 조회</span>' +

              UI.esc(x.code) + '</button>';
          }).join('') + '</div>' : '') +
     '</div></div>' +

     (msg ? '<div class="note bad mt">' + UI.esc(msg) + '</div>' : '') +
     '<div id="result" class="mt"></div>' +

     (found ? '' :
       '<div class="note info mt">예약번호를 잊으셨나요? 신청 직후 화면과 담당자 안내 메시지에 <b>STAY-연도-일련번호</b> 형식으로 안내됩니다. ' +
       '찾기 어려우시면 ' + UI.esc(ct.team) + ' ' + UI.esc(ct.phone) + ' 로 문의해주세요.</div>');

    if (found) drawResult(found);

    UI.qs('#q_go').onclick = doLookup;
    ['#q_code','#q_name'].forEach(function(sel){
      UI.qs(sel).addEventListener('keydown', function(e){ if (e.key === 'Enter') doLookup(); });
    });
  }

  function doLookup(){
    var code = UI.qs('#q_code').value, name = UI.qs('#q_name').value;
    var res = lookup(code, name);
    if (res.err) { found = null; render(res.err); UI.qs('#q_code').value = code; UI.qs('#q_name').value = name; return; }
    found = res.booking;
    remember(found.code, name.trim());
    render();
    UI.qs('#q_code').value = found.code; UI.qs('#q_name').value = name.trim();

  /* ---------------- 결과 ---------------- */
  function drawResult(b){

    var closed = ['CANCELED','REJECTED'].indexOf(b.status) >= 0;

    /* 신청자에게는 처리 이력 중 '무슨 일이 있었는지'만 보여준다(내부 메모는 제외) */

       '<span class="sp"></span><span class="sub">최종 변경 ' + UI.dtFull(b.updatedAt) + '</span></div>' +

        '<dl class="dl mt">' +
          dr('이용 숙소', UI.esc(b.lodgingName) + (lo ? ' <span class="tag ' + (lo.ownership==='DIRECT'?'direct':'partner') + '">' +
              UI.esc(STAY.OWNERSHIP[lo.ownership]) + '</span>' : '')) +

          dr('체크아웃', UI.dateFull(b.checkOut) + ' ' + UI.dateK(b.checkOut) + (lo ? ' <span class="muted">~' + UI.esc(lo.checkOutTime) + '</span>' : '')) +
          dr('숙박일수', '<b>' + b.nights + '박 ' + (b.nights+1) + '일</b>') +

          dr('신청자', UI.esc(b.applicantName) + ' <span class="muted">' + UI.esc(b.branch) + '</span>') +
          dr('예약자', UI.esc(b.guestName) + ' <span class="muted">' + UI.esc(b.guestPhone) + '</span>') +
          dr('예상 비용', STAY.won(b.estimatedCost) + ' <span class="muted">(' + UI.esc(STAY.COST_BEARER[b.costBearer]) + ')</span>') +
          dr('신청일', UI.dtFull(b.requestedAt)) +
        '</dl>' +
        (b.specialRequest ? '<div class="hr"></div><div class="muted" style="font-size:12.5px;font-weight:800">특별 요청사항</div>' +

        ? '<div class="card-b" style="border-top:1px solid var(--line-2)">' +

    if (st.own)    list = list.filter(function(l){ return l.ownership === st.own; });
    if (st.region) list = list.filter(function(l){ return l.region === st.region; });

      list = list.filter(function(l){ return l.active !== false; });
      list.sort(function(a, b){                       /* 직영 숙소를 먼저 안내한다 */
        if (a.ownership !== b.ownership) return a.ownership === 'DIRECT' ? -1 : 1;
        return a.name < b.name ? -1 : 1;

    var bs = Store.bookings().filter(function(b){ return b.lodgingId===loId && ['CANCELED','REJECTED'].indexOf(b.status)<0; });
    return { n: bs.length, sum: bs.reduce(function(s,b){ return s + ((b.reservation&&b.reservation.amount)||b.estimatedCost||0); }, 0) };

       '<div class="sp"></div>' + (canEdit ? '<button class="btn btn-gold" id="add">＋ 숙소 등록</button>' : '') + '</div>' +

       '<div class="kpi k-ink"><div class="lb">전체 숙소</div><div class="vl">' + all.length + '<small>곳</small></div></div>' +
       '<div class="kpi k-blue"><div class="lb">직영 (회사운영)</div><div class="vl">' +
         all.filter(function(l){return l.ownership==='DIRECT';}).length + '<small>곳</small></div><div class="sub">회사가 직접 운영</div></div>' +
       '<div class="kpi k-violet"><div class="lb">제휴 숙소</div><div class="vl">' +

         Math.round(all.filter(function(l){return l.ownership==="PARTNER";}).reduce(function(s,l){return s+(l.discountRate||0);},0) /

         '<div class="sub">제휴 숙소 기준</div></div>') +
     '</div>' +

     (incomplete() ? '<div class="note warn" style="margin-bottom:14px">📝 요금·객실·입퇴실·취소규정이 아직 등록되지 않은 숙소가 <b>' +
        incomplete() + '곳</b> 있습니다. ' +
        (isStaff ? '해당 항목은 예약 담당자가 확인 후 안내드립니다.' : '숙소를 열어 정보를 채워주세요.') + '</div>' : '') +
     '<div class="card mt"><div class="card-b"><div class="filterbar">' +

       '<div class="field"><label>구분</label><select class="select" id="f_type"><option value="">전체</option>' +

        (canEdit ? '<button class="btn btn-sm" data-ed="' + l.id + '">수정</button>' : '') + '</div>' +
        '<div class="card-b"><dl class="dl">' +
          d('지역', UI.esc(l.region)) + d('주소', UI.esc(l.address)) +

          d('연락처', l.managerPhone ? UI.esc(l.managerPhone) : miss()) +
          d('네이버 플레이스', l.homepage ? '<a href="' + UI.esc(l.homepage) + '" target="_blank" rel="noopener" style="text-decoration:underline">보기</a>' : '<span class="muted">-</span>') +
          d('입실/퇴실', (l.checkInTime || l.checkOutTime) ? (UI.esc(l.checkInTime||'-') + ' / ' + UI.esc(l.checkOutTime||'-')) : miss()) +
          d('요금', l.rackRate ? (STAY.won(l.rackRate) + (l.partnerRate ? ' → <b>' + STAY.won(l.partnerRate) + '</b> (' + (l.discountRate||0) + '%)' : '')) : miss()) +
          (isStaff ? '' : d('이용 실적', u.n + '건 · ' + STAY.won(u.sum))) +
        '</dl>' +
        '<div class="hr"></div>' +
        '<dl class="dl one">' +
          d('객실정보', l.roomInfo ? UI.esc(l.roomInfo) : miss()) +
          d('이용방법', l.usage ? UI.esc(l.usage) : miss()) +
          d('취소규정', l.cancelPolicy ? UI.esc(l.cancelPolicy) : miss()) +
          (l.caution ? d('주의사항', '<span style="color:var(--orange)">⚠ ' + UI.esc(l.caution) + '</span>') : '') +

    function ta(label, name, val, ph){
      return '<div class="field"><label>' + label + '</label><textarea class="textarea" name="' + name + '"' +

    }
    UI.modal({
      title: l.id ? '숙소 정보 수정' : '신규 숙소 등록', wide:true,
      body:'<div class="frow f2">' +
          f('숙소명 *','name', l.name) +
          '<div class="field"><label>구분</label><select class="select" name="type">' + UI.optionList(STAY.LODGING_TYPE, l.type) + '</select></div>' +

          f('지역','region', l.region, 'text', '예) 대구') +
        '</div>' +
        f('주소','address', l.address) +
        '<div class="frow">' +
          f('담당자','managerName', l.managerName) +

        '</div>' +
        '<div class="frow f4">' +
          f('정상가격','rackRate', l.rackRate, 'number') +
          f('제휴가격','partnerRate', l.partnerRate, 'number') +
          f('할인율(%)','discountRate', l.discountRate, 'number') +
          '<div class="field"><label>사용 여부</label><select class="select" name="active">' +
            '<option value="true"' + (l.active!==false?' selected':'') + '>사용</option>' +

        ta('객실정보','roomInfo', l.roomInfo, '예) 스탠다드 트윈 10실 / 디럭스 5실') +
        ta('이용방법','usage', l.usage, '예) 전화 예약 시 "옆커폰 법인" 언급, 월말 일괄 세금계산서') +
        ta('취소규정','cancelPolicy', l.cancelPolicy, '예) 3일 전 무료, 2일 전 30%, 당일 100%') +
        ta('이용 시 주의사항','caution', l.caution) +
        ta('비고','note', l.note),
      buttons:[
        (l.id ? { label:'삭제', cls:'btn-danger', keepOpen:true, onClick:function(mm, close){
            UI.confirm('숙소 삭제', UI.esc(l.name) + ' 을(를) 삭제합니다.\n기존 예약 기록은 유지됩니다.', '삭제', true).then(function(ok){
              if (!ok) return; Store.removeLodging(l.id); close(); UI.toast('삭제했습니다.','ok'); render();
            });
            return false;
          } } : { label:'취소' }),
        { label:'저장', cls:'btn-primary', keepOpen:true, onClick:function(mm, close){
            var out = { id: l.id };
            UI.qsa('[name]', mm).forEach(function(i){ out[i.name] = i.value; });
            if (!out.name.trim()) { UI.toast('숙소명을 입력해주세요.','bad'); return false; }
            ['rackRate','partnerRate','discountRate'].forEach(function(k){ out[k] = Number(out[k])||0; });
            out.active = out.active === 'true';
            Store.saveLodging(out);
            close(); UI.toast('저장했습니다.','ok'); render();
          } }
      ]
    });
  }

  UI.on(root, 'click', '#add', function(){ editModal(null); });
  UI.on(root, 'click', '[data-ed]', function(){ editModal(Store.lodging(this.dataset.ed)); });
  render();
})();

};

            '<option value="true"' + (n.pinned?' selected':'') + '>중요 (상단 고정)</option></select></div>' +
        '</div>' +
        '<div class="field"><label>제목</label><input class="input" name="title" value="' + UI.esc(n.title||'') + '"></div>' +
        '<div class="field"><label>내용</label><textarea class="textarea" name="body" style="min-height:220px">' + UI.esc(n.body||'') + '</textarea></div>',
      buttons:[{label:'취소'},{label:'저장', cls:'btn-primary', keepOpen:true, onClick:function(mm, close){
        var out = { id:n.id, author:n.author || user.name };
        UI.qsa('[name]', mm).forEach(function(i){ out[i.name] = i.value; });
        if (!out.title.trim()) { UI.toast('제목을 입력해주세요.','bad'); return false; }
        out.pinned = out.pinned === 'true';
        Store.saveNotice(out); close(); UI.toast('저장했습니다.','ok'); render();
      }}]
    });
  }

  UI.on(root, 'click', '.chip[data-c]', function(){ cat = this.dataset.c; render(); });
  UI.on(root, 'click', '#add', function(){ editModal(null); });
  UI.on(root, 'click', '[data-ed]', function(e){
    e.preventDefault();
    var n = Store.notices().filter(function(x){ return x.id === this.dataset.ed; }.bind(this))[0];
    editModal(n);
  });
  UI.on(root, 'click', '[data-del]', function(e){
    e.preventDefault();
    var id = this.dataset.del;
    UI.confirm('공지 삭제', '이 공지를 삭제합니다.', '삭제', true).then(function(ok){
      if (!ok) return; Store.removeNotice(id); UI.toast('삭제했습니다.','ok'); render();
    });
  });
  render();
})();

};
</script>
<script>
draw();
</script>
