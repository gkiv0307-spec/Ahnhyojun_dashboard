      UI.card('사용 안내', guide) +
      UI.card('데이터 초기화', danger);

    function restoreFromFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          S.importJSON(String(reader.result));
          var now = S.get();
          UI.toast('복원 완료 — 계약 ' + now.contracts.length + '건 · 청구서 ' + now.invoices.length + '건', 'ok');
          App.router.refresh();
        } catch (e) {
          UI.toast('복원 실패: ' + e.message, 'err');
        }
      };
      reader.onerror = function () { UI.toast('파일을 읽지 못했습니다.', 'err'); };
      reader.readAsText(file);
    }

    var fileInput = document.getElementById('restore-file');
    fileInput.addEventListener('change', function () {
      restoreFromFile(fileInput.files && fileInput.files[0]);
      fileInput.value = '';
    });

    // claude.ai 화면에서는 파일 선택 창이 막힐 수 있어 끌어다 놓기 경로를 함께 둔다.
    var drop = document.getElementById('restore-drop');
    if (drop) {
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          e.preventDefault(); drop.style.borderColor = 'var(--accent)';
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          e.preventDefault(); drop.style.borderColor = 'var(--line)';
        });
      });
      drop.addEventListener('drop', function (e) {
        restoreFromFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
      });
    }

    // 자동 백업 전송이 실패하면 화면이 다시 그려지므로, 켜고 끄기는 누르는 즉시 저장한다.
    var abToggle = document.getElementById('ab-enabled');
    if (abToggle) {
      abToggle.addEventListener('change', function () {
        var next = Object.assign({}, S.get().settings.autoBackup, { enabled: abToggle.checked, lastError: '' });
        delete next.token;
        S.updateSettings({ autoBackup: next });
        UI.toast(abToggle.checked ? '자동 백업을 켰습니다.' : '자동 백업을 껐습니다.', 'ok');
      });
    }
  }

  App.views.settings = {
    title: '설정 · 백업',
    desc: '기본값을 정하고 데이터를 백업·복원합니다.',
    actions: function () { return ''; },
    render: render,
    handlers: {
      saveSettings: function () {
        S.updateSettings({
          ownerName: document.getElementById('ownerName').value.trim(),
          defaultPayDay: Math.min(31, Math.max(1, U.num(document.getElementById('defaultPayDay').value) || 1)),
          lateFeeRate: U.num(document.getElementById('lateFeeRate').value),
          prorateFirstMonth: document.getElementById('prorateFirstMonth').checked
        });
        UI.toast('설정을 저장했습니다.', 'ok');
        App.router.refresh();
      },
      driveCheck: function () { App.drive.checkAndPreview(); },
      driveClearIgnore: function () { App.drive.clearIgnored(); UI.toast('다시 묻지 않기 목록을 비웠습니다.', 'ok'); App.router.refresh(); },
      driveSave: function () {
        var d = Object.assign({}, S.get().settings.drive, {
          rentFileId: document.getElementById('d-rent').value.trim(),
          rentYear: U.num(document.getElementById('d-year').value) || new Date().getFullYear(),
          expenseFileId: document.getElementById('d-exp').value.trim(),
          autoCheck: document.getElementById('d-auto').checked
        });
        S.updateSettings({ drive: d });
        UI.toast('연동 설정을 저장했습니다.', 'ok');
        App.router.refresh();
      },
      driveFind: function () {
        UI.toast('드라이브에서 파일을 찾는 중…');
        Promise.all([App.drive.searchFiles('부동산임차월세관리표'), App.drive.searchFiles('지출관리')]).then(function (r) {
          var files = r[0].concat(r[1]);
          if (!files.length) { UI.toast('관리표 파일을 찾지 못했습니다.', 'err'); return; }
          var body = '<div class="t-dim" style="font-size:13px;margin-bottom:8px">파일을 누르면 설정에 채워집니다.</div>' +
            files.map(function (f) {
              var kind = /지출/.test(f.title) ? 'exp' : 'rent';
              var year = (f.title.match(/_(\d{2})\D*년?/) || [])[1];
              return '<div class="list-item" style="padding-left:0;padding-right:0"><div class="li-main"><div class="li-title">' + U.esc(f.title) +
                '</div><div class="li-sub">수정 ' + String(f.modifiedTime || '').slice(0, 10) + '</div></div>' +
                '<button class="btn btn-sm" data-act="drivePick" data-id="' + kind + '|' + U.esc(f.id) + '|' + (year ? 2000 + Number(year) : '') + '">선택</button></div>';
            }).join('');
          UI.open({ title: '드라이브 파일 선택', body: body, buttons: [{ label: '닫기', onClick: UI.close }] });
        }, function (err) { UI.toast(App.drive.explain(err), 'err'); });
      },
      drivePick: function (id) {
        var p = id.split('|');
        if (p[0] === 'exp') document.getElementById('d-exp').value = p[1];
        else { document.getElementById('d-rent').value = p[1]; if (p[2]) document.getElementById('d-year').value = p[2]; }
        UI.close(); UI.toast('파일을 채웠습니다. “연동 설정 저장”을 눌러 주세요.', 'ok');
      },
      autoBackupSave: function () {
        var enabled = document.getElementById('ab-enabled').checked;
        var endpoint = document.getElementById('ab-endpoint').value.trim();
        var token = document.getElementById('ab-token').value.trim();
        if (enabled && !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?|$)/.test(endpoint)) {
          UI.toast('Apps Script 배포 주소(/exec)를 확인해 주세요.', 'err'); return;
        }
        if (enabled && !token) { UI.toast('백업 비밀문구를 입력해 주세요.', 'err'); return; }
        if (!App.autoBackup.setToken(token)) { UI.toast('이 브라우저에 비밀문구를 저장하지 못했습니다.', 'err'); return; }
        var safeAutoBackup = Object.assign({}, S.get().settings.autoBackup, {
          enabled: enabled, endpoint: endpoint, lastError: ''
        });
        delete safeAutoBackup.token;
        S.updateSettings({ autoBackup: safeAutoBackup });
        UI.toast(enabled ? '자동 백업 설정을 저장했습니다.' : '자동 백업을 껐습니다.', 'ok');
        App.router.refresh();
      },
      autoBackupNow: function () {
        UI.toast('Google Drive로 백업을 보내는 중…');
        App.autoBackup.sendNow().then(function () {
          UI.toast('백업 전송을 요청했습니다. Google Drive에서 파일을 확인해 주세요.', 'ok');
        }, function (err) {
          UI.toast('자동 백업 실패: ' + ((err && err.message) || '연결을 확인해 주세요.'), 'err');
        });
      },
      backup: function () {
        U.download('옆커폰_주택관리_백업_' + U.todayISO() + '.json', S.exportJSON(), 'application/json');
        UI.toast('백업 파일을 내려받았습니다.', 'ok');
      },
      restore: function () { document.getElementById('restore-file').click(); },
      seed: function () {
        UI.confirm({
          title: '샘플 데이터 불러오기', danger: true, confirmLabel: '불러오기',
          message: '샘플 데이터를 불러오면 현재 데이터가 모두 대체됩니다. 계속할까요?',
          onConfirm: function () { S.seedSample(); UI.toast('샘플 데이터를 불러왔습니다.', 'ok'); App.router.refresh(); }
        });
      },
      reset: function () {
        UI.confirm({
          title: '전체 데이터 삭제', danger: true, confirmLabel: '모두 삭제',
          message: '건물·계약·청구·지출 데이터를 모두 삭제합니다. 되돌릴 수 없습니다.',
          onConfirm: function () { S.reset(); UI.toast('데이터를 삭제했습니다.'); App.router.refresh(); }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 인수인계 점검 — 앱 데이터에서 확인이 필요한 것을 규칙으로 뽑아 체크리스트로 보여준다.
   완료 표시와 메모는 handover 컬렉션에 저장되어 모든 기기에서 같이 보인다. */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var state = { group: '', showDone: false };

  var GROUPS = [
    ['loan', '대출 만기'], ['money', '미납 · 명도'], ['contract', '계약서'],
    ['sheet', '관리표'], ['jagum', '자금일보 인계'], ['general', '일반']
  ];
  var GROUP_LABEL = {};
  GROUPS.forEach(function (g) { GROUP_LABEL[g[0]] = g[1]; });

  var UNIT_FLAG = /무단|명도|거주하는 사람|계약 등록 필요|계약기간 확인|짐이 차|청소 시급|확인 필요/;
  var CONTRACT_FLAG = /내용증명|기간 미확인|미기재|확인 필요|명도|무단 ?거주|무단 ?점유/;
  var UNPAID_MIN = 300000;
  var OVERDUE_DAYS = 15;

  /* 자동 항목: 데이터가 바뀌면 목록도 따라 바뀐다. key 로 완료·메모를 이어 붙인다. */
  function autoItems() {
    var st = S.get(), today = U.todayISO(), out = [];

    // 1. 대출 만기 (지났거나 90일 이내)
    st.buildings.forEach(function (b) {
      if (!b.loanDue || S.isDisposed(b)) return;
      var left = U.diffDays(today, b.loanDue);
      if (left > 90) return;
      out.push({
        key: 'loan:' + b.id, group: 'loan', urgent: left < 0,
        title: b.name + ' 대출 만기 ' + U.fmtDate(b.loanDue) + (left < 0 ? ' (' + (-left) + '일 지남)' : ' (D-' + left + ')'),
        detail: [b.loanBank, U.num(b.loanAmount) ? U.won(b.loanAmount) : ''].filter(Boolean).join(' · ') +
          ' — 연장 여부와 새 만기일·금리를 은행에 확인하고 자산 정보에 적어 두세요.',
        link: { kind: 'building', id: b.id }, bid: b.id
      });
    });

    // 2. 미납 (임차인별 합계)
    var byC = {};
    B.unpaidInvoices().forEach(function (inv) {
      if (B.overdueDays(inv) < OVERDUE_DAYS) return;   // 이번 달 갓 나온 청구서는 미납으로 세지 않는다
      var g = byC[inv.contractId] || (byC[inv.contractId] = { first: inv, months: 0, amount: 0 });
      g.months++; g.amount += B.remaining(inv);
      if (inv.ym < g.first.ym) g.first = inv;
    });
    var flaggedContracts = {};
    Object.keys(byC).forEach(function (cid) {
      var g = byC[cid];
      if (g.amount < UNPAID_MIN) return;
      var c = S.contract(cid) || {};
      var memoFlag = CONTRACT_FLAG.test(c.memo || '');
      flaggedContracts[cid] = true;
      out.push({
        key: 'unpaid:' + cid, group: 'money', urgent: g.amount >= 1000000 || memoFlag,
        title: S.unitLabel(g.first.unitId) + ' · ' + (c.tenantName || '') + ' 미납 ' + U.won(g.amount),
        detail: g.months + '개월 · 최초 기한 ' + U.fmtDate(g.first.dueDate) +
          (c.memo ? ' — ' + c.memo : '') + ' — 약속받은 납부일, 내용증명·명도 진행 상태를 확인하세요.',
        link: { kind: 'unpaid', id: cid }, cid: cid, invId: g.first.id, unitId: g.first.unitId
      });
    });

    // 3. 계약 메모에 확인 표시가 있는 진행중 계약
    st.contracts.forEach(function (c) {
      if (flaggedContracts[c.id] || !CONTRACT_FLAG.test(c.memo || '')) return;
      if (c.endDate && c.endDate < today) return;
      out.push({
        key: 'ctr:' + c.id, group: /명도|무단 ?거주|무단 ?점유|내용증명/.test(c.memo) ? 'money' : 'contract',
        urgent: /명도|무단 ?거주|무단 ?점유|내용증명/.test(c.memo),
        title: S.unitLabel(c.unitId) + ' · ' + c.tenantName + ' 계약 확인',
        detail: c.memo, link: { kind: 'contract', id: c.id }, cid: c.id, unitId: c.unitId
      });
    });

    // 4. 호실 메모에 확인 표시
    st.units.forEach(function (u) {
      if (!UNIT_FLAG.test(u.memo || '')) return;
      var money = /무단|명도|거주하는 사람|미납/.test(u.memo);
      out.push({
        key: 'unit:' + u.id, group: money ? 'money' : 'contract', urgent: money,
        title: S.unitLabel(u.id) + ' 상태 확인',
        detail: u.memo, link: { kind: 'building', id: u.buildingId }, unitId: u.id,
        cid: (S.activeContract(u.id) || {}).id || ''
      });
    });

    // 5. 만료일 없이 진행 중인 계약 (묵시적 갱신)
    var rolling = st.contracts.filter(function (c) { return !c.endDate && c.startDate <= today; });
    if (rolling.length) {
      var names = rolling.map(function (c) { return S.unitLabel(c.unitId) + ' ' + c.tenantName; });
      out.push({
        key: 'rolling', group: 'contract', urgent: false,
        title: '만료일 없이 진행 중인 계약 ' + rolling.length + '건',
        detail: '원 계약이 끝난 뒤에도 월세를 내고 있어 갱신 중으로 표시한 계약입니다. 재계약서가 있는지, 없으면 언제 쓸지 정하세요. — ' +
          names.slice(0, 12).join(', ') + (names.length > 12 ? ' 외 ' + (names.length - 12) + '건' : ''),
        link: { kind: 'renewal' }
      });
    }

    // 6. 관리표에서 글자로 적힌 칸 · 합계 불일치 (마지막 드라이브 확인 결과)
    var plan = App.drive && App.drive.last().plan;
    if (plan) {
      (plan.flags || []).forEach(function (f) {
        out.push({ key: 'sheet:' + f, group: 'sheet', urgent: /확인/.test(f), title: '관리표 ' + f,
          detail: '숫자 대신 글자가 적힌 칸입니다. 실제 입금 여부를 통장에서 확인하고 관리표를 숫자로 고쳐 주세요.' });
      });
      (plan.notes || []).forEach(function (n) {
        out.push({ key: 'sheetnote:' + n, group: 'sheet', urgent: false, title: '관리표 ' + n,
          detail: '월별 칸의 합과 총입금액 칸이 다릅니다. 보통 총입금액 수식이 깨진 것이니 관리표를 고치세요. 앱은 월별 칸을 기준으로 봅니다.' });
      });
    }

    // 6-1. 장부 점검 — 통장 확인 없이 남은 소액 잔액, 계약 금액과 다른 청구액
    var residual = B.unpaidInvoices().filter(function (inv) {
      return B.overdueDays(inv) >= OVERDUE_DAYS && B.isSmallResidual(inv) && !B.isBankVerified(inv);
    });
    if (residual.length) {
      out.push({ key: 'ledger:residual', group: 'money', urgent: false,
        title: '장부 점검 — 일부만 덜 들어온 잔액 ' + residual.length + '건 (통장 확인 필요)',
        detail: residual.slice(0, 12).map(function (inv) {
          return S.unitLabel(inv.unitId) + ' ' + inv.ym + ' 잔액 ' + U.won(B.remaining(inv));
        }).join(' · ') + (residual.length > 12 ? ' 외 ' + (residual.length - 12) + '건' : '') +
          ' — 관리표를 옮기며 금액이 앞뒤 달로 나뉜 착오인 경우가 많습니다. 미납 문자 전에 통장으로 실제 입금액을 확인하고, 착오면 수납 화면에서 입금을 바로잡으세요.' });
    }
    var thisYear = today.slice(0, 4) + '-01';
    var mismatch = st.invoices.filter(function (inv) {
      if (inv.ym < thisYear || inv.prorated || (inv.extras || []).length || B.isBankVerified(inv)) return false;
      var c = S.contract(inv.contractId);
      if (!c || S.isHeld(inv.unitId)) return false;
      return U.num(inv.total) !== U.num(c.rent) + U.num(c.maintenanceFee);
    });
    if (mismatch.length) {
      out.push({ key: 'ledger:amount', group: 'contract', urgent: false,
        title: '장부 점검 — 계약 금액과 다른 청구서 ' + mismatch.length + '건',
        detail: mismatch.slice(0, 12).map(function (inv) {
          var c = S.contract(inv.contractId);
          return S.unitLabel(inv.unitId) + ' ' + inv.ym + ' 청구 ' + U.won(inv.total) + ' / 계약 ' + U.won(U.num(c.rent) + U.num(c.maintenanceFee));
        }).join(' · ') + (mismatch.length > 12 ? ' 외 ' + (mismatch.length - 12) + '건' : '') +
          ' — 월세가 바뀐 달 전후로 금액이 섞였거나 계약 금액이 실제와 다를 수 있습니다. 통장의 실제 입금액을 기준으로 계약이나 청구서를 맞추세요.' });
    }

    // 7. 누구나 인수인계 때 챙길 일반 항목
    [
      ['g:bank', '은행 계좌 접근 인수', '월세 입금 계좌(신협·농협)의 인터넷뱅킹, OTP, 통장, 자동이체 목록을 넘겨받으세요. 대출 이자 출금 계좌도 같이.'],
      ['g:docs', '임대차계약서 원본과 앱 계약 목록 대조', '자산 정보의 “임대차계약서 폴더 열기”로 드라이브 폴더를 열고, 임대차 계약 화면의 진행중 목록과 하나씩 맞춰 보세요. 없는 계약서는 목록으로 적어 두세요.', { kind: 'contracts' }],
      ['g:sheet', '관리표 요약 행 오류', '관리표 아래쪽 월세합계·순이익 행에 #REF! 오류가 있어 그 숫자는 쓰면 안 됩니다. 정산 리포트의 숫자를 쓰세요.', { kind: 'reports' }],
      ['g:contacts', '중개사 · 관리업체 · 은행 담당자 연락처 인수', '건물별 중개사는 자산 정보에 이미 들어 있습니다. 관리업체(청소·수리), 은행 대출 담당자, 세무사 연락처를 받아 건물 메모에 적어 두세요.'],
      ['g:keys', '호실 비밀번호 · 열쇠 목록', '현관·호실 비밀번호는 호실 메모에 옮겨 두었습니다. 빠진 호실은 전임자에게 받아 호실 수정에서 채우세요.', { kind: 'buildings' }],
      ['g:tax', '재산세 · 보험 · 세무 일정', '재산세(7·9월), 화재보험 갱신, 세무사 자료 제출 시기를 확인해 지출 관리에 미리 적어 두세요.', { kind: 'expenses' }]
    ].forEach(function (g) {
      out.push({ key: g[0], group: 'general', urgent: false, title: g[1], detail: g[2], link: g[3] || null });
    });

    // 8. 자금일보 인수인계 (2026-11-04 인계 문서) — 정할 것 · 문서만으로 확인되지 않은 점
    var acLink = { kind: 'accounting' };
    [
      ['jg:sheet-owner', true, '자금일보 시트 입력 담당자 · 편집 권한 정하기', '인계 문서 6-1. 인수자는 시트의 노란 칸(사유)만 채웁니다. 입력할 사람에게 시트 편집 권한을 줘야 합니다.'],
      ['jg:deadline', false, '사유 입력 마감 시각 정하기', '인계 문서 6-2. 기본 제안은 "다음날 아침 갱신 전". 비어 있으면 확인필요로 남습니다.'],
      ['jg:gunwi', false, '군위 신협 은행 엑셀 받을 사람 정하기', '인계 문서 6-3. 군위 신협은 서버 연결이 없어 은행 엑셀로 따로 입력합니다(당분간 수동).'],
      ['jg:backup', true, '현재 담당자 부재 시 갱신 담당 정하기', '인계 문서 6-4. 거래 수집 · 갱신 · 대시보드 배포가 모두 현재 담당자(e브랜치 · 서버 키)에게만 있습니다. 부재 시 업무가 멈추므로 서버 키 · e브랜치 접근 이관을 따로 협의하세요.'],
      ['jg:appsscript', false, '시트 자동 작성(Apps Script) 설치 전 인수자 작업 범위 확인', '인계 문서 7: 자동 작성은 아직 준비 단계이고 날짜 탭은 직접 작성 중입니다. 설치 전까지 인수자가 무엇을 하는지(직접 만든 탭에 사유만 넣는지 등) 문서에 없습니다.'],
      ['jg:pohang', false, '포항 지점의 구분 자동 계산 계좌 확인', '구분 자동 계산 대상은 "포항·진주성·김해·거제·군위" 5개 지점인데, 계좌 목록에 "포항" 이름이 붙은 계좌가 없습니다. 어느 계좌인지 확인해 회계 업무 점검 → 계좌 연결에 적어 두세요.'],
      ['jg:lateRows', false, '늦게 들어오는 거래(거제 등)의 알림 · 마감 정하기', '이전 날짜 탭에 행이 나중에 추가될 수 있다고 되어 있으나, 누가 알려주고 언제까지 채우는지는 문서에 없습니다.'],
      ['jg:ebranch', false, 'e브랜치 "1시간 단위 전송"과 아침 "최신정보조회" 관계 확인', '구성도에는 1시간 단위 자동 전송, 일하는 방식에는 아침에 최신정보조회 직접 실행으로 적혀 있습니다. 둘의 관계를 담당자에게 확인하세요.']
    ].forEach(function (g) {
      out.push({ key: g[0], group: 'jagum', urgent: g[1], title: g[2], detail: g[3], link: acLink });
    });

    return out;
  }

  /** 자동 항목 + 저장된 완료·메모 + 직접 추가한 항목을 합친다 */
  function items() {
    var saved = S.get().handover || [];
    var byKey = {};
    saved.forEach(function (s) { if (s.key) byKey[s.key] = s; });
    var seen = {};
    var list = autoItems().map(function (a) {
      var s = byKey[a.key];
      seen[a.key] = true;
      return Object.assign({}, a, { id: s ? s.id : '', done: !!(s && s.done), doneAt: s ? s.doneAt : '', note: s ? s.note : '', manual: false });
    });
    saved.forEach(function (s) {
      if (s.manual) {
        list.push(Object.assign({ urgent: false, link: null }, s, { manual: true }));
      } else if (s.key && !seen[s.key] && (s.done || s.note || s.acted)) {
        // 데이터가 고쳐져 규칙에서 빠진 항목은 저절로 완료로 본다
        list.push(Object.assign({ urgent: false, link: null }, s, { resolved: true, done: true, doneAt: s.doneAt || s.actedAt || '' }));
      }
    });
    return list;
  }

  function summary() {
    var all = items();
    var open = all.filter(function (i) { return !i.done; });
    return { total: all.length, open: open.length, urgent: open.filter(function (i) { return i.urgent; }).length };
  }

  /** key 또는 id 로 저장 항목을 찾거나 만든다 */
  function savedFor(item) {
    var st = S.get();
    st.handover = st.handover || [];
    var found = null;
    st.handover.forEach(function (s) {
      if ((item.id && s.id === item.id) || (item.key && s.key === item.key)) found = s;
    });
    if (found) return found;
    found = { id: U.uid('hov'), key: item.key || '', title: item.title, detail: item.detail || '', group: item.group,
              done: false, doneAt: '', note: '', manual: !!item.manual, createdAt: U.todayISO() };
    st.handover.push(found);
    return found;
  }

  function findItem(ref) {
    return items().filter(function (i) { return i.id === ref || i.key === ref; })[0];
  }

  function openLink(link) {
    if (!link) return;
    if (link.kind === 'building') App.views.buildings.detail(link.id);
    else if (link.kind === 'contract') App.views.contracts.handlers.detail(link.id);
    else if (link.kind === 'unpaid') { location.hash = '#/payments'; setTimeout(function () { App.views.payments.handlers.groupDetail(link.id); }, 50); }
    else location.hash = '#/' + link.kind;
  }

  /* ---------- 항목에서 바로 진짜 기록 고치기 ---------- */
  function btn(label, act, ref, primary) {
    return '<button class="btn btn-sm' + (primary ? ' btn-primary' : '') + '" data-act="hoDo" data-id="' + U.esc(act + '|' + ref) + '">' + label + '</button>';
  }
  function actionsHTML(i, ref) {
    var k = String(i.key || '');
    var h = '';
    if (k.indexOf('unpaid:') === 0) h = btn('수납', 'settle', ref, true) + btn('✉️ 문자', 'sms', ref) + btn('퇴실 정산', 'moveout', ref);
    else if (k.indexOf('ctr:') === 0) h = btn('계약 수정', 'editContract', ref, true) + btn('✉️ 문자', 'sms', ref) + btn('임차인 변경', 'changeTenant', ref) + btn('퇴실 정산', 'moveout', ref);
    else if (k.indexOf('unit:') === 0) h = btn('호실 수정', 'editUnit', ref, true) + btn('임차인 변경', 'changeTenant', ref) + (i.cid ? btn('퇴실 정산', 'moveout', ref) : '');
    else if (k.indexOf('loan:') === 0) h = btn('대출 정보 수정', 'editBuilding', ref, true);
    else if (k === 'rolling') h = btn('🔁 만기 탭에서 정리', 'renewal', ref, true);
    else if (k.indexOf('ledger:') === 0) h = btn('수납 · 미납 열기', 'payments', ref, true);
    else if (i.manual && i.targetUnit) {
      var cur = S.activeContract(i.targetUnit);
      h = btn('호실 수정', 'editUnit', ref) + (cur ? btn('계약 수정', 'editContract', ref) + btn('퇴실 정산', 'moveout', ref) : '') + btn('임차인 변경', 'changeTenant', ref);
    } else if (i.manual) h = btn('🔗 호실 연결', 'link', ref);
    return h;
  }

  function unitOptions() {
    return [{ value: '', label: '(연결 안 함 — 점검표에만)' }].concat(S.get().units.filter(function (u) { return !S.isDisposed(u.buildingId); })
      .map(function (u) { var c = S.activeContract(u.id); return { value: u.id, label: S.unitLabel(u.id) + (c ? ' · ' + c.tenantName : ' · 공실') }; }));
  }

  function linkForm(i) {
    UI.form({
      title: '🔗 호실 연결 — ' + i.title,
      values: { targetUnit: i.targetUnit || '' },
      fields: [{ name: 'targetUnit', label: '이 항목과 관련된 호실', type: 'select', full: true, options: unitOptions(),
                 hint: '연결하면 이 항목에서 바로 계약 수정 · 퇴실 정산을 하고, 메모가 그 계약(또는 호실) 메모에도 남습니다' }],
      onSubmit: function (v) {
        var sv = savedFor(i), u = v.targetUnit ? S.unit(v.targetUnit) : null;
        sv.targetUnit = v.targetUnit || '';
        sv.link = u ? { kind: 'building', id: u.buildingId } : null;
        S.commit(); UI.toast(u ? S.unitLabel(u.id) + '에 연결했습니다.' : '연결을 풀었습니다.', 'ok'); App.router.refresh();
      }
    });
  }

  /** 항목이 가리키는 계약 · 호실 · 건물 */
  function targetsOf(i) {
    var cid = i.cid || '', unitId = i.unitId || i.targetUnit || '', bid = i.bid || '';
    if (!cid && unitId) { var ac = S.activeContract(unitId); if (ac) cid = ac.id; }
    if (!unitId && cid) { var c = S.contract(cid); if (c) unitId = c.unitId; }
    if (!bid && unitId) { var u = S.unit(unitId); if (u) bid = u.buildingId; }
    return { cid: cid, unitId: unitId, bid: bid };
  }

  function markActed(i) {
    var s = savedFor(i);
    s.acted = true; s.actedAt = U.todayISO();
  }

  function doAction(act, ref) {
    var i = findItem(ref);
    if (!i) return;
    var t = targetsOf(i), H = App.views;
    markActed(i); S.commit();
    if (act === 'settle') {
      var first = i.invId || (B.unpaidInvoices().filter(function (x) { return x.contractId === t.cid; })[0] || {}).id;
      if (first) H.dashboard.handlers.settle(first);
    } else if (act === 'sms') H.notices.quickSend(t.cid);
    else if (act === 'editContract') H.contracts.handlers.edit(t.cid);
    else if (act === 'changeTenant') H.contracts.changeTenant(t.unitId);
    else if (act === 'editUnit') H.buildings.handlers.editUnit(t.unitId);
    else if (act === 'editBuilding') H.buildings.handlers.editBuilding(t.bid);
    else if (act === 'moveout') moveOutForm(t.cid, i);
    else if (act === 'renewal') App.router.go('renewal');
    else if (act === 'payments') App.router.go('payments');
    else if (act === 'link') linkForm(i);
  }

  /** 점검 메모를 실제 계약 · 호실 · 건물 메모 끝에 [MM.DD 인수인계] 로 붙인다 */
  function syncMemo(t, note) {
    var line = '[' + U.fmtDate(U.todayISO()).slice(3) + ' 인수인계] ' + note.replace(/\s*\n\s*/g, ' / ');
    var rec = t.cid ? S.contract(t.cid) : t.unitId ? S.unit(t.unitId) : t.bid ? S.building(t.bid) : null;
    if (!rec) return;
    rec.memo = rec.memo ? rec.memo + ' · ' + line : line;
  }

  /* ---------- 퇴실 정산 — 계약 종료 · 미납 공제 · 공과금 정산 · 보증금 반환을 한 번에 ---------- */
  function moveOutForm(cid, item) {
    var c = S.contract(cid);
    if (!c) { UI.toast('연결된 계약이 없습니다. 호실에 진행 중인 계약이 있는지 확인하세요.', 'err'); return; }
    var today = U.todayISO();
    var od = B.unpaidInvoices().filter(function (i) { return i.contractId === c.id && i.dueDate <= today; })
      .sort(function (a, b) { return a.ym < b.ym ? -1 : 1; });
    var unpaid = U.sum(od, B.remaining);
    var F = ['unpaid', 'gas', 'elec', 'water', 'clean', 'etc'];
    UI.form({
      title: '🧳 퇴실 정산 · ' + S.unitLabel(c.unitId) + ' ' + (c.tenantName || ''),
      submitLabel: '정산 반영',
      values: { moveOut: today, refundDate: today, deposit: U.num(c.deposit), unpaid: unpaid, gas: 0, elec: 0, water: 0, clean: 0, etc: 0, refund: Math.max(0, U.num(c.deposit) - unpaid) },
      fields: [
        { name: 'moveOut', label: '퇴실일 (계약 종료일)', type: 'date', required: true },
        { name: 'refundDate', label: '보증금 반환일', type: 'date', required: true },
        { name: 'deposit', label: '보증금', type: 'money', hint: '계약서 보증금' },
        { name: 'unpaid', label: '미납 월세 공제', type: 'money', hint: '지금 미납 ' + U.won(unpaid) + (od.length ? ' (' + od.length + '개월)' : '') + ' — 넣은 만큼 오래된 달부터 "보증금 공제"로 수납 처리' },
        { name: 'gas', label: '가스 정산', type: 'money' },
        { name: 'elec', label: '전기 정산', type: 'money' },
        { name: 'water', label: '수도 정산', type: 'money' },
        { name: 'clean', label: '청소비 · 원상복구', type: 'money' },
        { name: 'etc', label: '기타 공제', type: 'money' },
        { name: 'etcNote', label: '기타 공제 내용', placeholder: '예) 도어락 교체' },
        { name: 'refund', label: '실제 반환액', type: 'money', required: true, hint: '보증금 − 공제 합계가 자동으로 계산됩니다. 통장 출금액과 맞는지 확인하세요.' },
        { name: 'account', label: '반환 통장 · 받는 사람', placeholder: '예) 대표님 농협 4402 → 다인시스템' }
      ],
      onRender: function (formEl, read) {
        var refund = formEl.querySelector('[name="refund"]');
        formEl.addEventListener('input', function (e) {
          if (e.target === refund) return;
          var v = read();
          var ded = F.reduce(function (sum, k) { return sum + U.num(v[k]); }, 0);
          refund.value = U.comma(Math.max(0, U.num(v.deposit) - ded));
        });
      },
      onSubmit: function (v) {
        if (v.moveOut < c.startDate) return { moveOut: '계약 시작일(' + U.fmtDate(c.startDate) + ')보다 앞설 수 없습니다.' };
        applyMoveOut(c, v, od, item);
      }
    });
  }

  function applyMoveOut(c, v, od, item) {
    var st = S.get(), label = S.unitLabel(c.unitId), u = S.unit(c.unitId) || {};
    var ded = [['미납 월세', v.unpaid], ['가스', v.gas], ['전기', v.elec], ['수도', v.water], ['청소비', v.clean], [v.etcNote || '기타', v.etc]]
      .filter(function (d) { return U.num(d[1]) > 0; });
    var dedSum = U.sum(ded, function (d) { return d[1]; });
    // 1. 계약 종료 + 정산 기록
    c.endDate = v.moveOut; c.endReason = '퇴실';
    c.settlement = { moveOut: v.moveOut, refundDate: v.refundDate, deposit: U.num(v.deposit), deductions: ded.map(function (d) { return { item: d[0], amount: U.num(d[1]) }; }),
                     refund: U.num(v.refund), account: v.account || '', at: U.todayISO() };
    var summary = U.fmtDate(v.moveOut) + ' 퇴실 · 보증금 ' + U.comma(v.deposit) + '원 중 ' + U.comma(v.refund) + '원 반환(' + U.fmtDate(v.refundDate) + (v.account ? ', ' + v.account : '') + ')' +
      (ded.length ? ' · 공제 ' + ded.map(function (d) { return d[0] + ' ' + U.comma(d[1]); }).join(' + ') : '');
    c.memo = (c.memo ? c.memo + ' · ' : '') + '[퇴실정산] ' + summary;
    if (U.num(v.deposit) - dedSum !== U.num(v.refund)) c.memo += ' (보증금 − 공제 ' + U.comma(U.num(v.deposit) - dedSum) + '원과 반환액이 다름 — 확인 필요)';
    // 2. 미납 공제 → 오래된 달부터 '보증금 공제' 수납
    var left = U.num(v.unpaid);
    od.forEach(function (inv) {
      if (left <= 0) return;
      var amt = Math.min(left, B.remaining(inv));
      inv.payments.push({ id: U.uid('pay'), date: v.refundDate, amount: amt, method: '보증금 공제', memo: '퇴실정산 — 보증금에서 공제' });
      left -= amt;
    });
    // 3. 퇴실 뒤 납부일이 잡힌 미수납 청구서는 지운다
    var removed = 0;
    st.invoices = st.invoices.filter(function (inv) {
      var drop = inv.contractId === c.id && inv.dueDate > v.moveOut && B.paidAmount(inv) === 0;
      if (drop) removed++;
      return !drop;
    });
    // 4. 공과금 정산은 지출로
    [['가스요금', v.gas], ['전기요금', v.elec], ['수도요금', v.water]].forEach(function (x) {
      if (U.num(x[1]) > 0) st.expenses.push({ id: U.uid('exp'), date: v.refundDate, buildingId: u.buildingId || '', category: '공과금', amount: U.num(x[1]),
        memo: label + ' 퇴실정산(' + x[0] + ')', createdAt: U.todayISO() });
    });
    // 5. 호실 메모 · 인수인계 항목
    if (u.id) u.memo = '[공실] ' + U.fmtDate(v.moveOut) + ' ' + (c.tenantName || '') + ' 퇴실 · 보증금 반환 ' + U.comma(v.refund) + '원(' + U.fmtDate(v.refundDate) + ')' + (u.memo ? ' · ' + u.memo : '');
    ['ctr:' + c.id, 'unpaid:' + c.id, 'unit:' + c.unitId].forEach(function (k) {
      var s = savedFor({ key: k, title: label + ' ' + (c.tenantName || ''), group: 'contract' });
      s.done = true; s.doneAt = U.todayISO(); s.note = (s.note ? s.note + '\n' : '') + '퇴실정산: ' + summary;
    });
    if (item && item.manual) { var m = savedFor(item); m.done = true; m.doneAt = U.todayISO(); }
    S.commit();
    UI.toast('퇴실 정산을 반영했습니다 — 계약 종료' + (U.num(v.unpaid) ? ', 미납 공제 수납' : '') + (removed ? ', 남은 청구서 ' + removed + '건 정리' : '') + '.', 'ok');
    App.router.refresh();
  }

  function render(el) {
    var all = items();
    var open = all.filter(function (i) { return !i.done; });
    var done = all.filter(function (i) { return i.done; });
    var urgent = open.filter(function (i) { return i.urgent; });

    var html = '<div class="grid grid-4">' +
      UI.stat('남은 항목', open.length + '건', '전체 ' + all.length + '건', open.length ? '' : 'ok',
        '전임자에게 확인하거나 직접 처리해야 할 일입니다. 대출 만기·미납·계약 메모·관리표 상태에서 자동으로 뽑고, 직접 추가한 항목도 함께 셉니다.') +
      UI.stat('급한 것', urgent.length + '건', '만기 지남 · 100만원 이상 · 명도', urgent.length ? 'danger' : '',
        '대출 만기가 이미 지났거나, 미납이 100만원 이상이거나, 명도·무단거주·내용증명이 걸린 항목입니다.') +
      UI.stat('완료', done.length + '건', done.length ? '최근 ' + U.fmtDate(U.sortBy(done, function (d) { return d.doneAt || ''; }, true)[0].doneAt) : '', done.length ? 'ok' : '',
        '체크한 항목입니다. 데이터가 정리되어 더 이상 뜨지 않는 항목도 여기에 남습니다.') +
      UI.stat('메모 있음', all.filter(function (i) { return i.note; }).length + '건', '전임자 답변 등', '',
        '각 항목의 “메모”에 전임자에게 들은 내용을 적어 두면 여기 셉니다. 메모는 모든 기기에서 같이 보입니다.') +
      '</div>';

    /* 분류 탭 */
    var counts = {};
    open.forEach(function (i) { counts[i.group] = (counts[i.group] || 0) + 1; });
    html += '<div class="tabs" style="margin-top:16px">' +
      '<button class="tab' + (state.group === '' ? ' active' : '') + '" data-act="hoGroup" data-id="">전체<span class="cnt">' + open.length + '</span></button>' +
      GROUPS.map(function (g) {
        return '<button class="tab' + (state.group === g[0] ? ' active' : '') + '" data-act="hoGroup" data-id="' + g[0] + '">' + g[1] +
          '<span class="cnt">' + (counts[g[0]] || 0) + '</span></button>';
      }).join('') + '</div>';

    var list = (state.showDone ? all : open).filter(function (i) { return !state.group || i.group === state.group; });
    list = U.sortBy(list, function (i) { return (i.done ? '2' : i.urgent ? '0' : '1') + i.group + i.title; });

    function row(i) {
      var ref = i.id || i.key;
      return '<div class="list-item ho-item' + (i.done ? ' ho-done' : '') + '" style="align-items:flex-start">' +
        '<input type="checkbox" data-act="hoToggle" data-id="' + U.esc(ref) + '"' + (i.done ? ' checked' : '') + ' style="margin-top:4px;width:16px;height:16px;cursor:pointer">' +
        '<div class="li-main"><div class="li-title">' + U.esc(i.title) +
        (i.urgent && !i.done ? ' <span class="badge badge-danger">급함</span>' : '') +
        (i.manual ? ' <span class="badge badge-muted">직접 추가</span>' : '') +
        (i.resolved ? ' <span class="badge badge-ok">데이터상 해결</span>' : '') +
        ' <span class="badge badge-info">' + GROUP_LABEL[i.group] + '</span></div>' +
        (i.detail ? '<div class="li-sub" style="white-space:pre-line;margin-top:2px">' + U.esc(i.detail) + '</div>' : '') +
        (i.note ? '<div style="margin-top:6px;padding:7px 10px;background:var(--accent-soft);border-radius:6px;font-size:12.5px;white-space:pre-line">📝 ' + U.esc(i.note) + '</div>' : '') +
        (i.doneAt ? '<div class="t-faint" style="font-size:11px;margin-top:4px">완료 ' + U.fmtDate(i.doneAt) + '</div>' : '') +
        '</div>' +
        '<div class="row ho-actions" style="flex:0 0 auto;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:300px">' +
        (i.done ? '' : actionsHTML(i, ref)) +
        (i.link ? '<button class="btn btn-sm btn-ghost" data-act="hoOpen" data-id="' + U.esc(ref) + '">보기</button>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="hoNote" data-id="' + U.esc(ref) + '">메모</button>' +
        (i.manual ? '<button class="btn btn-sm btn-ghost" data-act="hoDel" data-id="' + U.esc(ref) + '">삭제</button>' : '') +
        '</div></div>';
    }

    html += UI.card('', list.length ? list.map(row).join('')
      : UI.empty(open.length ? '이 분류에는 남은 항목이 없습니다' : '남은 항목이 없습니다', open.length ? '' : '인수인계 점검을 마쳤습니다. 새 미납이나 만기가 생기면 다시 뜹니다.'),
      '<label class="check"><input type="checkbox" data-act="hoShowDone"' + (state.showDone ? ' checked' : '') + '> 완료 항목도 보기</label>', true);

    html += '<p class="t-faint" style="font-size:12px;margin:12px 0 0">항목은 대출 만기일(자산 정보), 미납 ' + U.wonShort(UNPAID_MIN) +
      ' 이상(납부기한 ' + OVERDUE_DAYS + '일 경과분만), 계약·호실 메모의 확인 표시, 만료일 없는 계약, 마지막 드라이브 확인 결과에서 자동으로 만들어집니다. 체크와 메모만 저장되고, 문제가 정리되면 항목은 저절로 사라집니다.</p>';

    el.innerHTML = html;
  }

  App.views.handover = {
    title: '인수인계 점검',
    desc: '전임자에게 확인할 것과 직접 처리할 것을 체크리스트로 봅니다.',
    summary: summary,
    actions: function () {
      return '<button class="btn btn-primary" data-act="hoAdd">＋ 항목 추가</button>' +
        UI.help('자동으로 뽑히지 않는 확인 사항(예: 특정 임차인과 통화, 서류 위치)을 직접 적어 둡니다. 직접 추가한 항목은 삭제할 수 있습니다.');
    },
    render: render,
    handlers: {
      hoDo: function (id) { var p = String(id).split('|'); doAction(p[0], p.slice(1).join('|')); },
      hoGroup: function (id) { state.group = id || ''; App.router.refresh(); },
      hoShowDone: function (id, target) { state.showDone = target.checked; App.router.refresh(); },
      hoToggle: function (ref, target) {
        var item = findItem(ref);
        if (!item) return;
        var s = savedFor(item);
        s.done = target.checked;
        s.doneAt = s.done ? U.todayISO() : '';
        S.commit();
        UI.toast(s.done ? '완료로 표시했습니다.' : '다시 열었습니다.', s.done ? 'ok' : '');
        App.router.refresh();
      },
      hoNote: function (ref) {
        var item = findItem(ref);
        if (!item) return;
        var t = targetsOf(item);
        var where = t.cid ? '계약 메모' : t.unitId ? '호실 메모' : t.bid ? '건물 메모' : '';
        UI.form({
          title: '메모 — ' + item.title,
          values: { note: item.note || '', sync: !!where },
          fields: [{ name: 'note', label: '확인한 내용 · 전임자 답변', type: 'textarea', full: true, placeholder: '예) 9/10 전임자 확인: 10월 초 입금 약속' }]
            .concat(where ? [{ name: 'sync', label: '함께 남기기', type: 'checkbox', checkLabel: where + '에도 날짜와 함께 남기기', full: true }] : []),
          onSubmit: function (v) {
            var s = savedFor(item);
            var changed = v.note && v.note !== (s.syncedNote || '');
            s.note = v.note;
            if (v.sync && changed) { syncMemo(t, v.note); s.syncedNote = v.note; }
            S.commit();
            UI.toast('메모를 저장했습니다.', 'ok');
            App.router.refresh();
          }
        });
      },
      hoOpen: function (ref) { var item = findItem(ref); if (item) openLink(item.link); },
      hoAdd: function () {
        UI.form({
          title: '점검 항목 추가',
          values: { group: 'general' },
          fields: [
            { name: 'title', label: '항목', required: true, full: true, placeholder: '예) 한집 관리단 회비 납부 방법 확인' },
            { name: 'group', label: '분류', type: 'select', options: GROUPS.map(function (g) { return { value: g[0], label: g[1] }; }) },
            { name: 'targetUnit', label: '어디에 기록할지 (호실)', type: 'select', full: true,
              options: unitOptions(),
              hint: '고르면 메모가 그 호실의 계약(없으면 호실) 메모에도 남고, 항목에서 바로 계약 수정 · 퇴실 정산을 할 수 있습니다' },
            { name: 'urgent', label: '급함', type: 'checkbox', checkLabel: '급한 항목으로 표시' },
            { name: 'detail', label: '설명', type: 'textarea', full: true }
          ],
          onSubmit: function (v) {
            var st = S.get();
            st.handover = st.handover || [];
            var u = v.targetUnit ? S.unit(v.targetUnit) : null;
            st.handover.push({ id: U.uid('hov'), key: '', title: v.title, detail: v.detail, group: v.group, urgent: !!v.urgent,
                               targetUnit: v.targetUnit || '', link: u ? { kind: 'building', id: u.buildingId } : null,
                               done: false, doneAt: '', note: '', manual: true, createdAt: U.todayISO() });
            if (u && v.detail) syncMemo(targetsOf({ targetUnit: u.id }), v.title + ' — ' + v.detail);
            S.commit();
            UI.toast('항목을 추가했습니다.', 'ok');
            App.router.refresh();
          }
        });
      },
      hoDel: function (ref) {
        var st = S.get();
        st.handover = (st.handover || []).filter(function (s) { return s.id !== ref; });
        S.commit();
        UI.toast('삭제했습니다.');
        App.router.refresh();
      }
    }
  };
})(window.App);

</script>
<script>
/* 납부 안내 문자 — 납부일이 다가오거나 미납이 시작된 임차인을 단계별로 모아
   임차인 정보 · 연락처 · 보낼 문자를 만들어 준다. 문자는 담당자가 직접 보낸다.
   '보냈음' 기록은 smsLog 컬렉션에 저장되어 모든 기기에서 같이 보인다. */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var state = { stage: 'today', window: 1 };

  var STAGES = [
    { key: 'due', label: '납부일 안내', badge: 'badge-info',
      guide: '납부일 당일 오전에 보내면 가장 잘 들어옵니다. 이미 낸 분께는 보내지 않아도 됩니다.' },
    { key: 'first', label: '미납 1차', badge: 'badge-warn',
      guide: '납부일이 지난 첫 달입니다. 부드럽게 확인을 요청하고, 3일 안에 답이 없으면 전화하세요.' },
    { key: 'second', label: '2개월 이상', badge: 'badge-danger',
      guide: '두 달 이상 밀렸습니다. 납부 기한을 정해 알리고, 7일 뒤에도 없으면 최종 통보로 넘어갑니다.' },
    { key: 'final', label: '최종 통보', badge: 'badge-danger',
      guide: '미납액이 보증금을 넘었습니다. 문자 뒤에 내용증명을 준비하세요. 인수인계 점검표에 기록해 두면 좋습니다.' },
    { key: 'check', label: '통장 확인 필요', badge: 'badge-muted',
      guide: '청구액 중 일부(30% 이하)만 덜 들어온 것으로 나옵니다. 관리표를 옮기며 금액이 앞뒤 달로 나뉜 착오인 경우가 많으니, 문자를 보내기 전에 통장에서 실제 입금액을 먼저 확인하세요. 오늘 보낼 문자에는 넣지 않습니다.' }
  ];
  var STAGE = {};
  STAGES.forEach(function (s) { STAGE[s.key] = s; });
  var RESEND_DAYS = 7;   // 2개월 이상 · 최종 통보는 7일마다 다시 보낼 대상이 된다

  function smsSettings() {
    var s = S.get().settings.sms || {};
    return { sender: s.sender || '', phone: s.phone || '', accounts: s.accounts || {} };
  }

  function md(iso) { var d = U.parseDate(iso); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function monthLabel(ym) { return Number(String(ym).slice(5, 7)) + '월분'; }
  function amt(n) { return U.comma(n) + '원'; }
  /** 미납 월 목록 — 넷 이상이면 '1월분부터 10월분까지'로 줄인다 */
  function monthsText(invs) {
    if (invs.length <= 3) return invs.map(function (i) { return monthLabel(i.ym); }).join(', ');
    var a = invs[0].ym, b = invs[invs.length - 1].ym;
    return (a.slice(0, 4) !== b.slice(0, 4) ? a.slice(2, 4) + '년 ' : '') + monthLabel(a) + '부터 ' + monthLabel(b) + '까지';
  }

  /* 연락 대상 목록을 만든다 */
  function collect() {
    var st = S.get(), today = U.todayISO(), until = U.addDays(today, state.window);
    var byC = {};
    B.unpaidInvoices().forEach(function (inv) {
      var c = S.contract(inv.contractId);
      if (!c || !S.isActiveOn(c, today)) return;
      var g = byC[c.id] || (byC[c.id] = { c: c, overdue: [], upcoming: null });
      if (inv.dueDate < today) g.overdue.push(inv);
      else if (inv.dueDate <= until && (!g.upcoming || inv.dueDate < g.upcoming.dueDate)) g.upcoming = inv;
    });
    // 청구서가 아직 없는 달의 납부일도 계약 납부일로 챙긴다
    S.activeContracts(today).forEach(function (c) {
      if (byC[c.id] && (byC[c.id].overdue.length || byC[c.id].upcoming)) return;
      [U.monthKey(today), U.addMonths(U.monthKey(today), 1)].forEach(function (ym) {
        var due = U.dueDateOf(ym, c.payDay);
        if (due < today || due > until || due < c.startDate) return;
        if (S.invoiceOf && S.invoiceOf(c.id, ym)) return;
        var g = byC[c.id] || (byC[c.id] = { c: c, overdue: [], upcoming: null });
        if (!g.upcoming) g.upcoming = { id: 'plan:' + c.id + ':' + ym, ym: ym, dueDate: due, total: U.num(c.rent) + U.num(c.maintenanceFee), planned: true };
      });
    });

    var out = [];
    Object.keys(byC).forEach(function (cid) {
      var g = byC[cid], c = g.c, item;
      if (g.overdue.length) {
        g.overdue.sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; });
        var total = U.sum(g.overdue, B.remaining);
        var months = g.overdue.length;
        var stage = months >= 2 && U.num(c.deposit) > 0 && total > U.num(c.deposit) ? 'final' : months >= 2 ? 'second' : 'first';
        // 일부만 덜 들어온 소액 잔액뿐이면 문자 전에 통장부터 확인한다
        if (g.overdue.every(B.isSmallResidual) && !g.overdue.some(B.isBankVerified)) stage = 'check';
        item = { stage: stage, c: c, invs: g.overdue, total: total, months: months,
                 days: B.overdueDays(g.overdue[0]), ref: stage === 'first' ? g.overdue[0].id : '' };
      } else if (g.upcoming) {
        item = { stage: 'due', c: c, invs: [g.upcoming], total: g.upcoming.planned ? g.upcoming.total : B.remaining(g.upcoming),
                 months: 1, dLeft: U.diffDays(today, g.upcoming.dueDate), ref: g.upcoming.id };
      }
      if (!item) return;
      item.note = c.smsNote || '';
      item.hold = c.smsHoldUntil && c.smsHoldUntil >= today ? c.smsHoldUntil : '';
      item.sent = lastSent(item);
      item.todo = item.stage !== 'check' && !item.hold && (!item.sent || ((item.stage === 'second' || item.stage === 'final') && U.diffDays(item.sent.sentAt, today) >= RESEND_DAYS));
      item.text = message(item);
      out.push(item);
    });
    var order = { final: 0, second: 1, first: 2, due: 3, check: 4 };
    return out.sort(function (a, b) { return order[a.stage] - order[b.stage] || b.total - a.total; });
  }

  function lastSent(item) {
    var logs = (S.get().smsLog || []).filter(function (l) {
      if (l.contractId !== item.c.id || l.stage !== item.stage) return false;
      return item.ref ? l.ref === item.ref : true;
    });
    return logs.sort(function (a, b) { return a.sentAt < b.sentAt ? 1 : -1; })[0] || null;
  }

  /* 문자 본문 — 일반 문자로 보내도 깨지지 않게 특수문자를 쓰지 않는다 */
  function message(it) {
    var c = it.c, u = S.unit(c.unitId) || {}, b = S.building(u.buildingId) || {};
    var set = smsSettings();
    var who = (c.tenantName || '임차인') + '님';
    var place = (b.name || '') + ' ' + (u.name || '');
    var acct = set.accounts[b.id] ? '입금 계좌: ' + set.accounts[b.id] : '입금은 기존 납부 계좌로 부탁드립니다.';
    var sign = [set.sender || '주택관리 담당', set.phone].filter(Boolean).join(' ');
    var deadline = md(U.addDays(U.todayISO(), 7));
    var L = [];
    if (it.stage === 'due') {
      var inv = it.invs[0];
      L.push(who + ' 안녕하세요. ' + place + ' 관리 담당입니다.');
      L.push(monthLabel(inv.ym) + ' 월세 ' + amt(it.total) + ' 납부일이 ' + (it.dLeft === 0 ? '오늘(' + md(inv.dueDate) + ')' : it.dLeft === 1 ? '내일(' + md(inv.dueDate) + ')' : md(inv.dueDate)) + '입니다.');
      L.push(acct);
      L.push('이미 납부하셨다면 이 문자는 넘기셔도 됩니다. 감사합니다.');
    } else if (it.stage === 'first' || it.stage === 'check') {
      var f = it.invs[0];
      L.push(who + ' 안녕하세요. ' + place + ' 관리 담당입니다.');
      if (B.paidAmount(f) > 0) L.push(monthLabel(f.ym) + ' 월세 ' + amt(f.total) + ' 중 ' + amt(it.total) + '이 덜 들어온 것으로 확인되어 연락드립니다. (납부일 ' + md(f.dueDate) + ')');
      else L.push(md(f.dueDate) + '이 납부일이던 ' + monthLabel(f.ym) + ' 월세 ' + amt(it.total) + '이 아직 확인되지 않아 연락드립니다.');
      L.push('다른 이름이나 다른 계좌로 보내셨다면 알려 주세요. 입금 예정일을 회신해 주시면 확인해 두겠습니다.');
      L.push(acct);
    } else if (it.stage === 'second') {
      L.push(who + ' 안녕하세요. ' + place + ' 관리 담당입니다.');
      L.push('현재 ' + it.months + '개월분 월세 합계 ' + amt(it.total) + '이 미납 상태입니다. (' + monthsText(it.invs) + ')');
      L.push('임대차계약서상 월세가 2기 이상 연체되면 계약 해지 사유가 됩니다.');
      L.push(deadline + '까지 납부해 주시거나 납부 계획을 회신해 주시기 바랍니다.');
      L.push(acct);
    } else {
      L.push(who + ', ' + place + ' 관리 담당입니다.');
      L.push('미납 월세가 ' + it.months + '개월 ' + amt(it.total) + '으로 보증금 ' + amt(U.num(c.deposit)) + '을 넘었습니다.');
      L.push(deadline + '까지 전액 납부나 납부 계획 회신이 없으면 내용증명 발송과 계약 해지, 명도 절차를 진행할 수밖에 없음을 알려드립니다.');
      L.push(acct);
    }
    L.push(sign);
    return L.join('\n');
  }

  function guide(it) {
    if (it.hold) return U.fmtDate(it.hold) + '까지 기다리기로 했습니다. 그 뒤에도 입금이 없으면 다시 오늘 보낼 문자에 나타납니다.';
    if (it.stage === 'due') return it.dLeft === 0 ? '오늘이 납부일입니다. 오전에 보내세요.' : '납부일 ' + it.dLeft + '일 전입니다. 하루 전 안내로 보내세요.';
    var base = '납부일 ' + it.days + '일 지남. ';
    if (it.stage === 'first') return base + (it.days <= 3 ? '지금 1차 안내를 보내세요.' : '1차 안내 후 답이 없으면 전화하세요.');
    if (it.stage === 'second') return base + it.months + '개월째입니다. 납부 기한(7일)을 정해 보내세요.';
    if (it.stage === 'check') return '덜 들어온 금액이 적습니다. 장부 착오일 수 있으니 통장에서 실제 입금액을 먼저 확인하세요.';
    return '보증금 ' + U.won(it.c.deposit) + '을 넘었습니다. 문자 뒤 내용증명을 준비하세요.';
  }

  /** 메모가 있지만 지금 문자 대상은 아닌 계약 */
  function quietSpecials(items) {
    var shown = {};
    items.forEach(function (i) { shown[i.c.id] = 1; });

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      UI.toast(ok ? okMsg : '복사가 막혀 있습니다. 글자를 길게 눌러 직접 복사해 주세요.', ok ? 'ok' : 'err');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { UI.toast(okMsg, 'ok'); }, fallback);
    } else fallback();
  }

  /* ---------- 어디서든 문자 보내기 (임차인 이름을 누르면 열림) ---------- */
  /** 계약 하나의 지금 보낼 문자 항목 — 미납이 있으면 미납 단계, 없으면 다음 납부일 안내 */
  function itemFor(c) {
    var keep = state.window; state.window = 45;
    var it = collect().filter(function (i) { return i.c.id === c.id; })[0];
    state.window = keep;
    if (it) return it;
    // 계약이 끝났어도 남은 미납이 있으면 미납 문자로 만든다
    var today = U.todayISO();
    var od = B.unpaidInvoices().filter(function (i) { return i.contractId === c.id && i.dueDate < today; })
      .sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; });
    if (od.length) {
      var total = U.sum(od, B.remaining), months = od.length;
      var stage = months >= 2 && U.num(c.deposit) > 0 && total > U.num(c.deposit) ? 'final' : months >= 2 ? 'second' : 'first';
      it = { stage: stage, c: c, invs: od, total: total, months: months, days: B.overdueDays(od[0]), ref: stage === 'first' ? od[0].id : '' };
      it.note = c.smsNote || ''; it.hold = '';
      it.sent = lastSent(it); it.todo = !it.sent; it.text = message(it);
      return it;
    }
    var ym = U.monthKey(U.todayISO()), due = U.dueDateOf(ym, c.payDay);
    if (due < U.todayISO()) { ym = U.addMonths(ym, 1); due = U.dueDateOf(ym, c.payDay); }
    var inv = { id: 'plan:' + c.id + ':' + ym, ym: ym, dueDate: due, total: U.num(c.rent) + U.num(c.maintenanceFee), planned: true };
    it = { stage: 'due', c: c, invs: [inv], total: inv.total, months: 1, dLeft: U.diffDays(U.todayISO(), due), ref: inv.id };
    it.note = c.smsNote || ''; it.hold = '';
    it.sent = lastSent(it); it.todo = !it.sent; it.text = message(it);
    return it;
  }

  function copyPlain(text, ok) { copyText(text, ok); }

    var issue = '';   // 고른 개별 문자 종류 (비면 납부 안내)
    var greet = (c.tenantName || '임차인') + '님 안녕하세요. ' + S.unitLabel(c.unitId) + ' 관리 담당입니다.\n';
    var refs = UI.open({
      title: '✉️ ' + S.unitLabel(c.unitId) + ' · ' + (c.tenantName || ''),
      body: body,
      buttons: [
        { label: '닫기', onClick: UI.close },
        { label: '문자 복사', onClick: function () { copyPlain(document.getElementById('ntq-text').value, '문자를 복사했습니다. 휴대폰 문자에 붙여넣으세요.'); } },
        { label: '보냈음', className: 'btn-primary', onClick: function () {
          var st = S.get(); st.smsLog = st.smsLog || [];
          var rec = { id: U.uid('sms'), kind: issue ? 'issue' : 'notice', contractId: c.id, stage: issue || it.stage, sentAt: U.todayISO(), createdAt: U.todayISO(),
                      text: document.getElementById('ntq-text').value, phone: c.tenantPhone || '', label: S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') };
          if (!issue) rec.ref = it.ref;
          st.smsLog.push(rec);
          S.commit(); UI.close(); UI.toast(issue ? '개별 문자로 기록했습니다.' : '보냄으로 기록했습니다.', 'ok'); App.router.refresh();

  /** 다른 화면에서 임차인 이름을 이 링크로 감싸면 눌러서 바로 문자를 보낼 수 있다 */
  function tenantLink(c, label) {
    if (!c || !c.id) return U.esc(label || '');
    return '<a href="#" class="tenant-link" data-act="ntQuick" data-id="' + U.esc(c.id) + '" title="문자 보내기">' +
      U.esc(label != null ? label : (c.tenantName || '임차인')) + ' ✉️</a>';
  }

  function parseKey(key) { var p = String(key).split('|'); return { contractId: p[0], stage: p[1], ref: p[2] || '' }; }

  App.views.notices = {
    title: '납부 안내 문자',
    desc: '납부일 · 미납 단계별로 보낼 문자를 만들어 줍니다. 문자는 직접 보내세요.',
    render: render,
    quickSend: quickSend,
    tenantLink: tenantLink,
    todayCount: function () { return collect().filter(function (i) { return i.todo; }).length; },
    handlers: {
      ntQuick: function (id) { quickSend(id); },
      ntStage: function (id) { state.stage = id; App.router.refresh(); },
      ntCopy: function (id, target) {
        var ta = target.closest('.nt-msg').querySelector('textarea');
        copyText(ta.value, '문자를 복사했습니다. 휴대폰 문자에 붙여넣으세요.');
      },
      ntCopyPhone: function (id) { copyText(id, '번호를 복사했습니다.'); },
      ntNote: function (id) {
        var c = S.contract(id);
        if (!c) return;
        UI.form({
          title: '특이 케이스 메모 · ' + S.unitLabel(c.unitId) + ' ' + (c.tenantName || ''),
          submitLabel: '저장',
          values: { smsNote: c.smsNote || '', smsHoldUntil: c.smsHoldUntil || '' },
          fields: [
            { name: 'smsNote', label: '메모', type: 'textarea', full: true,
              hint: '예) 매월 말일 무렵 그 달 월세를 냄 · 10/20 입금 약속 · 다른 사람이 대신 입금. 비우면 특이 케이스에서 빠집니다.' },
            { name: 'smsHoldUntil', label: '이날까지 문자 대기', type: 'date', full: true,
              hint: '입금을 기다리기로 한 날짜. 이날까지는 오늘 보낼 문자에서 빠지고, 지나면 다시 나타납니다. 비우면 대기 없음.' }
          ],
          onSubmit: function (v) {
            c.smsNote = v.smsNote;
            c.smsHoldUntil = v.smsHoldUntil;
            S.commit();
            UI.toast('메모를 저장했습니다.', 'ok');
            App.router.refresh();
          }
        });
      },
      ntSent: function (key, target) {
        var k = parseKey(key), st = S.get(), c = S.contract(k.contractId) || {};
        var card = target && target.closest ? target.closest('.nt-item') : null;
        var ta = card ? card.querySelector('textarea') : null;
        st.smsLog = st.smsLog || [];
        st.smsLog.push({ id: U.uid('sms'), kind: 'notice', contractId: k.contractId, stage: k.stage, ref: k.ref, sentAt: U.todayISO(), createdAt: U.todayISO(),
                         text: ta ? ta.value : '', phone: c.tenantPhone || '', label: S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') });
        S.commit();
        UI.toast('보냄으로 기록했습니다.', 'ok');
        App.router.refresh();
      },
      ntUnsend: function (key) {
        var k = parseKey(key), st = S.get(), today = U.todayISO();
        var idx = -1;
        (st.smsLog || []).forEach(function (l, i) {
          if (l.contractId === k.contractId && l.stage === k.stage && (k.ref ? l.ref === k.ref : true)) idx = i;
        });
        if (idx >= 0) { st.smsLog.splice(idx, 1); S.commit(); }
        App.router.refresh();
      },
      ntSaveSet: function () {
        var accounts = {};
        Array.prototype.forEach.call(document.querySelectorAll('.nt-acc'), function (inp) {
          var v = inp.value.trim(); if (v) accounts[inp.getAttribute('data-bid')] = v;
        });
        var prev = smsSettings().accounts;
        Object.keys(prev).forEach(function (k) { if (!document.getElementById('nt-acc-' + k)) accounts[k] = prev[k]; });
        S.updateSettings({ sms: {
          sender: document.getElementById('nt-sender').value.trim(),
          phone: document.getElementById('nt-phone').value.trim(),
          accounts: accounts
        } });
        UI.toast('문자 설정을 저장했습니다.', 'ok');
        App.router.refresh();
      }
    }
  };
})(window.App);

</script>
<script>
/* 매도 · 임대 문자 게시판 — 중개사에게 뿌릴 매물 문자를 매물별로 관리한다.
   매물 정보를 적어 두고 [문구 생성]을 누르면 양식에 맞춘 문자가 만들어지고,
   보낸 뒤 [발송 기록]을 남기면 금액 · 발송 수 · 문의 결과가 히스토리로 쌓인다.
   매물은 saleItems, 발송 기록은 saleLog 컬렉션에 저장되어 모든 기기에서 같이 보인다. */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var state = { sel: 'all', gen: {} };

  var KINDS = [
    { value: 'home', label: '주택 매도' },
    { value: 'lodging', label: '숙박 매도' },
    { value: 'lease', label: '상가 임대' }
  ];
  var KIND_LABEL = {};
  KINDS.forEach(function (k) { KIND_LABEL[k.value] = k.label; });

  var STATUSES = ['매도 준비', '임대 모집', '금액 컨펌 필요', '시세조사 필요', '보류', '지사장님 보유', '거래 완료'];
  var STATUS_BADGE = {
    '매도 준비': 'badge-danger', '임대 모집': 'badge-info', '금액 컨펌 필요': 'badge-warn',
    '시세조사 필요': 'badge-warn', '보류': 'badge-muted', '지사장님 보유': 'badge-muted', '거래 완료': 'badge-ok'
  };
  var ACTIVE = { '매도 준비': 1, '임대 모집': 1 };

  function items() { return S.get().saleItems || []; }
  function logs() { return S.get().saleLog || []; }
  function item(id) {
    var list = items();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function logsOf(id) {
    return logs().filter(function (l) { return l.itemId === id; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  /* ---------- 매물별 중개사 연락처 (agents) ---------- */
  // 매물 → 건물 연결. 매물에 buildingId를 정해 두면 그쪽을 먼저 쓴다.
  var ITEM_BUILDING = {
    sale_gunsan: 'b_gunsan', sale_cheongwoo: 'b_cheongwoo', sale_biryong: 'b_biryong', sale_hwain: 'b_hwain',
    sale_sacheon: 'b_sacheon', sale_sadong: 'b_gyeongsan', sale_hanjip: 'b_hanjip', sale_pohang: 'b_browndot',
    sale_geoje: 'b_geoje', sale_gimhae: 'b_gimhae', sale_jinju: 'b_jinju', sale_bom: 'b_amnam', sale_duryu: 'b_duryu',
    sale_jukjeon_medi: 'b_jukjeon', sale_jukjeon_golden: 'b_jukjeon', sale_penta: 'b_penta', sale_seongju: 'b_seongju',
    sale_gimje: 'b_gimje', sale_siji: 'b_sijidu', sale_gwangju: 'b_gwangju', sale_nongong: 'b_yongkyung'
  };
  var LODGING_PRO = 'lodging_pro';   // 숙박업 전문 중개 — 숙박 매물 전부에 함께 붙는다
  var CHUNK_SMS = 100;               // 단체 문자 한 번에 붙여넣는 번호 수

  function buildingIdsOf(it) {
    var ids = [it.buildingId || ITEM_BUILDING[it.id]].filter(Boolean);
    if (it.kind === 'lodging') ids.push(LODGING_PRO);
    return ids;
  }
  function agentsFor(buildingIds) {
    var seen = {}, out = [];
    buildingIds.forEach(function (bid) {
      S.agentsOf(bid).forEach(function (a) {
        var k = String(a.mobile || a.tel || a.name).replace(/\D/g, '') || a.name;
        if (seen[k]) return;
        seen[k] = 1; out.push(a);
      });
    });
    return out;
  }
  function mobilesOf(list) {
    var seen = {}, out = [];
    list.forEach(function (a) {
      String(a.mobile || '').split('/').forEach(function (m) {
        var d = m.replace(/\D/g, '');
        if (!/^01[016789]\d{7,8}$/.test(d) || seen[d]) return;
        seen[d] = 1; out.push(U.phone(d));
      });
    });
    return out;
  }
  function agentCountHTML(it) {
    var list = agentsFor(buildingIdsOf(it));
    if (!list.length) return '';
    return '<button class="btn btn-sm" data-act="smAgents" data-id="' + U.esc(it.id) + '">📇 중개사 ' + U.comma(list.length) + '곳 · 휴대폰 ' + U.comma(mobilesOf(list).length) + '개</button>';
  }

  // 중개사 연락처 창 — 휴대폰 번호를 100개씩 묶어 복사해 단체 문자에 바로 붙여넣는다
  function agentsModal(buildingIds, title) {
    var list = agentsFor(buildingIds);
    var mobiles = mobilesOf(list);
    var chunks = [];
    for (var i = 0; i < mobiles.length; i += CHUNK_SMS) chunks.push(mobiles.slice(i, i + CHUNK_SMS));
    var btns = chunks.map(function (c, n) {
      return '<button class="btn btn-sm' + (n === 0 ? ' btn-primary' : '') + '" data-chunk="' + n + '">' +
        (chunks.length > 1 ? (n * CHUNK_SMS + 1) + '~' + (n * CHUNK_SMS + c.length) + '번 ' : '') + '휴대폰 ' + c.length + '개 복사</button>';
    }).join('');
    var sorted = list.slice().sort(function (a, b) {
      var am = mobilesOf([a]).length ? 0 : 1, bm = mobilesOf([b]).length ? 0 : 1;
      return am - bm || (U.num(a.dist) || 99999) - (U.num(b.dist) || 99999) || U.num(b.deals) - U.num(a.deals);
    });
    var body = '<div class="t-dim" style="font-size:12px;margin-bottom:8px">중개사무소 ' + U.comma(list.length) + '곳 · 휴대폰 ' + U.comma(mobiles.length) +
      '개 (중복 제거). 번호는 줄바꿈으로 복사되어 단체 문자 받는 사람 칸에 그대로 붙여넣을 수 있습니다. 번호를 누르면 한 개만 복사됩니다.</div>' +
      (btns ? '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">' + btns +
        '<button class="btn btn-sm" data-all="1">전체 표 복사 (엑셀용)</button></div>' : '<div class="empty" style="padding:12px">휴대폰 번호가 없습니다.</div>') +
      '<input id="ag-q" class="inline-input" type="search" placeholder="상호 · 중개사 · 주소 검색" style="width:100%;margin-bottom:8px">' +
      '<div class="table-wrap" style="max-height:420px;overflow-y:auto"><table class="rt"><thead><tr><th>중개사무소</th><th>휴대폰</th><th>사무실</th><th>주소</th></tr></thead><tbody id="ag-rows">' +
      sorted.map(function (a) {
        var ms = mobilesOf([a]);
        return '<tr data-k="' + U.esc(((a.name || '') + ' ' + (a.agent || '') + ' ' + (a.addr || '')).toLowerCase()) + '">' +
          '<td data-label=""><div class="rt-v">' + U.esc(a.name) + (a.agent ? '<div class="t-faint" style="font-size:11px">' + U.esc(a.agent) + '</div>' : '') + '</div></td>' +
          '<td class="mono" data-label="휴대폰"><div class="rt-v">' + ms.map(function (m) { return '<a href="#" data-one="' + U.esc(m) + '">' + U.esc(m) + '</a>'; }).join('<br>') + '</div></td>' +
          '<td class="mono t-dim" data-label="사무실"><div class="rt-v">' + U.esc(a.tel && mobilesOf([{ mobile: a.tel }]).length ? '' : U.phone(a.tel || '')) + '</div></td>' +
          '<td class="t-faint" style="font-size:11px;white-space:normal" data-label="주소"><div class="rt-v">' + U.esc(a.addr || '') + (a.dist ? ' · ' + U.comma(a.dist) + 'm' : '') + '</div></td></tr>';
      }).join('') + '</tbody></table></div>';
    var opened = UI.open({ title: '📇 ' + title + ' · 중개사 연락처', body: body, buttons: [{ label: '닫기', onClick: UI.close }] });
    opened.body.addEventListener('click', function (e) {
      var b = e.target.closest('[data-chunk],[data-one],[data-all]');
      if (!b) return;
      e.preventDefault();
      if (b.hasAttribute('data-chunk')) copyText(chunks[+b.getAttribute('data-chunk')].join('\n'), '휴대폰 번호 ' + chunks[+b.getAttribute('data-chunk')].length + '개를 복사했습니다. 단체 문자 받는 사람 칸에 붙여넣으세요.');
      else if (b.hasAttribute('data-one')) copyText(b.getAttribute('data-one'), b.getAttribute('data-one') + ' 복사');
      else copyText(['중개사무소\t중개사\t휴대폰\t사무실\t주소'].concat(sorted.map(function (a) {
        return [a.name, a.agent || '', mobilesOf([a]).join(' / '), a.tel || '', a.addr || ''].join('\t');
      })).join('\n'), '중개사 ' + sorted.length + '곳 표를 복사했습니다. 엑셀에 붙여넣으세요.');
    });
    var q = opened.body.querySelector('#ag-q');
    q.addEventListener('input', function () {
      var v = q.value.trim().toLowerCase();
      Array.prototype.forEach.call(opened.body.querySelectorAll('#ag-rows tr'), function (tr) {
        tr.hidden = !!v && tr.getAttribute('data-k').indexOf(v) < 0;
      });
    });
  }

  function smsSet() {
    var s = S.get().settings.saleSms || {};
    return {
      senderPhone: s.senderPhone || '010-8550-2669',
      consultPhone: s.consultPhone || '010-6419-0759',
      company: s.company || '주식회사 옆커폰',
      hours: s.hours || '09:00~18:00',
      ownerName: s.ownerName || '문성혁',
      ownerCarrier: s.ownerCarrier || 'SKT',
      ownerPhone: s.ownerPhone || '010-2076-4155'
    };
  }

  /** 개인 소유 매물인지 — 매물에 정해 둔 값이 먼저, 없으면 연결된 건물의 명의로 판단한다.
      지사장님 보유분 · 거래 완료(이전 · 매각)는 소유자가 다르므로 넣지 않는다. */
  function isPersonal(it) {
    if (it.ownerType) return it.ownerType === '개인';
    if (it.status === '지사장님 보유' || it.status === '거래 완료') return false;
    var b = S.building(it.buildingId || ITEM_BUILDING[it.id]);
    return !!b && b.owner === '개인';
  }
  // 중개사들이 자주 묻는 소유자 성함 · 통신사 · 연락처 (개인 소유만)
  function ownerLines(it) {
    if (!isPersonal(it)) return [];
    var set = smsSet();
    return ['- 소유자 : ' + set.ownerName, '- 소유자 연락처 : ' + set.ownerPhone + ' (' + set.ownerCarrier + ')'];
  }

  /** 750000000 → '7억 5,000만원' */
  function wonKo(v) {
    v = Math.round(U.num(v));
    if (!v) return '';
    var eok = Math.floor(v / 100000000), man = Math.round((v % 100000000) / 10000);
    return ((eok ? eok + '억' : '') + (man ? ' ' + U.comma(man) + '만' : '')).trim() + '원';
  }
  function priceOf(it) { return it.priceText || wonKo(it.price) || '-'; }
  function lines(text) {
    return String(text || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  }
  function bullets(text) {
    return lines(text).map(function (l) { return /^[-*※<]/.test(l) ? l : '- ' + l; }).join('\n');
  }

  /* ---------- 문구 생성 ---------- */
  function message(it) {
    var set = smsSet();
    var consult = '- 자세한 내용 상담 : ' + set.consultPhone;
    var L = [];
    if (it.kind === 'lodging') {
      L.push('안녕하세요, 소장님.', '');
      L.push('숙박업(펜션/모텔/호텔) 매도 물건을 보유하고 있어 안내드립니다.');
      L.push('매수 고객이 있으시거나 관심 있으시면 언제든 연락 부탁드립니다.', '');
      L.push('중개보수는 협의 가능합니다.', '');
      L.push('상호 : ' + (it.unit || it.name));
      if (it.address) L.push('주소지 : ' + it.address);
      if (it.structure) L.push('업종 : ' + it.structure);
      if (it.rooms) L.push('객실 수 : ' + it.rooms);
      if (it.appraisal) L.push('감정가 : ' + it.appraisal);
      L.push('매매가 : ' + priceOf(it));
      if (it.prevPrice) L.push('※ 가격 조정 : ' + it.prevPrice + ' → ' + priceOf(it));
      if (it.sales) L.push(it.sales);
      lines(it.highlights).forEach(function (l) { L.push(l); });
      L.push('자료 요청 시 제공가능', '');
      ownerLines(it).forEach(function (l) { L.push(l.slice(2)); });
      L.push('자세한 내용 상담 : ' + set.consultPhone, '');
      L.push('좋은 거래가 될 수 있도록 성실히 협조드리겠습니다.');
      L.push('감사합니다.');
      return L.join('\n');
    }
    if (it.kind === 'lease') return leaseMessage([it]);

    L.push('소장님 안녕하세요.', '');
    L.push((it.title || it.name) + ' 매도 진행 요청드립니다.', '');
    L.push('■ 물건 정보');
    L.push('- 건물명 : ' + (it.unit || it.name));
    if (it.address) L.push('- 주소 : ' + it.address);
    if (it.area) L.push('- 면적 : ' + it.area);
    if (it.structure) L.push('- 구성 : ' + it.structure);
    L.push('- 매도가 : ' + priceOf(it));
    if (it.prevPrice) L.push('  ※ 가격 조정 : ' + it.prevPrice + ' → ' + priceOf(it));
    if (lines(it.lease).length) { L.push('', '■ 임대차 현황'); L.push(bullets(it.lease)); }
    if (lines(it.highlights).length) { L.push('', '■ 특이사항'); L.push(bullets(it.highlights)); }
    if (ownerLines(it).length) { L.push('', '■ 소유자 정보'); ownerLines(it).forEach(function (l) { L.push(l); }); }
    L.push('', '■ 안내');
    L.push('- 가능시간 : ' + set.hours);
    L.push(consult, '');
    L.push('※ 매매 물건이 많아 전화 응대가 어려운 경우가 많습니다.');
    L.push('  문자로 먼저 연락 주시면 확인 후 회신드리겠습니다.', '');
    L.push('빠른 진행 부탁드립니다. 감사합니다.');
    return L.join('\n');
  }

  /** 상가 임대 — 여러 물건을 번호를 붙여 한 문자로 묶는다 */
  function leaseMessage(list) {
    var set = smsSet();
    var L = ['안녕하세요 소장님', set.company + ' 부동산 담당자입니다.', '법인소유물건 상가 임대 부탁드립니다.', ''];
    list.forEach(function (it, i) {
      L.push('<' + (list.length > 1 ? (i + 1) + '번 물건 · ' : '') + (it.unit || it.name) + '>');
      if (it.address) L.push('주소 : ' + it.address);
      if (it.area) L.push('면적 : ' + it.area);
      lines(it.lease).forEach(function (l) { L.push(l); });
      L.push('임대료 : ' + priceOf(it));
      lines(it.highlights).forEach(function (l) { L.push(l); });
      ownerLines(it).forEach(function (l) { L.push(l.slice(2)); });
      L.push('');
    });

  function copyText(text, okMsg) {
    function done(ok) { UI.toast(ok ? (okMsg || '문자를 복사했습니다. 휴대폰 문자에 붙여넣으세요.') : '복사가 막혀 있습니다. 글자를 길게 눌러 직접 복사해 주세요.', ok ? 'ok' : 'err'); }
    function fallback() {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      t.remove(); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    else fallback();
  }
