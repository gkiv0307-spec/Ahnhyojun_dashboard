      smGen: function (id) { var it = item(id); if (!it) return; state.gen[id] = message(it); App.router.refresh(); },
      smGenLease: function () {
        state.gen.__lease = leaseMessage(items().filter(function (it) { return it.kind === 'lease' && ACTIVE[it.status]; }));
        App.router.refresh();
      },
      smCopy: function (id, target) { copyText(target.closest('.sm-msg').querySelector('textarea').value); },
      smLog: function (id) { var it = item(id); if (it) logForm(it, null); },
      smLogView: function (id) {
        var l = logs().filter(function (x) { return x.id === id; })[0];
        if (!l) return;
        var it = item(l.itemId);
        UI.open({
          title: (it ? it.name + ' · ' : '') + U.fmtDate(l.date) + ' 발송 문자',
          body: '<div class="t-dim" style="font-size:12px;margin-bottom:8px">' + U.esc(l.method || '') + (l.count ? ' · ' + U.comma(l.count) + '곳' : '') + '</div>' +
            '<div class="sm-msg"><textarea class="nt-text" readonly rows="' + Math.min(28, l.text.split('\n').length + 1) + '">' + U.esc(l.text) + '</textarea></div>',
          buttons: [{ label: '닫기', onClick: UI.close }, { label: '문자 복사', className: 'btn-primary', onClick: function () { copyText(l.text); } }]
        });
      },
      smLogEdit: function (id) {
        var l = logs().filter(function (x) { return x.id === id; })[0];
        if (l) logForm(item(l.itemId), l);
      },
      smSet: function () {
        var set = smsSet();
        UI.form({
          title: '매도 문자 번호 · 문구 설정', values: set,
          fields: [
            { name: 'senderPhone', label: '발송 번호 (문자 보내는 휴대폰)', required: true },
            { name: 'consultPhone', label: '문자 속 상담 번호', required: true, hint: '"자세한 내용 상담 : 번호" 줄로 들어갑니다' },
            { name: 'company', label: '회사명 (상가 임대 문자 첫 줄)' },
            { name: 'hours', label: '안내 가능 시간' },
            { name: 'ownerName', label: '소유자 성함 (개인 소유 문자)', hint: '개인 소유 매물 문자에만 들어갑니다 · 법인 물건은 제외' },
            { name: 'ownerPhone', label: '소유자 연락처' },
            { name: 'ownerCarrier', label: '소유자 통신사', placeholder: 'SKT · KT · LG U+' }
          ],
          onSubmit: function (v) {
            S.updateSettings({ saleSms: v });
            state.gen = {};
            UI.toast('설정을 저장했습니다. 문구를 다시 생성하세요.', 'ok');
            App.router.refresh();
          }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 자금일보 확인 — 「부동산 자금일보 보고양식」 구글 시트를 15일 단위로 읽어
   주택 · 상가 월세 입금을 찾아 장부에 넣는다.
   계좌 · 키워드 규칙으로 계약을 찾고, 담당자가 확인한 건만 반영한다.
   반영한 입금에는 '통장 확인 · 자금일보' 메모가 붙어 드라이브 관리표가 덮어쓰지 않는다. */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var DEFAULT_FILE = '1oZhlvCxenuM8LNQ4XoSrwa1zOPJMbTYHmqZVyi8Fvmk';
  var DEFAULT_RULES = [
    { account: '신한(성주)', keyword: '', contractId: 'c_seongju_202' }
  ];

  var state = { period: null, busy: false, error: '', rows: null, plan: null, pick: {} };

  function conf() {
    var j = S.get().settings.jagum || {};
    return { fileId: j.fileId || DEFAULT_FILE, rules: j.rules || DEFAULT_RULES, done: j.done || [], lastImport: j.lastImport || '' };
  }
  function saveConf(patch) { S.updateSettings({ jagum: Object.assign(conf(), patch) }); }

  /* ---------- 15일 단위 기간 ---------- */
  function periodOf(iso) {
    var ym = iso.slice(0, 7), d = Number(iso.slice(8, 10));
    var last = U.toISO(U.monthEnd(ym));
    return d <= 15 ? { key: ym + '-A', from: ym + '-01', to: ym + '-15', label: Number(ym.slice(5)) + '월 1~15일' }
                   : { key: ym + '-B', from: ym + '-16', to: last, label: Number(ym.slice(5)) + '월 16~' + Number(last.slice(8)) + '일' };
  }
  /** 다 지난 가장 최근 기간 */
  function lastClosed() { var cur = periodOf(U.todayISO()); return periodOf(U.addDays(cur.from, -1)); }
  function recentPeriods(n) {
    var out = [], p = lastClosed();
    for (var i = 0; i < n; i++) { out.push(p); p = periodOf(U.addDays(p.from, -1)); }
    return out;
  }
  function isDone(key) { return conf().done.indexOf(key) >= 0; }
  /** 아직 확인하지 않은 지난 기간 (대시보드 알림용) */
  function pending() {
    var p = lastClosed();
    return isDone(p.key) ? null : p;
  }

  /* ---------- 시트 읽기 ---------- */
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = XLSX_URL; s.onload = function () { res(window.XLSX); };
      s.onerror = function () { rej({ code: 'lib', message: '엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.' }); };
      document.head.appendChild(s);
    });
  }

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /** 기간에 해당하는 "M월 D일" 시트의 행을 모은다 */
  function readRows(wb, p) {
    var rows = [], year = p.from.slice(0, 4);
    wb.SheetNames.forEach(function (name) {
      var m = /^(\d{1,2})월\s*(\d{1,2})일$/.exec(name.trim());
      if (!m) return;
      var iso = year + '-' + U.pad2(Number(m[1])) + '-' + U.pad2(Number(m[2]));
      if (iso < p.from || iso > p.to) return;
      var data = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
      var col = null;
      data.forEach(function (r) {
        var cells = r.map(function (c) { return typeof c === 'string' ? c.trim() : c; });
        if (!col) {
          var ai = cells.indexOf('계좌');
          if (ai >= 0 && cells.indexOf('사유') >= 0) col = { acc: ai, who: cells.indexOf('거래처'), in: cells.indexOf('입금금액'), out: cells.indexOf('출금금액'), why: cells.indexOf('사유') };
          return;
        }
        var acc = String(cells[col.acc] || '');
        if (!acc) return;
        var inAmt = U.num(cells[col.in]), outAmt = U.num(cells[col.out]);
        if (!inAmt && !outAmt) return;
        rows.push({ date: iso, account: acc, who: String(cells[col.who] || ''), inAmt: inAmt, outAmt: outAmt, why: String(cells[col.why] || '') });
      });
    });
    return rows.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  /* ---------- 계약 · 청구서 맞추기 ---------- */
  function ruleFor(r) {
    var rules = conf().rules;
    for (var i = 0; i < rules.length; i++) {
      var x = rules[i];
      if (x.account && x.account !== r.account) continue;
      if (x.keyword && (r.who + ' ' + r.why).indexOf(x.keyword) < 0) continue;
      if (S.contract(x.contractId)) return x;
    }
    return null;
  }

  function targetInvoice(c, r, taken) {
    var invs = S.get().invoices.filter(function (i) { return i.contractId === c.id; })
      .sort(function (a, b) { return a.ym < b.ym ? -1 : 1; });
    var limit = U.addDays(r.date, 20);
    for (var i = 0; i < invs.length; i++) {
      var inv = invs[i];
      var rest = B.remaining(inv) - (taken[inv.id] || 0);
      if (rest > 0 && inv.dueDate <= limit) return { inv: inv, ym: inv.ym };
    }
    // 청구서가 없으면 입금한 달(이미 있으면 그다음 달) 청구서를 새로 만든다
    var ym = r.date.slice(0, 7);
    while (S.invoiceOf(c.id, ym)) ym = U.addMonths(ym, 1);
    return { inv: null, ym: ym };
  }

  function buildPlan(rows) {
    var rules = conf().rules, ruleAcc = {};
    rules.forEach(function (x) { if (x.account) ruleAcc[x.account] = true; });
    var plan = { pays: [], notes: [] }, taken = {};
    rows.forEach(function (r) {
      var rule = r.inAmt > 0 ? ruleFor(r) : null;
      if (rule) {
        var c = S.contract(rule.contractId);
        var dup = S.get().invoices.some(function (i) {
          return i.contractId === c.id && (i.payments || []).some(function (p) { return p.date === r.date && U.num(p.amount) === r.inAmt; });
        }) || (c.receipts || []).some(function (p) { return p.date === r.date && U.num(p.amount) === r.inAmt; });
        // 청구서를 만들지 않는 계약은 입금만 기록한다
        var t = (dup || c.noBilling) ? { inv: null, ym: '' } : targetInvoice(c, r, taken);
        if (t.inv) taken[t.inv.id] = (taken[t.inv.id] || 0) + r.inAmt;
        plan.pays.push({ key: [r.date, r.account, r.who, r.inAmt].join('|'), row: r, contract: c, inv: t.inv, ym: t.ym, dup: dup });
        return;
      }
      if (ruleAcc[r.account]) plan.notes.push(r);   // 참고는 규칙에 있는 계좌의 다른 입출금만
    });
    return plan;
  }

  function check(p) {
    var cf = conf();
    if (!App.drive || App.drive.status() !== 'ready' || !App.drive.download) {
      state.error = '이 화면에서는 구글 드라이브 연동을 쓸 수 없습니다. claude.ai에서 대시보드를 열어 주세요.';
      App.router.refresh(); return;
    }
    state.busy = true; state.error = ''; state.plan = null; state.period = p; App.router.refresh();
    Promise.all([loadXLSX(), App.drive.download(cf.fileId, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')])
      .then(function (r) {
        var wb = window.XLSX.read(b64ToBytes(r[1]), { type: 'array' });
        state.rows = readRows(wb, p);
        state.plan = buildPlan(state.rows);
        state.pick = {};
        state.plan.pays.forEach(function (x) { if (!x.dup) state.pick[x.key] = true; });
      })
      .catch(function (err) { state.error = (App.drive.explain ? App.drive.explain(err) : '') || (err && err.message) || '시트를 읽지 못했습니다.'; })
      .then(function () { state.busy = false; App.router.refresh(); });
  }

  /** [가져오기] — 확인하지 않은 지난 기간과 이번 기간(어제까지)을 한 번에 읽어 바로 장부에 넣는다 */
  function importAll() {
    var cf = conf();
    if (!App.drive || App.drive.status() !== 'ready' || !App.drive.download) {
      state.error = '이 화면에서는 구글 드라이브 연동을 쓸 수 없습니다. claude.ai에서 대시보드를 열어 주세요.';
      App.router.go('jagum'); App.router.refresh(); return;
    }
    var periods = recentPeriods(6).filter(function (p) { return !isDone(p.key); }).reverse();
    var cur = periodOf(U.todayISO());
    periods.push({ key: cur.key, from: cur.from, to: U.addDays(U.todayISO(), -1), label: cur.label.replace(/~\d+일$/, '~' + Number(U.addDays(U.todayISO(), -1).slice(8)) + '일') + ' (진행 중)', open: true });
    periods = periods.filter(function (p) { return p.from <= p.to; });
    state.busy = true; state.error = ''; state.plan = null; state.result = null; state.period = null;
    if (App.router.current() !== 'jagum') App.router.go('jagum'); else App.router.refresh();
    Promise.all([loadXLSX(), App.drive.download(cf.fileId, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')])
      .then(function (r) {
        var wb = window.XLSX.read(b64ToBytes(r[1]), { type: 'array' });
        var res = { added: [], notes: [], periods: [], rows: 0 }, done = conf().done.slice();
        periods.forEach(function (p) {
          var rows = readRows(wb, p), plan = buildPlan(rows);
          res.rows += rows.length;
          res.added = res.added.concat(writePays(plan, null));
          res.notes = res.notes.concat(plan.notes);
          res.periods.push(p.label);
          if (!p.open && done.indexOf(p.key) < 0) done.push(p.key);
        });
        saveConf({ done: done, lastImport: new Date().toISOString() });
        S.commit();
        state.result = res;
        UI.toast(res.added.length ? '입금 ' + res.added.length + '건을 장부에 넣었습니다.' : '새로 넣을 입금이 없습니다.', 'ok');
      })
      .catch(function (err) { state.error = (App.drive.explain ? App.drive.explain(err) : '') || (err && err.message) || '시트를 읽지 못했습니다.'; })
      .then(function () { state.busy = false; App.router.refresh(); });
  }

  /** 계획의 입금을 장부에 넣는다. pick이 없으면 이미 넣은 건을 뺀 전부를 넣는다 */
  function writePays(plan, pick) {
    var st = S.get(), added = [];
    (plan ? plan.pays : []).forEach(function (x) {
      if (x.dup || (pick && !pick[x.key])) return;
      var c = x.contract;
      var memo = '통장 확인 · 자금일보 ' + x.row.account + ' · 입금자 ' + x.row.who + (x.row.why ? ' · ' + x.row.why : '');
      if (c.noBilling) {
        c.receipts = c.receipts || [];
        c.receipts.push({ id: U.uid('rcp'), date: x.row.date, amount: x.row.inAmt, method: '계좌이체', memo: memo });
        added.push({ row: x.row, contract: c, ym: '' });
        return;
      }
      var inv = x.inv || S.invoiceOf(c.id, x.ym);
      if (!inv) {
        var amount = U.num(c.rent) + U.num(c.maintenanceFee);
        inv = { id: U.uid('inv'), contractId: c.id, unitId: c.unitId, ym: x.ym, dueDate: U.dueDateOf(x.ym, c.payDay),
                rent: U.num(c.rent), maintenanceFee: U.num(c.maintenanceFee), extras: [], payments: [], prorated: false,
                total: amount, memo: '자금일보에서 만듦', createdAt: U.todayISO() };
        st.invoices.push(inv);
      }
      inv.payments.push({ id: U.uid('pay'), date: x.row.date, amount: x.row.inAmt, method: '계좌이체', memo: memo });
      added.push({ row: x.row, contract: c, ym: inv.ym });
    });
    return added;
  }

  function apply() {
    var n = writePays(state.plan, state.pick).length;
    var done = conf().done.slice();
    if (state.period && done.indexOf(state.period.key) < 0) done.push(state.period.key);
    saveConf({ done: done });
    S.commit();
    UI.toast(n ? '입금 ' + n + '건을 장부에 넣었습니다.' : '확인 완료로 표시했습니다.', 'ok');
    state.plan = null; state.rows = null;
    App.router.refresh();
  }

  /* ---------- 화면 ---------- */
  function contractLabel(c) { return c ? S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') : '(계약 없음)'; }

  function periodsHTML() {
    return '<div class="row" style="gap:6px;flex-wrap:wrap">' + recentPeriods(6).map(function (p) {
      var on = state.period && state.period.key === p.key;
      return '<button class="btn btn-sm' + (on ? ' btn-primary' : '') + '" data-act="jgCheck" data-id="' + p.key + '">' +
        p.label + (isDone(p.key) ? ' ✓' : '') + '</button>';
    }).join('') + '</div>';
  }

  function resultHTML() {
    var r = state.result;
    if (!r) return '';
    var rows = r.added.map(function (x) {
      return { cells: [U.fmtDate(x.row.date), U.esc(x.row.account), U.esc(x.row.who), '<b>' + U.comma(x.row.inAmt) + '</b>',
        '<span style="white-space:normal">' + U.esc(contractLabel(x.contract)) + '</span>', x.ym ? U.fmtMonth(x.ym) + '분' : '입금 기록',
        '<span class="t-dim" style="white-space:normal;font-size:12px">' + U.esc(x.row.why) + '</span>'] };
    });
    var notes = r.notes.map(function (n) {
      return { cells: [U.fmtDate(n.date), U.esc(n.account), U.esc(n.who), n.inAmt ? U.comma(n.inAmt) : '', n.outAmt ? U.comma(n.outAmt) : '',
        '<span class="t-dim" style="white-space:normal;font-size:12px">' + U.esc(n.why) + '</span>'] };
    });
    return UI.card('가져오기 결과 · 장부에 넣은 입금 ' + r.added.length + '건',
        (rows.length ? UI.table(['날짜', '계좌', '입금자', { label: '금액', className: 'num' }, '계약', '넣은 곳', '자금일보 사유'], rows)
          : UI.empty('새로 넣을 입금이 없습니다', '규칙에 맞는 입금이 모두 이미 장부에 있습니다.')) +
        '<div class="t-faint" style="font-size:12px;padding:8px 16px">읽은 기간: ' + U.esc(r.periods.join(', ')) + ' · 자금일보 ' + U.comma(r.rows) + '줄</div>', '', true) +
      (notes.length ? '<div style="margin-top:16px">' + UI.card('참고 · 장부에 넣지 않은 내역 ' + notes.length + '건',
        UI.table(['날짜', '계좌', '거래처', { label: '입금', className: 'num' }, { label: '출금', className: 'num' }, '사유'], notes), '', true) + '</div>' : '');
  }

  function planHTML() {
    if (state.busy) return UI.card('', '<div class="t-dim">자금일보 시트를 읽는 중입니다… (파일이 커서 10~20초 걸릴 수 있습니다)</div>');
    if (state.error) return UI.card('', '<div style="color:var(--danger)"><b>읽지 못했습니다.</b> ' + U.esc(state.error) + '</div>');
    if (!state.plan) return resultHTML();
    var p = state.plan, per = state.period;
    var rows = p.pays.map(function (x) {
      var target = x.dup ? '<span class="badge badge-ok">이미 반영됨</span>'
        : x.contract.noBilling ? '입금 기록만 <span class="t-faint">(청구서 없음)</span>'
        : (x.inv ? U.fmtMonth(x.inv.ym) + '분' : U.fmtMonth(x.ym) + '분 <span class="t-faint">(청구서 새로 만듦)</span>');
      return { cells: [
        x.dup ? '' : '<input type="checkbox" class="jg-pick" data-key="' + U.esc(x.key) + '"' + (state.pick[x.key] ? ' checked' : '') + '>',
        U.fmtDate(x.row.date), U.esc(x.row.account), U.esc(x.row.who), '<b>' + U.comma(x.row.inAmt) + '</b>',
        '<span style="white-space:normal">' + U.esc(contractLabel(x.contract)) + '</span>', target,
        '<span class="t-dim" style="white-space:normal;font-size:12px">' + U.esc(x.row.why) + '</span>'
      ] };
    });
    var newN = p.pays.filter(function (x) { return !x.dup; }).length;
    var payCard = UI.card(per.label + ' · 월세 입금 ' + p.pays.length + '건',
      rows.length ? UI.table(['', '날짜', '계좌', '입금자', { label: '금액', className: 'num' }, '계약', '넣을 곳', '자금일보 사유'], rows)
        : UI.empty('이 기간에 규칙에 맞는 월세 입금이 없습니다', '아래 참고 내역을 보고 필요하면 규칙을 추가하세요.'),
      '<button class="btn btn-sm btn-primary" data-act="jgApply">' + (newN ? '선택한 입금 장부에 넣기' : '확인 완료로 표시') + '</button>', true);
    var noteRows = p.notes.map(function (r) {
      return { cells: [U.fmtDate(r.date), U.esc(r.account), U.esc(r.who),
        r.inAmt ? U.comma(r.inAmt) : '', r.outAmt ? U.comma(r.outAmt) : '',
        '<span class="t-dim" style="white-space:normal;font-size:12px">' + U.esc(r.why) + '</span>'] };
    });
    var noteCard = UI.card('참고 · 장부에 넣지 않는 내역 ' + p.notes.length + '건',
      noteRows.length ? UI.table(['날짜', '계좌', '거래처', { label: '입금', className: 'num' }, { label: '출금', className: 'num' }, '사유'], noteRows)
        : UI.empty('참고할 내역이 없습니다', ''), '<span class="t-faint" style="font-size:12px">규칙에 있는 계좌의 다른 입출금 · 메모만</span>', true);
    return payCard + '<div style="margin-top:16px">' + noteCard + '</div>' +
      '<div class="t-faint" style="font-size:12px;margin-top:8px">자금일보 ' + U.comma(state.rows.length) + '줄을 읽었습니다.</div>';
  }

  function rulesHTML() {
    var cf = conf();
    var rows = cf.rules.map(function (x, i) {
      return { cells: [U.esc(x.account || '(모든 계좌)'), U.esc(x.keyword || '(전부)'), '<span style="white-space:normal">' + U.esc(contractLabel(S.contract(x.contractId))) + '</span>',
        '<button class="btn btn-sm btn-ghost" data-act="jgRuleDel" data-id="' + i + '">삭제</button>'] };
    });
    return UI.card('입금 → 계약 연결 규칙', UI.table(['자금일보 계좌', '거래처·사유에 들어간 말', '넣을 계약', ''], rows),
      '<button class="btn btn-sm" data-act="jgRuleAdd">+ 규칙 추가</button><button class="btn btn-sm" data-act="jgFile">시트 바꾸기</button>', true);
  }

  function render(el) {
    var cf = conf(), pend = pending();
    var head = '<div class="card"><div class="card-body">' +
      '<div class="row" style="margin-bottom:12px;gap:12px"><button class="btn btn-primary" data-act="jgImport"' + (state.busy ? ' disabled' : '') + '>자금일보 가져오기</button>' +
      '<span>누르면 확인하지 않은 기간과 이번 기간(어제까지)의 월세 입금이 <b>자동으로 장부에 들어갑니다.</b></span> ' +
      (pend ? '<span class="badge badge-warn">' + pend.label + ' 확인 전</span>' : '<span class="badge badge-ok">최근 기간 확인 완료</span>') +
      (cf.lastImport ? '<span class="t-faint" style="font-size:12px">마지막 가져오기 ' + U.fmtDate(cf.lastImport.slice(0, 10)) + '</span>' : '') + '</div>' +
      '<div class="t-faint" style="font-size:12px">시트: <a href="https://docs.google.com/spreadsheets/d/' + U.esc(cf.fileId) + '/edit" target="_blank" rel="noopener">부동산 자금일보 보고양식</a> · 규칙에 맞는 입금만 장부에 넣고(이미 넣은 입금은 다시 넣지 않음), 나머지는 가져오기 결과에 참고로만 보여줍니다.</div>' +
      '</div></div>';
    el.innerHTML = head + '<div style="margin-top:16px">' + planHTML() + '</div>' + '<div style="margin-top:16px">' + rulesHTML() + '</div>';
    Array.prototype.forEach.call(el.querySelectorAll('.jg-pick'), function (cb) {
      cb.addEventListener('change', function () { state.pick[cb.getAttribute('data-key')] = cb.checked; });
    });
  }

  function contractOptions() {
    return S.activeContracts(U.todayISO(), true).map(function (c) { return { value: c.id, label: contractLabel(c) }; })
      .sort(function (a, b) { return a.label < b.label ? -1 : 1; });
  }

  App.views.jagum = {
    title: '자금일보 확인',
    desc: '부동산 자금일보 시트를 15일 단위로 읽어 월세 입금을 장부에 넣습니다.',
    render: render,
    pending: pending,
    _readRows: readRows, _buildPlan: buildPlan, _periodOf: periodOf,
    handlers: {
      jgCheck: function (key) {
        var p = recentPeriods(6).filter(function (x) { return x.key === key; })[0];
        if (p) { state.result = null; check(p); }
      },
      jgApply: function () { apply(); },
      jgImport: function () { if (!state.busy) importAll(); },
      jgRuleDel: function (i) {
        var rules = conf().rules.slice(); rules.splice(Number(i), 1);
        saveConf({ rules: rules }); App.router.refresh();
      },
      jgRuleAdd: function () {
        UI.form({
          title: '입금 → 계약 연결 규칙 추가',
          fields: [
            { name: 'account', label: '자금일보 계좌 표시명', placeholder: '예) 신한(성주) · 비우면 모든 계좌', full: true },
            { name: 'keyword', label: '거래처·사유에 들어간 말', placeholder: '비우면 그 계좌 입금 전부', full: true },
            { name: 'contractId', label: '넣을 계약', type: 'select', options: contractOptions(), required: true, full: true }
          ],
          onSubmit: function (v) {
            saveConf({ rules: conf().rules.concat([v]) });
            if (state.rows) state.plan = buildPlan(state.rows);
            UI.toast('규칙을 추가했습니다.', 'ok'); App.router.refresh();
          }
        });
      },
      jgFile: function () {
        UI.form({
          title: '자금일보 시트 바꾸기', values: { fileId: conf().fileId },
          fields: [{ name: 'fileId', label: '구글 시트 파일 ID', required: true, full: true, hint: '시트 주소의 /d/ 와 /edit 사이 글자' }],
          onSubmit: function (v) { saveConf({ fileId: v.fileId.trim() }); App.router.refresh(); }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 계약 만기 · 연장 — 묵시적 갱신을 막기 위해 만기 전 통지 기한을 챙긴다.
   주택(주택임대차보호법 6조): 임대인은 만기 6개월 전 ~ 2개월 전에 갱신 거절이나 조건 변경을 통지해야 한다.
     통지가 없으면 같은 조건으로 2년 묵시적 갱신 — 임차인은 언제든 해지 통지(3개월 뒤 효력), 임대인은 못 한다.
   상가(상가건물임대차보호법 10조): 6개월 전 ~ 1개월 전, 통지 없으면 1년 묵시적 갱신.
   결정 · 통지 기록은 계약의 renewal 필드에 남는다. */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var state = { tab: 'todo' };
  var DECISIONS = ['', '연장 (같은 조건)', '연장 (조건 변경)', '종료 (갱신 거절)', '임차인 퇴실 예정'];
  var METHODS = ['', '문자', '전화', '문자 + 전화', '내용증명', '카카오톡', '대면'];

  function isCommercial(c) {
    var u = S.unit(c.unitId) || {}, b = S.building(u.buildingId) || {};
    return b.kind === '상가' || u.type === '상가';
  }

  /** 계약의 현재 만기와 통지 기한을 계산한다 */
  function info(c) {
    var today = U.todayISO(), com = isCommercial(c);
    var cycleYears = com ? 1 : 2, lastNoticeMonths = com ? 1 : 2;
    var end = c.endDate, implied = false, origEnd = '';
    if (!end) {
      var m = /원 계약 \d{4}-\d\d-\d\d ~ (\d{4}-\d\d-\d\d)/.exec(c.memo || '');
      if (m) {
        origEnd = m[1]; end = origEnd; implied = true;
        while (end < today) end = U.addDays(U.addMonthsDate(U.addDays(end, 1), cycleYears * 12), -1);
      }
    }
    if (!end) return { c: c, com: com, unknown: true, stage: 'unknown', r: c.renewal || {} };
    var nStart = U.addMonthsDate(end, -6), nEnd = U.addMonthsDate(end, -lastNoticeMonths);
    var r = c.renewal || {};
    var decided = !!r.decision, notified = !!r.notifiedAt;
    var stage;
    if (decided && notified) stage = 'done';
    else if (today < nStart) stage = 'wait';
    else if (today <= nEnd) stage = 'window';
    else stage = 'late';
    return { c: c, com: com, end: end, implied: implied, origEnd: origEnd, nStart: nStart, nEnd: nEnd,
             dEnd: U.diffDays(today, end), dDeadline: U.diffDays(today, nEnd), stage: stage, r: r,
             cycleYears: cycleYears, lastNoticeMonths: lastNoticeMonths };
  }

  function collect() {
    var today = U.todayISO();
    return S.activeContracts(today).filter(function (c) {
      var u = S.unit(c.unitId);
      if (!u || S.isDisposed(u.buildingId) || U.num(c.rent) + U.num(c.maintenanceFee) + U.num(c.deposit) <= 0) return false;
      // 다음 임차인 계약(승계 · 재계약)이 이미 있으면 정리된 것으로 본다
      return !S.contractsOfUnit(c.unitId).some(function (o) { return o.id !== c.id && o.startDate > c.startDate; });
    }).map(info);
  }

  /** 대시보드용 — 통지 기간에 들었거나 기한이 지났는데 아직 결정 · 통지가 없는 계약 */
  function summary() {
    var list = collect();
    var win = list.filter(function (x) { return x.stage === 'window'; });
    var late = list.filter(function (x) { return x.stage === 'late'; });
    var soon = win.filter(function (x) { return x.dDeadline <= 30; });
    return { window: win.length, late: late.length, soon: soon.length, list: win.concat(late) };
  }

  var STAGE = {
    late: { label: '통지 기한 지남', badge: 'badge-danger' },
    window: { label: '지금 통지할 때', badge: 'badge-warn' },
    wait: { label: '통지 기간 전', badge: 'badge-muted' },
    done: { label: '결정 · 통지 완료', badge: 'badge-ok' },
    unknown: { label: '만기 확인 필요', badge: 'badge-muted' }
  };

  function place(c) { return S.unitLabel(c.unitId); }

  /** 이 계약의 연체(납부일이 지난 미납) */
  function arrears(c) {
    var today = U.todayISO(), B = App.billing;
    var list = S.get().invoices.filter(function (i) { return i.contractId === c.id && i.dueDate < today && B.remaining(i) > 0; });
    return { months: list.length, amount: U.sum(list, B.remaining) };
  }
  function arrearsHTML(c) {
    var a = arrears(c);
    return a.months
      ? '<span class="badge badge-danger" style="font-size:10.5px">연체 ' + a.months + '개월 · ' + U.wonShort(a.amount) + '</span>'
      : '<span class="badge badge-ok" style="font-size:10.5px">연체 없음</span>';
  }

  function rowHTML(x) {
    var c = x.c, s = STAGE[x.stage], r = x.r;
    var due = x.unknown ? '<span class="t-faint">계약서의 만기일을 계약에 넣어 주세요</span>'
      : (x.stage === 'wait' ? U.fmtDate(x.nStart) + '부터 ' + U.fmtDate(x.nEnd) + '까지'
        : x.stage === 'window' ? '<b>' + U.fmtDate(x.nEnd) + '까지</b> (D-' + x.dDeadline + ')'
        : x.stage === 'late' ? '<span class="t-danger">' + U.fmtDate(x.nEnd) + ' 지남</span>' : U.fmtDate(x.nEnd));
    var endTxt = x.unknown ? '<span class="t-faint">종료일 없음</span>'
      : U.fmtDate(x.end) + ' <span class="t-faint">(D-' + x.dEnd + ')</span>' +
        (x.implied ? '<div class="t-faint" style="font-size:11px">원 계약 ' + U.fmtDate(x.origEnd) + ' 만료 → 묵시적 갱신 ' + x.cycleYears + '년 단위</div>' : '');
    var dec = r.decision ? '<b>' + U.esc(r.decision) + '</b>' + (r.notifiedAt ? '<div class="t-faint" style="font-size:11px">' + U.fmtDate(r.notifiedAt) + ' ' + U.esc(r.method || '') + ' 통지</div>' : '<div class="t-danger" style="font-size:11px">아직 통지 안 함</div>')
      : '<span class="t-faint">미정</span>';
    return { cells: [
      '<b>' + U.esc(place(c)) + '</b><div class="t-faint" style="font-size:12px">' + App.views.notices.tenantLink(c) + (x.com ? ' · 상가' : '') +
        (c.tenantPhone ? ' · <a href="#/renewal" data-act="rnPhone" data-id="' + U.esc(c.id) + '" title="번호 복사">' + U.esc(U.phone(c.tenantPhone)) + ' 📋</a>' : ' · <span class="t-danger">연락처 없음</span>') + '</div>' +
        '<div style="margin-top:3px">' + arrearsHTML(c) + '</div>',
      '<span class="badge ' + s.badge + '">' + s.label + '</span>',
      '<span style="white-space:normal">' + endTxt + '</span>',
      '<span style="white-space:normal">' + due + '</span>',
      '<span style="white-space:normal">' + dec + (r.tenantIntent ? '<div class="t-faint" style="font-size:11px">임차인: ' + U.esc(r.tenantIntent) + '</div>' : '') +
        (function () { var l = lastSms(c); return l ? '<div style="font-size:11px"><a href="#/renewal" data-act="smsView" data-id="' + U.esc(l.id) + '">✉️ ' + U.fmtDate(l.sentAt) + ' ' + (KIND_LABEL[l.stage.replace('renewal-', '')] || '') + '</a></div>' : ''; })() + '</span>',
      sameCellHTML(x),
      '<button class="btn btn-sm" data-act="rnMsg" data-id="' + U.esc(c.id) + '">문자</button> ' +
      '<button class="btn btn-sm btn-primary" data-act="rnDecide" data-id="' + U.esc(c.id) + '">결정 기록</button>'
    ] };
  }

  function render(el) {
    var list = collect();
    var by = function (k) { return list.filter(function (x) { return x.stage === k; }); };
    var late = by('late'), win = by('window'), wait = by('wait'), done = by('done'), unk = by('unknown');
    var implied = list.filter(function (x) { return x.implied; });
    var same = list.filter(function (x) { return !x.unknown && isSame(x); });
    var renewed = renewedList();
    var TABS = [
      ['todo', '지금 할 일', late.length + win.length],
      ['same', '✅ 계약서 그대로 연장 체크', same.length],
      ['renewed', '연장 등록 완료', renewed.length],
      ['wait', '다가오는 만기 (1년 안)', wait.filter(function (x) { return x.dEnd <= 365; }).length],
      ['implied', '이미 묵시적 갱신 중', implied.length],
      ['done', '결정 · 통지 완료', done.length],
      ['unknown', '만기 확인 필요', unk.length]
    ];
    var rows;
    if (state.tab === 'todo') rows = late.concat(win);
    else if (state.tab === 'wait') rows = wait.filter(function (x) { return x.dEnd <= 365; });
    else if (state.tab === 'implied') rows = implied;
    else if (state.tab === 'done') rows = done;
    else if (state.tab === 'same') rows = same;
    else if (state.tab === 'renewed') rows = [];
    else rows = unk;
    rows.sort(function (a, b) { return (a.nEnd || '9') < (b.nEnd || '9') ? -1 : 1; });

    var guide = '<div class="card"><div class="card-body" style="font-size:13px;line-height:1.7">' +
      '<b>묵시적 갱신을 막으려면</b> 만기 <b>6개월 전 ~ 2개월 전</b>(상가는 1개월 전)까지 임차인에게 <b>연장 여부 · 조건 변경 · 종료</b>를 알려야 합니다. ' +
      '이 기간에 아무 말이 없으면 같은 조건으로 <b>주택 2년 · 상가 1년</b> 자동 연장되고, 그 뒤엔 임차인만 언제든 나갈 수 있습니다(3개월 뒤 효력). ' +
      '<span class="t-dim">통지는 문자로 하고 회신을 남겨 두세요. 종료(갱신 거절)는 내용증명이 안전합니다.</span> ' +
      '<span class="t-dim">계약서 내용 그대로 연장하기로 한 임차인은 줄 끝의 <b>“계약서 그대로 연장”</b>에 체크하고 1년 · 2년을 고른 뒤, 위의 <b>“체크한 계약 연장 등록”</b>을 누르면 기존 계약은 만기로 정리되고 같은 조건의 재계약이 한 번에 등록됩니다.</span></div></div>';
    var stats = '<div class="grid grid-4" style="margin-top:16px">' +
      UI.stat('통지 기한 지남', late.length + '건', '결정 · 통지 없이 기한이 지남', late.length ? 'danger' : '') +
      UI.stat('지금 통지할 때', win.length + '건', '6개월 전 ~ 기한 사이') +
      UI.stat('이미 묵시적 갱신 중', implied.length + '건', '종료일 없이 원 계약이 끝난 곳') +
      UI.stat('결정 · 통지 완료', done.length + '건', '') + '</div>';
    var chips = '<div class="chips" style="padding:0;margin:16px 0 10px;align-items:center">' + TABS.map(function (t) {
      return '<button class="chip' + (state.tab === t[0] ? ' active' : '') + '" data-act="rnTab" data-id="' + t[0] + '">' + t[1] + ' <span class="cnt">' + t[2] + '</span></button>';
    }).join('') +
      (same.length ? '<button class="btn btn-sm btn-primary" data-act="rnBulk" style="margin-left:auto">✅ 체크한 ' + same.length + '건 같은 조건으로 연장 등록</button>' : '') + '</div>';
    var table;
    if (state.tab === 'renewed') {
      table = renewed.length
        ? UI.card('', UI.table(['호실 · 임차인', '이전 계약 만기', '새 계약 기간', '등록일', ''], renewed.map(renewedRowHTML)), '', true)
        : UI.card('', UI.empty('연장 등록한 계약이 없습니다', '“계약서 그대로 연장”에 체크한 뒤 “체크한 계약 연장 등록”을 누르면 여기에 쌓입니다.'));
    } else if (state.tab === 'same') {
      table = rows.length
        ? '<div class="t-dim" style="font-size:12.5px;margin:0 0 10px">계약서 내용 그대로 연장하기로 한 임차인입니다. 기간(1년 · 2년)을 확인하고 위의 <b>연장 등록</b>을 누르면 기존 계약은 만기로 정리되고 같은 조건의 재계약이 등록됩니다.</div>' +
          UI.card('', UI.table(['호실 · 임차인', '상태', '만기', '통지 기한', '결정', '계약서 그대로 연장', ''], rows.map(rowHTML)), '', true)
        : UI.card('', UI.empty('체크한 계약이 없습니다', '다른 탭에서 줄 끝의 “계약서 그대로 연장”에 체크하세요.'));
    } else {
      table = rows.length ? UI.card('', UI.table(['호실 · 임차인', '상태', '만기', '통지 기한', '결정', '계약서 그대로 연장', ''], rows.map(rowHTML)), '', true)
        : UI.card('', UI.empty('해당하는 계약이 없습니다', state.tab === 'todo' ? '지금 통지해야 할 계약이 없습니다.' : ''));
    }
    el.innerHTML = guide + stats + chips + table;
    if (!el._rnBound) {
      el._rnBound = true;
      el.addEventListener('change', function (e) {
        var sel = e.target.closest ? e.target.closest('[data-rnmonths]') : null;
        if (!sel) return;
        var c = S.contract(sel.getAttribute('data-rnmonths'));
        if (!c) return;
        var r = c.renewal || {};
        r.sameMonths = Number(sel.value) || 12; r.updatedAt = U.todayISO();
        c.renewal = r; S.commit();
        UI.toast('연장 기간을 ' + termLabel(r.sameMonths) + '으로 바꿨습니다.', 'ok');
        App.router.refresh();
      });
    }
  }

  /* ---------- 문자 ---------- */
  function smsSign() {
    var s = S.get().settings.sms || {};
    return [s.sender || '주택관리 담당', s.phone].filter(Boolean).join(' ');
  }
  function md(iso) { var d = U.parseDate(iso); return d ? (d.getMonth() + 1) + '월 ' + d.getDate() + '일' : ''; }
  function ymd(iso) { var d = U.parseDate(iso); return d ? d.getFullYear() + '년 ' + md(iso) : ''; }
  /** 같은 조건 연장 — 새 계약 기간 계산 (기본: 원래 계약 기간과 같은 길이, 모르면 12개월) */
  function termMonths(c) {
    if (c.startDate && c.endDate) {
      var m = Math.round(U.diffDays(c.startDate, U.addDays(c.endDate, 1)) / 30.4);
      if (m >= 1 && m <= 36) return m;
    }
    return 12;
  }
  function newPeriod(x, months) {
    var start = U.addDays(x.end, 1);
    return { start: start, end: U.addDays(U.addMonthsDate(start, months), -1), months: months };
  }

  function message(x, kind, opt) {
    var c = x.c, r = x.r || {}, who = (c.tenantName || '임차인') + '님', end = x.end ? ymd(x.end) + '에' : '만기일에';
    var cur = '보증금 ' + U.won(c.deposit) + ' / 월 ' + U.won(U.num(c.rent) + U.num(c.maintenanceFee));
    var reply = md(U.addDays(U.todayISO(), 7));
    var L = [who + ' 안녕하세요. ' + place(c) + ' 관리 담당입니다.'];
    if (kind === 'ask') {
      L.push('현재 임대차계약이 ' + (x.end ? ymd(x.end) + '에' : '곧') + ' 만료되어 연락드립니다.');
      L.push('계약을 연장하실지, 만기에 퇴실하실지 ' + reply + '까지 회신 부탁드립니다.');
      L.push('연장 조건은 회신 주시면 따로 안내드리겠습니다.');
    } else if (kind === 'change') {
      L.push(end + ' 계약 만료 후 재계약 조건을 안내드립니다.');
      L.push('변경 조건: 보증금 ' + U.won(r.newDeposit || c.deposit) + ' / 월 ' + U.won(r.newMonthly || (U.num(c.rent) + U.num(c.maintenanceFee))) + ' (현재 ' + cur + ')');
      L.push('이 조건으로 재계약하실지 ' + reply + '까지 회신 부탁드립니다. 회신이 없으시면 만기에 계약이 종료되는 것으로 진행하겠습니다.');
    } else if (kind === 'confirm') {
      opt = opt || {};
      var np = newPeriod(x, opt.months || termMonths(c));
      L.push(md(opt.replyDate || U.todayISO()) + ' 회신 주신 내용에 따라 임대차계약을 기존과 같은 조건으로 연장하기로 한 내용을 아래와 같이 정리해 드립니다.');
      L.push('');
      L.push('- 호실: ' + place(c));
      L.push('- 기존 계약: ' + (x.implied ? '원 계약 ' + ymd(x.origEnd) + ' 만료 후 갱신 중 (현재 만기 ' + ymd(x.end) + ')' : ymd(c.startDate) + ' ~ ' + ymd(x.end)));
      L.push('- 연장 기간: ' + ymd(np.start) + ' ~ ' + ymd(np.end) + ' (' + np.months + '개월)');
      L.push('- 보증금: ' + U.won(c.deposit) + ' (변동 없음)');
      L.push('- 월세: ' + U.won(c.rent) + (U.num(c.maintenanceFee) ? ' / 관리비: ' + U.won(c.maintenanceFee) : '') + ', 매월 ' + c.payDay + '일 납부 (변동 없음)');
      L.push('- 그 밖의 계약 조건 · 특약: 기존 계약 내용 그대로 유지');
      L.push('');
      L.push('위 내용과 다른 점이 있으시면 ' + reply + '까지 알려 주세요. 따로 말씀이 없으시면 위 조건으로 연장된 것으로 하겠습니다.');
      L.push('※ 이 문자는 연장 합의 내용 확인용으로 보관됩니다.');
    } else {
      L.push('현재 임대차계약은 ' + end + ' 만료되며, 임대인 사정으로 계약을 갱신하지 않고 만기에 종료하고자 미리 알려드립니다.');
      L.push('만기일에 맞춰 퇴실 준비 부탁드리며, 보증금은 퇴실 확인 후 공과금 · 원상복구 정산을 거쳐 반환해 드립니다.');
      L.push('퇴실 일정을 회신해 주시면 감사하겠습니다.');
    }
    L.push(smsSign());
    return L.join('\n');
  }

  function copy(text, ok) {
    function fallback() {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var done = false; try { done = document.execCommand('copy'); } catch (e) { done = false; }
      t.remove();
      UI.toast(done ? ok : '복사가 막혀 있습니다. 글자를 길게 눌러 직접 복사해 주세요.', done ? 'ok' : 'err');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { UI.toast(ok, 'ok'); }, fallback);
    else fallback();
  }

  var KIND_LABEL = { ask: '연장 의사 묻기', change: '조건 변경 안내', end: '종료(갱신 거절) 통지', confirm: '연장 확정 회신' };

  /** 보낸 만기 안내 문자를 히스토리(smsLog)에 남기고 통지일을 채운다 */
  function logSent(x, kind, text, opt) {
    var st = S.get(), c = x.c, today = U.todayISO();
    st.smsLog = st.smsLog || [];
    st.smsLog.push({ id: U.uid('sms'), kind: 'renewal', contractId: c.id, stage: 'renewal-' + kind, sentAt: today, createdAt: today,
                     text: text, phone: c.tenantPhone || '', label: place(c) + ' · ' + (c.tenantName || ''), end: x.end || '' });
    var r = c.renewal || {};
    if (!r.notifiedAt) r.notifiedAt = today;
    if (!r.method) r.method = '문자';
    if (!r.decision && kind === 'end') r.decision = '종료 (갱신 거절)';
    if (!r.decision && kind === 'change') r.decision = '연장 (조건 변경)';
    var np = null;
    if (kind === 'confirm') {
      np = newPeriod(x, (opt && opt.months) || termMonths(c));
      r.decision = '연장 (같은 조건)'; r.tenantIntent = '계속 거주';
      r.repliedAt = (opt && opt.replyDate) || today; r.newStart = np.start; r.newEnd = np.end; r.confirmedAt = today;
    }
    r.updatedAt = today;
    c.renewal = r;
    S.commit();
    UI.close();
    UI.toast('보낸 문자를 기록했습니다. [문자 히스토리]에서 다시 볼 수 있습니다.', 'ok');
    App.router.refresh();
    if (np) offerRenewalContract(c, x, np, r);
  }

  /** 연장 확정 뒤 재계약을 계약 목록에 바로 등록한다 (같은 조건) */
  function offerRenewalContract(c, x, np, r) {
    setTimeout(function () {
      UI.confirm({
        title: '재계약으로 등록할까요?',
        message: place(c) + ' ' + (c.tenantName || '') + '\n' + U.fmtDate(np.start) + ' ~ ' + U.fmtDate(np.end) + ' (' + np.months + '개월), 보증금 · 월세 그대로\n\n등록하면 지금 계약은 ' + U.fmtDate(x.end) + '에 끝난 것으로 정리되고, 만기 · 연장 목록에서 빠집니다.',
        confirmLabel: '재계약 등록',
        onConfirm: function () {
          var st = S.get();
          if (!c.endDate) c.endDate = x.end;
          c.endReason = '만료';
          st.contracts.push({ id: U.uid('ctr'), unitId: c.unitId, tenantName: c.tenantName, tenantPhone: c.tenantPhone, type: c.type,
            deposit: c.deposit, rent: c.rent, maintenanceFee: c.maintenanceFee, payDay: c.payDay,
            startDate: np.start, endDate: np.end, changeType: '재계약', prevContractId: c.id, smsNote: c.smsNote || '', smsHoldUntil: '',
            memo: '같은 조건 연장 합의 — 임차인 회신 ' + U.fmtDate(r.repliedAt) + ', 확인 문자 ' + U.fmtDate(r.confirmedAt) + ' 발송(문자 히스토리 보관) · 특약은 이전 계약 그대로',
            createdAt: U.todayISO() });
          S.commit();
          UI.toast('재계약을 등록했습니다.', 'ok');
          App.router.refresh();
        }
      });
    }, 50);
  }

  function lastSms(c) {
    return (S.get().smsLog || []).filter(function (l) { return l.contractId === c.id && l.kind === 'renewal'; })
      .sort(function (a, b) { return a.sentAt < b.sentAt ? 1 : -1; })[0] || null;
  }

    var kinds = [['ask', '연장 의사 묻기'], ['confirm', '✅ 연장 확정 회신'], ['change', '조건 변경 안내'], ['end', '종료(갱신 거절) 통지']];
    var cur = (x.r && x.r.tenantIntent === '계속 거주') ? 'confirm' : 'ask';
    var opt = { replyDate: U.todayISO(), months: termMonths(x.c) };
    function body() {
      return '<div class="row" style="margin-bottom:10px">' + kinds.map(function (k) {

          : '<span class="nt-nophone" style="margin:0">연락처 없음</span><a class="btn btn-sm" href="#/contracts">계약에서 번호 넣기</a>') +
        arrearsHTML(x.c) +
        '<span class="t-faint" style="font-size:12px">' + (x.end ? '만기 ' + U.fmtDate(x.end) + ' · 통지 기한 ' + U.fmtDate(x.nEnd) : '') + '</span></div>' +
        (arrears(x.c).months ? '<div class="t-faint" style="font-size:12px;margin:-2px 0 8px">연체가 있으면 연장 조건(완납 후 재계약 등)이나 종료를 함께 검토하세요.</div>' : '') +
      (cur === 'confirm' && x.end ? '<div class="row" style="gap:10px;margin-bottom:8px;font-size:13px">' +
        '<label>임차인 회신 받은 날 <input type="date" id="rn-reply" class="inline-input" value="' + opt.replyDate + '"></label>' +
        '<label>연장 기간 <select id="rn-months" class="inline-input">' + [6, 12, 24].concat([opt.months]).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; })
          .map(function (m) { return '<option value="' + m + '"' + (m === opt.months ? ' selected' : '') + '>' + m + '개월</option>'; }).join('') + '</select></label></div>' : '') +
      '<textarea class="nt-text" id="rn-text" rows="' + (cur === 'confirm' ? 15 : 9) + '">' + U.esc(message(x, cur, opt)) + '</textarea>' +
      (cur === 'confirm' ? '<div class="t-faint" style="font-size:12px;margin-top:6px">임차인이 같은 조건 연장에 동의했을 때 보내는 확인 문자입니다. 합의 내용이 문자로 남아 나중에 증거가 됩니다. [보냈음 기록]을 누르면 결정 · 회신일이 채워지고 재계약 등록까지 이어집니다.</div>' : '') +
      (cur === 'end' ? '<div class="t-faint" style="font-size:12px;margin-top:6px">종료 통지는 다툼이 생길 수 있어 문자와 함께 내용증명을 보내 두는 것이 안전합니다.</div>' : '') +
      (cur === 'change' && !x.r.newMonthly ? '<div class="t-faint" style="font-size:12px;margin-top:6px">변경 금액은 [결정 기록]에서 새 보증금 · 월 납부액을 넣으면 반영됩니다.</div>' : '');
    }
    var refs = UI.open({
      title: '만기 안내 문자 · ' + place(x.c) + ' ' + (x.c.tenantName || ''),
      body: body(),
      buttons: [
        { label: '닫기', onClick: UI.close },
        { label: '보냈음 기록', onClick: function () { logSent(x, cur, document.getElementById('rn-text').value, opt); } },
        { label: '문자 복사', className: 'btn-primary', onClick: function () {
          copy(document.getElementById('rn-text').value, '문자를 복사했습니다. 보낸 뒤 [결정 기록]에 통지일을 남기세요.');
        } }
      ]
    });
    refs.body.addEventListener('click', function (e) {
      if (e.target.closest('[data-rnphone]')) { copy(x.c.tenantPhone, '번호를 복사했습니다.'); return; }
      var b = e.target.closest('[data-rnk]');
      if (!b) return;
      cur = b.getAttribute('data-rnk'); refs.body.innerHTML = body();
    });
    refs.body.addEventListener('change', function (e) {
      if (e.target.id === 'rn-reply') opt.replyDate = e.target.value || U.todayISO();
      else if (e.target.id === 'rn-months') opt.months = Number(e.target.value) || 12;
      else return;
      document.getElementById('rn-text').value = message(x, cur, opt);
    });
  }

  function decideForm(x) {
    var c = x.c, r = c.renewal || {};
    UI.form({
      title: '연장 결정 기록 · ' + place(c) + ' ' + (c.tenantName || ''),
      values: Object.assign({ newDeposit: c.deposit, newMonthly: U.num(c.rent) + U.num(c.maintenanceFee) }, r),
      fields: [
        { name: 'decision', label: '임대인 결정', type: 'select', options: DECISIONS.map(function (d) { return { value: d, label: d || '(미정)' }; }) },
        { name: 'tenantIntent', label: '임차인 의사', type: 'select', options: ['', '계속 거주', '퇴실 예정', '응답 없음', '협의 중'].map(function (d) { return { value: d, label: d || '(모름)' }; }) },
        { name: 'repliedAt', label: '임차인 회신 받은 날', type: 'date' },
        { name: 'notifiedAt', label: '임차인에게 통지한 날', type: 'date', hint: '기한(' + (x.nEnd ? U.fmtDate(x.nEnd) : '-') + ') 안에 통지해야 묵시적 갱신을 막을 수 있습니다' },
        { name: 'method', label: '통지 방법', type: 'select', options: METHODS.map(function (d) { return { value: d, label: d || '(선택)' }; }) },
        { name: 'newDeposit', label: '새 보증금 (조건 변경 시)', type: 'money' },
        { name: 'newMonthly', label: '새 월 납부액 (조건 변경 시)', type: 'money' },
        { name: 'memo', label: '메모', type: 'textarea', full: true, hint: '임차인 회신 내용, 협의 내용 등' }
      ],
      onSubmit: function (v) {
        v.updatedAt = U.todayISO();
        c.renewal = v;
        S.commit();
        UI.toast('기록했습니다.' + (v.decision && v.decision.indexOf('연장') === 0 ? ' 재계약서를 쓰면 [임대차 계약]에서 재계약으로 등록하세요.' : ''), 'ok');

    });

  /* ---------- 계약서 그대로 연장 (같은 조건 · 1년/2년) ---------- */
  /** 체크 여부 — 직접 체크했거나, 결정 기록이 '연장 (같은 조건)'이면서 체크를 끄지 않은 계약 */
  function isSame(x) {
    var r = x.r || x.c.renewal || {};
    if (r.renewedContractId && S.contract(r.renewedContractId)) return false;
    if (r.sameTerms === true) return true;
    if (r.sameTerms === false) return false;
    return r.decision === '연장 (같은 조건)';
  }
  function termLabel(m) { return m === 12 ? '1년' : m === 24 ? '2년' : m + '개월'; }
  /** 연장 기간 — 고른 값이 있으면 그것, 없으면 원 계약 기간(약 1년이면 12 · 약 2년이면 24), 모르면 주택 2년 · 상가 1년 */
  function renewMonths(x) {
    var r = x.r || x.c.renewal || {}, c = x.c;
    if (r.sameMonths) return Number(r.sameMonths);
    if (c.startDate && c.endDate) {
      var m = Math.round(U.diffDays(c.startDate, U.addDays(c.endDate, 1)) / 30.4);
      if (m >= 10 && m <= 14) return 12;
      if (m >= 22 && m <= 26) return 24;
      if (m >= 1 && m <= 36) return m;
    }
    return (x.cycleYears || 2) * 12;
  }
  function sameCellHTML(x) {
    if (x.unknown) return '<span class="t-faint" style="font-size:12px">만기 입력 후</span>';
    var on = isSame(x), m = renewMonths(x), np = on ? newPeriod(x, m) : null;
    var opts = [12, 24].concat(m).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; });
    return '<label class="check" style="gap:5px;white-space:nowrap"><input type="checkbox" data-act="rnSame" data-id="' + U.esc(x.c.id) + '"' + (on ? ' checked' : '') + '> 계약서 그대로</label>' +
      (on ? '<div class="row" style="gap:6px;margin-top:4px"><select class="inline-input" data-rnmonths="' + U.esc(x.c.id) + '" style="padding:2px 6px;font-size:12px">' +
        opts.map(function (v) { return '<option value="' + v + '"' + (v === m ? ' selected' : '') + '>' + termLabel(v) + '</option>'; }).join('') + '</select>' +
        '<span class="t-faint" style="font-size:11px;white-space:nowrap">' + U.fmtDate(np.start) + ' ~ ' + U.fmtDate(np.end) + '</span></div>' : '');
  }
  /** 체크 토글 — 켜면 결정도 '연장 (같은 조건)'으로 채운다 (통지일은 건드리지 않음) */
  function toggleSame(id, on) {
    var c = S.contract(id); if (!c) return;
    var x = info(c), r = c.renewal || {};
    r.sameTerms = !!on;
    if (on) {
      if (!r.decision) r.decision = '연장 (같은 조건)';
      if (!r.tenantIntent) r.tenantIntent = '계속 거주';
      if (!r.sameMonths) r.sameMonths = renewMonths(x);
    }
    r.updatedAt = U.todayISO();
    c.renewal = r; S.commit();
    UI.toast(on ? place(c) + ' ' + (c.tenantName || '') + ' — 계약서 그대로 ' + termLabel(r.sameMonths) + ' 연장으로 체크했습니다.' : '체크를 풀었습니다.', on ? 'ok' : '');
    App.router.refresh();
  }
  /** 체크된 계약 하나를 같은 조건으로 재계약 등록한다 (화면 없음) */
  function registerSame(x) {
    var c = x.c, st = S.get(), today = U.todayISO(), r = c.renewal || {};
    var np = newPeriod(x, renewMonths(x));
    var overlap = S.contractsOfUnit(c.unitId).filter(function (o) {
      return o.id !== c.id && o.startDate <= np.end && (!o.endDate || o.endDate >= np.start);
    });
    if (overlap.length) return { ok: false, why: '같은 기간에 다른 계약(' + (overlap[0].tenantName || '') + ')이 있어 건너뜀' };
    if (!c.endDate) c.endDate = x.end;
    c.endReason = '만료';
    var nc = { id: U.uid('ctr'), unitId: c.unitId, tenantName: c.tenantName, tenantPhone: c.tenantPhone, type: c.type,
      deposit: c.deposit, rent: c.rent, maintenanceFee: c.maintenanceFee, payDay: c.payDay,
      startDate: np.start, endDate: np.end, changeType: '재계약', prevContractId: c.id, smsNote: c.smsNote || '', smsHoldUntil: '',
      memo: '계약서 그대로 유지 · 같은 조건 연장 ' + termLabel(np.months) + ' (' + U.fmtDate(np.start) + ' ~ ' + U.fmtDate(np.end) + ') — ' + U.fmtDate(today) + ' 만기 · 연장 화면에서 등록' +
        (r.repliedAt ? ' · 임차인 회신 ' + U.fmtDate(r.repliedAt) : '') + ' · 보증금 · 월세 · 특약은 이전 계약 그대로',
      createdAt: today };
    st.contracts.push(nc);
    r.sameTerms = true; r.decision = '연장 (같은 조건)'; r.tenantIntent = r.tenantIntent || '계속 거주';
    r.sameMonths = np.months; r.newStart = np.start; r.newEnd = np.end;
    r.renewedContractId = nc.id; r.renewedAt = today; r.prevEnd = x.end; r.updatedAt = today;
    c.renewal = r;
    return { ok: true, nc: nc, np: np };
  }
  /** 체크한 계약을 모아 확인 창을 띄우고 한 번에 등록한다 */
  function bulkRegister() {
    var targets = collect().filter(function (x) { return !x.unknown && isSame(x); });
    if (!targets.length) { UI.toast('체크한 계약이 없습니다. 줄 끝의 “계약서 그대로 연장”에 먼저 체크하세요.', 'err'); return; }
    var body = '<div class="t-dim" style="font-size:13px;margin-bottom:10px">아래 ' + targets.length + '건을 <b>보증금 · 월세 · 관리비 · 납부일 · 특약 그대로</b> 재계약으로 등록합니다. ' +
      '기존 계약은 만기일에 끝난 것(만료)으로 정리되고, 새 계약은 만기 다음 날부터 시작합니다. 청구서는 새 계약 기간이 되면 평소처럼 만들어집니다.</div>' +
      '<div class="table-wrap"><table><thead><tr><th>호실 · 임차인</th><th>기존 만기</th><th>새 계약 기간</th><th>조건</th></tr></thead><tbody>' +
      targets.map(function (x) {
        var np = newPeriod(x, renewMonths(x));
        return '<tr><td><b>' + U.esc(place(x.c)) + '</b> ' + U.esc(x.c.tenantName || '') + '</td><td class="mono">' + U.fmtDate(x.end) + '</td>' +
          '<td class="mono">' + U.fmtDate(np.start) + ' ~ ' + U.fmtDate(np.end) + ' <span class="badge badge-info">' + termLabel(np.months) + '</span></td>' +
          '<td class="t-dim" style="font-size:12px">보증금 ' + U.wonShort(x.c.deposit) + ' / 월 ' + U.wonShort(U.num(x.c.rent) + U.num(x.c.maintenanceFee)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="t-faint" style="font-size:12px;margin-top:8px">기간을 바꾸려면 창을 닫고 줄의 1년 · 2년 선택을 고친 뒤 다시 누르세요. 등록 뒤에는 “연장 등록 완료” 탭에서 확인하고, 잘못 눌렀으면 거기서 취소할 수 있습니다.</div>';
    UI.open({
      title: '✅ 계약서 그대로 연장 등록 · ' + targets.length + '건',
      body: body,
      buttons: [
        { label: '닫기', onClick: UI.close },
        { label: targets.length + '건 연장 등록', className: 'btn-primary', onClick: function () {
          var done = [], skipped = [];
          targets.forEach(function (x) {
            var res = registerSame(x);
            if (res.ok) done.push(place(x.c) + ' ' + (x.c.tenantName || '') + ' ' + termLabel(res.np.months));
            else skipped.push(place(x.c) + ' ' + (x.c.tenantName || '') + ': ' + res.why);
          });
          S.commit(); UI.close();
          UI.toast((done.length ? done.length + '건을 같은 조건으로 연장 등록했습니다.' : '등록한 계약이 없습니다.') + (skipped.length ? ' 건너뜀 ' + skipped.length + '건: ' + skipped.join(' / ') : ''), done.length ? 'ok' : 'err');
          if (done.length) state.tab = 'renewed';
          App.router.refresh();
        } }
      ]
    });
  }
  /** 이 화면에서 연장 등록한 계약 — 새 계약이 아직 있는 것만, 최근 등록 순 */
  function renewedList() {
    return S.get().contracts.filter(function (c) {
      var r = c.renewal || {};
      return r.renewedContractId && S.contract(r.renewedContractId);
    }).map(function (c) { return { c: c, r: c.renewal, nc: S.contract(c.renewal.renewedContractId) }; })
      .sort(function (a, b) { return (a.r.renewedAt || '') < (b.r.renewedAt || '') ? 1 : -1; });
  }
  function renewedRowHTML(y) {
    var c = y.c, nc = y.nc, months = Math.round(U.diffDays(nc.startDate, U.addDays(nc.endDate, 1)) / 30.4);
    var paid = S.get().invoices.some(function (i) { return i.contractId === nc.id && App.billing.paidAmount(i) > 0; });
    return { cells: [
      '<b>' + U.esc(place(c)) + '</b><div class="t-faint" style="font-size:12px">' + App.views.notices.tenantLink(nc) + ' · 보증금 ' + U.wonShort(nc.deposit) + ' / 월 ' + U.wonShort(U.num(nc.rent) + U.num(nc.maintenanceFee)) + '</div>',
      '<span class="mono">' + U.fmtDate(y.r.prevEnd || c.endDate) + '</span>',
      '<span class="mono">' + U.fmtDate(nc.startDate) + ' ~ ' + U.fmtDate(nc.endDate) + '</span> <span class="badge badge-ok">' + termLabel(months) + ' · 같은 조건</span>' +
        (nc.startDate > U.todayISO() ? '<div class="t-faint" style="font-size:11px">' + U.diffDays(U.todayISO(), nc.startDate) + '일 뒤 시작</div>' : ''),
      '<span class="mono">' + U.fmtDate(y.r.renewedAt) + '</span>',
      '<button class="btn btn-sm" data-act="rnOpenCtr" data-id="' + U.esc(nc.id) + '">새 계약 보기</button> ' +
      (paid ? '<span class="t-faint" style="font-size:11px">입금 기록 있음</span>' : '<button class="btn btn-sm btn-ghost" data-act="rnCancel" data-id="' + U.esc(c.id) + '">연장 취소</button>')
    ] };
  }
  /** 잘못 등록한 연장을 되돌린다 — 새 계약에 입금 기록이 없을 때만 */
  function cancelRenewed(id) {
    var c = S.contract(id); if (!c || !c.renewal || !c.renewal.renewedContractId) return;
    var nc = S.contract(c.renewal.renewedContractId);
    if (nc && S.get().invoices.some(function (i) { return i.contractId === nc.id && App.billing.paidAmount(i) > 0; })) {
      UI.toast('새 계약에 입금 기록이 있어 취소할 수 없습니다. 임대차 계약 화면에서 직접 정리하세요.', 'err'); return;
    }
    UI.confirm({
      title: '연장 등록 취소', danger: true, confirmLabel: '취소하기',
      message: place(c) + ' ' + (c.tenantName || '') + '의 재계약(' + (nc ? U.fmtDate(nc.startDate) + ' ~ ' + U.fmtDate(nc.endDate) : '') + ')을 지우고, 기존 계약을 다시 만기 · 연장 목록으로 되돌립니다.\n체크 표시는 그대로 남습니다.',
      onConfirm: function () {
        if (nc) S.removeContract(nc.id);
        var r = c.renewal;
        delete r.renewedContractId; delete r.renewedAt; delete r.newStart; delete r.newEnd;
        if (c.endReason === '만료') c.endReason = '';
        r.updatedAt = U.todayISO();
        S.commit(); UI.toast('연장 등록을 취소했습니다.', 'ok'); App.router.refresh();
      }
    });
  }

  function find(id) { var c = S.contract(id); return c ? info(c) : null; }

  App.views.renewal = {
    title: '계약 만기 · 연장',
    desc: '만기 전 통지 기한을 챙겨 묵시적 갱신을 막습니다. 연장 여부를 묻고 결정을 기록하세요.',
    render: render,
    summary: summary,
    _info: info,
    _isSame: isSame, _renewMonths: renewMonths, _registerSame: registerSame,
    handlers: {
      rnTab: function (id) { state.tab = id; App.router.refresh(); },
      rnPhone: function (id) { var c = S.contract(id); if (c && c.tenantPhone) copy(c.tenantPhone, '번호를 복사했습니다.'); },
      rnMsg: function (id) { var x = find(id); if (x) msgModal(x); },
      rnDecide: function (id) { var x = find(id); if (x) decideForm(x); },
      rnSame: function (id, target) { toggleSame(id, !!(target && target.checked)); },
      rnBulk: function () { bulkRegister(); },
      rnCancel: function (id) { cancelRenewed(id); },
      rnOpenCtr: function (id) { App.views.contracts.handlers.detail(id); }
    }
  };
})(window.App);

</script>
<script>
/* 문자 히스토리 — 납부 안내 · 만기 안내 · 개별 문자(누수 · 시설 등) · 매도/임대 문자를 언제 누구에게 어떤 내용으로 보냈는지 한곳에서 본다.
   납부 · 만기 안내 · 개별 문자는 smsLog, 매도 · 임대 문자는 saleLog에서 읽는다. 원문은 [보냈음]을 누를 때 함께 저장된다. */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var state = { kind: 'all', q: '' };

  var STAGE = {
    due: '납부일 안내', first: '미납 1차', second: '2개월 이상', final: '최종 통보', check: '통장 확인',
    'renewal-ask': '연장 의사 묻기', 'renewal-change': '조건 변경 안내', 'renewal-end': '종료(갱신 거절) 통지', 'renewal-confirm': '연장 확정 회신'
  };
  // 납부와 상관없는 개별 문자 — 납부 안내 목록의 '보냄' 판정에는 쓰이지 않는다
  var ISSUES = [
    { key: 'issue-repair', label: '시설 · 누수' },
    { key: 'issue-move', label: '입주 · 퇴실' },
    { key: 'issue-contract', label: '계약 · 서류' },
    { key: 'issue-etc', label: '기타 개별' }
  ];
  ISSUES.forEach(function (i) { STAGE[i.key] = i.label; });
  var KINDS = [
    { key: 'all', label: '전체', emoji: '📜' },
    { key: 'notice', label: '납부 안내', emoji: '📨' },
    { key: 'issue', label: '개별 문자', emoji: '💬' },
    { key: 'renewal', label: '만기 안내', emoji: '🔁' },
    { key: 'sale', label: '매도 · 임대', emoji: '📣' }
  ];
  var KIND = {}; KINDS.forEach(function (k) { KIND[k.key] = k; });

  function entries() {
    var out = [];
    (S.get().smsLog || []).forEach(function (l) {
      var kind = l.kind || (String(l.stage).indexOf('renewal-') === 0 ? 'renewal' : 'notice');
      var c = S.contract(l.contractId);
      out.push({ id: l.id, src: 'sms', kind: kind, raw: l, date: l.sentAt, stage: STAGE[l.stage] || l.stage || '',
        target: l.label || (c ? S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') : '(삭제된 계약)'),
        to: l.phone || (c && c.tenantPhone) || '', count: 1, text: l.text || '', memo: '' });
    });
    (S.get().saleLog || []).forEach(function (l) {
      var it = (S.get().saleItems || []).filter(function (x) { return x.id === l.itemId; })[0];
      out.push({ id: l.id, src: 'sale', kind: 'sale', date: l.date, stage: l.priceText || '',
        target: it ? it.name : '(삭제된 매물)', to: '중개사 ' + U.comma(l.count || 0) + '곳', count: U.num(l.count),
        text: l.text || '', memo: [l.method, l.memo].filter(Boolean).join(' · ') });
    });
    return out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  function find(id) { return entries().filter(function (e) { return e.id === id; })[0] || null; }

  function render(el) {
    var all = entries();
    var q = state.q.trim();
    var list = all.filter(function (e) {
      if (state.kind !== 'all' && e.kind !== state.kind) return false;
      return !q || (e.target + ' ' + e.stage + ' ' + e.text + ' ' + e.to).indexOf(q) >= 0;
    });
    var cnt = {}; KINDS.forEach(function (k) { cnt[k.key] = 0; });
    all.forEach(function (e) { cnt[e.kind]++; cnt.all++; });
    var chips = '<div class="chips" style="padding:0;margin:0 0 12px">' + KINDS.map(function (k) {
      return '<button class="chip' + (state.kind === k.key ? ' active' : '') + '" data-act="shKind" data-id="' + k.key + '">' + k.emoji + ' ' + k.label + ' <span class="cnt">' + cnt[k.key] + '</span></button>';
    }).join('') + '<input id="sh-q" class="inline-input" type="search" placeholder="호실 · 이름 · 내용 검색" value="' + U.esc(state.q) + '" style="margin-left:auto;min-width:200px"></div>';
    var rows = list.map(function (e) {
      var k = KIND[e.kind] || KIND.all;
      return { cells: [
        U.fmtDate(e.date),
        '<span class="badge ' + (e.kind === 'notice' ? 'badge-warn' : e.kind === 'renewal' ? 'badge-info' : e.kind === 'issue' ? 'badge-special' : 'badge-danger') + '">' + k.emoji + ' ' + k.label + '</span>',
        '<b style="white-space:normal">' + U.esc(e.target) + '</b>',
        '<span style="white-space:normal">' + U.esc(e.stage) + '</span>',
        '<span class="mono" style="font-size:12px">' + U.esc(e.to) + '</span>',
        e.text ? '<span class="t-dim" style="white-space:normal;font-size:12px">' + U.esc(e.text.replace(/\s+/g, ' ').slice(0, 60)) + '…</span>'
               : '<span class="t-faint" style="font-size:12px">원문 저장 전 기록</span>',
        '<button class="btn btn-sm" data-act="smsView" data-id="' + U.esc(e.id) + '">' + (e.text ? '문자 보기' : '자세히') + '</button>'
      ] };
    });
    var guide = '<div class="t-faint" style="font-size:12px;margin-bottom:10px">각 화면에서 [보냈음]을 누르면 보낸 문자 원문이 여기에 쌓입니다. 누수 · 시설 같은 납부와 상관없는 문자는 문자 창에서 종류를 \'개별 문자\'로 고르거나 [＋ 개별 문자 기록]으로 남기세요. 잘못 들어간 기록은 [문자 보기] → [종류 바꾸기]로 고칠 수 있습니다. 이 기능 전 기록(10/16 납부 안내 등)은 날짜 · 대상만 남아 있습니다.</div>';
    el.innerHTML = guide + chips + (rows.length
      ? UI.card('', UI.table(['날짜', '종류', '대상', '단계 · 금액', '받는 곳', '내용', ''], rows), '', true)
      : UI.card('', UI.empty('보낸 문자 기록이 없습니다', '납부 안내 · 만기 안내 · 매도 문자에서 [보냈음]을 누르면 쌓입니다.')));
    var inp = document.getElementById('sh-q');
    UI.onType(inp, function (v) { state.q = v; App.router.refresh(true); });
  }

  function view(id) {
    var e = find(id);
    if (!e) return;
    var k = KIND[e.kind] || KIND.all;
    UI.open({
      title: k.emoji + ' ' + U.fmtDate(e.date) + ' · ' + e.target,
      body: '<div class="t-dim" style="font-size:12px;margin-bottom:8px">' + U.esc([k.label, e.stage, e.to, e.memo].filter(Boolean).join(' · ')) + '</div>' +
        (e.text ? '<textarea class="nt-text" readonly rows="' + Math.min(26, e.text.split('\n').length + 1) + '">' + U.esc(e.text) + '</textarea>'
                : '<div class="empty" style="padding:20px">이 기록은 원문 저장 기능이 생기기 전에 남긴 것이라 문자 내용이 없습니다.</div>'),
      buttons: [{ label: '닫기', onClick: UI.close }].concat(e.src === 'sms' && e.kind !== 'renewal' ? [{ label: '종류 바꾸기', onClick: function () { reclassify(e.raw); } }] : []).concat(e.text ? [{ label: '문자 복사', className: 'btn-primary', onClick: function () {
        var done = function (ok) { UI.toast(ok ? '문자를 복사했습니다.' : '복사가 막혀 있습니다. 글자를 길게 눌러 직접 복사해 주세요.', ok ? 'ok' : 'err'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(e.text).then(function () { done(true); }, function () { done(false); });
        else done(false);
      } }] : [])
    });
  }

  function issueOptions() { return ISSUES.map(function (i) { return { value: i.key, label: '💬 개별 문자 · ' + i.label }; }); }

  /** 납부 안내로 잘못 들어간 기록을 개별 문자로 (또는 그 반대로) 바꾼다 */
  function reclassify(l) {
    if (!l) return;
    var orig = l.kind === 'issue' ? (l.noticeStage || 'due') : l.stage;
    UI.form({
      title: '문자 종류 바꾸기',
      submitLabel: '저장',
      values: { to: l.kind === 'issue' ? l.stage : 'notice' },
      fields: [{ name: 'to', label: '종류', type: 'select', full: true,
        options: [{ value: 'notice', label: '📨 납부 안내 · ' + (STAGE[orig] || orig) }].concat(issueOptions()),
        hint: '개별 문자로 바꾸면 납부 안내 목록의 \'보냄\' 표시에서 빠집니다.' }],
      onSubmit: function (v) {
        if (v.to === 'notice') {
          if (l.kind === 'issue') { l.kind = 'notice'; l.stage = l.noticeStage || 'due'; delete l.noticeStage; }
        } else {
          if (l.kind !== 'issue') { l.noticeStage = l.stage; l.kind = 'issue'; }
          l.stage = v.to;
        }
        S.commit(); UI.toast('종류를 바꿨습니다.', 'ok'); App.router.refresh();
      }
    });
  }

  /** 문자 창을 거치지 않고 보낸 개별 문자를 직접 기록한다 */
  function addIssue() {
    var today = U.todayISO();
    var order = { active: 0, scheduled: 1, ended: 2 };
    var list = U.sortBy(S.get().contracts.slice(), function (c) {
      return order[App.views.contracts.contractStatus(c)] + S.unitLabel(c.unitId);
    });
    UI.form({
      title: '💬 개별 문자 기록',
      submitLabel: '기록',
      values: { contractId: '', stage: 'issue-repair', sentAt: today, text: '' },
      fields: [
        { name: 'contractId', label: '받은 사람', type: 'select', full: true, required: true,
          options: [{ value: '', label: '— 호실 · 임차인 선택 —' }].concat(list.map(function (c) {
            var st = App.views.contracts.contractStatus(c);
            return { value: c.id, label: S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') + (st === 'ended' ? ' (종료)' : st === 'scheduled' ? ' (예정)' : '') };
          })) },
        { name: 'stage', label: '종류', type: 'select', options: ISSUES.map(function (i) { return { value: i.key, label: i.label }; }) },
        { name: 'sentAt', label: '보낸 날', type: 'date', required: true },
        { name: 'text', label: '보낸 문자 내용', type: 'textarea', full: true, required: true }
      ],
      onSubmit: function (v) {
        if (!String(v.text || '').trim()) return { text: '문자 내용을 넣어 주세요.' };
        var c = S.contract(v.contractId) || {}, st = S.get();
        st.smsLog = st.smsLog || [];
        st.smsLog.push({ id: U.uid('sms'), kind: 'issue', contractId: v.contractId, stage: v.stage, sentAt: v.sentAt || today, createdAt: today,
                         text: v.text, phone: c.tenantPhone || '', label: S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') });
        S.commit(); UI.toast('개별 문자로 기록했습니다.', 'ok');
        state.kind = 'issue'; App.router.refresh();
      }
    });
  }

  App.views.smshistory = {
    title: '문자 히스토리',
    desc: '납부 안내 · 개별 문자 · 만기 안내 · 매도/임대 문자를 언제, 누구에게, 어떤 내용으로 보냈는지 봅니다.',
    render: render,
    ISSUES: ISSUES,
    actions: function () { return '<button class="btn btn-primary" data-act="shAddIssue">＋ 개별 문자 기록</button>'; },
    handlers: {
      shAddIssue: function () { addIssue(); },
      shKind: function (id) { state.kind = id; App.router.refresh(); },
      smsView: function (id) { view(id); }
    }
  };
})(window.App);

</script>
<script>
/* 번호 · 이름 찾기 — 어느 화면에서든 휴대폰 번호(뒷자리만 쳐도 됨) · 이름 · 호실로
   임차인을 찾는다. 지난 계약까지 보여 주고, 계약 · 호실 메모와 중개사 연락처에 적힌 번호도 함께 찾는다. */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var digits = function (s) { return String(s || '').replace(/\D/g, ''); };
  var ST = { active: ['진행중', 'badge-ok'], ended: ['종료', 'badge-muted'], scheduled: ['예정', 'badge-info'] };
  var MAX = 30;

  function unpaidOf(c) {
    return U.sum(S.get().invoices.filter(function (i) { return i.contractId === c.id; }), function (i) { return B.remaining(i); });
  }

  // 메모 속 번호는 앞뒤 글자와 함께 보여 준다
  function snippet(text, q) {
    var t = String(text || '');
    var re = new RegExp(q.split('').join('\\D?'));
    var m = re.exec(t);
    if (!m) return '';
    var s = Math.max(0, m.index - 30), e = Math.min(t.length, m.index + m[0].length + 30);
    return (s ? '…' : '') + U.esc(t.slice(s, m.index)) + '<mark>' + U.esc(m[0]) + '</mark>' + U.esc(t.slice(m.index + m[0].length, e)) + (e < t.length ? '…' : '');
  }

  function search(raw) {
    var q = String(raw || '').trim();
    var dq = digits(q);
    var byNum = dq.length >= 3 && dq.length >= q.replace(/[\s-]/g, '').length;   // 숫자만 친 경우
    var lq = q.toLowerCase();
    var res = { tenants: [], memos: [], agents: [], biz: [], bacct: [] };
    if (!q || (byNum && dq.length < 3) || (!byNum && q.length < 1)) return res;
    var st = S.get();
    st.contracts.forEach(function (c) {
      var hit = byNum ? digits(c.tenantPhone).indexOf(dq) >= 0
                      : ((c.tenantName || '') + ' ' + S.unitLabel(c.unitId)).toLowerCase().indexOf(lq) >= 0;
      if (hit) res.tenants.push(c);
      else if (byNum && dq.length >= 4 && digits(c.memo).indexOf(dq) >= 0) res.memos.push({ label: S.unitLabel(c.unitId) + ' · ' + (c.tenantName || '') + ' 계약 메모', text: c.memo, contractId: c.id });
    });
    if (byNum && dq.length >= 4) {
      st.units.forEach(function (u) {
        if (digits(u.memo).indexOf(dq) >= 0) res.memos.push({ label: S.unitLabel(u.id) + ' 호실 메모', text: u.memo, unitId: u.id });
      });
      (st.agents || []).forEach(function (a) {
        if ((digits(a.mobile) + ' ' + digits(a.tel)).indexOf(dq) >= 0) res.agents.push(a);
      });
    }
    if (App.views.bizreg && (byNum ? dq.length >= 3 : q.length >= 2)) res.biz = App.views.bizreg.search(q);
    if (App.views.bizreg && App.views.bizreg.searchAccts && (byNum ? dq.length >= 4 : q.length >= 2)) res.bacct = App.views.bizreg.searchAccts(q);
    var order = { active: 0, scheduled: 1, ended: 2 };
    res.tenants = U.sortBy(res.tenants, function (c) {
      return order[App.views.contracts.contractStatus(c)] * 1e9 - Number(String(c.startDate || '').replace(/\D/g, ''));
    });
    return res;
  }

  function resultsHTML(q) {
    var r = search(q);
    if (!String(q || '').trim()) return '<div class="t-faint lk-guide">휴대폰 번호(뒷자리 4자리만 쳐도 됩니다) · 임차인 이름 · 호실을 입력하세요. 지난 계약과 메모에 적힌 번호까지 찾습니다.</div>';
    var dq = digits(q);
    var html = '';
    if (r.tenants.length) {
      html += '<div class="lk-head">임차인 ' + r.tenants.length + '명</div>' + r.tenants.slice(0, MAX).map(function (c) {
        var s = ST[App.views.contracts.contractStatus(c)] || ST.active;
        var unpaid = unpaidOf(c);
        return '<div class="lk-item">' +
          '<div class="lk-top"><b>' + U.esc(S.unitLabel(c.unitId)) + '</b> <span class="badge ' + s[1] + '">' + s[0] + '</span>' +
          (unpaid > 0 ? ' <span class="badge badge-danger">미납 ' + U.comma(unpaid) + '</span>' : '') + '</div>' +
          '<div class="lk-name">' + U.esc(c.tenantName || '(이름 없음)') + (c.tenantPhone ? ' · <span class="mono">' + U.esc(U.phone(c.tenantPhone)) + '</span>' : '') + '</div>' +
          '<div class="lk-sub">보증금 ' + U.comma(c.deposit || 0) + ' / 월세 ' + U.comma(c.rent || 0) +
          ' · ' + U.fmtDate(c.startDate) + ' ~ ' + (c.endDate ? U.fmtDate(c.endDate) : '미정') + (c.endReason && c.endDate ? ' ' + U.esc(c.endReason) : '') + '</div>' +
          '<div class="row lk-acts"><button class="btn btn-sm btn-primary" data-act="dCtr" data-id="' + U.esc(c.id) + '">계약 상세</button>' +
          (s[0] !== '종료' ? '<button class="btn btn-sm" data-act="ntQuick" data-id="' + U.esc(c.id) + '">✉️ 문자</button>' : '') + '</div></div>';
      }).join('');
    }
    if (r.memos.length) {
      html += '<div class="lk-head">메모에 적힌 번호 ' + r.memos.length + '건</div>' + r.memos.slice(0, MAX).map(function (m) {
        return '<div class="lk-item"><div class="lk-top"><b>' + U.esc(m.label) + '</b></div>' +
          '<div class="lk-sub">' + snippet(m.text, dq) + '</div>' +
          (m.contractId ? '<div class="row lk-acts"><button class="btn btn-sm" data-act="dCtr" data-id="' + U.esc(m.contractId) + '">계약 상세</button></div>'
                        : '<div class="row lk-acts"><button class="btn btn-sm" data-act="unitDetail" data-id="' + U.esc(m.unitId) + '">호실 상세</button></div>') + '</div>';
      }).join('');
    }
    if (r.agents.length) {
      html += '<div class="lk-head">중개사 ' + r.agents.length + '곳</div>' + r.agents.slice(0, 10).map(function (a) {
        var b = S.building(a.buildingId);
        return '<div class="lk-item"><div class="lk-top"><b>' + U.esc(a.name) + '</b>' + (a.agent ? ' · ' + U.esc(a.agent) : '') + '</div>' +
          '<div class="lk-sub"><span class="mono">' + U.esc([a.mobile, a.tel].filter(function (x) { return digits(x).length >= 7; }).join(' / ')) + '</span>' + (b ? ' · ' + U.esc(b.name) + ' 주변' : '') + '</div></div>';
      }).join('');
    }
    if (r.biz.length) {
      html += '<div class="lk-head">사업자등록 ' + r.biz.length + '곳</div>' + r.biz.slice(0, 10).map(function (b) {
        return '<div class="lk-item"><div class="lk-top"><b>' + U.esc(b.name || '') + '</b> <span class="badge badge-muted">' + U.esc(b.type || '') + '</span></div>' +
          '<div class="lk-sub"><span class="mono">' + U.esc(b.regNo || '-') + '</span> · ' + U.esc(b.ceo || '-') + (b.alias ? ' · ' + U.esc(b.alias) : '') + '</div>' +
          '<div class="row lk-acts"><button class="btn btn-sm" data-act="brCopy" data-id="' + U.esc(b.regNo || '') + '">번호 복사</button>' +
          '<button class="btn btn-sm" data-act="brGo" data-id="' + U.esc(b.regNo || b.name || '') + '">게시판에서 보기</button></div></div>';
      }).join('');
    }
    if (r.bacct.length) {
      html += '<div class="lk-head">계좌 · 인증서 ' + r.bacct.length + '개</div>' + r.bacct.slice(0, 10).map(function (b) {
        return '<div class="lk-item"><div class="lk-top"><b>' + U.esc(b.branch || '') + '</b> <span class="badge badge-muted">' + U.esc(b.bank || '') + '</span></div>' +
          '<div class="lk-sub"><span class="mono">' + U.esc(b.accountNo || '') + '</span> · ' + U.esc(b.use || '') + (b.cert ? ' · 🔐 ' + U.esc(b.cert) : '') + '</div>' +
          '<div class="row lk-acts"><button class="btn btn-sm" data-act="brCopy" data-id="' + U.esc(b.accountNo || '') + '">계좌 복사</button>' +
          '<button class="btn btn-sm" data-act="brGo" data-tab="acct" data-id="' + U.esc(b.accountNo || '') + '">게시판에서 보기</button></div></div>';
      }).join('');
    }
    return html || '<div class="empty" style="padding:20px">찾는 번호 · 이름이 없습니다.</div>';
  }

  function open(initial) {
    var opened = UI.open({
      title: '🔍 번호 · 이름 찾기',
      body: '<input id="lk-q" class="lk-input" type="search" inputmode="search" autocomplete="off" placeholder="010-1234-5678 · 5678 · 이름 · 호실 · 사업자번호" value="' + U.esc(initial || '') + '">' +
        '<div id="lk-res" class="lk-res">' + resultsHTML(initial) + '</div>',
      buttons: [{ label: '닫기', onClick: UI.close }]
    });
    var inp = opened.body.querySelector('#lk-q'), res = opened.body.querySelector('#lk-res');
    inp.addEventListener('input', function () { res.innerHTML = resultsHTML(inp.value); });
    setTimeout(function () { inp.focus(); }, 30);
  }

  App.views.lookup = {
    open: open,
    search: search,
    handlers: { lookupOpen: function () { open(''); } }
  };
})(window.App);

</script>
<script>

    { key: 'regional', label: '지역장님 소유 주택', ico: '👤', keepDisposed: true, desc: '엠엔케이 · 김무성 명의 개인주택(경주비룡 · 광주 탑빌리지). 우리 보유 집계에는 넣지 않고, 운영 계좌 입출금과 월세만 따로 관리합니다.' }
  ];
  var CAT = {}; CATS.forEach(function (c) { CAT[c.key] = c; });
  var ASSET_CATS = CATS.filter(function (c) { return c.key !== 'common'; });
  var ACCT_CATS = [{ value: '', label: '(미지정 — 누락으로 표시)' }]
    .concat(ASSET_CATS.map(function (c) { return { value: c.key, label: c.ico + ' ' + c.label }; }))
    .concat([{ value: 'other', label: '🧾 기타 (부동산 중개 · 회사 운영 등)' }]);
  var FREQ = { daily: '매일', weekly: '매주', monthly: '매월', months: '정해진 달' };

  /* ---------- 기본 업무 ---------- */
  function T(cat, key, freq, title, detail, extra) {
    return Object.assign({ id: cat + ':' + key, cat: cat, freq: freq, title: title, detail: detail }, extra || {});
  }
  var TAX = '세무 일정은 일반 기준입니다. 실제 대상 · 기한은 세무사에게 확인하세요.';
  function rentalTasks(cat, label) {

  }

      T('building', 'vat', 'months', '부가세 신고 · 납부 자료 (건물 · 상가)', '1 · 7월 확정, 4 · 10월 예정(개인은 보통 예정고지). 기한 25일. ' + TAX, { months: [1, 4, 7, 10], day: 20 })
    ])

  var DEFAULT_ACCOUNTS = [
    ['대구(브라운도트)', ''], ['대구(스테이 김해)', ''], ['대구(스테이 거제)', ''], ['대구(부동산 중개)', ''], ['대구(중개 우대)', ''],
    ['신한(성주)', ''], ['신한(양산)', ''], ['신한(거제)', ''], ['신한(진주성점)', ''], ['우리(중산2호점)', ''],
    ['옆커호텔(신협)', ''], ['옆커호텔(대구)', ''], ['옆커호텔(하나)', ''],
    ['신협(군위)', '서버 연결 없음 — 은행 엑셀로 따로 입력']

  /* ---------- 저장 ---------- */
  function list() { return S.get().acct || []; }
  /** 읽기 전용 설정 (없으면 기본값) — 화면 그리기만으로는 아무것도 쓰지 않는다 */
  function cfg() {
    var c = list().filter(function (r) { return r.id === 'cfg'; })[0];
    return c || { id: 'cfg', start: '', custom: [], hidden: [], bcat: {}, accounts: null };
  }
  /** 쓰기용 설정 — 없으면 만든다 */
  function cfgW() {
    var st = S.get(); st.acct = st.acct || [];
    var c = st.acct.filter(function (r) { return r.id === 'cfg'; })[0];
    if (!c) { c = { id: 'cfg', start: U.todayISO(), custom: [], hidden: [], bcat: {}, accounts: null }; st.acct.push(c); }
    c.custom = c.custom || []; c.hidden = c.hidden || []; c.bcat = c.bcat || {};
    if (!c.accounts) c.accounts = DEFAULT_ACCOUNTS.map(function (a, i) { return { id: 'acc' + i, name: a[0], cat: '', buildingId: '', note: a[1] }; });
    return c;
  }
  function accounts() {
    var c = cfg();
    return c.accounts || DEFAULT_ACCOUNTS.map(function (a, i) { return { id: 'acc' + i, name: a[0], cat: '', buildingId: '', note: a[1] }; });
  }
  function startDate() { return cfg().start || U.todayISO(); }
  function doneMap() {
    var m = {};
    list().forEach(function (r) { if (r.key) m[r.key] = r; });
    return m;
  }
  function prune() {
    var st = S.get(), limit = U.addDays(U.todayISO(), -400);
    st.acct = (st.acct || []).filter(function (r) { return !r.key || (r.at || '') >= limit || r.note; });
  }

  function tasks(all) {
    var c = cfg(), hidden = {};
    (c.hidden || []).forEach(function (h) { hidden[h] = 1; });
    return DEFAULT_TASKS.concat(c.custom || []).filter(function (t) { return all || !hidden[t.id]; });
  }

  /* ---------- 기간 계산 ---------- */
  function monday(iso) { var d = U.parseDate(iso); return U.addDays(iso, -((d.getDay() + 6) % 7)); }
  function monthsOf(t) { return (t.months || []).map(Number); }
  function current(t, today) {
    var ym = today.slice(0, 7), m = Number(today.slice(5, 7));
    if (t.freq === 'daily') return { key: today, due: today, end: today, label: '오늘' };
    if (t.freq === 'weekly') { var mon = monday(today); return { key: 'W' + mon, due: U.addDays(mon, 4), end: U.addDays(mon, 6), label: '이번 주' }; }
    if (t.freq === 'monthly' || (t.freq === 'months' && monthsOf(t).indexOf(m) >= 0)) {
      return { key: ym, due: U.dueDateOf(ym, t.day || 31), end: U.toISO(U.monthEnd(ym)), label: m + '월' };
    }
    return null;
  }
  /** 지난 기간 중 시작일 이후인 것 (daily는 최근 7일) */
  function previous(t, today, start) {
    var out = [];
    if (t.freq === 'daily') {
      for (var i = 1; i <= 7; i++) { var d = U.addDays(today, -i); if (d >= start) out.push({ key: d, label: U.fmtDate(d) }); }
    } else if (t.freq === 'weekly') {
      var pm = U.addDays(monday(today), -7);
      if (U.addDays(pm, 6) >= start) out.push({ key: 'W' + pm, label: U.fmtDate(pm) + ' 주' });
    } else {
      var ym = today.slice(0, 7);
      for (var k = 1; k <= 12; k++) {
        var p = U.addMonths(ym, -k), pm2 = Number(p.slice(5, 7));
        if (t.freq === 'monthly' || monthsOf(t).indexOf(pm2) >= 0) {
          if (U.toISO(U.monthEnd(p)) >= start) out.push({ key: p, label: U.fmtMonth(p) });
          break;
        }
      }
    }
    return out;
  }
  function nextMonthLabel(t, today) {
    var ym = today.slice(0, 7);
    for (var k = 1; k <= 12; k++) {
      var n = U.addMonths(ym, k);
      if (monthsOf(t).indexOf(Number(n.slice(5, 7))) >= 0) return U.fmtMonth(n);
    }
    return '';
  }

  /** 업무 하나의 지금 상태 */
  function status(t, dm, today, start) {
    var cur = current(t, today);
    var rec = cur ? dm[t.id + '@' + cur.key] : null;
    var missed = previous(t, today, start).filter(function (p) { var r = dm[t.id + '@' + p.key]; return !(r && r.done); });
    var st = !cur ? 'off' : rec && rec.done ? 'done' : (cur.due < today ? 'late' : (cur.due <= today || t.freq === 'daily' || t.freq === 'weekly') ? 'today' : 'open');
    return { t: t, cur: cur, rec: rec, st: st, missed: missed, next: cur ? '' : nextMonthLabel(t, today) };
  }

  /* ---------- 물건 분류 ---------- */
  function autoCat(b) {
    if (S.isLodging(b)) return 'lodging';
    if (b.kind === '상가') return 'building';
    if (b.owner === '개인') return 'personal';
    if (b.owner === '법인' || b.owner === '옆커폰' || b.owner === '옆커호텔') return 'corp';
    return '';
  }
  function catOf(b) { return (cfg().bcat || {})[b.id] || autoCat(b); }
  function heldBuildings() {
    var keep = {}; CATS.forEach(function (c) { if (c.keepDisposed) keep[c.key] = 1; });
    return S.get().buildings.filter(function (b) { return !S.isDisposed(b) || keep[(cfg().bcat || {})[b.id]]; });
  }
  function monthlyRent(bid) {
    return U.sum(S.unitsOf(bid), function (u) { var c = S.activeContract(u.id); return c ? U.num(c.rent) + U.num(c.maintenanceFee) : 0; });
  }

  /* ---------- 요약 · 누락 ---------- */
  function compute() {
    var today = U.todayISO(), start = startDate(), dm = doneMap();
    var rows = tasks().map(function (t) { return status(t, dm, today, start); });
    var bs = heldBuildings();
    var unclassB = bs.filter(function (b) { return !catOf(b); });
    var unmappedA = accounts().filter(function (a) { return !a.cat; });
    var emptyCats = ASSET_CATS.filter(function (c) { return !c.noAsset && !bs.some(function (b) { return catOf(b) === c.key; }); });
    return { rows: rows, bs: bs, unclassB: unclassB, unmappedA: unmappedA, emptyCats: emptyCats, today: today, start: start };
  }
  function summary() {
    var c = compute();
    var late = c.rows.filter(function (r) { return r.st === 'late'; }).length;
    var missed = U.sum(c.rows, function (r) { return r.missed.length; });
    return {
      today: c.rows.filter(function (r) { return r.st === 'today'; }).length,
      missed: late + missed,
      unclassified: c.unclassB.length + c.unmappedA.length + c.emptyCats.length

  }

  /* ---------- 화면 ---------- */
  var ST_BADGE = { done: ['완료', 'badge-ok'], late: ['기한 지남', 'badge-danger'], today: ['오늘 할 일', 'badge-warn'], open: ['이번 기간', 'badge-info'], off: ['이번 기간 아님', 'badge-muted'] };

      UI.stat('분류 확인 필요', (c.unclassB.length + c.unmappedA.length + c.emptyCats.length) + '건', '물건 ' + c.unclassB.length + ' · 계좌 ' + c.unmappedA.length + ' · 빈 구분 ' + c.emptyCats.length,
