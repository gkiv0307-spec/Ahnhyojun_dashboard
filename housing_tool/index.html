<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옆커폰 주택관리 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 옆커폰 주택관리 현황
   색: 잉크 네이비 + 딥 씨블루 강조, 차가운 슬레이트 중립색
   서체: IBM Plex Sans KR(UI) + IBM Plex Mono(금액·날짜 등 수치)
   레이아웃: 좌측 고정 내비 + 요약 타일 띠 + 표를 담는 패널 */

:root {
  --ground: #eceff3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --line: #dde3ea;
  --line-strong: #c3ccd7;
  --ink: #132433;
  --muted: #5c6b7b;
  --faint: #8695a5;
  --accent: #1d5b8f;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecf5;
  --ok: #0f7a52;
  --ok-soft: #e0f1e9;
  --warn: #a5680b;
  --warn-soft: #f8eeda;
  --danger: #b3352b;
  --danger-soft: #f9e6e4;
  --special: #6a46b0;
  --special-soft: #f0eafa;
  --lift: 0 12px 32px rgba(19, 36, 51, .18);
  --radius: 8px;
  --rail: 214px;
  --font-ui: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111820;
    --surface: #19212b;
    --surface-2: #202935;
    --line: #2a343f;
    --line-strong: #3b4855;
    --ink: #e3e9f0;
    --muted: #93a2b3;
    --faint: #6f8093;
    --accent: #74aede;
    --accent-ink: #0d1520;
    --accent-soft: #1d2d3d;
    --ok: #4dbf8d;
    --ok-soft: #16302a;
    --warn: #dba556;
    --warn-soft: #33291a;
    --danger: #ef8375;
    --danger-soft: #38211f;
    --special: #b9a0ec;
    --special-soft: #2a2339;
    --lift: 0 12px 32px rgba(0, 0, 0, .45);
  }
}

:root[data-theme="dark"] {
  --ground: #111820;
  --surface: #19212b;
  --surface-2: #202935;
  --line: #2a343f;
  --line-strong: #3b4855;
  --ink: #e3e9f0;
  --muted: #93a2b3;
  --faint: #6f8093;
  --accent: #74aede;
  --accent-ink: #0d1520;
  --accent-soft: #1d2d3d;
  --ok: #4dbf8d;
  --ok-soft: #16302a;
  --warn: #dba556;
  --warn-soft: #33291a;
  --danger: #ef8375;
  --danger-soft: #38211f;
  --special: #b9a0ec;
  --special-soft: #2a2339;
  --lift: 0 12px 32px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
a { color: inherit; text-decoration: none; }
input, select, textarea, button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

#app { display: flex; min-height: 100vh; }

/* ---------- 좌측 내비 ---------- */
.sidebar {
  width: var(--rail);
  flex: 0 0 var(--rail);
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 16px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
}
.brand-text strong { display: block; font-size: 15px; font-weight: 600; }
.brand-text small { color: var(--faint); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 1px; padding: 4px 10px; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 7px; color: var(--muted); font-weight: 500;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav { overflow-y: auto; scrollbar-width: thin; }
.nav-ico { width: 20px; text-align: center; font-size: 15px; line-height: 1; flex: none; }
.nav-label { flex: 1; min-width: 0; }
.nav-group { padding: 14px 10px 4px; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .04em; }
.nav-group:first-child { padding-top: 4px; }
.nav-badge { flex: none; min-width: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; background: var(--danger-soft); color: var(--danger); font-family: var(--font-num); }
.nav-badge.warn { background: var(--warn-soft); color: var(--warn); }
.nav-badge.info { background: var(--accent-soft); color: var(--accent); }
.sidebar-foot {
  padding: 12px 16px; font-size: 11px; color: var(--faint);
  border-top: 1px solid var(--line); line-height: 1.45;
}

/* ---------- 본문 ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 24px; background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.topbar-title { flex: 1; min-width: 0; }
.topbar-title h1 { font-size: 17px; }
.topbar-title p { margin: 1px 0 0; font-size: 12px; color: var(--faint); }
.topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.view { padding: 20px 24px 56px; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 7px;
  border: 1px solid var(--line-strong); background: var(--surface);
  cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.1); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }
.icon-btn {
  border: none; background: transparent; cursor: pointer;
  width: 32px; height: 32px; border-radius: 7px; font-size: 16px; color: var(--muted);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.only-mobile { display: none; }

/* ---------- 패널 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.view > .card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.card-head h3 { font-size: 13.5px; }
.card-head .spacer, .spacer { flex: 1; }
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }
.grid { display: grid; gap: 14px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- 요약 타일 ---------- */
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
.stat-label {
  font-size: 11px; color: var(--muted); font-weight: 500;
  letter-spacing: .04em; text-transform: none;
}
.stat-value {
  font-family: var(--font-num); font-size: 21px; font-weight: 600;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.25;
}
.stat-sub { font-size: 11.5px; color: var(--faint); }
.stat-value.danger { color: var(--danger); }
.stat-value.ok { color: var(--ok); }

/* ---------- 탭 ---------- */
.tabs {
  display: flex; gap: 2px; overflow-x: auto; margin-bottom: 16px;
  border-bottom: 1px solid var(--line); scrollbar-width: thin;
}
.tab {
  flex: 0 0 auto; padding: 9px 13px; border: none; background: transparent;
  border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500;
  cursor: pointer; white-space: nowrap; border-radius: 6px 6px 0 0;
}
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .cnt { margin-left: 6px; font-size: 11px; font-family: var(--font-num); color: var(--faint); }
.tab.active .cnt { color: var(--accent); }
.tab-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 14px; }
.tab-meta .m { font-size: 12px; color: var(--muted); }
.tab-actions { display: flex; gap: 8px; flex: 0 0 auto; }
.tab-meta .m b { font-family: var(--font-num); color: var(--ink); font-weight: 600; margin-left: 4px; }

/* ---------- 표 ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th {
  font-size: 11.5px; color: var(--muted); font-weight: 500; background: var(--surface-2);
  position: sticky; top: 0; letter-spacing: .02em;
}
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; }
td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td.actions { text-align: right; }
.t-dim { color: var(--muted); }
.t-faint { color: var(--faint); }
.t-strong { font-weight: 600; }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- 상태 칩 ---------- */
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; border: 1px solid transparent;
  font-family: var(--font-ui);
}
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--accent-soft); color: var(--accent); }
.badge-muted { background: var(--surface-2); color: var(--muted); border-color: var(--line); }

/* ---------- 폼 ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field .req { color: var(--danger); }
.field input, .field select, .field textarea {
  padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 7px;
  background: var(--surface); width: 100%;
}
.field input[type="date"], .field input[inputmode="numeric"] { font-family: var(--font-num); }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field textarea { min-height: 64px; resize: vertical; }
.field .hint { font-size: 11px; color: var(--faint); }
.field .err { font-size: 11px; color: var(--danger); }
.inline-input {
  padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 7px;
  background: var(--surface); font-family: var(--font-num);
}
.check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.check input { width: auto; }

/* ---------- 모달 ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10, 20, 30, .5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; z-index: 100; overflow-y: auto;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface); border-radius: 10px; width: min(620px, 100%);
  box-shadow: var(--lift); border: 1px solid var(--line);
}
.modal-head { display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 15px; flex: 1; }
.modal-body { padding: 18px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 13px 18px; border-top: 1px solid var(--line); }

/* ---------- 도움말 ---------- */
.help {
  display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px;
  border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--faint); font-size: 10px; font-weight: 700; line-height: 1;
  cursor: help; vertical-align: middle; flex: 0 0 auto; user-select: none; opacity: .55;
}
.help:hover, .help:focus-visible { opacity: 1; }
.help:hover, .help:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card-head h3 .help { vertical-align: 1px; }
.tip {
  position: fixed; z-index: 300; max-width: 280px; padding: 9px 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong);
  border-radius: 8px; box-shadow: var(--lift); font-size: 12.5px; line-height: 1.55;
  pointer-events: none; white-space: pre-line;
}
.tip[hidden] { display: none; }

/* ---------- 토스트 ---------- */
.toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast {
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 7px; padding: 10px 14px; box-shadow: var(--lift); font-size: 13px; max-width: 320px;
}
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }

/* ---------- 빈 상태 ---------- */
.empty { padding: 34px 16px; text-align: center; color: var(--faint); }
.empty strong { display: block; color: var(--muted); margin-bottom: 6px; font-size: 14px; font-weight: 600; }

/* ---------- 차트 ---------- */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 8px 4px 0; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.chart-bars { flex: 1; display: flex; align-items: flex-end; gap: 3px; width: 100%; justify-content: center; }
.chart-bar { width: 13px; border-radius: 2px 2px 0 0; background: var(--accent); min-height: 2px; }
.chart-bar.out { background: var(--danger); opacity: .8; }
.chart-x { font-size: 11px; color: var(--faint); font-family: var(--font-num); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

/* ---------- 진행 바 ---------- */
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: var(--ok); }

.list-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: none; }
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-title { font-weight: 500; }
.list-item .li-sub { font-size: 12px; color: var(--faint); }
.ho-done .li-title { text-decoration: line-through; color: var(--faint); }
.ho-done .li-sub { opacity: .7; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select {
  padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface);
}

/* ---------- 호실 계약 이력 ---------- */
.hist { display: flex; flex-direction: column; }
.hist-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); position: relative; }
.hist-row:last-child { border-bottom: none; }
.hist-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); margin-top: 6px; flex: 0 0 auto; }
.hist-row.active .hist-dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.hist-row .li-main { flex: 1; min-width: 0; }
.hist-row .li-sub { font-size: 12px; color: var(--faint); }
/* ---------- 대시보드: 오늘 챙길 일 · 칩 · 공실 묶음 ---------- */
.t-danger { color: var(--danger); }
.todo-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.todo-row:last-child { border-bottom: none; }
.todo-row:first-child { padding-top: 2px; }
.todo-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--accent); }
.todo-row.danger .todo-dot { background: var(--danger); }
.todo-row.warn .todo-dot { background: var(--warn); }
.todo-row .li-main { flex: 1; min-width: 0; }
.todo-row .li-sub { font-size: 12px; color: var(--faint); margin-top: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 4px; }
.chip {
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; cursor: pointer;
}
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip .cnt { font-family: var(--font-num); font-size: 11px; opacity: .8; }
.vac-group { padding: 8px 0; border-bottom: 1px solid var(--line); }
.vac-group:last-child { border-bottom: none; }
.vac-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.vac-units { font-size: 12.5px; color: var(--muted); line-height: 1.7; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
@media (max-width: 1020px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .only-mobile { display: inline-flex; }
  .sidebar {
    position: fixed; z-index: 60; transform: translateX(-100%);
    transition: transform .18s ease; box-shadow: var(--lift);
  }
  .sidebar.open { transform: translateX(0); }
  .view { padding: 16px 14px 48px; }
  .topbar { padding: 12px 14px; flex-wrap: wrap; align-items: center; }
  .topbar #menu-btn { order: 0; }
  .topbar-title { order: 1; flex: 1 1 auto; }
  .topbar-title h1 { font-size: 16px; }
  .topbar-title p { display: none; }
  .topbar-actions { order: 2; flex-basis: 100%; justify-content: flex-start; }
  .topbar-actions:empty { display: none; }
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 12px 13px; }
  .stat-value { font-size: 18px; }
  .todo-row { flex-wrap: wrap; }
  .todo-row .btn { margin-left: 21px; }
  .hide-m { display: none; }
  th, td { padding: 8px 10px; }
  .form-grid { grid-template-columns: 1fr; }
  .ho-item { flex-wrap: wrap; }
  .ho-item .ho-actions { flex: 1 1 100% !important; max-width: none !important; justify-content: flex-end; }
  .ho-item > div:not(.ho-actions) { min-width: 0; flex: 1 1 0; }
}

/* 시트 내보내기 */
.ex-list { display: flex; flex-direction: column; gap: 2px; }
.ex-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-row:first-child { border-top: 0; }
.ex-main { flex: 1; min-width: 0; }
.ex-count { margin-left: 8px; font-size: 12px; color: var(--muted); }
.ex-steps { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 13px; }
.ex-steps li { margin: 0; }

<script>
/* 공통 유틸리티 */
var App = window.App || {};
window.App = App;

App.util = (function () {
  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- 날짜 ---------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function toISO(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function parseDate(iso) {
    if (!iso) return null;
    var p = String(iso).split('-');
    if (p.length < 3) return null;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return isNaN(d.getTime()) ? null : d;
  }

  function today() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function todayISO() { return toISO(today()); }

  function daysInMonth(year, month /* 1-12 */) {
    return new Date(year, month, 0).getDate();
  }

  /** 'YYYY-MM' 형식의 월 키 */
  function monthKey(iso) { return String(iso || '').slice(0, 7); }

  function currentMonth() { return monthKey(todayISO()); }

  function parseMonth(ym) {
    var p = String(ym).split('-');
    return { year: Number(p[0]), month: Number(p[1]) };
  }

  function monthStart(ym) {
    var m = parseMonth(ym);
    return new Date(m.year, m.month - 1, 1);
  }

  function monthEnd(ym) {
    var m = parseMonth(ym);
    return new Date(m.year, m.month, 0);
  }

  function addMonths(ym, delta) {
    var m = parseMonth(ym);
    var d = new Date(m.year, m.month - 1 + delta, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }

  /** 납부일(1~31)을 해당 월의 실제 날짜로 보정 */
  function dueDateOf(ym, payDay) {
    var m = parseMonth(ym);
    var last = daysInMonth(m.year, m.month);
    var day = Math.min(Math.max(Number(payDay) || 1, 1), last);
    return m.year + '-' + pad2(m.month) + '-' + pad2(day);
  }

  /** a에서 b까지의 일수 (b - a) */
  function diffDays(aISO, bISO) {
    var a = parseDate(aISO), b = parseDate(bISO);
    if (!a || !b) return 0;
    return Math.round((b - a) / 86400000);
  }

  function addDays(iso, n) {
    var d = parseDate(iso);
    if (!d) return iso;
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  /** 날짜에 n개월을 더한다. 말일은 대상 월의 마지막 날로 보정한다. */
  function addMonthsDate(iso, n) {
    var d = parseDate(iso);
    if (!d) return iso;
    var y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
    var target = new Date(y, m, 1);
    var last = daysInMonth(target.getFullYear(), target.getMonth() + 1);
    return toISO(new Date(target.getFullYear(), target.getMonth(), Math.min(day, last)));
  }

  function fmtDate(iso) {
    if (!iso) return '-';
    var p = String(iso).split('-');
    if (p.length < 3) return iso;
    return p[0].slice(2) + '.' + p[1] + '.' + p[2];
  }

  function fmtMonth(ym) {
    var m = parseMonth(ym);
    return m.year + '년 ' + m.month + '월';
  }

  /* ---------- 숫자 / 금액 ---------- */
  function num(v) {

<script>
/* 청구 · 수납 계산 로직 */
(function (App) {
  var U = App.util;
  var S = function () { return App.store; };

  /** 청구서 합계 재계산 */
  function recalc(inv) {
    var extras = U.sum(inv.extras || [], function (e) { return e.amount; });
    inv.total = U.num(inv.rent) + U.num(inv.maintenanceFee) + extras;
    return inv.total;
  }

  function paidAmount(inv) {
    return U.sum(inv.payments || [], function (p) { return p.amount; });
  }

  function remaining(inv) {
    return Math.max(0, U.num(inv.total) - paidAmount(inv));
  }

  /** 'paid' | 'partial' | 'overdue' | 'unpaid' */
  function status(inv, refISO) {
    var ref = refISO || U.todayISO();
    var rest = remaining(inv);
    if (rest <= 0) return 'paid';
    if (inv.dueDate < ref) return 'overdue';
    return paidAmount(inv) > 0 ? 'partial' : 'unpaid';
  }

  var STATUS_LABEL = { paid: '완납', partial: '부분수납', overdue: '연체', unpaid: '미납' };
  var STATUS_BADGE = { paid: 'badge-ok', partial: 'badge-warn', overdue: 'badge-danger', unpaid: 'badge-muted' };

  function statusBadge(inv, refISO) {
    var st = status(inv, refISO);
    return '<span class="badge ' + STATUS_BADGE[st] + '">' + STATUS_LABEL[st] + '</span>';
  }

  /** 보증금 상계로 처리한 금액 (실제 입금과 구분) */
  function offsetAmount(inv) {
    return (inv.payments || []).reduce(function (s, p) { return s + (p.method === '상계' ? Number(p.amount) || 0 : 0); }, 0);
  }
  function offsetBadge(inv) {
    var o = offsetAmount(inv);
    return o ? ' <span class="badge badge-special" title="보증금에서 상계한 금액 — 통장 입금 아님">보증금 상계 ' + U.comma(o) + '</span>' : '';
  }
  function methodLabel(p) {
    return p.method === '상계' ? '<span class="badge badge-special">보증금 상계</span>' : U.esc(p.method || '');
  }

  /** 납부기한 초과 일수 */
  function overdueDays(inv, refISO) {
    if (remaining(inv) <= 0) return 0;
    var d = U.diffDays(inv.dueDate, refISO || U.todayISO());
    return d > 0 ? d : 0;
  }

  /** 연체료 = 미납액 × 연이율 × 연체일수 / 365 */
  function lateFee(inv, refISO) {
    var rate = U.num(S().get().settings.lateFeeRate);
    var days = overdueDays(inv, refISO);
    if (!rate || !days) return 0;
    return Math.round(remaining(inv) * (rate / 100) * (days / 365));
  }

  /** 해당 월에서 계약이 유효한 일수 / 그 달의 총 일수 */
  function coverage(contract, ym) {
    var mStart = U.toISO(U.monthStart(ym));
    var mEnd = U.toISO(U.monthEnd(ym));
    var from = contract.startDate > mStart ? contract.startDate : mStart;
    var to = (contract.endDate && contract.endDate < mEnd) ? contract.endDate : mEnd;
    var total = U.diffDays(mStart, mEnd) + 1;
    var days = U.diffDays(from, to) + 1;
    return { days: Math.max(0, days), total: total, from: from, to: to, partial: days < total };
  }

  /**
   * 한 달치 청구서를 만든다. 이미 있는 청구서는 건드리지 않는다.
   * @returns {{created:number, skipped:number, ym:string}}
   */
  function generateMonth(ym, opts) {
    opts = opts || {};
    var store = S();
    var st = store.get();
    var prorate = opts.prorate != null ? opts.prorate : st.settings.prorateFirstMonth;
    var created = 0, skipped = 0;

    store.contractsInMonth(ym).forEach(function (c) {
      if (store.invoiceOf(c.id, ym)) { skipped++; return; }
      if (c.noBilling) { skipped++; return; }   // 청구서를 만들지 않는 계약 (회계에서 따로 확인)
      var cov = coverage(c, ym);
      if (cov.days <= 0) { skipped++; return; }

      var ratio = (prorate && cov.partial) ? cov.days / cov.total : 1;
      var rent = Math.round(U.num(c.rent) * ratio / 10) * 10;
      var fee = Math.round(U.num(c.maintenanceFee) * ratio / 10) * 10;
      if (rent === 0 && fee === 0) { skipped++; return; }

      var inv = {
        id: U.uid('inv'),
        contractId: c.id,
        unitId: c.unitId,
        ym: ym,
        dueDate: U.dueDateOf(ym, c.payDay),
        rent: rent,
        maintenanceFee: fee,
        extras: [],
        payments: [],
        prorated: ratio !== 1,
        proratedDays: cov.days,
        memo: ratio !== 1 ? (cov.days + '/' + cov.total + '일 일할계산') : '',
        createdAt: U.todayISO()
      };
      recalc(inv);
      st.invoices.push(inv);
      created++;
    });

    if (created) store.commit();
    return { created: created, skipped: skipped, ym: ym };
  }

  function addPayment(invId, payment) {
    var inv = S().invoice(invId);
    if (!inv) return null;
    payment.id = U.uid('pay');
    inv.payments.push(payment);
    S().commit();
    return inv;
  }

  function removePayment(invId, payId) {
    var inv = S().invoice(invId);
    if (!inv) return;
    inv.payments = inv.payments.filter(function (p) { return p.id !== payId; });
    S().commit();
  }

  /** 남은 금액을 전액 수납 처리 */
  function settle(invId, dateISO, method) {
    var inv = S().invoice(invId);
    if (!inv) return null;
    var rest = remaining(inv);
    if (rest <= 0) return inv;
    return addPayment(invId, {
      date: dateISO || U.todayISO(),
      amount: rest,
      method: method || '계좌이체',
      memo: ''
    });
  }

  /* ---------- 집계 ---------- */

  /** 특정 월의 청구/수납 요약 */
  function monthStats(ym) {
    var invoices = S().invoicesOfMonth(ym);
    var billed = U.sum(invoices, function (i) { return i.total; });
    var collected = U.sum(invoices, function (i) { return Math.min(paidAmount(i), i.total); });
    var unpaidList = invoices.filter(function (i) { return remaining(i) > 0; });
    return {
      ym: ym,
      count: invoices.length,
      billed: billed,
      collected: collected,
      unpaid: billed - collected,
      unpaidCount: unpaidList.length,
      overdueCount: invoices.filter(function (i) { return status(i) === 'overdue'; }).length,
      rate: U.pct(collected, billed),
      invoices: invoices
    };
  }

  /** 통장 대사로 확인한 입금이 들어 있는 청구서인가 (입금 메모에 '통장') */
  function isBankVerified(inv) {
    return (inv.payments || []).some(function (p) { return /통장/.test(p.memo || ''); });
  }

  /** 일부만 덜 들어온 소액 잔액(청구액의 30% 이하)인가.
   *  관리표를 옮기며 금액이 앞뒤 달로 나뉘어 생긴 착오인 경우가 많아, 미납 문자 전에 통장 확인이 필요하다. */
  function isSmallResidual(inv) {
    var rest = remaining(inv);
    return paidAmount(inv) > 0 && rest > 0 && rest <= U.num(inv.total) * 0.3;
  }

  /** 전체 미납(연체 포함) 청구서 — 오래된 순 */
  function unpaidInvoices() {
    return U.sortBy(
      S().get().invoices.filter(function (i) { return remaining(i) > 0 && !S().isHeld(i.unitId); }),
      function (i) { return i.dueDate; }
    );
  }

  /** 공실 현황 */
  function occupancy(refISO) {
    var store = S();
    // 숙박업 물건의 객실, 매각 · 이전한 물건의 호실은 월세 입주·공실 계산에서 뺀다
    var units = store.get().units.filter(function (u) {
      var b = store.building(u.buildingId);
      return !u.holder && !store.isLodging(b) && !store.isDisposed(b);
    });
    var occupied = units.filter(function (u) { return !!store.activeContract(u.id, refISO); });
    return {
      total: units.length,
      occupied: occupied.length,
      vacant: units.length - occupied.length,
      rate: U.pct(occupied.length, units.length),
      vacantUnits: units.filter(function (u) { return !store.activeContract(u.id, refISO); })
    };
  }

  /** 만기 임박 계약 (기본 60일 이내) */
  function expiring(days) {
    var limit = days || 60;
    var today = U.todayISO();
    return U.sortBy(
      S().activeContracts().filter(function (c) {
        if (!c.endDate) return false;
        var left = U.diffDays(today, c.endDate);
        return left >= 0 && left <= limit;
      }),
      function (c) { return c.endDate; }
    );
  }

  /** 계약 기준 월 예상 수입 (월세 + 관리비) */
  function expectedMonthly(refISO) {
    var list = S().activeContracts(refISO);
    return {
      rent: U.sum(list, function (c) { return c.rent; }),
      maintenance: U.sum(list, function (c) { return c.maintenanceFee; }),
      deposit: U.sum(list, function (c) { return c.deposit; })
    };
  }

  /** 실제 입금일 기준 월별 수입 */
  /** 청구서를 만들지 않는 계약(noBilling)에 바로 기록한 입금 — 청구서 입금처럼 쓰도록 {inv, p} 모양으로 돌려준다 */
  function receiptRows() {
    var out = [];
    S().get().contracts.forEach(function (c) {
      (c.receipts || []).forEach(function (p) {
        out.push({ inv: { id: '', contractId: c.id, unitId: c.unitId, ym: '', total: 0, rent: 0 }, p: p, c: c, receipt: true });
      });
    });
    return out;
  }

  function incomeByMonth(year) {
    var map = {};
    receiptRows().forEach(function (r) {
      var ym = U.monthKey(r.p.date);
      if (year && ym.slice(0, 4) !== String(year)) return;
      if (!map[ym]) map[ym] = { total: 0, rent: 0, etc: 0 };
      map[ym].total += U.num(r.p.amount); map[ym].rent += U.num(r.p.amount);
    });
    S().get().invoices.forEach(function (inv) {
      var rentShare = U.num(inv.total) ? U.num(inv.rent) / U.num(inv.total) : 0;
      (inv.payments || []).forEach(function (p) {
        var ym = U.monthKey(p.date);
        if (year && ym.slice(0, 4) !== String(year)) return;
        if (!map[ym]) map[ym] = { total: 0, rent: 0, etc: 0 };
        var amt = U.num(p.amount);
        map[ym].total += amt;
        map[ym].rent += Math.round(amt * rentShare);
        map[ym].etc += amt - Math.round(amt * rentShare);
      });
    });
    return map;
  }

  /** 지출일 기준 월별 지출 */
  function expenseByMonth(year) {
    var map = {};
    S().get().expenses.forEach(function (e) {
      var ym = U.monthKey(e.date);
      if (year && ym.slice(0, 4) !== String(year)) return;
      map[ym] = (map[ym] || 0) + U.num(e.amount);
    });
    return map;
  }

  /** 건물별 수입·지출 집계 (연도 필터) */
  function byBuilding(year) {
    var store = S();
    var out = {};
    store.get().buildings.forEach(function (b) {
      out[b.id] = { building: b, income: 0, expense: 0, units: store.unitsOf(b.id).length };
    });
    out[''] = { building: { id: '', name: '미지정' }, income: 0, expense: 0, units: 0 };

    store.get().invoices.forEach(function (inv) {
      var u = store.unit(inv.unitId);
      var key = u && out[u.buildingId] ? u.buildingId : '';
      (inv.payments || []).forEach(function (p) {
        if (year && U.monthKey(p.date).slice(0, 4) !== String(year)) return;
        out[key].income += U.num(p.amount);
      });
    });
    receiptRows().forEach(function (r) {
      if (year && U.monthKey(r.p.date).slice(0, 4) !== String(year)) return;
      var u = store.unit(r.inv.unitId);
      out[u && out[u.buildingId] ? u.buildingId : ''].income += U.num(r.p.amount);
    });
    store.get().expenses.forEach(function (e) {
      if (year && U.monthKey(e.date).slice(0, 4) !== String(year)) return;
      var key = out[e.buildingId] ? e.buildingId : '';
      out[key].expense += U.num(e.amount);
    });

    return Object.keys(out).map(function (k) { return out[k]; })
      .filter(function (r) { return r.building.id || r.income || r.expense; });
  }

  App.billing = {
    recalc: recalc, paidAmount: paidAmount, remaining: remaining,
    status: status, statusBadge: statusBadge, STATUS_LABEL: STATUS_LABEL,
    offsetAmount: offsetAmount, offsetBadge: offsetBadge, methodLabel: methodLabel,
    overdueDays: overdueDays, lateFee: lateFee, coverage: coverage,
    generateMonth: generateMonth, addPayment: addPayment, removePayment: removePayment, settle: settle,
    monthStats: monthStats, unpaidInvoices: unpaidInvoices, isBankVerified: isBankVerified, isSmallResidual: isSmallResidual, occupancy: occupancy,
    expiring: expiring, expectedMonthly: expectedMonthly,
    incomeByMonth: incomeByMonth, receiptRows: receiptRows, expenseByMonth: expenseByMonth, byBuilding: byBuilding
  };
})(window.App);

<script>
/* 클라우드 동기화 — claude.ai 아티팩트로 열었을 때만 동작한다.
   파일로 직접 열면 조용히 건너뛰고 브라우저 저장(localStorage)만 사용한다. */
(function (App) {
  var U = App.util, S = App.store;

  var db = null;
  var downloads = null;
  var status = 'local';          // local | connecting | cloud | error
  var lastSent = {};             // 문서 id -> 마지막으로 주고받은 JSON 문자열
  var pushTimer = null;
  var applying = false;

  var CHUNK = 120;               // 청구서 문서 하나에 담는 최대 건수

  var LABEL = {
    local: '이 브라우저에만 저장됩니다',
    connecting: '클라우드 연결 중…',
    cloud: '클라우드에 저장 · 모든 기기에서 열림',
    error: '클라우드 연결 실패 · 이 브라우저에만 저장됩니다'
  };

  function statusText() { return LABEL[status]; }

  function setStatus(next) {
    status = next;
    var el = document.getElementById('storage-note');
    if (el) el.textContent = (S.get().settings.ownerName ? S.get().settings.ownerName + ' 님 · ' : '') + LABEL[status];
  }

  /** 현재 상태를 저장 문서 단위로 나눈다. 청구서는 연도별로 쪼개 문서 크기 한도를 피한다. */
  function toDocs(state) {
    var safeSettings = JSON.parse(JSON.stringify(state.settings || {}));
    // 자동 백업 비밀문구는 기기 로컬 전용이며 클라우드 문서에 올리지 않는다.
    if (safeSettings.autoBackup) delete safeSettings.autoBackup.token;
    var out = {
      settings: { items: [safeSettings] },
      buildings: { items: state.buildings },
      units: { items: state.units },
      contracts: { items: state.contracts },
      expenses: { items: state.expenses },
      listings: { items: state.listings },
      templates: { items: state.templates },
      handover: { items: state.handover || [] },
      smsLog: { items: state.smsLog || [] },
      saleItems: { items: state.saleItems || [] },
      saleLog: { items: state.saleLog || [] },
      acct: { items: state.acct || [] },
      bizreg: { items: state.bizreg || [] },
      autopay: { items: state.autopay || [] },
      cashrcpt: { items: state.cashrcpt || [] }
    };
    // 중개사는 agentsdb_ 문서에 저장한다. 예전 agents_ 문서는 옛 버전 화면이 순서를 섞어 다시 쓰며
    // 데이터를 망가뜨렸기 때문에 더 이상 쓰지 않는다 (옛 화면은 agentsdb_를 모르므로 건드리지 못한다).
    for (var s2 = 0, part2 = 1; s2 < state.agents.length || part2 === 1; s2 += CHUNK, part2++) {
      out['agentsdb_' + part2] = { items: state.agents.slice(s2, s2 + CHUNK) };
    }
    // 청구서는 연도별로 나누고, 문서 크기 한도(256KB)를 넘지 않도록 다시 쪼갠다
    var groups = U.groupBy(state.invoices, function (i) { return String(i.ym).slice(0, 4) || '0000'; });
    Object.keys(groups).forEach(function (y) {
      var list = groups[y];
      for (var start = 0, part = 1; start < list.length || part === 1; start += CHUNK, part++) {
        out['invoices_' + y + '_' + part] = { items: list.slice(start, start + CHUNK) };
      }
    });
    // 그 해의 청구서를 모두 지운 경우 남아 있는 문서를 비운다
    Object.keys(lastSent).forEach(function (id) {
      if ((id.indexOf('invoices_') === 0 || id.indexOf('agentsdb_') === 0) && !out[id]) out[id] = { items: [] };
    });
    return out;
  }

  function fromDocs(map) {
    var state = { version: 1, settings: {}, buildings: [], units: [], contracts: [],
                  invoices: [], expenses: [], agents: [], listings: [], templates: [], handover: [], smsLog: [], saleItems: [], saleLog: [], acct: [], bizreg: [], autopay: [], cashrcpt: [] };
    // 나눠 저장한 문서는 번호 순서대로 이어 붙인다 (사전순이면 agents_10이 agents_2보다 먼저 와서
    // 순서가 바뀐 채 다시 저장되고, 열린 기기끼리 서로 덮어쓰기를 반복한다)
    var agentsDb = [], legacy = [], hasDb = false;
    function key(id) { return id.split('_').map(function (p) { return /^\d+$/.test(p) ? ('0000000' + p).slice(-8) : p; }).join('_'); }
    Object.keys(map).sort(function (a, b) { return key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0; }).forEach(function (id) {
      var items = (map[id] && map[id].items) || [];
      if (id === 'settings') state.settings = items[0] || {};
      else if (id.indexOf('invoices_') === 0) state.invoices = state.invoices.concat(items);
      else if (id.indexOf('agentsdb_') === 0) { hasDb = true; agentsDb = agentsDb.concat(items); }
      else if (id.indexOf('agents_') === 0) legacy = legacy.concat(items);
      else if (state[id]) state[id] = items;
    });
    // 새 문서가 아직 없으면 예전 agents_를 한 번 옮겨 온다 (중복 id는 하나만)
    if (hasDb) state.agents = agentsDb;
    else {
      var seen = {};
      state.agents = legacy.filter(function (a) { if (!a || seen[a.id]) return false; seen[a.id] = 1; return true; });
    }
    return state;
  }

  function isEmptyState(state) {
    return !state.buildings.length && !state.units.length && !state.contracts.length &&
      !state.invoices.length && !state.expenses.length && !state.agents.length &&
      !state.listings.length && !state.templates.length;
  }

  function push() {
    if (!db || applying) return;
    var docs = toDocs(S.get());
    var writes = [];
    Object.keys(docs).forEach(function (id) {
      var json = JSON.stringify(docs[id]);
      if (lastSent[id] === json) return;
      lastSent[id] = json;
      writes.push(db.doc('state/' + id).set(docs[id]).catch(function (e) {
        delete lastSent[id];
        console.error('저장 실패', id, e);
        if (e && e.code === 'quota_exceeded') {
          App.ui.toast('클라우드 저장 공간이 가득 찼습니다. 오래된 청구서를 정리해 주세요.', 'err');
        } else {
          setStatus('error');
        }
      }));
    });
    return Promise.all(writes);
  }

  function schedulePush() {
    if (!db) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 400);
  }

  function applyRemote(map) {
    applying = true;
    try {
      // 받은 묶음에 없는 문서는 마지막으로 알고 있던 값을 그대로 쓴다 — 일부만 온 스냅샷이
      // 건물 · 계약 · 중개사 같은 데이터를 지운 것으로 오해하지 않게 한다.
      var merged = {};
      Object.keys(lastSent).forEach(function (id) { try { merged[id] = JSON.parse(lastSent[id]); } catch (e) { /* 건너뜀 */ } });
      Object.keys(map).forEach(function (id) { merged[id] = map[id]; lastSent[id] = JSON.stringify(map[id]); });
      S.importJSON(JSON.stringify(fromDocs(merged)));
      // 원격 적용만으로는 아무것도 쓰지 않는다. lastSent는 서버에 실제로 있는 문서 그대로 둔다 —
      // 여기서 다시 나눈 문서로 바꿔 두면, 서버의 묶음 경계(120건)가 이 화면과 다를 때 다음 저장에서
      // 바뀐 문서만 쓰고 경계를 넘어간 청구서가 들어 있는 문서는 쓰지 않아 청구서가 사라진다.
    } catch (e) {
      console.error('원격 데이터 적용 실패', e);
    }
    applying = false;
    clearTimeout(pushTimer);
    if (App.router) App.router.refresh();
  }

  function snapshotToMap(snap) {
    var map = {};
    snap.docs.forEach(function (d) { map[d.id] = d.data() || {}; });
    return map;
  }

  function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setStatus('local'); return; }
    setStatus('connecting');

    window.claude.use('downloads').then(function (d) { downloads = d; }, function () { downloads = null; });

    window.claude.use('db').then(function (store) {
      if (!store) { setStatus('local'); return; }
      db = store;
      return db.collection('state').get().then(function (snap) {
        var map = snapshotToMap(snap);
        var remoteEmpty = isEmptyState(fromDocs(map));
        if (remoteEmpty && !isEmptyState(S.get())) {
          // 이 기기에만 있던 데이터를 클라우드로 올린다
          return push().then(function () { setStatus('cloud'); });
        }
        if (!remoteEmpty) {
          applyRemote(map);
          App.ui.toast('클라우드에 저장된 데이터를 불러왔습니다.', 'ok');
        }
        setStatus('cloud');
      }).then(function () {
        if (!db) return;
        db.collection('state').onSnapshot(function (snap) {
          if (snap.metadata.hasPendingWrites) return;   // 내가 방금 쓴 내용
          if (snap.metadata.fromCache) return;          // 서버 확정 전 일부만 담긴 스냅샷
          var map = snapshotToMap(snap);
          // 예전 agents_ 문서는 옛 화면이 계속 고쳐 써도 무시한다
          var changed = Object.keys(map).some(function (id) { return !/^agents_/.test(id) && lastSent[id] !== JSON.stringify(map[id]); });
          if (changed) applyRemote(map);
        }, function (e) {
          console.error('구독 오류', e);
          if (e && (e.code === 'revoked' || e.code === 'unavailable')) setStatus('error');
        });
        S.subscribe(schedulePush);
      });
    }).catch(function (e) {
      console.error('클라우드 연결 실패', e);
      setStatus('error');
    });
  }

  /** 파일 저장 — 아티팩트 안에서는 downloads 기능을 통해야 실제로 저장된다. */
  function saveFile(filename, content, mime) {
    if (!downloads) return false;
    downloads.save({ filename: filename, data: content }).then(function () {
      App.ui.toast('파일을 저장했습니다.', 'ok');
    }, function (e) {
      if (!e || e.code !== 'declined') App.ui.toast('파일 저장에 실패했습니다.', 'err');
    });
    return true;
  }

  App.sync = {
    connect: connect,
    statusText: statusText,
    isCloud: function () { return status === 'cloud'; },
    saveFile: saveFile,
    hasDownloads: function () { return !!downloads; }
  };
})(window.App);

</script>
<script>
/* 구글 드라이브 연동 — 관리표·지출관리 스프레드시트를 읽어 앱과의 차이를 찾고 반영한다.
   claude.ai 아티팩트로 열었을 때 Google Drive 커넥터를 통해 동작하며,
   파일로 직접 열면 조용히 비활성화된다. 시트 내용을 지우거나 덮어쓰지 않고 '추가'만 한다. */
(function (App) {
  var U = App.util, S = App.store, B = App.billing;
  // ui.js 는 이 파일보다 뒤에 불러오므로, 쓰는 순간에 찾는다
  var UI = {
    open: function (o) { return App.ui.open(o); },
    close: function () { return App.ui.close(); },
    toast: function (m, k) { return App.ui.toast(m, k); }
  };

  var SERVER = 'Google Drive';
  var mcp = null;                 // claude.use('mcp') 결과
  var status = 'init';            // init | ready | none
  var last = { checkedAt: 0, plan: null, error: null, busy: false };
  var listeners = [];

  function notify() { listeners.forEach(function (f) { f(last); }); }

  /* ================= 텍스트 → 행 ================= */
  /**
   * 커넥터가 주는 시트 텍스트는 셀을 쉼표로, 행을 공백으로 잇는다.
   * 행 첫 칸이 비어 있어 행 경계는 " ," 로 보이지만 셀 끝의 공백(" 10 ,")도 같아 보이므로,
   * 헤더의 칸 수(N)를 기준으로 충분히 채워졌을 때만 행을 끝낸다.
   */
  function tokenize(text, isHeader) {
    text = String(text || '').replace(/\\([~*_#\\])/g, '$1');
    var rows = [], row = [], field = '', q = false, N = 0;
    function push() { row.push(field.trim()); field = ''; }
    function endRow() {
      rows.push(row);
      if (isHeader(row)) N = row.length;
      row = [];
    }
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += ch;
      } else if (ch === '"') {
        q = true;
      } else if (ch === ',') {
        push();
      } else if (ch === ' ' && text[i + 1] === ',') {
        push(); i++;
        if (!N || row.length >= N - 3 || row.length > N + 6) endRow();
      } else {
        field += ch;
      }
    }
    push(); if (row.length > 1) endRow();
    return rows;
  }

  function num(v) {
    var s = String(v == null ? '' : v).replace(/[₩,\s원]/g, '');
    if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
    return Number(s);
  }

  /** '26. 05. 04' / '2026-08-10' / '2026. 8. 3' / '25.02.09' → ISO */
  function toISO(s) {
    var m = String(s || '').trim().match(/^(\d{2,4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})/);
    if (!m) return '';
    var y = Number(m[1]); if (y < 100) y += 2000;
    return y + '-' + U.pad2(Number(m[2])) + '-' + U.pad2(Number(m[3]));
  }

  function norm(s) {
    return String(s || '').replace(/\([^)]*\)/g, '').replace(/신협|농협|새마을금고|\d+|\s+|·/g, '').trim();
  }

  var KEYWORDS = [   // 시트 건물명 → 앱 건물명 보조 매칭 (긴 이름부터)
    ['서해화인빌', '김제서해화인빌'], ['한집', '한집시티빌'], ['시그니엘', '군산시그니엘'],
    ['탑빌리지', '광주탑빌리지'], ['비룡', '경주비룡'], ['경주화인빌', '경주화인빌'],
    ['두성', '대구 시지두성'], ['시지', '대구 시지두성'], ['청우', '경주청우아파트'],
    ['희망빌', '사천 희망빌'], ['사동', '경산 오피스텔'], ['경산오피스텔', '경산 오피스텔'],
    ['해오름', '성주 해오름빌'], ['군위', '군위 단독주택'], ['펜타힐즈', '경산 펜타힐즈'],
    ['그랑폴리스', '유천 AK그랑폴리스'], ['제니스', '수성 위브더제니스'], ['브라운도트', '포항 브라운도트']
  ];

  function findBuilding(sheetName) {
    var n = norm(sheetName);
    if (!n) return null;
    var bs = S.get().buildings.slice().sort(function (a, b) { return norm(b.name).length - norm(a.name).length; });
    for (var i = 0; i < bs.length; i++) {
      var bn = norm(bs[i].name);
      if (bn && (n.indexOf(bn) >= 0 || bn.indexOf(n) >= 0)) return bs[i];
    }
    for (var k = 0; k < KEYWORDS.length; k++) {
      if (n.indexOf(norm(KEYWORDS[k][0])) >= 0) {
        var hit = bs.filter(function (b) { return b.name === KEYWORDS[k][1]; })[0];
        if (hit) return hit;
      }
    }
    return null;
  }

  function findUnit(buildingId, name) {
    var key = String(name || '').replace(/\s+/g, '');
    return S.unitsOf(buildingId, true).filter(function (u) { return u.name.replace(/\s+/g, '') === key; })[0] || null;
  }

  /* ================= 임차월세관리표 ================= */
  function isRentHeader(row) {
    return row.indexOf('호실') >= 0 && row.indexOf('월세') >= 0 && row.indexOf('1월') >= 0;
  }

  /** 첫 시트(대표님 명의)만 읽어 행 객체 배열로 만든다 */
  function parseRent(text, year) {
    var rows = tokenize(text, isRentHeader);
    var out = [], col = null, building = '', started = false, notes = [], flags = [];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      if (isRentHeader(row)) {
        if (started) break;                         // 두 번째 시트 헤더 → 중단
        col = {}; row.forEach(function (h, i) { if (h && col[h] == null) col[h] = i; });
        started = true;
        continue;
      }
      if (!started) continue;
      var joined = row.join(',');
      if (/사본|지사장|공실 업체|총 갯수|공실 갯수|월세합계|대출/.test(joined) && !/\d+호/.test(row[col['호실']] || '')) {
        if (/사본|지사장|공실 업체/.test(joined)) break;
        continue;
      }
      var get = function (h) { return col[h] == null ? '' : (row[col[h]] || ''); };
      if (get('건물')) building = get('건물');
      var unitName = get('호실');
      if (!unitName || !/\d/.test(unitName)) continue;

      var months = [];
      for (var m = 1; m <= 12; m++) {
        var v = get(m + '월'), n = num(v);
        months.push(n != null ? n : (/공실/.test(v) ? 'V' : (/미납/.test(v) ? 'M' : null)));
        // 숫자·공실·미납이 아닌 글자("확인필요", "선납", "청소시급" 등)는 사람이 봐야 할 표시다
        if (n == null && v && !/공실|미납/.test(v)) flags.push(building + ' ' + unitName + ' ' + m + '월 칸: "' + v + '"');
      }
      var rec = {
        buildingName: building, unitName: unitName,
        tenant: get('이름').trim(), phone: get('연락처').trim(),
        type: get('임차') || '월세',
        start: toISO(get('계약시작') || get('계약기간').split(/[~\-]/)[0]),
        end: toISO(get('계약종료') || (get('계약기간').split(/[~\-]/)[1] || '')),
        deposit: (num(get('보증금')) || 0) * 10000,
        rent: (num(get('월세')) || 0) * 10000,
        fee: (num(get('관리비')) || 0) * 10000,
        payDay: Number((get('월입금일').match(/\d+/) || [0])[0]) || 0,
        months: months,
        total: num(get('총입금액')) || 0,
        arrears: num(get('미납금')) || 0,
        memo: [get('비고'), get('호실별 특이사항 및 요구조건')].filter(Boolean).join(' · '),
        year: year
      };
      var sum = 0; months.forEach(function (x) { if (typeof x === 'number') sum += x; });
      rec.monthSum = sum;
      if (rec.total && sum !== rec.total) notes.push(unitName + ': 월별 합 ' + U.comma(sum) + ' ≠ 총입금액 ' + U.comma(rec.total));
      out.push(rec);
    }
    if (!started) throw new Error('관리표 헤더(건물·호실·월세·1월)를 찾지 못했습니다. 파일이 맞는지 확인하세요.');
    return { rows: out, notes: notes, flags: flags };
  }

  /* ================= 주택 지출관리 ================= */
  function isExpenseHeader(row) {
    return row.indexOf('구분') >= 0 && row.indexOf('지출일자') >= 0 && row.indexOf('지출항목') >= 0;
  }

  function category(text) {
    var t = String(text).replace(/\s/g, '');
    if (/재산세|등록면허세|취득세/.test(t)) return '세금';
    if (/중개수수료|복비/.test(t)) return '중개수수료';
    if (/청소/.test(t)) return '청소·관리';
    if (/관리비|전기|가스|수도|수신료|공과/.test(t)) return '공과금';
    if (/수리|교체|도배|장판|공사|설치|인테리어|방충|누수|보일러|에어컨|배관|리모컨|호스|구매|구입|도어락|인터폰/.test(t)) return '수선비';
    if (/이자/.test(t)) return '대출이자';
    return '기타';
  }

  function parseExpense(text) {
    var rows = tokenize(text, isExpenseHeader);
    var out = [], col = null;
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      if (isExpenseHeader(row)) {
        col = {}; row.forEach(function (h, i) { h = h.trim(); if (h && col[h] == null) col[h] = i; });
        continue;
      }
      if (!col) continue;
      var get = function (h) { return col[h] == null ? '' : (row[col[h]] || ''); };
      var date = toISO(get('지출일자')), amount = num(get('금액'));
      if (!date || amount == null || amount <= 0) continue;
      out.push({ date: date, buildingName: get('구분'), unitName: get('호수'),
                 item: get('지출항목'), amount: amount, method: get('결제수단') });
    }
    if (!col) throw new Error('지출관리 헤더(구분·지출일자·지출항목)를 찾지 못했습니다.');
    return out;
  }

  /* ================= 차이 비교 ================= */
  function paidInMonth(contractId, ym) {
    var sum = 0;
    S.get().invoices.forEach(function (inv) {
      if (inv.contractId !== contractId) return;
      (inv.payments || []).forEach(function (p) { if (String(p.date).slice(0, 7) === ym) sum += U.num(p.amount); });
    });
    return sum;
  }

  /** 시트에 이름이 잘려 적힌 경우(TRAN THI M ↔ TRAN THI MY DUNG)도 같은 사람으로 본다 */
  function sameTenant(a, b) {
    var x = String(a || '').replace(/\s+/g, '').toUpperCase(), y = String(b || '').replace(/\s+/g, '').toUpperCase();
    if (!x || !y) return false;
    if (x === y) return true;
    var short = x.length < y.length ? x : y, long = x.length < y.length ? y : x;
    return short.length >= 3 && long.indexOf(short) === 0;
  }

  /** 담당자가 '다시 묻지 않기'로 넘긴 항목 */
  function ignored() {
    var list = (S.get().settings.drive || {}).ignore || [];
    var m = {}; list.forEach(function (k) { m[k] = true; });
    return m;
  }

  function buildPlan(rent, expenses) {
    var plan = { contractsNew: [], contractsChanged: [], paymentsNew: [], invoicesNew: [],
                 expensesNew: [], skipped: [], notes: (rent && rent.notes) || [], flags: (rent && rent.flags) || [] };
    var st = S.get();

    (rent ? rent.rows : []).forEach(function (r) {
      var b = findBuilding(r.buildingName);
      if (!b) { plan.skipped.push(r.buildingName + ' ' + r.unitName + ': 앱에 없는 건물'); return; }
      var u = findUnit(b.id, r.unitName);
      if (!u) { plan.skipped.push(b.name + ' ' + r.unitName + ': 앱에 없는 호실'); return; }
      if (!r.tenant) {
        if (r.monthSum) plan.skipped.push(b.name + ' ' + r.unitName + ': 임차인 없이 입금 ' + U.comma(r.monthSum) + '원');
        return;
      }
      var c = st.contracts.filter(function (c) { return c.unitId === u.id && c.tenantName === r.tenant; })[0] ||
              st.contracts.filter(function (c) { return c.unitId === u.id && sameTenant(c.tenantName, r.tenant); })[0];
      var label = b.name + ' ' + u.name + ' · ' + r.tenant;

      if (!c) {
        var firstPaid = r.months.map(function (v, i) { return typeof v === 'number' ? i + 1 : 0; }).filter(Boolean)[0];
        var start = r.start || (firstPaid ? r.year + '-' + U.pad2(firstPaid) + '-01' : '');
        if (!start) { plan.skipped.push(label + ': 계약 시작일도 입금도 없음'); return; }
        c = { id: U.uid('ctr'), unitId: u.id, tenantName: r.tenant, tenantPhone: r.phone, type: r.type,
              deposit: r.deposit, rent: r.rent, maintenanceFee: r.fee, payDay: r.payDay || 1,
              startDate: start, endDate: r.end, memo: r.memo ? r.memo + ' · 드라이브에서 가져옴' : '드라이브에서 가져옴',
              changeType: '신규', createdAt: U.todayISO(), _new: true };
        plan.contractsNew.push({ label: label, contract: c, row: r });
        // 같은 호실에 아직 진행 중인 다른 임차인의 계약이 있으면(승계·교체) 새 계약 전날로 종료를 제안한다.
        var dayBefore = U.addDays(start, -1);
        st.contracts.forEach(function (o) {
          if (o.unitId !== u.id || o.tenantName === r.tenant) return;
          if (o.endDate && o.endDate < start) return;
          if (o.startDate && o.startDate >= start) return;
          plan.contractsChanged.push({ label: b.name + ' ' + u.name + ' · ' + o.tenantName + ' (이전 임차인)', contract: o,
                                       changes: [['endDate', o.endDate || '갱신 중', dayBefore, '종료일'], ['endReason', o.endReason || '', '승계', '종료 사유']] });
          c.changeType = '승계'; c.prevContractId = o.id; c.prevTenant = o.tenantName;
        });
      } else {
        var ch = [];
        // 계약서로 확인한 계약은 조건(월세·보증금·관리비·납부일)을 관리표로 덮지 않는다
        var verified = /계약서 확인/.test(c.memo || '');
        if (verified) { /* 연락처·만료일만 비교 */ }
        else if (r.rent && r.rent !== U.num(c.rent)) ch.push(['rent', c.rent, r.rent, '월세']);
        if (!verified && r.deposit && r.deposit !== U.num(c.deposit)) ch.push(['deposit', c.deposit, r.deposit, '보증금']);
        if (!verified && r.fee && r.fee !== U.num(c.maintenanceFee)) ch.push(['maintenanceFee', c.maintenanceFee, r.fee, '관리비']);
        if (!verified && r.payDay && r.payDay !== U.num(c.payDay)) ch.push(['payDay', c.payDay, r.payDay, '납부일']);
        var successor = st.contracts.some(function (o) { return o.id !== c.id && o.unitId === c.unitId && c.endDate && o.startDate > c.endDate; });
        if (r.end && c.endDate && r.end > c.endDate && !successor) ch.push(['endDate', c.endDate, r.end, '만료일']);
        if (r.phone && !c.tenantPhone) ch.push(['tenantPhone', '', r.phone, '연락처']);
        if (ch.length) plan.contractsChanged.push({ label: label, contract: c, changes: ch });
      }

      var amount = (r.rent || U.num(c.rent)) + (r.fee || U.num(c.maintenanceFee));
      var startM = c.startDate && c.startDate.slice(0, 4) === String(r.year) ? Number(c.startDate.slice(5, 7)) : 1;
      // 시트와 앱의 입금을 연초부터 누적으로 비교한다. 선납(8월에 9월분까지)이나
      // 격월 납부(2월에 1·2월분)를 월 단위로 맞추면 이중으로 잡히기 때문이다.
      // 계약 시작월 이전 칸은 그 호실의 이전 임차인 몫이므로 누적에서도 제외한다.
      var sheetCum = 0, appCum = 0;
      r.months.forEach(function (v, i) {
        var m = i + 1, ym = r.year + '-' + U.pad2(m);
        if (m < startM) return;
        // 통장 대사로 확인한 달은 관리표 숫자로 건드리지 않는다(누적 비교에서도 뺀다)
        var vinv = c._new ? null : S.invoiceOf(c.id, ym);
        if (vinv && B.isBankVerified(vinv)) return;
        if (typeof v === 'number') sheetCum += v;
        if (!c._new) appCum += paidInMonth(c.id, ym);
        if (v === 'V' || v === null) return;
        var inv = c._new ? null : S.invoiceOf(c.id, ym);
        if (!inv) plan.invoicesNew.push({ label: label + ' ' + U.fmtMonth(ym), contract: c, ym: ym, amount: amount, payDay: r.payDay || U.num(c.payDay) || 1 });
        if (typeof v === 'number' && v > 0) {
          var deficit = sheetCum - appCum;
          if (deficit > 0) {
            var add = Math.min(v, deficit);
            appCum += add;
            plan.paymentsNew.push({ label: label + ' ' + U.fmtMonth(ym), contract: c, ym: ym, amount: add,
              payDay: r.payDay || U.num(c.payDay) || 1, note: add < v ? '(시트 ' + U.comma(v) + '원 중 앱에 없는 몫)' : '' });
          }
        }
      });
    });

    var squash = function (t) { return String(t || '').replace(/[\s,·、.()\-]/g, ''); };
    (expenses || []).forEach(function (e) {
      var b = findBuilding(e.buildingName);
      var dup = st.expenses.some(function (x) {
        if (x.date !== e.date || U.num(x.amount) !== e.amount) return false;
        if (b && x.buildingId && x.buildingId !== b.id) return false;   // 같은 날 같은 금액이라도 건물이 다르면 별개
        return true;
      });
      if (!dup) {
        // 날짜가 하루 이틀 다르게 적힌 같은 지출(항목명·금액 일치)도 중복으로 본다
        dup = st.expenses.some(function (x) {
          return U.num(x.amount) === e.amount && squash(x.memo) === squash(e.item) &&
            Math.abs(U.diffDays(x.date, e.date)) <= 3;
        });
      }
      if (dup) return;
      plan.expensesNew.push({ label: e.date + ' ' + e.item + ' ' + U.comma(e.amount) + '원',
        expense: { id: U.uid('exp'), date: e.date, buildingId: b ? b.id : '', unitName: e.unitName,
                   category: category(e.item), amount: e.amount, method: e.method || '', memo: e.item, createdAt: U.todayISO() } });
    });

    // 항목마다 키를 달고, 다시 묻지 않기로 한 항목은 뺀다
    var ign = ignored(), dropped = {};
    plan.contractsNew.forEach(function (x) { x.key = 'new|' + x.contract.unitId + '|' + x.contract.tenantName; });
    plan.contractsChanged.forEach(function (x) { x.key = 'chg|' + x.contract.id + '|' + x.changes.map(function (c) { return c[0] + '=' + c[2]; }).join(','); });
    plan.paymentsNew.forEach(function (x) { x.key = 'pay|' + (x.contract._new ? x.contract.unitId + '|' + x.contract.tenantName : x.contract.id) + '|' + x.ym + '|' + x.amount; });
    plan.invoicesNew.forEach(function (x) { x.key = 'inv|' + (x.contract._new ? x.contract.unitId + '|' + x.contract.tenantName : x.contract.id) + '|' + x.ym; });
    plan.expensesNew.forEach(function (x) { x.key = 'exp|' + x.expense.date + '|' + x.expense.amount + '|' + x.expense.memo; });
    plan.contractsNew = plan.contractsNew.filter(function (x) { if (ign[x.key]) { dropped[x.contract.id] = true; return false; } return true; });
    ['contractsChanged', 'paymentsNew', 'invoicesNew', 'expensesNew'].forEach(function (k) {
      plan[k] = plan[k].filter(function (x) { return !ign[x.key] && !(x.contract && dropped[x.contract.id]); });
    });
    plan.count = plan.contractsNew.length + plan.contractsChanged.length + plan.paymentsNew.length +
                 plan.invoicesNew.length + plan.expensesNew.length;
    return plan;
  }

  function applyPlan(plan) {
    var st = S.get();
    plan.contractsNew.forEach(function (x) { delete x.contract._new; st.contracts.push(x.contract); });
    plan.contractsChanged.forEach(function (x) {
      x.changes.forEach(function (ch) { x.contract[ch[0]] = ch[2]; });
    });
    var made = {};
    function ensureInvoice(c, ym, amount, payDay) {
      var inv = S.invoiceOf(c.id, ym) || made[c.id + ym];
      if (inv) return inv;
      inv = { id: U.uid('inv'), contractId: c.id, unitId: c.unitId, ym: ym, dueDate: U.dueDateOf(ym, payDay),
              rent: amount - U.num(c.maintenanceFee), maintenanceFee: U.num(c.maintenanceFee), extras: [],
              payments: [], prorated: false, total: amount, memo: '드라이브에서 가져옴', createdAt: U.todayISO() };
      st.invoices.push(inv); made[c.id + ym] = inv;
      return inv;
    }
    plan.invoicesNew.forEach(function (x) { ensureInvoice(x.contract, x.ym, x.amount, x.payDay); });
    plan.paymentsNew.forEach(function (x) {
      var inv = ensureInvoice(x.contract, x.ym, U.num(x.contract.rent) + U.num(x.contract.maintenanceFee), x.payDay);
      inv.payments.push({ id: U.uid('pay'), date: U.dueDateOf(x.ym, x.payDay), amount: x.amount,
                          method: '계좌이체', memo: '드라이브 관리표 (날짜는 납부일 기준 · 통장 미확인)' });
    });
    plan.expensesNew.forEach(function (x) { st.expenses.push(x.expense); });

    // 선납으로 과납된 달이 있으면 초과분을 같은 계약의 뒤쪽 미납 청구서로 옮긴다
    // (8월에 9월분까지 넣어 둔 상태에서 9월 청구서가 새로 생기는 경우)
    var touched = {};
    plan.invoicesNew.forEach(function (x) { touched[x.contract.id] = true; });
    Object.keys(touched).forEach(function (cid) {
      var invs = st.invoices.filter(function (i) { return i.contractId === cid; })
        .sort(function (a, b) { return a.ym < b.ym ? -1 : 1; });
      invs.forEach(function (over) {
        if (B.isBankVerified(over)) return;   // 통장으로 확인한 입금은 다른 달로 옮기지 않는다
        var surplus = U.sum(over.payments, function (p) { return p.amount; }) - U.num(over.total);
        if (surplus <= 0) return;
        invs.forEach(function (later) {
          if (surplus <= 0 || later.ym <= over.ym || B.isBankVerified(later)) return;
          var due = U.num(later.total) - U.sum(later.payments, function (p) { return p.amount; });
          if (due <= 0) return;
          var move = Math.min(due, surplus);
          var src = over.payments[over.payments.length - 1];
          src.amount -= move;
          if (src.amount <= 0) over.payments.pop();
          later.payments.push({ id: U.uid('pay'), date: src.date, amount: move, method: src.method || '계좌이체', memo: '선납분 이월' });
          surplus -= move;
        });
      });
    });

    S.updateSettings({ drive: Object.assign({}, st.settings.drive, {
      lastApplied: new Date().toISOString(), lastResult: plan.count + '건 반영' }) });
    S.commit();
  }

  /* ================= 커넥터 호출 ================= */
  function explain(err) {
    var code = err && err.code;
    if (code === 'needs_reauth') return 'Google Drive 연결이 만료되었습니다. claude.ai 설정 → 커넥터에서 Google Drive를 다시 연결해 주세요.';
    if (code === 'server_not_connected') return 'Google Drive 커넥터가 없습니다. claude.ai 설정 → 커넥터에서 Google Drive를 추가해 주세요.';
    if (code === 'selection_required') return '연결된 Google Drive가 여러 개입니다. 화면 안내에 따라 하나를 선택한 뒤 다시 시도하세요.';
    if (code === 'blocked_by_policy' || code === 'approval_required') return '조직 정책으로 이 페이지에서 Google Drive 호출이 제한되어 있습니다.';
    if (code === 'tool_error') return 'Google Drive가 오류를 돌려주었습니다: ' + (err.message || '') + ' — 파일 ID가 맞는지 확인하세요.';
    if (code === 'not_granted') return 'Google Drive 사용 권한을 허용하지 않았습니다. 다시 시도하면 허용 여부를 묻습니다.';
    if (code === 'server_unavailable' || code === 'rate_limited') return 'Google Drive가 잠시 응답하지 않습니다. 잠시 후 다시 시도해 주세요.';
    return (err && err.message) || '알 수 없는 오류';
  }

  function call(tool, input) {
    return mcp.callTool(SERVER, tool, input).catch(function (err) {
      if (err && err.retryable) {
        var wait = Math.min(err.retryAfterMs || 1500, 60000) + Math.random() * 500;
        return new Promise(function (res) { setTimeout(res, wait); })
          .then(function () { return mcp.callTool(SERVER, tool, input); });
      }
      throw err;
    });
  }

  function readFile(fileId) {
    return call('read_file_content', { fileId: fileId }).then(function (res) {
      var p = res && res.payload;
      if (p && typeof p === 'object' && typeof p.fileContent === 'string') return p.fileContent;
      if (typeof p === 'string') { try { var j = JSON.parse(p); if (j.fileContent) return j.fileContent; } catch (e) { /* 원문 */ } return p; }
      throw { code: 'tool_error', message: '파일 내용을 읽지 못했습니다.' };
    });
  }

  /** 파일을 받아 base64 문자열로 돌려준다 (구글 시트는 exportMimeType 형식으로 내보냄) */
  function download(fileId, exportMimeType) {
    var input = { fileId: fileId };
    if (exportMimeType) input.exportMimeType = exportMimeType;
    return call('download_file_content', input).then(function (res) {
      var p = res && res.payload;
      if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { /* 원문 */ } }
      if (p && typeof p === 'object' && typeof p.content === 'string') return p.content;
      throw { code: 'tool_error', message: '파일을 받지 못했습니다.' };
    });
  }

  function searchFiles(keyword) {
    return call('search_files', { query: "title contains '" + keyword.replace(/'/g, "\\'") + "'", pageSize: 10, excludeContentSnippets: true })
      .then(function (res) {
        var p = res && res.payload;
        if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = {}; } }
        return (p && p.files) || [];
      });
  }

  function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { status = 'none'; notify(); return Promise.resolve(false); }
    return window.claude.use('mcp').then(function (m) {
      mcp = m; status = m ? 'ready' : 'none'; notify();
      return !!m;
    }, function () { status = 'none'; notify(); return false; });
  }

  /** 드라이브를 읽어 계획을 세운다(적용은 하지 않음) */
  function check(opts) {
    opts = opts || {};
    var d = S.get().settings.drive || {};
    if (status !== 'ready') return Promise.reject({ code: 'not_available', message: '이 화면에서는 드라이브 연동을 쓸 수 없습니다.' });
    if (!d.rentFileId && !d.expenseFileId) return Promise.reject({ code: 'no_file', message: '설정에서 관리표 파일을 먼저 지정하세요.' });
    last.busy = true; last.error = null; notify();
    var jobs = [
      d.rentFileId ? readFile(d.rentFileId).then(function (t) { return parseRent(t, Number(d.rentYear) || new Date().getFullYear()); }) : Promise.resolve(null),
      d.expenseFileId ? readFile(d.expenseFileId).then(parseExpense) : Promise.resolve([])
    ];
    return Promise.all(jobs).then(function (r) {
      var plan = buildPlan(r[0], r[1]);
      plan.rentRows = r[0] ? r[0].rows.length : 0;
      plan.expenseRows = r[1] ? r[1].length : 0;
      last.plan = plan; last.checkedAt = Date.now(); last.busy = false;
      S.updateSettings({ drive: Object.assign({}, d, { lastChecked: new Date().toISOString() }) });
      notify();
      return plan;
    }).catch(function (err) {
      last.busy = false; last.error = explain(err); notify();
      throw err;
    });
  }

  /* ================= 미리보기 UI ================= */
  function list(items, max) {
    max = max || 12;
    var html = items.slice(0, max).map(function (x) {
      return '<li>' + (x.key ? '<label class="check" style="display:inline-flex;color:inherit"><input type="checkbox" class="dv-pick" data-key="' + U.esc(x.key) + '" checked> ' : '') + U.esc(x.label) + (x.note ? ' <span class="t-faint">' + U.esc(x.note) + '</span>' : '') +
        (x.changes ? ' <span class="t-faint">' + x.changes.map(function (c) {
          return c[3] + ' ' + (typeof c[1] === 'number' ? U.comma(c[1]) : c[1]) + ' → ' + (typeof c[2] === 'number' ? U.comma(c[2]) : c[2]);
        }).join(', ') + '</span>' : '') + (x.key ? '</label>' : '') + '</li>';
    }).join('');
    if (items.length > max) html += '<li class="t-faint">… 외 ' + (items.length - max) + '건</li>';
    return '<ul style="margin:4px 0 12px;padding-left:18px;font-size:13px">' + html + '</ul>';
  }

  function preview(plan) {
    var body = '<div class="t-dim" style="font-size:13px;margin-bottom:12px">관리표 ' + plan.rentRows + '행 · 지출 ' + plan.expenseRows +
      '행을 읽었습니다. 아래는 <b>앱에 없는 내용만</b> 고른 것이며, 적용해도 기존 기록은 지워지지 않습니다.</div>';
    if (!plan.count) body += '<div class="empty"><strong>새로 반영할 내용이 없습니다</strong><div>드라이브와 앱이 같은 상태입니다.</div></div>';
    if (plan.paymentsNew.length) body += '<b>새 입금 ' + plan.paymentsNew.length + '건 · ' + U.won(U.sum(plan.paymentsNew, function (x) { return x.amount; })) + '</b>' + list(plan.paymentsNew);
    if (plan.contractsNew.length) body += '<b>새 계약 ' + plan.contractsNew.length + '건</b>' + list(plan.contractsNew);
    if (plan.contractsChanged.length) body += '<b>계약 조건 변경 ' + plan.contractsChanged.length + '건</b>' + list(plan.contractsChanged);
    if (plan.invoicesNew.length) body += '<b>새 청구서 ' + plan.invoicesNew.length + '건</b> <span class="t-faint" style="font-size:12px">(입금·미납 표시가 있는 달)</span>' + list(plan.invoicesNew, 40);
    if (plan.expensesNew.length) body += '<b>새 지출 ' + plan.expensesNew.length + '건 · ' + U.won(U.sum(plan.expensesNew, function (x) { return x.expense.amount; })) + '</b>' + list(plan.expensesNew);
    if (plan.skipped.length) body += '<details style="font-size:12px"><summary class="t-faint">건너뜀 ' + plan.skipped.length + '건</summary>' + list(plan.skipped.map(function (s) { return { label: s }; }), 30) + '</details>';
    if (plan.notes.length) body += '<details style="font-size:12px"><summary class="t-faint">확인 필요 ' + plan.notes.length + '건 (월별 합 ≠ 총입금액)</summary>' + list(plan.notes.map(function (s) { return { label: s }; }), 30) + '</details>';
    if (plan.flags.length) body += '<details style="font-size:12px"><summary class="t-faint">관리표에 글자로 적힌 칸 ' + plan.flags.length + '건 (인수인계 점검에도 표시)</summary>' + list(plan.flags.map(function (s) { return { label: s }; }), 30) + '</details>';

    if (plan.count) body = '<div class="callout-note" style="font-size:12.5px;padding:9px 11px;border-radius:7px;background:var(--warn-soft);color:var(--ink);margin-bottom:12px">' +
      '드라이브 관리표가 대시보드보다 오래된 경우, 이미 바로잡은 내용을 되돌리는 항목이 섞일 수 있습니다. ' +
      '<b>맞는 항목만 체크</b>해서 적용하고, 체크를 뺀 항목은 아래에서 <b>다시 묻지 않기</b>로 넘길 수 있습니다.</div>' + body +
      '<label class="check" style="margin-top:6px"><input type="checkbox" id="dv-ignore" checked> 체크를 뺀 항목은 다음부터 다시 묻지 않기</label>';

    function picked() {
      var on = {}, off = [];
      Array.prototype.forEach.call(document.querySelectorAll('.dv-pick'), function (el) {
        if (el.checked) on[el.getAttribute('data-key')] = true; else off.push(el.getAttribute('data-key'));
      });
      return { on: on, off: off };
    }
    function run() {
      var p = picked();
      var sub = {};
      Object.keys(plan).forEach(function (k) { sub[k] = plan[k]; });
      var dropNew = {};
      sub.contractsNew = plan.contractsNew.filter(function (x) { if (!p.on[x.key]) { dropNew[x.contract.id] = true; return false; } return true; });
      ['contractsChanged', 'paymentsNew', 'invoicesNew', 'expensesNew'].forEach(function (k) {
        sub[k] = plan[k].filter(function (x) { return p.on[x.key] && !(x.contract && dropNew[x.contract.id]); });
      });
      sub.count = sub.contractsNew.length + sub.contractsChanged.length + sub.paymentsNew.length + sub.invoicesNew.length + sub.expensesNew.length;
      var ignoreBox = document.getElementById('dv-ignore');
      if (ignoreBox && ignoreBox.checked && p.off.length) {
        var d = S.get().settings.drive || {};
        var list2 = (d.ignore || []).slice();
        p.off.forEach(function (k) { if (list2.indexOf(k) < 0) list2.push(k); });
        S.updateSettings({ drive: Object.assign({}, d, { ignore: list2 }) });
      }
      if (sub.count) applyPlan(sub);
      last.plan = null; UI.close();
      UI.toast((sub.count ? '드라이브 내용 ' + sub.count + '건을 반영했습니다.' : '반영한 항목이 없습니다.') +
        (ignoreBox && ignoreBox.checked && p.off.length ? ' ' + p.off.length + '건은 다시 묻지 않습니다.' : ''), 'ok');
      App.router.refresh();
    }

    UI.open({
      title: '구글 드라이브에서 가져오기',
      body: body,
      buttons: plan.count ? [
        { label: '나중에', onClick: UI.close },
        { label: '체크한 항목 적용', className: 'btn-primary', onClick: run }
      ] : [{ label: '닫기', className: 'btn-primary', onClick: UI.close }]
    });
  }

  function checkAndPreview() {
    UI.toast('드라이브를 읽는 중…');
    return check().then(preview, function (err) { UI.toast(explain(err), 'err'); });
  }

  /** 페이지를 열 때 조용히 확인만 하고, 새 내용이 있으면 대시보드에 알린다 */
  function autoCheck() {
    var d = S.get().settings.drive || {};
    if (status !== 'ready' || d.autoCheck === false || !d.rentFileId) return;
    check({ silent: true }).then(function (plan) {
      if (plan.count && App.router.current() === 'dashboard') App.router.refresh();
    }, function () { /* 배너에 오류 표시 */ if (App.router.current() === 'dashboard') App.router.refresh(); });
  }

  /** 대시보드 상단 배너 HTML */
  function bannerHTML() {
    if (status !== 'ready') return '';
    if (last.busy) return '<div class="card" style="padding:12px 16px;margin-bottom:16px" class="t-dim">구글 드라이브 확인 중…</div>';
    if (last.error) return '<div class="card" style="padding:12px 16px;margin-bottom:16px;border-left:3px solid var(--danger)">' +
      '<b>드라이브 연동 오류</b> <span class="t-dim">' + U.esc(last.error) + '</span> ' +
      '<button class="btn btn-sm" data-act="driveCheck" style="margin-left:8px">다시 시도</button></div>';
    var p = last.plan;
    if (!p) return '';
    if (!p.count) return '';
    return '<div class="card" style="padding:12px 16px;margin-bottom:16px;border-left:3px solid var(--accent);display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<div><b>구글 드라이브에 새 내용 ' + p.count + '건</b> <span class="t-dim" style="font-size:12px">' +
      [p.paymentsNew.length ? '입금 ' + p.paymentsNew.length : '', p.contractsNew.length ? '계약 ' + p.contractsNew.length : '',
       p.contractsChanged.length ? '변경 ' + p.contractsChanged.length : '', p.expensesNew.length ? '지출 ' + p.expensesNew.length : '']
        .filter(Boolean).join(' · ') + '</span></div><div class="spacer"></div>' +
      '<button class="btn btn-sm btn-primary" data-act="drivePreview">내용 보고 적용</button></div>';
  }

  App.drive = {
    connect: connect, check: check, checkAndPreview: checkAndPreview, autoCheck: autoCheck,
    preview: function () { if (last.plan) preview(last.plan); else checkAndPreview(); },
    bannerHTML: bannerHTML, searchFiles: searchFiles, download: download, explain: explain,
    status: function () { return status; }, last: function () { return last; },
    onChange: function (fn) { listeners.push(fn); },
    clearIgnored: function () {
      var d = S.get().settings.drive || {};
      S.updateSettings({ drive: Object.assign({}, d, { ignore: [] }) });
    },
    _parseRent: parseRent, _parseExpense: parseExpense, _tokenize: tokenize, _buildPlan: buildPlan
  };
})(window.App);

</script>
<script>
/* Google Apps Script 웹앱으로 Drive JSON 백업과 Sheets 기록을 보낸다.
   Google Drive 커넥터는 읽기 전용이므로, 쓰기는 사용자가 배포한 웹앱이 담당한다. */
(function (App) {
  var S = App.store;
  var started = false;
  var timer = null;
  var busy = false;
  var pending = false;
  var BACKUP_HOUR = 19;
  var MAX_BYTES = 8 * 1024 * 1024; // Apps Script File.setContent 한도보다 여유 있게 제한
  var AUTH_KEY = 'zipkeeper.backup.auth';
  var META_KEY = 'zipkeeper.backup.meta';

  function localToken() {
    try { return localStorage.getItem(AUTH_KEY) || ''; } catch (e) { return ''; }
  }

  function setLocalToken(value) {
    try {
      if (value) localStorage.setItem(AUTH_KEY, value);
      else localStorage.removeItem(AUTH_KEY);
      return true;
    } catch (e) { return false; }
  }

  function readMeta() {
    try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (e) { return {}; }
  }

  function writeMeta(patch) {
    try {
      localStorage.setItem(META_KEY, JSON.stringify(Object.assign({}, readMeta(), patch)));
      return true;
    } catch (e) { return false; }
  }

  function cfg() {
    return Object.assign({}, (S.get().settings && S.get().settings.autoBackup) || {}, { token: localToken() });
  }

  function configured() {
    var c = cfg();
    return !!(c.enabled && /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?|$)/.test(c.endpoint || '') && c.token);
  }

  function cleanState() {
    var state = JSON.parse(S.exportJSON());
    delete state.exportedAt;
    // 백업용 비밀문구는 Drive의 JSON 파일 안에 다시 저장하지 않는다.
    if (state.settings && state.settings.autoBackup) {
      delete state.settings.autoBackup.token;
      // 전송 결과 자체가 다음 날의 변경으로 잡히지 않도록 상태 표시는 비교·백업에서 뺀다.
      delete state.settings.autoBackup.lastAttempt;
      delete state.settings.autoBackup.lastError;
    }
    return state;
  }

  function fingerprint(text) {
    var a = 2166136261, b = 5381;
    for (var i = 0; i < text.length; i++) {
      a ^= text.charCodeAt(i); a = Math.imul(a, 16777619);
      b = ((b << 5) + b) ^ text.charCodeAt(i);
    }
    return text.length + ':' + (a >>> 0).toString(16) + ':' + (b >>> 0).toString(16);
  }

  function nextSeven(now) {
    var next = new Date(now.getTime());
    next.setHours(BACKUP_HOUR, 0, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next;
  }

  function previousSeven(now) {
    var due = new Date(now.getTime());
    due.setHours(BACKUP_HOUR, 0, 0, 0);
    if (due > now) due.setDate(due.getDate() - 1);
    return due;
  }

  function counts(state) {
    var payments = 0;
    (state.invoices || []).forEach(function (inv) { payments += (inv.payments || []).length; });
    return {
      buildings: (state.buildings || []).length,
      units: (state.units || []).length,
      contracts: (state.contracts || []).length,
      invoices: (state.invoices || []).length,
      payments: payments,
      expenses: (state.expenses || []).length
    };
  }

  function makePayload(reason) {
    var state = cleanState();
    var data = JSON.stringify(state, null, 2);
    return { snapshot: data, text: JSON.stringify({
      token: cfg().token,
      app: 'zipkeeper',
      schemaVersion: state.version || 1,
      reason: reason || 'auto',
      sentAt: new Date().toISOString(),
      ownerName: (state.settings && state.settings.ownerName) || '',
      counts: counts(state),
      data: data
    }) };
  }

  function updateStatus(patch) {
    var c = Object.assign({}, (S.get().settings && S.get().settings.autoBackup) || {}, patch);
    delete c.token;
    S.get().settings.autoBackup = c;
    try { localStorage.setItem(S.KEY, JSON.stringify(S.get())); } catch (e) { /* store가 별도로 알림 */ }
    if (App.router && App.router.current() === 'settings') App.router.refresh();
  }

  function send(reason, prepared) {
    if (!configured()) return Promise.reject(new Error('자동 백업 설정을 먼저 완료해 주세요.'));
    if (busy) { pending = true; return Promise.resolve(false); }

    var built = prepared || makePayload(reason);
    var payload = built.text;
    var bytes = new Blob([payload]).size;
    if (bytes > MAX_BYTES) return Promise.reject(new Error('백업 데이터가 8MB를 넘어 자동 전송할 수 없습니다.'));
    busy = true;
    return fetch(cfg().endpoint, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: payload,
      cache: 'no-store',
      keepalive: bytes < 60000
    }).then(function () {
      writeMeta({ lastHash: fingerprint(built.snapshot), lastCheckAt: new Date().toISOString(), retryAfter: '' });
      updateStatus({ lastAttempt: new Date().toISOString(), lastError: '' });
      return true;
    }).catch(function (err) {
      writeMeta({ retryAfter: new Date(Date.now() + 30 * 60 * 1000).toISOString() });
      updateStatus({ lastError: (err && err.message) || '전송 실패' });
      throw err;
    }).then(function (result) {
      busy = false;
      if (pending) pending = false;
      schedule();
      return result;
    }, function (err) {
      busy = false;
      if (pending) pending = false;
      schedule();
      throw err;
    });
  }

  function runScheduled() {
    if (!configured()) return;
    var built = makePayload('scheduled');
    var meta = readMeta();
    if (meta.lastHash === fingerprint(built.snapshot)) {
      writeMeta({ lastCheckAt: new Date().toISOString(), retryAfter: '' });
      schedule();
      return;
    }
    send('scheduled', built).catch(function () { /* 설정 화면에 표시하고 30분 뒤 재시도 */ });
  }

  function schedule() {
    clearTimeout(timer);
    if (!configured()) return;
    var now = new Date();
    var meta = readMeta();
    if (!meta.lastCheckAt) {
      writeMeta({ lastCheckAt: now.toISOString(), retryAfter: '' });
      meta = readMeta();
    }
    var retryAt = meta.retryAfter ? new Date(meta.retryAfter) : null;
    var missed = new Date(meta.lastCheckAt) < previousSeven(now);
    if (missed) {
      var delay = retryAt && retryAt > now ? retryAt - now : 1000;
      timer = setTimeout(runScheduled, delay);
      return;
    }
    timer = setTimeout(runScheduled, nextSeven(now) - now);
  }

  function init() {
    if (started) return;
    started = true;
