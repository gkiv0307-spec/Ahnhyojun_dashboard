          if (!v.startDate) errors.startDate = '시작일을 넣어 주세요.';
          if (!v.endDate) errors.endDate = '만료일을 넣어 주세요.';
          if (v.startDate && v.endDate && v.endDate < v.startDate) errors.endDate = '만료일이 시작일보다 빠릅니다.';
          if (cur && v.oldEnd && v.startDate && v.startDate <= v.oldEnd) errors.startDate = '앞 계약 종료일 다음 날부터 가능합니다.';
          var overlap = S.contractsOfUnit(unitId).filter(function (o) {
            if (cur && o.id === cur.id) return false;
            return o.startDate <= v.endDate && (!o.endDate || o.endDate >= v.startDate);
          });
          if (overlap.length) errors.startDate = '같은 기간에 다른 계약이 있습니다 (' + overlap[0].tenantName + ').';
        }
        if (Object.keys(errors).length) return errors;

        var done = [];
        if (cur) {
          cur.endDate = v.oldEnd;
          cur.endReason = v.oldReason || (leaving ? '퇴실' : '승계');
          if (v.settle) cur.memo = (cur.memo ? cur.memo + '\n' : '') + '[정산] ' + v.settle;
          // 마지막 달 청구서를 종료일까지 일할 계산 (입금이 이미 청구액 이상이면 손대지 않음)
          if (v.prorateLast) {
            var ym = U.monthKey(v.oldEnd);
            var inv = S.invoiceOf(cur.id, ym);
            if (inv && B.paidAmount(inv) < U.num(inv.total)) {
              var cov = B.coverage(cur, ym);
              if (cov.partial) {
                inv.rent = Math.round(U.num(cur.rent) * cov.days / cov.total / 10) * 10;
                inv.maintenanceFee = Math.round(U.num(cur.maintenanceFee) * cov.days / cov.total / 10) * 10;
                inv.prorated = true; inv.proratedDays = cov.days;
                inv.memo = cov.days + '/' + cov.total + '일 일할계산 (' + U.fmtDate(v.oldEnd) + ' 종료)';
                B.recalc(inv);
                done.push(U.fmtMonth(ym) + ' 청구서 ' + U.won(inv.total) + '로 조정');
              }
            }
          }
          // 종료일 이후 달의 미납 청구서는 지운다 (입금 없는 것만)
          S.get().invoices.slice().forEach(function (i) {
            if (i.contractId === cur.id && i.ym > U.monthKey(v.oldEnd) && !B.paidAmount(i)) S.remove('invoices', i.id);
          });
          done.push(cur.tenantName + ' 계약 ' + U.fmtDate(v.oldEnd) + ' 종료(' + cur.endReason + ')');
        }
        if (!leaving) {
          var nc = S.upsert('contracts', {
            unitId: unitId, tenantName: v.tenantName, tenantPhone: v.tenantPhone, type: v.type,
            payDay: U.num(v.payDay) || 1, deposit: U.num(v.deposit), rent: U.num(v.rent), maintenanceFee: U.num(v.maintenanceFee),
            startDate: v.startDate, endDate: v.endDate, memo: v.memo || '',
            changeType: v.changeType === '승계' ? '승계' : '신규',
            prevContractId: cur ? cur.id : '', prevTenant: cur ? cur.tenantName : ''
          });
          done.push(v.tenantName + ' 계약 ' + U.fmtDate(v.startDate) + ' 시작(' + nc.changeType + ')');
        }
        S.commit();
        UI.toast(done.join(' · '), 'ok');
        App.router.refresh();
      }
    });
  }

  /** 호실 하나의 계약 이력을 시간순으로 보여준다 */
  function unitHistory(unitId) {
    var list = U.sortBy(S.contractsOfUnit(unitId), function (c) { return c.startDate; }, true);
    var today = U.todayISO();
    var body = list.length ? list.map(function (c, i) {
      var stt = contractStatus(c);
      var invs = S.get().invoices.filter(function (x) { return x.contractId === c.id; });
      var paid = U.sum(invs, function (x) { return B.paidAmount(x); });
      var unpaid = U.sum(invs, function (x) { return B.remaining(x); });
      return '<div class="hist-row' + (stt === 'active' ? ' active' : '') + '">' +
        '<div class="hist-dot"></div>' +
        '<div class="li-main"><div class="li-title">' + (stt === 'active' ? App.views.notices.tenantLink(c) : U.esc(c.tenantName)) +
        ' <span class="badge ' + ST_BADGE[stt] + '">' + ST_LABEL[stt] + '</span> ' + changeBadge(c) + '</div>' +
        '<div class="li-sub">' + U.fmtDate(c.startDate) + ' ~ ' + (c.endDate ? U.fmtDate(c.endDate) : '갱신 중') +
        ' · 보증금 ' + U.wonShort(c.deposit) + ' / 월세 ' + U.wonShort(c.rent) + (U.num(c.maintenanceFee) ? ' + 관리비 ' + U.wonShort(c.maintenanceFee) : '') +
        ' · 수납 ' + U.wonShort(paid) + (unpaid ? ' · <span class="t-danger">미납 ' + U.wonShort(unpaid) + '</span>' : '') + '</div>' +
        (c.prevTenant ? '<div class="li-sub">← ' + U.esc(c.prevTenant) + ' 님에게서 ' + U.esc(c.changeType || '') + '</div>' : '') +
        (c.memo ? '<div class="li-sub" style="white-space:pre-line;margin-top:2px">' + U.esc(c.memo) + '</div>' : '') + '</div>' +
        '<button class="btn btn-sm btn-ghost" data-act="detail" data-id="' + c.id + '">상세</button></div>';
    }).join('') : '<div class="t-faint">이 호실에 등록된 계약이 없습니다.</div>';
    UI.open({
      title: S.unitLabel(unitId) + ' 계약 이력 (' + list.length + '건)',
      body: '<div class="hist">' + body + '</div>',
      buttons: [
        { label: '닫기', onClick: UI.close },
        { label: '임차인 변경', className: 'btn-primary', onClick: function () { UI.close(); changeTenant(unitId); } }
      ]
    });
  }

  function render(el) {
    var st = S.get();
    if (!st.contracts.length) {
      el.innerHTML = UI.empty('등록된 계약이 없습니다', '임차인 계약을 등록하면 월세 청구와 수납 관리를 할 수 있습니다.',
        '<button class="btn btn-primary" data-act="add">계약 등록</button>');
      return;
    }

    var list = st.contracts.filter(function (c) {
      if (filter.status && contractStatus(c) !== filter.status) return false;
      if (filter.buildingId) {
        var u = S.unit(c.unitId);
        if (!u || u.buildingId !== filter.buildingId) return false;
      }
      if (filter.change === 'ended' ? !c.endReason : (filter.change && c.changeType !== filter.change)) return false;
      if (filter.q) {
        var hay = (c.tenantName + ' ' + (c.tenantPhone || '') + ' ' + S.unitLabel(c.unitId)).toLowerCase();
        var dq = filter.q.replace(/\D/g, '');
        var byNum = dq.length >= 3 && String(c.tenantPhone || '').replace(/\D/g, '').indexOf(dq) >= 0;
        if (hay.indexOf(filter.q.toLowerCase()) < 0 && !byNum) return false;
      }
      return true;
    });
    list = U.sortBy(list, function (c) { return S.unitLabel(c.unitId); });

    var filters = '<div class="filters">' +
      '<select id="f-building"><option value="">전체 건물</option>' +
      st.buildings.map(function (b) {
        return '<option value="' + b.id + '"' + (filter.buildingId === b.id ? ' selected' : '') + '>' + U.esc(b.name) + '</option>';
      }).join('') + '</select>' +
      '<select id="f-status">' +
      [['active', '진행중'], ['scheduled', '예정'], ['ended', '만료'], ['', '전체']].map(function (o) {
        return '<option value="' + o[0] + '"' + (filter.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select>' +
      '<select id="f-change"><option value="">변경 구분 전체</option>' +
      CHANGE_TYPES.map(function (t) { return '<option value="' + t + '"' + (filter.change === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
      '<option value="ended"' + (filter.change === 'ended' ? ' selected' : '') + '>종료 사유 있음</option></select>' +
      '<input id="f-q" type="search" placeholder="임차인 · 호실 검색" value="' + U.esc(filter.q) + '" style="min-width:180px">' +
      '<div class="spacer"></div>' +
      '<span class="t-faint">' + list.length + '건</span>' +
      '</div>';

    var rows = list.map(function (c) {
      var stt = contractStatus(c);
      var left = c.endDate ? U.diffDays(U.todayISO(), c.endDate) : null;
      var dday = (stt === 'active' && left != null && left <= 60)
        ? ' <span class="badge ' + (left <= 30 ? 'badge-danger' : 'badge-warn') + '">D-' + left + '</span>' : '';
      return { cells: [
        '<span class="t-strong">' + U.esc(S.unitLabel(c.unitId)) + '</span>',
        U.esc(c.tenantName) + (changeBadge(c) ? ' ' + changeBadge(c) : '') +
          (c.tenantPhone ? '<div class="t-faint" style="font-size:12px">' + U.phone(c.tenantPhone) + '</div>' : ''),
        '<span class="badge badge-muted">' + U.esc(c.type || '월세') + '</span>',
        '<span class="mono">' + U.comma(c.deposit) + '</span>',
        '<span class="mono">' + U.comma(c.rent) + '</span>',
        '<span class="mono">' + U.comma(c.maintenanceFee) + '</span>',
        '매월 ' + (c.payDay || 1) + '일',
        U.fmtDate(c.startDate) + ' ~ ' + U.fmtDate(c.endDate) + dday,
        '<span class="badge ' + ST_BADGE[stt] + '">' + ST_LABEL[stt] + '</span>',
        '<button class="btn btn-sm btn-ghost" data-act="detail" data-id="' + c.id + '">상세</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="history" data-id="' + c.unitId + '">이력</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="edit" data-id="' + c.id + '">수정</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="del" data-id="' + c.id + '">삭제</button>'
      ] };
    });

    var headers = ['호실', '임차인', '형태',
      { label: '보증금', className: 'num' }, { label: '월세', className: 'num' }, { label: '관리비', className: 'num' },
      '납부일', '계약 기간', '상태', { label: '', className: 'actions' }];

    el.innerHTML = filters + UI.card('', rows.length
      ? UI.table(headers, rows)
      : '<div class="empty"><strong>조건에 맞는 계약이 없습니다</strong></div>', '', true);

    var fb = document.getElementById('f-building');
    var fs = document.getElementById('f-status');
    var fq = document.getElementById('f-q');
    fb.addEventListener('change', function () { filter.buildingId = fb.value; App.router.refresh(); });
    fs.addEventListener('change', function () { filter.status = fs.value; App.router.refresh(); });
    var fc = document.getElementById('f-change');
    fc.addEventListener('change', function () { filter.change = fc.value; App.router.refresh(); });
    UI.onType(fq, function (v) { filter.q = v; App.router.refresh(true); }, 220);
  }

  App.views.contracts = {
    title: '임대차 계약',
    desc: '임차인 정보와 보증금·월세·계약 기간을 관리합니다.',
    actions: function () {
      return '<button class="btn" data-act="changePick">임차인 변경</button>' +
        '<button class="btn btn-primary" data-act="add">＋ 계약 등록</button>' +
        UI.help('임차인 변경은 한 호실에서 앞 계약 종료와 새 계약 등록을 한 번에 처리합니다. 승계·신규·퇴실을 고르면 종료일·정산 메모·마지막 달 일할 계산까지 함께 기록됩니다.');
    },
    render: render,
    contractStatus: contractStatus,
    changeTenant: changeTenant,
    unitHistory: unitHistory,
    changeBadge: changeBadge,
    handlers: {
      add: function () { contractForm(null); },
      change: function (unitId) { changeTenant(unitId); },
      changePick: function () {
        UI.form({
          title: '임차인 변경 — 호실 선택',
          fields: [{ name: 'unitId', label: '호실', type: 'select', required: true, options: unitOptions(), full: true }],
          submitLabel: '다음',
          onSubmit: function (v) { setTimeout(function () { changeTenant(v.unitId); }, 30); }
        });
      },
      history: function (unitId) { unitHistory(unitId); },
      edit: function (id) { contractForm(id); },
      detail: function (id) { detail(id); },
      del: function (id) {
        var c = S.contract(id);
        UI.confirm({
          title: '계약 삭제',
          danger: true, confirmLabel: '삭제',
          message: '"' + S.unitLabel(c.unitId) + ' · ' + c.tenantName + '" 계약과 청구·수납 내역을 모두 삭제합니다.',
          onConfirm: function () { S.removeContract(id); UI.toast('삭제했습니다.'); App.router.refresh(); }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 수납 · 미납 관리 */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var state = { ym: U.currentMonth(), tab: 'month', status: '', buildingId: '', q: '',
               rq: '', from: '', to: '' };   // rq: 호실·임차인 검색, from/to: 입금일 기간

  /* ---------- 입금 등록 ---------- */
  function openSettle(invId) {
    var inv = S.invoice(invId);
    if (!inv) return;
    var c = S.contract(inv.contractId) || {};
    var rest = B.remaining(inv);
    UI.form({
      title: '입금 등록 — ' + S.unitLabel(inv.unitId) + ' ' + U.fmtMonth(inv.ym) + '분',
      submitLabel: '입금 등록',
      values: { date: U.todayISO(), amount: rest, method: '계좌이체' },
      fields: [
        { name: 'date', label: '입금일', type: 'date', required: true },
        { name: 'amount', label: '입금액', type: 'money', required: true,
          hint: '청구액 ' + U.won(inv.total) + ' · 미납 잔액 ' + U.won(rest) },
        { name: 'method', label: '입금 방법', type: 'select', options: ['계좌이체', '현금', '카드', '상계', '기타'] },
        { name: 'memo', label: '메모', placeholder: '입금자명 등' }
      ],
      onSubmit: function (v) {
        if (U.num(v.amount) <= 0) return { amount: '0보다 큰 금액을 입력하세요.' };
        B.addPayment(invId, v);
        UI.toast(U.esc(c.tenantName || '') + ' ' + U.won(v.amount) + ' 입금 처리했습니다.', 'ok');
        App.router.refresh();
      }
    });
  }

  /* ---------- 청구서 수정 ---------- */
  function editInvoice(invId) {
    var inv = S.invoice(invId);
    if (!inv) return;
    var extra = (inv.extras && inv.extras[0]) || { label: '', amount: 0 };
    UI.form({
      title: '청구서 수정 — ' + U.fmtMonth(inv.ym),
      values: {
        rent: inv.rent, maintenanceFee: inv.maintenanceFee,
        extraLabel: extra.label, extraAmount: extra.amount,
        dueDate: inv.dueDate, memo: inv.memo
      },
      fields: [
        { name: 'rent', label: '월세', type: 'money' },
        { name: 'maintenanceFee', label: '관리비', type: 'money' },
        { name: 'extraLabel', label: '추가 항목명', placeholder: '예) 수도요금, 연체료' },
        { name: 'extraAmount', label: '추가 금액', type: 'money' },
        { name: 'dueDate', label: '납부기한', type: 'date', required: true },
        { name: 'memo', label: '메모', full: true }
      ],
      onSubmit: function (v) {
        inv.rent = U.num(v.rent);
        inv.maintenanceFee = U.num(v.maintenanceFee);
        inv.extras = U.num(v.extraAmount) ? [{ label: v.extraLabel || '기타', amount: U.num(v.extraAmount) }] : [];
        inv.dueDate = v.dueDate;
        inv.memo = v.memo;
        B.recalc(inv);
        S.commit();
        UI.toast('청구서를 수정했습니다.', 'ok');
        App.router.refresh();
      }
    });
  }

  /* ---------- 상세 ---------- */
  function detail(invId) {
    var inv = S.invoice(invId);
    if (!inv) return;
    var c = S.contract(inv.contractId) || {};
    var rest = B.remaining(inv);
    var fee = B.lateFee(inv);
    var lines = [['월세', inv.rent], ['관리비', inv.maintenanceFee]]
      .concat((inv.extras || []).map(function (e) { return [e.label || '기타', e.amount]; }));

    var body = '<div class="t-faint" style="font-size:12px">' + U.esc(S.unitLabel(inv.unitId)) + ' · ' + U.esc(c.tenantName || '') + '</div>' +
      '<h3 style="margin:4px 0 12px;font-size:16px">' + U.fmtMonth(inv.ym) + ' 청구서</h3>' +
      '<table style="font-size:13px"><tbody>' +
      lines.map(function (l) {
        return '<tr><td class="t-dim">' + U.esc(l[0]) + '</td><td class="num mono">' + U.won(l[1]) + '</td></tr>';
      }).join('') +
      '<tr><td class="t-strong">청구 합계</td><td class="num mono t-strong">' + U.won(inv.total) + '</td></tr>' +
      '<tr><td class="t-dim">납부기한</td><td class="num">' + U.fmtDate(inv.dueDate) +
      (B.overdueDays(inv) ? ' <span class="badge badge-danger">' + B.overdueDays(inv) + '일 연체</span>' : '') + '</td></tr>' +
      (fee ? '<tr><td class="t-dim">연체료(참고, 연 ' + S.get().settings.lateFeeRate + '%)</td><td class="num mono">' + U.won(fee) + '</td></tr>' : '') +
      '<tr><td class="t-dim">수납액</td><td class="num mono">' + U.won(B.paidAmount(inv)) + '</td></tr>' +
      '<tr><td class="t-strong">미납 잔액</td><td class="num mono t-strong ' + (rest ? 'stat-value danger' : '') + '" style="font-size:13px">' + U.won(rest) + '</td></tr>' +
      '</tbody></table>' +
      (inv.memo ? '<div class="t-faint" style="margin-top:8px;font-size:12px">' + U.esc(inv.memo) + '</div>' : '') +
      '<h3 style="margin:18px 0 8px;font-size:13px">입금 내역</h3>';

    if ((inv.payments || []).length) {
      body += '<div class="table-wrap"><table><tbody>' +
        U.sortBy(inv.payments, function (p) { return p.date; }).map(function (p) {
          return '<tr><td>' + U.fmtDate(p.date) + '</td><td>' + B.methodLabel(p) + '</td>' +
            '<td>' + U.esc(p.memo || '') + '</td>' +
            '<td class="num mono">' + U.won(p.amount) + '</td>' +
            '<td class="actions"><button class="btn btn-sm btn-ghost" data-act="delPay" data-id="' + inv.id + '::' + p.id + '">삭제</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      body += '<div class="t-faint" style="font-size:13px">입금 내역이 없습니다.</div>';
    }

    UI.open({
      title: '청구서 상세',
      body: body,
      buttons: [
        { label: '청구서 수정', onClick: function () { UI.close(); editInvoice(invId); } },
        rest > 0
          ? { label: '입금 등록', className: 'btn-primary', onClick: function () { UI.close(); openSettle(invId); } }
          : { label: '닫기', className: 'btn-primary', onClick: UI.close }
      ]
    });
  }

  /* ---------- 검색 ---------- */
  /** 호실·임차인·건물명으로 걸러낸다 */
  function hit(unitId, tenantName) {
    var q = state.rq.trim().toLowerCase();
    if (!q) return true;
    return (S.unitLabel(unitId) + ' ' + (tenantName || '')).toLowerCase().indexOf(q) >= 0;
  }

  function searchHTML() {
    return '<input id="f-rq" type="search" placeholder="호실 · 임차인 검색" value="' +
      U.esc(state.rq) + '" style="min-width:170px">';
  }

  /** 모든 청구서의 입금 기록을 한 줄씩 펼친다 (입금 내역 탭) */
  function paymentRows() {
    var out = [];
    S.get().invoices.forEach(function (inv) {
      (inv.payments || []).forEach(function (p) {
        var u = S.unit(inv.unitId);
        if (state.buildingId && (!u || u.buildingId !== state.buildingId)) return;
        var c = S.contract(inv.contractId) || {};
        if (!hit(inv.unitId, c.tenantName)) return;
        var d = String(p.date || '');
        if (state.from && d < state.from) return;
        if (state.to && d > state.to) return;
        out.push({ inv: inv, p: p, c: c });
      });
    });
    // 청구서 없이 입금만 기록하는 계약(자금일보 · 회계 확인 물건)
    B.receiptRows().forEach(function (r) {
      var u = S.unit(r.inv.unitId);
      if (state.buildingId && (!u || u.buildingId !== state.buildingId)) return;
      if (!hit(r.inv.unitId, r.c.tenantName)) return;
      var d = String(r.p.date || '');
      if (state.from && d < state.from) return;
      if (state.to && d > state.to) return;
      out.push(r);
    });
    return U.sortBy(out, function (r) { return r.p.date + '_' + S.unitLabel(r.inv.unitId); }, true);
  }

  /* ---------- 목록 ---------- */
  function invoiceList() {
    var list = state.tab === 'unpaid' ? B.unpaidInvoices() : S.invoicesOfMonth(state.ym);
    if (state.status) list = list.filter(function (i) { return B.status(i) === state.status; });
    if (state.buildingId) {
      list = list.filter(function (i) {
        var u = S.unit(i.unitId);
        return u && u.buildingId === state.buildingId;
      });
    }
    list = list.filter(function (i) {
      return hit(i.unitId, (S.contract(i.contractId) || {}).tenantName);
    });
    return U.sortBy(list, function (i) { return i.ym + '_' + S.unitLabel(i.unitId); });
  }

  /** 미납 청구서를 계약(임차인) 단위로 묶는다 */
  function unpaidGroups() {
    var map = {};
    B.unpaidInvoices().forEach(function (inv) {
      if (state.buildingId) {
        var u = S.unit(inv.unitId);
        if (!u || u.buildingId !== state.buildingId) return;
      }
      if (!hit(inv.unitId, (S.contract(inv.contractId) || {}).tenantName)) return;
      var g = map[inv.contractId] || (map[inv.contractId] =
        { contractId: inv.contractId, first: inv, months: 0, amount: 0, last: '', invoices: [] });
      g.months++;
      g.amount += B.remaining(inv);
      g.invoices.push(inv);
      if (inv.ym < g.first.ym) g.first = inv;
      (inv.payments || []).forEach(function (p) { if (p.date > g.last) g.last = p.date; });
    });
    return U.sortBy(Object.keys(map).map(function (k) { return map[k]; }),
      function (g) { return g.amount; }, true);
  }

  function groupDetail(contractId) {
    var g = unpaidGroups().filter(function (x) { return x.contractId === contractId; })[0];
    if (!g) return;
    var c = S.contract(contractId) || {};
    var rows = U.sortBy(g.invoices, function (i) { return i.ym; }).map(function (inv) {
      return { cells: [
        U.fmtMonth(inv.ym), U.fmtDate(inv.dueDate),
        '<span class="mono">' + U.comma(inv.total) + '</span>',
        '<span class="mono">' + U.comma(B.paidAmount(inv)) + '</span>',
        '<span class="mono t-strong">' + U.comma(B.remaining(inv)) + '</span>',
        B.statusBadge(inv) + B.offsetBadge(inv),
        '<button class="btn btn-sm btn-primary" data-act="settle" data-id="' + inv.id + '">수납</button>'
      ] };
    });
    UI.open({
      title: S.unitLabel(g.first.unitId) + ' · ' + (c.tenantName || ''),
      body: '<div class="t-dim" style="font-size:13px;margin-bottom:10px">미납 ' + g.months + '개월 · 합계 ' +
        '<b>' + U.won(g.amount) + '</b>' + (c.tenantPhone ? ' · ' + U.phone(c.tenantPhone) : '') +
        (g.last ? ' · 최근 입금 ' + U.fmtDate(g.last) : '') + '</div>' +
        UI.table(['청구월', '납부기한', { label: '청구액', className: 'num' },
                  { label: '수납액', className: 'num' }, { label: '미납액', className: 'num' },
                  '상태', { label: '', className: 'actions' }], rows) +
        (c.memo ? '<div class="t-faint" style="margin-top:10px;font-size:12px;white-space:pre-line">' + U.esc(c.memo) + '</div>' : ''),
      buttons: [{ label: '닫기', className: 'btn-primary', onClick: UI.close }]
    });
  }

  /** 왼쪽 건물 목록 — 건물별 미납 임차인 수를 함께 보여준다 */
  function buildingListHTML(st, unpaidAll) {
    var per = {}, total = {};
    unpaidAll.forEach(function (inv) {
      var u = S.unit(inv.unitId);
      var bid = u ? u.buildingId : '';
      (per[bid] || (per[bid] = {}))[inv.contractId] = 1;
      total[inv.contractId] = 1;
    });
    var q = state.q.trim().toLowerCase();
    var list = st.buildings.filter(function (b) {
      if (!q) return true;
      return ((b.name || '') + ' ' + (b.address || '')).toLowerCase().indexOf(q) >= 0;
    });
    // 미납이 많은 건물부터
    list = U.sortBy(list, function (b) { return -Object.keys(per[b.id] || {}).length; });
    var totalN = Object.keys(total).length;
    return '<aside class="blist">' +
      '<div class="blist-search"><input id="p-q" type="search" placeholder="건물 이름 · 주소 검색" value="' + U.esc(state.q) + '"></div>' +
      '<div class="blist-scroll">' +
      (q ? '' :
        '<button class="bitem' + (state.buildingId ? '' : ' active') + '" data-act="payBld" data-id="">' +
        '<span class="bitem-name">전체 건물</span><span class="bitem-cnt">' + st.buildings.length + '건</span>' +
        (totalN ? '<span class="bitem-vac" title="미납 임차인 ' + totalN + '명">' + totalN + '</span>' : '') +
        '</button>') +
      (list.length ? '<div class="blist-head">건물 ' + list.length + '</div>' : '') +
      list.map(function (b) {
        var n = Object.keys(per[b.id] || {}).length;
        var units = S.unitsOf(b.id).length;
        return '<button class="bitem' + (state.buildingId === b.id ? ' active' : '') +
          '" data-act="payBld" data-id="' + b.id + '">' +
          '<span class="bitem-name">' + U.esc(b.name) + '</span>' +
          (units ? '<span class="bitem-cnt">' + units + '실</span>' : '') +
          (n ? '<span class="bitem-vac" title="미납 임차인 ' + n + '명">' + n + '</span>' : '') +
          '</button>';
      }).join('') +
      (q && !list.length ? '<div class="blist-empty">검색 결과가 없습니다.</div>' : '') +
      '</div></aside>';
  }

  function render(el) {
    var st = S.get();
    var unpaidAll = B.unpaidInvoices();
    var html = '<div class="tabs">' +
      [['month', U.fmtMonth(state.ym) + ' 청구', S.invoicesOfMonth(state.ym).length],
       ['unpaid', '미납 · 연체', unpaidAll.length],
       ['pay', '입금 내역', U.sum(st.invoices, function (i) { return (i.payments || []).length; })],
       ['building', '건물별', st.buildings.length]].map(function (t) {
        return '<button class="tab' + (state.tab === t[0] ? ' active' : '') +
          '" data-act="tabPay" data-id="' + t[0] + '">' + t[1] +
          '<span class="cnt">' + t[2] + '</span></button>';
      }).join('') + '</div>';

    /* ── 월별 청구 ── */
    if (state.tab === 'month') {
      var stats = B.monthStats(state.ym);
      html += '<div class="grid grid-4" style="margin-bottom:16px">' +
        UI.stat('청구액', U.wonShort(stats.billed), U.fmtMonth(state.ym) + ' · ' + stats.count + '건') +
        UI.stat('수납액', U.wonShort(stats.collected), '수납률 ' + stats.rate + '%', stats.rate >= 100 ? 'ok' : '') +
        UI.stat('미납액', U.wonShort(stats.unpaid), stats.unpaidCount + '건 미납', stats.unpaid ? 'danger' : '') +
        UI.stat('연체 건수', stats.overdueCount + '건', '납부기한 경과', stats.overdueCount ? 'danger' : '') +
        '</div>';
      html += '<div class="filters">' +
        '<button class="btn btn-sm" data-act="prevM">◀</button>' +
        '<input type="month" id="ym" class="inline-input" value="' + state.ym + '">' +
        '<button class="btn btn-sm" data-act="nextM">▶</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="thisM">이번 달</button>' +
        '<select id="f-status"><option value="">전체 상태</option>' +
        [['unpaid', '미납'], ['overdue', '연체'], ['partial', '부분수납'], ['paid', '완납']].map(function (o) {
          return '<option value="' + o[0] + '"' + (state.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select>' + searchHTML() +
        '<div class="spacer"></div><button class="btn btn-sm" data-act="csv">CSV 내보내기</button></div>';

      var rows = invoiceList().map(function (inv) {
        var c = S.contract(inv.contractId) || {};
        var rest = B.remaining(inv);
        var od = B.overdueDays(inv);
        return { cells: [
          '<span class="t-strong">' + U.esc(S.unitLabel(inv.unitId)) + '</span>' +
          '<div class="t-faint" style="font-size:12px">' + App.views.notices.tenantLink(c) + '</div>',
          U.fmtDate(inv.dueDate) + (od ? '<div style="font-size:12px;color:var(--danger)">' + od + '일 경과</div>' : ''),
          '<span class="mono">' + U.comma(inv.rent) + '</span>',
          '<span class="mono">' + U.comma(inv.maintenanceFee) + '</span>',
          '<span class="mono t-strong">' + U.comma(inv.total) + '</span>',
          '<span class="mono">' + U.comma(B.paidAmount(inv)) + '</span>',
          '<span class="mono ' + (rest ? 'stat-value danger' : 't-faint') + '" style="font-size:13px">' + U.comma(rest) + '</span>',
          B.statusBadge(inv) + B.offsetBadge(inv),
          (rest > 0 ? '<button class="btn btn-sm btn-primary" data-act="settle" data-id="' + inv.id + '">완납</button> ' : '') +
          '<button class="btn btn-sm btn-ghost" data-act="detail" data-id="' + inv.id + '">상세</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="del" data-id="' + inv.id + '">삭제</button>'
        ] };
      });
      html += UI.card('', rows.length
        ? UI.table(['호실 · 임차인', '납부기한', { label: '월세', className: 'num' },
            { label: '관리비', className: 'num' }, { label: '청구액', className: 'num' },
            { label: '수납액', className: 'num' }, { label: '미납액', className: 'num' },
            '상태', { label: '', className: 'actions' }], rows)
        : UI.empty(U.fmtMonth(state.ym) + ' 청구서가 없습니다',
            '이 달의 청구서를 생성하면 수납 관리를 시작할 수 있습니다.',
            '<button class="btn btn-primary" data-act="gen">' + U.fmtMonth(state.ym) + ' 청구서 생성</button>'), '', true);
    }

    /* ── 미납 · 연체 (임차인별) ── */
    if (state.tab === 'unpaid') {
      var groups = unpaidGroups();
      var total = U.sum(groups, function (g) { return g.amount; });
      html += '<div class="grid grid-4" style="margin-bottom:16px">' +
        UI.stat('미납 총액', U.wonShort(total), '임차인 ' + groups.length + '명 · 청구서 ' +
          U.sum(groups, function (g) { return g.months; }) + '건', total ? 'danger' : '') +
        UI.stat('최다 미납', groups.length ? U.wonShort(groups[0].amount) : '-',
          groups.length ? S.unitLabel(groups[0].first.unitId) : '') +
        UI.stat('6개월 이상', groups.filter(function (g) { return g.months >= 6; }).length + '명',
          '장기 미납', groups.filter(function (g) { return g.months >= 6; }).length ? 'danger' : '') +
        UI.stat('연체료(참고)', U.wonShort(U.sum(unpaidAll, function (i) { return B.lateFee(i); })),
          '연 ' + st.settings.lateFeeRate + '% 기준') +
        '</div>';
      html += '<div class="filters">' + searchHTML() + '<div class="spacer"></div>' +
        '<button class="btn btn-sm" data-act="csv">CSV 내보내기</button></div>';

      var grows = groups.map(function (g) {
        var c = S.contract(g.contractId) || {};
        return { cells: [
          '<span class="t-strong">' + U.esc(S.unitLabel(g.first.unitId)) + '</span>' +
          '<div class="t-faint" style="font-size:12px">' + App.views.notices.tenantLink(c) +
          (c.tenantPhone ? ' · ' + U.phone(c.tenantPhone) : '') + '</div>',
          U.fmtMonth(g.first.ym) + (g.months > 1 ? ' 외 ' + (g.months - 1) + '개월' : ''),
          '<span class="mono">' + g.months + '</span>',
          U.fmtDate(g.first.dueDate) +
            '<div class="t-faint" style="font-size:12px">' + B.overdueDays(g.first) + '일 경과</div>',
          '<span class="mono t-strong stat-value danger" style="font-size:13px">' + U.comma(g.amount) + '</span>',
          g.last ? U.fmtDate(g.last) : '<span class="t-faint">없음</span>',
          '<button class="btn btn-sm" data-act="groupDetail" data-id="' + g.contractId + '">내역</button> ' +
          '<button class="btn btn-sm" data-act="ntQuick" data-id="' + g.contractId + '">✉️ 문자</button> ' +
          '<button class="btn btn-sm btn-primary" data-act="settle" data-id="' + g.first.id + '">수납</button>'
        ] };
      });
      html += UI.card('', grows.length
        ? UI.table(['호실 · 임차인', '미납 시작', { label: '개월', className: 'num' }, '최초 납부기한',
            { label: '미납 합계', className: 'num' }, '최근 입금', { label: '', className: 'actions' }], grows)
        : UI.empty('미납 건이 없습니다', '모든 청구서가 수납 완료되었습니다.'), '', true);
    }

    /* ── 입금 내역 (일자별) ── */
    if (state.tab === 'pay') {
      var pays = paymentRows();
      var sum = U.sum(pays, function (r) { return r.p.amount; });
      var byMonth = U.groupBy(pays, function (r) { return U.monthKey(r.p.date); });
      var months = Object.keys(byMonth).sort().reverse();
      html += '<div class="grid grid-4" style="margin-bottom:16px">' +
        UI.stat('입금 건수', U.comma(pays.length) + '건',
          (state.from || state.to) ? (state.from || '처음') + ' ~ ' + (state.to || '오늘') : '전체 기간') +
        UI.stat('입금 합계', U.wonShort(sum), pays.length ? '건당 평균 ' + U.wonShort(Math.round(sum / pays.length)) : '') +
        UI.stat('대상 호실', U.comma(Object.keys(U.groupBy(pays, function (r) { return r.inv.unitId; })).length) + '실',
          state.buildingId ? U.esc((S.building(state.buildingId) || {}).name || '') : '전체 건물') +
        UI.stat('최근 입금', pays.length ? U.fmtDate(pays[0].p.date) : '-',
          months.length ? months.length + '개월에 걸침' : '') +
        '</div>';

      html += '<div class="filters">' +
        '<input type="date" id="f-from" class="inline-input" value="' + U.esc(state.from) + '">' +
        '<span class="t-faint">~</span>' +
        '<input type="date" id="f-to" class="inline-input" value="' + U.esc(state.to) + '">' +
        '<button class="btn btn-sm btn-ghost" data-act="rangeThis">이번 달</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="rangePrev">지난 달</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="range3">최근 3개월</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="rangeAll">전체</button>' +
        searchHTML() +
        '<div class="spacer"></div><button class="btn btn-sm" data-act="csvPay">CSV 내보내기</button></div>';

      var prows = [];
      months.forEach(function (m) {
        var list = byMonth[m];
        prows.push({ attrs: ' style="background:var(--surface-2);font-weight:600"',
          cells: [U.fmtMonth(m), '', '', '', '<span class="mono">' + U.comma(U.sum(list, function (r) { return r.p.amount; })) + '</span>',
                  '<span class="t-faint">' + list.length + '건</span>', ''] });
        list.forEach(function (r) {
          prows.push({ cells: [
            '<span class="mono">' + U.fmtDate(r.p.date) + '</span>',
            '<span class="t-strong">' + U.esc(S.unitLabel(r.inv.unitId)) + '</span>',
            U.esc(r.c.tenantName || ''),
            r.receipt ? '<span class="badge badge-muted">입금 기록</span>' : U.fmtMonth(r.inv.ym) + '분',
            '<span class="mono t-strong">' + U.comma(r.p.amount) + '</span>',
            B.methodLabel(r.p),
            '<span class="t-faint" style="font-size:12px;white-space:normal">' + U.esc(r.p.memo || '') + '</span>'
          ] });
        });
      });
      html += UI.card('', prows.length
        ? UI.table(['입금일', '호실', '임차인', '청구월', { label: '금액', className: 'num' }, '방법', '메모'], prows)
        : UI.empty('조건에 맞는 입금 기록이 없습니다', '기간이나 검색어를 바꿔 보세요.'), '', true);
    }

    /* ── 건물별 ── */
    if (state.tab === 'building') {
      var invs = S.invoicesOfMonth(state.ym);
      var per = {};
      st.buildings.forEach(function (b) { per[b.id] = { b: b, count: 0, billed: 0, paid: 0, unpaid: 0, arrears: 0 }; });
      invs.forEach(function (inv) {
        var u = S.unit(inv.unitId);
        var row = u && per[u.buildingId];
        if (!row) return;
        row.count++; row.billed += U.num(inv.total);
        row.paid += Math.min(B.paidAmount(inv), U.num(inv.total));
      });
      unpaidAll.forEach(function (inv) {
        var u = S.unit(inv.unitId);
        if (u && per[u.buildingId]) per[u.buildingId].arrears += B.remaining(inv);
      });
      var list = Object.keys(per).map(function (k) { return per[k]; })
        .filter(function (r) { return r.count || r.arrears; });
      list = U.sortBy(list, function (r) { return -r.arrears; });

      html += '<div class="filters">' +
        '<button class="btn btn-sm" data-act="prevM">◀</button>' +
        '<input type="month" id="ym" class="inline-input" value="' + state.ym + '">' +
        '<button class="btn btn-sm" data-act="nextM">▶</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="thisM">이번 달</button>' +
        '<div class="spacer"></div><span class="t-faint">' + U.fmtMonth(state.ym) + ' 기준 · 미납은 전체 기간</span></div>';

      var brows = list.map(function (r) {
        var rate = U.pct(r.paid, r.billed);
        return { cells: [
          '<button class="btn btn-sm btn-ghost" data-act="payBuilding" data-id="' + r.b.id + '" style="padding:0;font-weight:600">' +
            U.esc(r.b.name) + '</button>',
          '<span class="mono">' + r.count + '</span>',
          '<span class="mono">' + U.comma(r.billed) + '</span>',
          '<span class="mono">' + U.comma(r.paid) + '</span>',
          '<span class="mono">' + U.comma(r.billed - r.paid) + '</span>',
          '<div class="progress" style="min-width:80px"><span style="width:' + Math.min(100, rate) + '%"></span></div>' +
            '<div class="t-faint mono" style="font-size:11px">' + rate + '%</div>',
          '<span class="mono t-strong ' + (r.arrears ? 'stat-value danger' : 't-faint') + '" style="font-size:13px">' +
            U.comma(r.arrears) + '</span>'
        ] };
      });
      brows.push({ attrs: ' style="background:var(--surface-2);font-weight:600"',
        cells: ['합계', '<span class="mono">' + U.sum(list, function (r) { return r.count; }) + '</span>',
          '<span class="mono">' + U.comma(U.sum(list, function (r) { return r.billed; })) + '</span>',
          '<span class="mono">' + U.comma(U.sum(list, function (r) { return r.paid; })) + '</span>',
          '<span class="mono">' + U.comma(U.sum(list, function (r) { return r.billed - r.paid; })) + '</span>', '',
          '<span class="mono">' + U.comma(U.sum(list, function (r) { return r.arrears; })) + '</span>'] });
      html += UI.card('', UI.table(['건물', { label: '청구 건수', className: 'num' },
        { label: '청구액', className: 'num' }, { label: '수납액', className: 'num' },
        { label: '당월 미납', className: 'num' }, '수납률', { label: '누적 미납', className: 'num' }],
        brows), '', true);
    }

    el.innerHTML = '<div class="bsplit">' + buildingListHTML(st, unpaidAll) +
      '<div class="bmain">' + html + '</div></div>';

    var qEl = document.getElementById('p-q');
    UI.onType(qEl, function (v) { state.q = v; App.router.refresh(true); });
    var ymEl = document.getElementById('ym');
    if (ymEl) ymEl.addEventListener('change', function () {
      if (ymEl.value) { state.ym = ymEl.value; App.router.refresh(); }
    });
    var fs = document.getElementById('f-status');
    if (fs) fs.addEventListener('change', function () { state.status = fs.value; App.router.refresh(); });
    var rq = document.getElementById('f-rq');
    UI.onType(rq, function (v) { state.rq = v; App.router.refresh(true); }, 220);
    var ff = document.getElementById('f-from');
    if (ff) ff.addEventListener('change', function () { state.from = ff.value; App.router.refresh(); });
    var ft = document.getElementById('f-to');
    if (ft) ft.addEventListener('change', function () { state.to = ft.value; App.router.refresh(); });
  }

  function exportCSV() {
    var rows = [['청구월', '건물', '호실', '임차인', '납부기한', '월세', '관리비', '기타', '청구액', '수납액', '미납액', '상태', '입금일']];
    invoiceList().forEach(function (inv) {
      var c = S.contract(inv.contractId) || {};
      var u = S.unit(inv.unitId) || {};
      var b = S.building(u.buildingId) || {};
      rows.push([
        inv.ym, b.name || '', u.name || '', c.tenantName || '', inv.dueDate,
        inv.rent, inv.maintenanceFee, U.sum(inv.extras || [], function (e) { return e.amount; }),
        inv.total, B.paidAmount(inv), B.remaining(inv),
        B.STATUS_LABEL[B.status(inv)],
        (inv.payments || []).map(function (p) { return p.date; }).join(' ')
      ]);
    });
    U.download('옆커폰_주택관리_수납내역_' + (state.tab === 'unpaid' ? '미납전체' : state.ym) + '.csv', U.toCSV(rows), 'text/csv');
    UI.toast('CSV 파일을 내려받았습니다.', 'ok');
  }

  App.views.payments = {
    title: '수납 · 미납',
    desc: '월별 청구서를 만들고 입금을 기록합니다.',
    openSettle: openSettle,
    actions: function () {
      return '<button class="btn btn-primary" data-act="gen">' + U.fmtMonth(state.ym) + ' 청구서 생성</button>';
    },
    render: render,
    handlers: {
      gen: function () {
        var r = B.generateMonth(state.ym);
        UI.toast(r.created
          ? U.fmtMonth(state.ym) + ' 청구서 ' + r.created + '건 생성 (기존 ' + r.skipped + '건 유지)'
          : '새로 생성할 청구서가 없습니다.', r.created ? 'ok' : '');
        state.tab = 'month';
        App.router.refresh();
      },
      prevM: function () { state.ym = U.addMonths(state.ym, -1); App.router.refresh(); },
      nextM: function () { state.ym = U.addMonths(state.ym, 1); App.router.refresh(); },
      thisM: function () { state.ym = U.currentMonth(); App.router.refresh(); },
      tabPay: function (id) { state.tab = id; App.router.refresh(); window.scrollTo(0, 0); },
      rangeThis: function () {
        state.from = U.toISO(U.monthStart(U.currentMonth()));
        state.to = U.toISO(U.monthEnd(U.currentMonth()));
        App.router.refresh();
      },
      rangePrev: function () {
        var m = U.addMonths(U.currentMonth(), -1);
        state.from = U.toISO(U.monthStart(m));
        state.to = U.toISO(U.monthEnd(m));
        App.router.refresh();
      },
      range3: function () {
        state.from = U.toISO(U.monthStart(U.addMonths(U.currentMonth(), -2)));
        state.to = U.todayISO();
        App.router.refresh();
      },
      rangeAll: function () { state.from = ''; state.to = ''; App.router.refresh(); },
      csvPay: function () {
        var rows = [['입금일', '건물', '호실', '임차인', '청구월', '금액', '방법', '메모']];
        paymentRows().forEach(function (r) {
          var u = S.unit(r.inv.unitId) || {};
          var b = S.building(u.buildingId) || {};
          rows.push([r.p.date, b.name || '', u.name || '', r.c.tenantName || '',
                     r.inv.ym, r.p.amount, r.p.method || '', r.p.memo || '']);
        });
        U.download('옆커폰_입금내역_' + (state.from || '전체') + '_' + (state.to || U.todayISO()) + '.csv',
                   U.toCSV(rows), 'text/csv');
        UI.toast('입금 내역 CSV를 내려받았습니다.', 'ok');
      },
      payBld: function (id) {
        state.buildingId = id || '';
        // 건물별 표에서 한 건물을 고르면 그 건물의 월별 청구로 넘어간다
        if (id && state.tab === 'building') state.tab = 'month';
        App.router.refresh(); window.scrollTo(0, 0);
      },
      groupDetail: groupDetail,
      payBuilding: function (id) { state.buildingId = id; state.tab = 'month'; App.router.refresh(); },
      settle: openSettle,
      detail: detail,
      editInvoice: editInvoice,
      csv: exportCSV,
      delPay: function (composite) {
        var parts = composite.split('::');
        B.removePayment(parts[0], parts[1]);
        UI.close();
        UI.toast('입금 내역을 삭제했습니다.');
        App.router.refresh();
      },
      del: function (id) {
        var inv = S.invoice(id);
        UI.confirm({
          title: '청구서 삭제',
          danger: true, confirmLabel: '삭제',
          message: U.fmtMonth(inv.ym) + ' · ' + S.unitLabel(inv.unitId) + ' 청구서를 삭제합니다.' +
            ((inv.payments || []).length ? '\n입금 내역 ' + inv.payments.length + '건도 함께 삭제됩니다.' : ''),
          onConfirm: function () { S.remove('invoices', id); UI.toast('삭제했습니다.'); App.router.refresh(); }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 지출 관리 */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var state = { year: String(new Date().getFullYear()), buildingId: '', category: '' };

  function buildingOptions() {
    return [{ value: '', label: '건물 미지정 (공통)' }].concat(
      S.get().buildings.map(function (b) { return { value: b.id, label: b.name }; })
    );
  }

  function expenseForm(id) {
    var e = null;
    if (id) {
      S.get().expenses.forEach(function (x) { if (x.id === id) e = x; });
    }
    var st = S.get();
    UI.form({
      title: e ? '지출 수정' : '지출 등록',
      values: e || { date: U.todayISO(), category: st.settings.expenseCategories[0], buildingId: '' },
      fields: [
        { name: 'date', label: '지출일', type: 'date', required: true },
        { name: 'category', label: '분류', type: 'select', options: st.settings.expenseCategories },
        { name: 'buildingId', label: '건물', type: 'select', options: buildingOptions() },
        { name: 'unitName', label: '호실', placeholder: '예) 201호 (건물 공통이면 비움)' },
        { name: 'amount', label: '금액', type: 'money', required: true },
        { name: 'method', label: '결제수단', type: 'select', options: ['농협', '신협', '카드', '현금', '기타'] },
        { name: 'memo', label: '내용', full: true, placeholder: '예) 201호 보일러 수리' }
      ],
      onSubmit: function (v) {
        if (U.num(v.amount) <= 0) return { amount: '0보다 큰 금액을 입력하세요.' };
        S.upsert('expenses', Object.assign({ id: e ? e.id : null }, v));
        UI.toast('지출을 저장했습니다.', 'ok');
        App.router.refresh();
      }
    });
  }

  function filtered() {
    return U.sortBy(S.get().expenses.filter(function (e) {
      if (state.year && String(e.date).slice(0, 4) !== state.year) return false;
      if (state.buildingId && e.buildingId !== state.buildingId) return false;
      if (state.category && e.category !== state.category) return false;
      return true;
    }), function (e) { return e.date; }, true);
  }

  function years() {
    var set = {};
    S.get().expenses.forEach(function (e) { set[String(e.date).slice(0, 4)] = 1; });
    set[String(new Date().getFullYear())] = 1;
    return Object.keys(set).sort().reverse();
  }

  function render(el) {
    var st = S.get();
    var list = filtered();
    var total = U.sum(list, function (e) { return e.amount; });
    var byCat = U.groupBy(list, function (e) { return e.category || '기타'; });

    var filters = '<div class="filters">' +
      '<select id="f-year">' + years().map(function (y) {
        return '<option value="' + y + '"' + (state.year === y ? ' selected' : '') + '>' + y + '년</option>';
      }).join('') + '<option value=""' + (state.year === '' ? ' selected' : '') + '>전체 기간</option></select>' +
      '<select id="f-building"><option value="">전체 건물</option>' +
      st.buildings.map(function (b) {
        return '<option value="' + b.id + '"' + (state.buildingId === b.id ? ' selected' : '') + '>' + U.esc(b.name) + '</option>';
      }).join('') + '</select>' +
      '<select id="f-cat"><option value="">전체 분류</option>' +
      st.settings.expenseCategories.map(function (c) {
        return '<option value="' + U.esc(c) + '"' + (state.category === c ? ' selected' : '') + '>' + U.esc(c) + '</option>';
      }).join('') + '</select>' +
      '<div class="spacer"></div>' +
      '<span class="t-dim mono">합계 ' + U.won(total) + ' · ' + list.length + '건</span>' +
      '<button class="btn btn-sm" data-act="csv">CSV 내보내기</button>' +
      '</div>';

    var catHTML = Object.keys(byCat).length
      ? '<div class="grid grid-4">' + U.sortBy(Object.keys(byCat), function (k) {
          return U.sum(byCat[k], function (e) { return e.amount; });
        }, true).slice(0, 8).map(function (k) {
          var amount = U.sum(byCat[k], function (e) { return e.amount; });
          return '<div><div class="t-faint" style="font-size:12px">' + U.esc(k) + '</div>' +
            '<div class="t-strong mono">' + U.wonShort(amount) + '</div>' +
            '<div class="progress" style="margin-top:5px"><span style="width:' + U.pct(amount, total) + '%;background:var(--danger)"></span></div></div>';
        }).join('') + '</div>'
      : '<div class="t-faint">지출 내역이 없습니다.</div>';

    var rows = list.map(function (e) {
      var b = S.building(e.buildingId);
      return { cells: [
        U.fmtDate(e.date),
        '<span class="badge badge-muted">' + U.esc(e.category || '기타') + '</span>',
        b ? U.esc(b.name) : '<span class="t-faint">공통</span>',
        e.unitName ? U.esc(e.unitName) : '<span class="t-faint">-</span>',
        U.esc(e.memo || ''),
        e.method ? '<span class="badge badge-muted">' + U.esc(e.method) + '</span>' : '',
        '<span class="mono t-strong">' + U.comma(e.amount) + '</span>',
        '<button class="btn btn-sm btn-ghost" data-act="edit" data-id="' + e.id + '">수정</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="del" data-id="' + e.id + '">삭제</button>'
      ] };
    });

    el.innerHTML = filters +
      UI.card('분류별 지출' + (state.year ? ' (' + state.year + '년)' : ''), catHTML) +
      '<div style="margin-top:16px">' +
      UI.card('', rows.length ? UI.table(['지출일', '분류', '건물', '호실', '내용', '결제', { label: '금액', className: 'num' }, { label: '', className: 'actions' }], rows)
        : UI.empty('지출 내역이 없습니다', '수선비, 공과금, 세금 등 건물 관련 지출을 기록하면 순수익을 계산할 수 있습니다.',
          '<button class="btn btn-primary" data-act="add">지출 등록</button>'), '', true) +
      '</div>';

    document.getElementById('f-year').addEventListener('change', function () { state.year = this.value; App.router.refresh(); });
    document.getElementById('f-building').addEventListener('change', function () { state.buildingId = this.value; App.router.refresh(); });
    document.getElementById('f-cat').addEventListener('change', function () { state.category = this.value; App.router.refresh(); });
  }

  App.views.expenses = {
    title: '지출 관리',
    desc: '수선비·공과금·세금 등 건물 지출을 기록합니다.',
    actions: function () { return '<button class="btn btn-primary" data-act="add">＋ 지출 등록</button>'; },
    render: render,
    handlers: {
      add: function () { expenseForm(null); },
      edit: function (id) { expenseForm(id); },
      del: function (id) {
        UI.confirm({
          title: '지출 삭제', danger: true, confirmLabel: '삭제',
          message: '이 지출 내역을 삭제합니다.',
          onConfirm: function () { S.remove('expenses', id); UI.toast('삭제했습니다.'); App.router.refresh(); }
        });
      },
      csv: function () {
        var rows = [['지출일', '분류', '건물', '호실', '내용', '결제수단', '금액']];
        filtered().forEach(function (e) {
          var b = S.building(e.buildingId);
          rows.push([e.date, e.category, b ? b.name : '공통', e.unitName || '', e.memo || '', e.method || '', e.amount]);
        });
        U.download('옆커폰_주택관리_지출내역_' + (state.year || '전체') + '.csv', U.toCSV(rows), 'text/csv');
        UI.toast('CSV 파일을 내려받았습니다.', 'ok');
      }
    }
  };
})(window.App);

</script>
<script>
/* 자산 현황 — 물건별 취득·대출·수익 */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var state = { owner: '', kind: '', op: '' };

  function monthlyRent(bid) {
    return U.sum(S.unitsOf(bid), function (u) {
      var c = S.activeContract(u.id);
      return c ? U.num(c.rent) + U.num(c.maintenanceFee) : 0;
    });
  }

  function rows() {
    return S.get().buildings.filter(function (b) { return !S.isDisposed(b); }).map(function (b) {
      var units = S.unitsOf(b.id);
      var occupied = units.filter(function (u) { return !!S.activeContract(u.id); }).length;
      var count = units.length || U.num(b.unitCount);
      var rent = monthlyRent(b.id);
      var interest = U.num(b.loanInterest);
      return {
        b: b,
        lodging: S.isLodging(b),
        registered: units.length > 0,
        units: count,
        occupied: occupied,
        vacancy: units.length ? Math.round((units.length - occupied) / units.length * 1000) / 10 : 0,
        bid: U.num(b.bidPrice),
        loan: U.num(b.loanAmount),
        equity: Math.max(0, U.num(b.bidPrice) - U.num(b.loanAmount)),
        rent: rent,
        interest: interest,
        net: rent - interest
      };
    });
  }

  function filtered() {
    return rows().filter(function (r) {
      if (state.owner && (r.b.owner || '') !== state.owner) return false;
      if (state.kind && (r.b.kind || '') !== state.kind) return false;
      if (state.op === '숙박' && !r.lodging) return false;
      if (state.op === '임대' && r.lodging) return false;
      return true;
    });
  }

  function render(el) {
    var list = filtered();
    var all = rows();
    var owners = [], kinds = [];
    all.forEach(function (r) {
      if (r.b.owner && owners.indexOf(r.b.owner) < 0) owners.push(r.b.owner);
      if (r.b.kind && kinds.indexOf(r.b.kind) < 0) kinds.push(r.b.kind);
    });

    var tBid = U.sum(list, function (r) { return r.bid; });
    var tLoan = U.sum(list, function (r) { return r.loan; });
    var tRent = U.sum(list, function (r) { return r.rent; });
    var tInt = U.sum(list, function (r) { return r.interest; });
    var rental = list.filter(function (r) { return !r.lodging; });
    var lodgingCount = list.length - rental.length;
    var tUnits = U.sum(rental, function (r) { return r.units; });
    var tOcc = U.sum(rental, function (r) { return r.occupied; });

    var html = '<div class="grid grid-4">' +
      UI.stat('보유 물건', list.length + '건', '임대 ' + tUnits + '호실 · 입주 ' + tOcc + '실' + (lodgingCount ? ' · 숙박업 ' + lodgingCount + '건' : '')) +
      UI.stat('취득가 합계', U.wonShort(tBid), '대출 ' + U.wonShort(tLoan) + ' · 자기자본 ' + U.wonShort(tBid - tLoan)) +
      UI.stat('월 임대료', U.wonShort(tRent), '진행중 계약 기준', 'ok') +
      UI.stat('월 순현금', U.wonShort(tRent - tInt), '임대료 - 대출이자 ' + U.wonShort(tInt),
        tRent - tInt >= 0 ? 'ok' : 'danger') +
      '</div>';

    html += '<div class="filters" style="margin-top:16px">' +
      '<select id="f-owner"><option value="">전체 명의</option>' +
      owners.map(function (o) {
        return '<option value="' + U.esc(o) + '"' + (state.owner === o ? ' selected' : '') + '>' + U.esc(o) + '</option>';
      }).join('') + '</select>' +
      '<select id="f-kind"><option value="">전체 종류</option>' +
      kinds.map(function (k) {
        return '<option value="' + U.esc(k) + '"' + (state.kind === k ? ' selected' : '') + '>' + U.esc(k) + '</option>';
      }).join('') + '</select>' +
      '<select id="f-op"><option value="">임대 · 숙박 전체</option>' +
      [['임대', '임대 물건'], ['숙박', '숙박업 운영']].map(function (o) {
        return '<option value="' + o[0] + '"' + (state.op === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select>' +
      '<div class="spacer"></div><span class="t-faint">' + list.length + '건' +
      (lodgingCount ? ' · 숙박업 ' + lodgingCount + '건은 입주·임대료 집계 제외' : '') + '</span>' +
      '<button class="btn btn-sm" data-act="csvAssets">CSV 내보내기</button></div>';

    var body = U.sortBy(list, function (r) { return -r.bid; }).map(function (r) {
      var b = r.b;
      return { cells: [
        '<span class="t-strong">' + U.esc(b.name) + '</span>' +
        (b.brand ? '<div class="t-faint" style="font-size:11px">' + U.esc(b.brand) + '</div>' : '') +
        (b.caseNo ? '<div class="t-faint" style="font-size:11px">' + U.esc(b.caseNo) + '</div>' : ''),
        (b.owner ? '<span class="badge badge-muted">' + U.esc(b.owner) + '</span>' : '-'),
        (b.kind ? '<span class="badge badge-info">' + U.esc(b.kind) + '</span>' : '-') +
          (r.lodging ? ' <span class="badge badge-warn">숙박</span>' : ''),
        '<span class="t-dim" style="font-size:12px">' + U.esc(b.address || '-') + '</span>',
        r.lodging ? '<span class="t-faint">객실 ' + (r.units || '-') + '</span>'
          : r.registered ? (r.occupied + ' / ' + r.units) : (r.units ? '<span class="t-faint">- / ' + r.units + '</span>' : '-'),
        r.registered && !r.lodging ? r.vacancy + '%' : '<span class="t-faint">-</span>',
        '<span class="mono">' + (r.bid ? U.comma(r.bid) : '-') + '</span>',
        '<span class="mono">' + (r.loan ? U.comma(r.loan) : '-') + '</span>',
        '<span class="mono">' + (r.interest ? U.comma(r.interest) : '-') + '</span>',
        '<span class="mono">' + (r.rent ? U.comma(r.rent) : '-') + '</span>',
        '<span class="mono t-strong" style="color:' + (r.net >= 0 ? 'inherit' : 'var(--danger)') + '">' +
          (r.rent || r.interest ? U.comma(r.net) : '-') + '</span>',
        '<button class="btn btn-sm btn-ghost" data-act="assetDetail" data-id="' + b.id + '">상세</button>'
      ] };
    });
    body.push({
      attrs: ' style="background:var(--surface-2);font-weight:600"',
      cells: ['합계', '', '', '', tOcc + ' / ' + tUnits, '', '<span class="mono">' + U.comma(tBid) + '</span>',
        '<span class="mono">' + U.comma(tLoan) + '</span>', '<span class="mono">' + U.comma(tInt) + '</span>',
        '<span class="mono">' + U.comma(tRent) + '</span>', '<span class="mono">' + U.comma(tRent - tInt) + '</span>', '']
    });

    html += '<div style="margin-top:16px">' + UI.card('', UI.table(
      ['물건', '명의', '종류', '소재지', '입주/호실', { label: '공실률', className: 'num' },
       { label: '취득가', className: 'num' }, { label: '대출금', className: 'num' },
       { label: '월 이자', className: 'num' }, { label: '월 임대료', className: 'num' },
       { label: '월 순현금', className: 'num' }, { label: '', className: 'actions' }],
      body), '', true) + '</div>';

    var st = S.get();
    if (st.listings.length) {
      var lrows = st.listings.map(function (l) {
        return { cells: [
          '<span class="t-strong">' + U.esc(l.name) + '</span>',
          U.esc(l.price || '-'),
          l.sentDate ? U.esc(l.sentDate) : '-',
          '<span class="mono">' + U.comma(l.sentCount) + '</span>',
          '<span class="mono">' + U.comma(l.naver) + '</span>',
          '<span class="mono ' + (U.num(l.contacted) ? 't-strong' : 't-faint') + '">' + U.comma(l.contacted) + '</span>'
        ] };
      });
      html += '<div style="margin-top:16px">' + UI.card('매물 홍보 현황',
        UI.table(['물건', '의뢰금액', '문자 발송일', { label: '발송 수', className: 'num' },
                  { label: '네이버 등록', className: 'num' }, { label: '중개사 연락', className: 'num' }], lrows),
        '<span class="t-faint" style="font-size:12px">문자 ' +
        U.comma(U.sum(st.listings, function (l) { return l.sentCount; })) + '건 발송 · 연락 ' +
        U.comma(U.sum(st.listings, function (l) { return l.contacted; })) + '건</span>', true) + '</div>';
    }

    if (st.templates.length) {
      html += '<div style="margin-top:16px">' + UI.card('부동산 문자 양식 (' + st.templates.length + '개)',
        st.templates.map(function (t, i) {
          return '<div class="list-item" style="padding-left:0;padding-right:0">' +
            '<div class="li-main"><div class="li-title">' + U.esc(t.title) + '</div>' +
            '<div class="li-sub">' + U.esc(String(t.body).slice(0, 70).replace(/\n/g, ' ')) + '…</div></div>' +
            '<button class="btn btn-sm" data-act="showTemplate" data-id="' + i + '">보기</button></div>';
        }).join('')) + '</div>';
    }

    el.innerHTML = html;
    document.getElementById('f-owner').addEventListener('change', function () { state.owner = this.value; App.router.refresh(); });
    document.getElementById('f-kind').addEventListener('change', function () { state.kind = this.value; App.router.refresh(); });
    document.getElementById('f-op').addEventListener('change', function () { state.op = this.value; App.router.refresh(); });
  }

  App.views.assets = {
    title: '자산 현황',
    desc: '물건별 취득가·대출·임대 수익을 한눈에 봅니다.',
    actions: function () { return '<button class="btn" data-act="addBuilding">＋ 물건 추가</button>'; },
    render: render,
    handlers: {
      assetDetail: function (id) { App.views.buildings.detail(id); },
      showTemplate: function (i) {
        var t = S.get().templates[Number(i)];
        if (!t) return;
        UI.open({
          title: t.title,
          body: '<textarea id="tpl-body" readonly style="width:100%;min-height:340px;padding:10px;' +
            'border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);' +
            'font-family:inherit;font-size:13px;line-height:1.6">' + U.esc(t.body) + '</textarea>',
          buttons: [
            { label: '닫기', onClick: UI.close },
            { label: '전체 선택', className: 'btn-primary', onClick: function () {
              var ta = document.getElementById('tpl-body');
              ta.focus(); ta.select();
              UI.toast('선택했습니다. Ctrl+C(⌘+C)로 복사하세요.', 'ok');
            } }
          ]
        });
      },
      csvAssets: function () {
        var out = [['물건', '명의', '종류', '운영', '사건번호', '소재지', '면적', '호실수', '입주', '공실률(%)',
                    '감정가', '취득가', '대출금', '월이자', '월임대료', '월순현금']];
        filtered().forEach(function (r) {
          var b = r.b;
          out.push([b.name, b.owner || '', b.kind || '', r.lodging ? '숙박' : '임대', b.caseNo || '', b.address || '', b.area || '',
                    r.units, r.occupied, r.vacancy, U.num(b.appraisal), r.bid, r.loan, r.interest, r.rent, r.net]);
        });
        U.download('옆커폰_주택관리_자산현황_' + U.todayISO() + '.csv', U.toCSV(out), 'text/csv');
        UI.toast('CSV 파일을 내려받았습니다.', 'ok');
      }
    }
  };
})(window.App);

</script>
<script>
/* 정산 리포트 */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var state = { year: String(new Date().getFullYear()) };

  function years() {
    var set = {};
    set[String(new Date().getFullYear())] = 1;
    S.get().invoices.forEach(function (inv) {
      (inv.payments || []).forEach(function (p) { set[String(p.date).slice(0, 4)] = 1; });
      set[inv.ym.slice(0, 4)] = 1;
    });
    S.get().expenses.forEach(function (e) { set[String(e.date).slice(0, 4)] = 1; });
    return Object.keys(set).sort().reverse();
  }

  function monthlyData(year) {
    var inc = B.incomeByMonth(year);
    var exp = B.expenseByMonth(year);
    var rows = [];
    for (var m = 1; m <= 12; m++) {
      var ym = year + '-' + U.pad2(m);
      var i = inc[ym] || { total: 0, rent: 0, etc: 0 };
      var billed = U.sum(S.invoicesOfMonth(ym), function (v) { return v.total; });
      rows.push({
        ym: ym, month: m,
        billed: billed,
        income: i.total, rent: i.rent, etc: i.etc,
        expense: exp[ym] || 0,
        net: i.total - (exp[ym] || 0)
      });
    }
    return rows;
  }

  function chart(rows) {
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r.income, r.expense); })));
    var cols = rows.map(function (r) {
      var ih = Math.round((r.income / max) * 150);
      var eh = Math.round((r.expense / max) * 150);
      var tip = r.month + '월 · 수입 ' + U.wonShort(r.income) + ' / 지출 ' + U.wonShort(r.expense);
      return '<div class="chart-col" title="' + U.esc(tip) + '">' +
        '<div class="chart-bars">' +
        '<div class="chart-bar" style="height:' + Math.max(2, ih) + 'px"></div>' +
        '<div class="chart-bar out" style="height:' + Math.max(2, eh) + 'px"></div>' +
        '</div><div class="chart-x">' + r.month + '</div></div>';
    }).join('');
    return '<div class="legend" style="margin-bottom:6px">' +
      '<span><i style="background:var(--accent)"></i>수입</span>' +
      '<span><i style="background:var(--danger)"></i>지출</span></div>' +
      '<div class="chart">' + cols + '</div>';
  }

  function render(el) {
    var year = state.year;
    var rows = monthlyData(year);
    var incomeTotal = U.sum(rows, function (r) { return r.income; });
    var expenseTotal = U.sum(rows, function (r) { return r.expense; });
    var billedTotal = U.sum(rows, function (r) { return r.billed; });
    var net = incomeTotal - expenseTotal;

    var filters = '<div class="filters">' +
      '<select id="f-year">' + years().map(function (y) {
        return '<option value="' + y + '"' + (state.year === y ? ' selected' : '') + '>' + y + '년</option>';
      }).join('') + '</select>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-sm" data-act="csv">CSV 내보내기</button>' +
      '</div>';

    var summary = '<div class="grid grid-4">' +
      UI.stat(year + '년 수입', U.wonShort(incomeTotal), '실제 입금 기준', 'ok') +
      UI.stat(year + '년 지출', U.wonShort(expenseTotal), '지출일 기준', expenseTotal ? 'danger' : '') +
      UI.stat('순수익', U.wonShort(net), '수입 - 지출', net >= 0 ? 'ok' : 'danger') +
      UI.stat('수납률', (billedTotal ? U.pct(incomeTotal, billedTotal) : 0) + '%',
        '청구 ' + U.wonShort(billedTotal) + ' 대비') +
      '</div>';

    var monthRows = rows.map(function (r) {
      return { cells: [
        r.month + '월',
        '<span class="mono">' + U.comma(r.billed) + '</span>',
        '<span class="mono">' + U.comma(r.income) + '</span>',
        '<span class="mono t-faint">' + U.comma(r.rent) + '</span>',
        '<span class="mono t-faint">' + U.comma(r.etc) + '</span>',
        '<span class="mono">' + U.comma(r.expense) + '</span>',
        '<span class="mono t-strong" style="color:' + (r.net >= 0 ? 'inherit' : 'var(--danger)') + '">' + U.comma(r.net) + '</span>'
      ] };
    });
    monthRows.push({
      attrs: ' style="background:var(--surface-2);font-weight:600"',
      cells: ['합계',
        '<span class="mono">' + U.comma(billedTotal) + '</span>',
        '<span class="mono">' + U.comma(incomeTotal) + '</span>',
        '<span class="mono">' + U.comma(U.sum(rows, function (r) { return r.rent; })) + '</span>',
        '<span class="mono">' + U.comma(U.sum(rows, function (r) { return r.etc; })) + '</span>',
        '<span class="mono">' + U.comma(expenseTotal) + '</span>',
        '<span class="mono">' + U.comma(net) + '</span>']
    });

    var bld = B.byBuilding(year);
    var bldRows = bld.map(function (r) {
      var n = r.income - r.expense;
      return { cells: [
        U.esc(r.building.name),
        r.units ? r.units + '실' : '-',
        '<span class="mono">' + U.comma(r.income) + '</span>',
        '<span class="mono">' + U.comma(r.expense) + '</span>',
        '<span class="mono t-strong">' + U.comma(n) + '</span>',
        (r.income ? U.pct(n, r.income) : 0) + '%'
      ] };
    });

    /* 미납 잔액 요약 */
    var unpaid = B.unpaidInvoices();
    var unpaidYear = unpaid.filter(function (i) { return i.ym.slice(0, 4) === year; });

    el.innerHTML = filters + summary +
      '<div style="margin-top:16px">' + UI.card(year + '년 월별 수입 · 지출', chart(rows)) + '</div>' +
      '<div style="margin-top:16px">' + UI.card('월별 상세', UI.table(
        ['월', { label: '청구액', className: 'num' }, { label: '수입(입금)', className: 'num' },
          { label: '└ 월세분', className: 'num' }, { label: '└ 관리비·기타', className: 'num' },
          { label: '지출', className: 'num' }, { label: '순수익', className: 'num' }],
        monthRows), '', true) + '</div>' +
      '<div class="grid grid-2" style="margin-top:16px">' +
      UI.card('건물별 수익', bldRows.length
        ? UI.table(['건물', '호실', { label: '수입', className: 'num' }, { label: '지출', className: 'num' },
            { label: '순수익', className: 'num' }, { label: '이익률', className: 'num' }], bldRows)
        : '<div class="t-faint">집계할 데이터가 없습니다.</div>', '', bldRows.length > 0) +
      UI.card('미납 잔액',
        '<div class="stat-value ' + (unpaidYear.length ? 'danger' : '') + '">' +
        U.won(U.sum(unpaidYear, function (i) { return B.remaining(i); })) + '</div>' +
        '<div class="stat-sub">' + year + '년 청구분 미납 ' + unpaidYear.length + '건 · ' +
        '전체 미납 ' + U.wonShort(U.sum(unpaid, function (i) { return B.remaining(i); })) + ' (' + unpaid.length + '건)</div>' +
        (unpaidYear.length ? '<div style="margin-top:12px">' + unpaidYear.slice(0, 6).map(function (i) {
          return '<div class="list-item" style="padding-left:0;padding-right:0">' +
            '<div class="li-main"><div class="li-title">' + U.esc(S.unitLabel(i.unitId)) + '</div>' +
            '<div class="li-sub">' + U.fmtMonth(i.ym) + '분 · 기한 ' + U.fmtDate(i.dueDate) + '</div></div>' +
            '<span class="mono t-strong">' + U.won(B.remaining(i)) + '</span></div>';
        }).join('') + '</div>' : '')) +
      '</div>';

    document.getElementById('f-year').addEventListener('change', function () { state.year = this.value; App.router.refresh(); });
  }

  App.views.reports = {
    title: '정산 리포트',
    desc: '월별·건물별 수입과 지출을 집계합니다.',
    actions: function () { return ''; },
    render: render,
    handlers: {
      csv: function () {
        var rows = monthlyData(state.year);
        var out = [['월', '청구액', '수입(입금)', '월세분', '관리비·기타', '지출', '순수익']];
        rows.forEach(function (r) { out.push([r.month + '월', r.billed, r.income, r.rent, r.etc, r.expense, r.net]); });
        out.push(['합계',
          U.sum(rows, function (r) { return r.billed; }),
          U.sum(rows, function (r) { return r.income; }),
          U.sum(rows, function (r) { return r.rent; }),
          U.sum(rows, function (r) { return r.etc; }),
          U.sum(rows, function (r) { return r.expense; }),
          U.sum(rows, function (r) { return r.net; })]);
        U.download('옆커폰_주택관리_정산리포트_' + state.year + '.csv', U.toCSV(out), 'text/csv');
        UI.toast('CSV 파일을 내려받았습니다.', 'ok');
      }
    }
  };
})(window.App);

</script>
<script>
/* 구글 시트 내보내기 — 새 관리 시트(탭 5장) 구조에 맞춰 CSV를 만들어 내려받는다.
   과거 내역을 하나도 빠뜨리지 않고 옮기기 위한 화면이다. */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  function bName(buildingId) {
    var b = S.building(buildingId);
    return b ? b.name : '';
  }

  function unitBuildingName(unitId) {
    var u = S.unit(unitId);
    return u ? bName(u.buildingId) : '';
  }

  function unitName(unitId) {
    var u = S.unit(unitId);
    return u ? u.name : '';
  }

  function contractStatus(c) {
    var today = U.todayISO();
    if (c.endDate && c.endDate < today) return '종료';
    if (c.startDate && c.startDate > today) return '예정';
    return '임대중';
  }

  /* ---- 탭별 표 만들기 ---- */

  function rowsBuildings() {
    var rows = [['물건명', '명의', '종류', '운영', '주소', '면적', '사건번호', '낙찰일', '낙찰가',
      '감정가', '예상매매가', '대출은행', '대출원금', '월이자', '만기일', '자료링크', '메모']];
    U.sortBy(S.get().buildings, function (b) { return b.name || ''; }).forEach(function (b) {
      rows.push([
        b.name || '', b.owner || '', b.kind || '', S.isLodging(b) ? '숙박' : '임대',
        b.address || '', b.area || '', b.caseNo || '', b.bidDate || '', b.bidPrice || '',
        b.appraisal || '', b.estSale || '', b.loanBank || '', b.loanAmount || '',
        b.loanInterest || '', b.loanDue || '', b.docUrl || '', b.memo || ''
      ]);
    });
    return rows;
  }

  function rowsUnits() {
    var rows = [['물건명', '호실', '층', '면적', '종류', '관리비', '메모']];
    U.sortBy(S.get().units, function (u) { return bName(u.buildingId) + '_' + (u.name || ''); })
      .forEach(function (u) {
        rows.push([bName(u.buildingId), u.name || '', u.floor || '', u.area || '',
          u.type || '', u.maintenanceFee || '', u.memo || '']);
      });
    return rows;
  }

  function rowsContracts() {
    var rows = [['물건명', '호실', '임차인', '연락처', '형태', '보증금', '월세', '관리비', '납부일',
      '시작일', '종료일', '변경구분', '이전임차인', '종료사유', '상태', '메모']];
    U.sortBy(S.get().contracts, function (c) {
      return unitBuildingName(c.unitId) + '_' + unitName(c.unitId) + '_' + (c.startDate || '');
    }).forEach(function (c) {
      rows.push([
        unitBuildingName(c.unitId), unitName(c.unitId), c.tenantName || '', c.tenantPhone || '',
        c.type || '', c.deposit || '', c.rent || '', c.maintenanceFee || '', c.payDay || '',
        c.startDate || '', c.endDate || '', c.changeType || '', c.prevTenant || '',
        c.endReason || '', contractStatus(c), c.memo || ''
      ]);
    });
    return rows;
  }

  function rowsInvoices() {
    var rows = [['청구월', '물건명', '호실', '임차인', '납부기한', '월세', '관리비', '기타',
      '청구액', '입금액', '미납액', '상태', '입금일', '메모']];
    U.sortBy(S.get().invoices, function (i) {
      return i.ym + '_' + unitBuildingName(i.unitId) + '_' + unitName(i.unitId);
    }).forEach(function (inv) {
      var c = S.contract(inv.contractId) || {};
      rows.push([
        inv.ym, unitBuildingName(inv.unitId), unitName(inv.unitId), c.tenantName || '',
        inv.dueDate || '', inv.rent || '', inv.maintenanceFee || '',
        U.sum(inv.extras || [], function (e) { return e.amount; }) || '',
        inv.total || '', B.paidAmount(inv) || '', B.remaining(inv) || '',
        B.STATUS_LABEL[B.status(inv)] || '',
        (inv.payments || []).map(function (p) { return p.date; }).join(' '),
        inv.memo || ''
      ]);
    });
    return rows;
  }

  function rowsExpenses() {
    var rows = [['지출일', '물건명', '구분', '내용', '금액']];
    U.sortBy(S.get().expenses, function (e) { return (e.date || '') + '_' + (e.id || ''); })
      .forEach(function (e) {
        rows.push([e.date || '', bName(e.buildingId), e.category || '', e.memo || '', e.amount || '']);
      });
    return rows;
  }

  var TABS = [
    { key: 'b', file: '1_물건', title: '물건', make: rowsBuildings,
      desc: '건물·상가·숙박 물건 한 줄씩. 낙찰가, 대출, 만기일까지.' },
    { key: 'u', file: '2_호실', title: '호실', make: rowsUnits,
      desc: '물건에 딸린 호실 목록.' },
    { key: 'c', file: '3_계약', title: '계약', make: rowsContracts,
      desc: '지나간 계약까지 전부. 임차인이 바뀐 이력이 줄로 남는다.' },
    { key: 'i', file: '4_입금대장', title: '입금대장', make: rowsInvoices,
      desc: '월별 청구와 입금, 미납액. 2023년부터 누적.' },
    { key: 'e', file: '5_지출대장', title: '지출대장', make: rowsExpenses,
      desc: '지출 내역 한 줄씩. 대출이자·세금·수선비 모두 포함.' }
  ];

  function tabByKey(key) {
    for (var i = 0; i < TABS.length; i++) if (TABS[i].key === key) return TABS[i];
    return null;
  }

  function save(tab) {
    var rows = tab.make();
    U.download('옆커폰_' + tab.file + '.csv', U.toCSV(rows), 'text/csv');
    return rows.length - 1;
  }

  function saveOne(key) {
    var tab = tabByKey(key);
    if (!tab) return;
    var n = save(tab);
    UI.toast(tab.title + ' ' + U.comma(n) + '줄을 내려받았습니다.', 'ok');
  }

  function saveAll() {
    var total = 0, i = 0;
    function next() {
      if (i >= TABS.length) {
        UI.toast('5개 파일 ' + U.comma(total) + '줄을 모두 내려받았습니다.', 'ok');
        return;
      }
      total += save(TABS[i]);
      i++;
      setTimeout(next, 400);
    }
    next();
  }

  function render(el) {
    var cards = TABS.map(function (t) {
      var n = t.make().length - 1;
      return '<div class="ex-row">' +
        '<div class="ex-main"><b>' + U.esc(t.title) + '</b>' +
        '<span class="ex-count">' + U.comma(n) + '줄</span>' +
        '<div class="help">' + U.esc(t.desc) + '</div></div>' +
        '<button class="btn btn-sm" data-act="one" data-id="' + t.key + '">내려받기</button>' +
        '</div>';
    }).join('');

    el.innerHTML = '' +
      '<div class="card">' +
      '<div class="card-head"><h2>구글 시트로 옮기기</h2>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary btn-sm" data-act="all">5개 한 번에 내려받기</button></div>' +
      '<p class="help">과거 내역까지 전부 담은 CSV입니다. 받은 파일을 새 구글 시트에 탭으로 넣으면 됩니다.</p>' +
      '<div class="ex-list">' + cards + '</div>' +
      '</div>' +

      '<div class="card">' +
