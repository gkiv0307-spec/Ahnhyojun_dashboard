    var rs = c.rows.filter(function (r) { return r.t.cat === key; });
    var on = rs.filter(function (r) { return r.cur; }), off = rs.filter(function (r) { return !r.cur; });
    var order = { late: 0, today: 1, open: 2, done: 3 };
    on.sort(function (a, b) { return (b.missed.length ? 1 : 0) - (a.missed.length ? 1 : 0) || order[a.st] - order[b.st]; });
    var html = '<div class="tab-meta"><span class="m t-dim">' + U.esc(k.desc) + '</span></div>';
    html += UI.card(k.ico + ' ' + k.label + ' · 이번 기간 업무 ' + on.length + '건',
      (on.length ? on.map(taskRow).join('') : UI.empty('이번 기간에 할 업무가 없습니다', '')) +
      (off.length ? '<div style="padding:10px 16px;border-top:1px solid var(--line)"><button class="btn btn-sm btn-ghost" data-act="acShowOff">' +
        (state.showOff ? '▾' : '▸') + ' 이번 기간이 아닌 업무 ' + off.length + '건 (세금 달 등)</button></div>' + (state.showOff ? off.map(taskRow).join('') : '') : ''),
      '<button class="btn btn-sm" data-act="acAdd" data-id="' + key + '">＋ 업무 추가</button>', true);
    if (key === 'common') {
      var ac = accounts();
      html += '<div style="margin-top:16px">' + UI.card('자금일보 계좌 ' + ac.length + '개', '<div class="t-dim" style="font-size:13px">구분이 정해지지 않은 계좌 <b>' + ac.filter(function (a) { return !a.cat; }).length +
        '개</b>. 계좌마다 어느 구분(법인주택 · 건물 · 개인주택 · 호텔·펜션)의 돈인지 정해 두면 누락 점검에서 빠집니다.</div>',
        '<button class="btn btn-sm" data-act="acTab" data-id="accounts">계좌 연결 열기</button>') + '</div>';
      return html;
    }
    var linked = accounts().filter(function (a) { return a.cat === key; });
    if (linked.length) {
      html += '<div style="margin-top:16px">' + UI.card(k.ico + ' ' + k.label + ' 계좌 ' + linked.length + '개', UI.table(['계좌', '메모'], linked.map(function (a) {
        return { cells: ['<b>' + U.esc(a.name) + '</b>', '<span class="t-dim" style="font-size:12px">' + U.esc(a.note || '') + '</span>'] };
      })), '<button class="btn btn-sm" data-act="acTab" data-id="accounts">계좌 연결 열기</button>', true) + '</div>';
    }
    if (k.noAsset) return html;
    var bs = U.sortBy(c.bs.filter(function (b) { return catOf(b) === key; }), function (b) { return b.name; });
    var brow = bs.map(function (b) {
      var manual = (cfg().bcat || {})[b.id];
      return { cells: [
        '<b>' + U.esc(b.name) + '</b>' + (b.brand ? '<div class="t-faint" style="font-size:11px">' + U.esc(b.brand) + '</div>' : ''),
        U.esc(b.owner || '-'), U.esc(b.kind || '-') + (S.isLodging(b) ? ' <span class="badge badge-warn">숙박</span>' : ''),
        '<span class="t-dim" style="font-size:12px">' + U.esc(b.address || '-') + '</span>',
        S.isLodging(b) ? '<span class="t-faint">객실 ' + (S.unitsOf(b.id).length || U.num(b.unitCount) || '-') + '</span>' : '<span class="mono">' + U.comma(monthlyRent(b.id)) + '</span>',
        '<span class="mono">' + (U.num(b.loanInterest) ? U.comma(b.loanInterest) : '-') + '</span>',
        (manual ? '<span class="badge badge-info">직접 지정</span> ' : '<span class="badge badge-muted">자동</span> ') +
          '<button class="btn btn-sm btn-ghost" data-act="acBldCat" data-id="' + U.esc(b.id) + '">분류 바꾸기</button>'
      ] };
    });
    html += '<div style="margin-top:16px">' + UI.card(k.ico + ' ' + k.label + ' 물건 ' + bs.length + '건',
      bs.length ? UI.table(['물건', '명의', '종류', '소재지', { label: '월 임대료', className: 'num' }, { label: '월 이자', className: 'num' }, '분류'], brow)
        : UI.empty('이 구분으로 분류된 물건이 없습니다', '건물 · 호실에서 명의 · 종류를 넣거나, 다른 구분의 물건에서 “분류 바꾸기”로 옮기세요.'), '', true,
      '자동 분류 규칙: 숙박업 운영(호텔 · 모텔 · 펜션) → 호텔·펜션, 종류가 상가 → 건물 · 상가, 명의 개인 → 개인주택, 명의 법인 · 옆커폰 · 옆커호텔 → 법인주택. 매각 · 이전한 물건은 빠집니다.') + '</div>';

        '자금일보 대시보드: <a class="go-link" href="https://ykp.dnr6646.workers.dev/" target="_blank" rel="noopener">ykp.dnr6646.workers.dev ↗</a> (보기 전용 · 갱신 · 배포는 현재 담당자)'
      ])) +
      '<div style="margin-top:16px" class="t-faint">정해야 할 것 4가지와 문서만으로 확인되지 않은 점은 <a class="go-link" href="#/handover">인수인계 점검</a>의 "자금일보 인계" 분류에 체크리스트로 넣어 두었습니다.</div>' +
      '</div>';
    return UI.card('📄 자금일보 인수인계 요약', body);

  function render(el) {
    var c = compute();
    var TABS = [['all', '전체 · 누락 점검']].concat(CATS.map(function (k) { return [k.key, k.ico + ' ' + k.label]; }))
      .concat([['accounts', '🔗 계좌 연결'], ['doc', '📄 자금일보 인계']]);
    if (c.unclassB.length) TABS.splice(6, 0, ['unclass', '❓ 분류 안 된 물건']);
    if (!TABS.some(function (t) { return t[0] === state.tab; })) state.tab = 'all';
    function cnt(key) {
      if (key === 'accounts') return c.unmappedA.length;
      if (key === 'unclass') return c.unclassB.length;
      if (!CAT[key]) return 0;
      return c.rows.filter(function (r) { return r.t.cat === key && (r.st === 'late' || r.st === 'today' || r.missed.length); }).length;
    }
    var tabs = '<div class="tabs">' + TABS.map(function (t) {
      var n = cnt(t[0]);
      return '<button class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-act="acTab" data-id="' + t[0] + '">' + t[1] + (n ? '<span class="cnt">' + n + '</span>' : '') + '</button>';
    }).join('') + '</div>';
    var body = state.tab === 'all' ? overviewHTML(c)
      : state.tab === 'accounts' ? accountsHTML()
      : state.tab === 'doc' ? handoverDocHTML()
      : state.tab === 'unclass' ? unclassHTML(c)
      : catHTML(c, state.tab);
    el.innerHTML = tabs + body +
      '<p class="t-faint" style="font-size:12px;margin:12px 0 0">체크와 메모는 클라우드에 저장되어 모든 기기에서 같이 보입니다. 세금 일정(재산세 · 종부세 · 부가세 · 종합소득세 · 법인세)은 일반 기준이므로 실제 대상과 기한은 세무사에게 확인하세요. ' +
      '업무 누락은 이 화면을 처음 연 날(' + U.fmtDate(c.start) + ') 이후 기간만 셉니다.</p>';
    if (!cfg().start) { cfgW(); S.commit(); }
  }

  /* ---------- 쓰기 ---------- */
  function findTask(id) { return tasks(true).filter(function (t) { return t.id === id; })[0]; }
  function setDone(t, periodKey, done, note) {
    var st = S.get(); st.acct = st.acct || [];
    var key = t.id + '@' + periodKey;
    var r = st.acct.filter(function (x) { return x.key === key; })[0];
    if (!r) { r = { id: U.uid('acd'), key: key, done: false, at: '', note: '' }; st.acct.push(r); }
    if (done != null) { r.done = !!done; r.at = done ? U.todayISO() : ''; }
    if (note != null) r.note = note;
    cfgW(); prune(); S.commit();
  }

  App.views.accounting = {
    title: '회계 업무 점검',
    desc: '법인주택 · 건물 · 개인주택 · 호텔·펜션 회계와 자금일보 업무를 기간별로 체크하고, 빠진 것을 찾습니다.',
    summary: summary,
    actions: function () {
      return '<button class="btn" data-act="acTab" data-id="doc">📄 자금일보 인계</button>' +
        '<button class="btn btn-primary" data-act="acAdd" data-id="' + (CAT[state.tab] ? state.tab : 'common') + '">＋ 업무 추가</button>';
    },
    render: render,
    handlers: {
      acTab: function (id) { state.tab = id || 'all'; App.router.go('accounting'); App.router.refresh(); window.scrollTo(0, 0); },
      acShowOff: function () { state.showOff = !state.showOff; App.router.refresh(); },
      acToggle: function (id, target) {
        var t = findTask(id); if (!t) return;
        var cur = current(t, U.todayISO()); if (!cur) return;
        setDone(t, cur.key, !!(target && target.checked), null);
        UI.toast(target && target.checked ? '완료로 표시했습니다.' : '다시 열었습니다.', target && target.checked ? 'ok' : '');
        App.router.refresh();
      },
      acNote: function (id) {
        var t = findTask(id); if (!t) return;
        var cur = current(t, U.todayISO()); if (!cur) return;
        var rec = doneMap()[t.id + '@' + cur.key] || {};
        UI.form({
          title: '메모 — ' + t.title + ' (' + cur.label + ')',
          values: { note: rec.note || '' },
          fields: [{ name: 'note', label: '처리 내용 · 확인할 것', type: 'textarea', full: true, placeholder: '예) 11/5 세무사 자료 전달 · 신한(거제) 3건 사유 담당자 확인 중' }],
          onSubmit: function (v) { setDone(t, cur.key, null, v.note); UI.toast('메모를 저장했습니다.', 'ok'); App.router.refresh(); }
        });
      },
      acMissed: function (id) {
        var t = findTask(id); if (!t) return;
        var dm = doneMap(), miss = previous(t, U.todayISO(), startDate()).filter(function (p) { var r = dm[t.id + '@' + p.key]; return !(r && r.done); });
        if (!miss.length) return;
        UI.form({
          title: '지난 기간 처리 — ' + t.title,
          values: { note: '' },
          fields: [{ name: 'note', label: miss.map(function (p) { return p.label; }).join(', ') + ' (' + miss.length + '건)', type: 'textarea', full: true,
            placeholder: '예) 11/3 늦게 처리함 · 해당 거래 없음', hint: '저장하면 위 기간 모두 완료로 표시하고 이 메모를 남깁니다. 실제로 했거나 해당 없음일 때만 저장하세요.' }],
          submitLabel: '완료로 표시',
          onSubmit: function (v) {
            miss.forEach(function (p) { setDone(t, p.key, true, v.note || '지난 기간 처리'); });
            UI.toast(miss.length + '건을 완료로 표시했습니다.', 'ok'); App.router.refresh();
          }
        });
      },
      acHide: function (id) {
        var t = findTask(id); if (!t) return;
        UI.confirm({
          title: t.custom ? '업무 삭제' : '업무 숨기기', danger: true, confirmLabel: t.custom ? '삭제' : '숨기기',
          message: '"' + t.title + '"을(를) ' + (t.custom ? '삭제합니다.' : '목록에서 숨깁니다. 해당 없는 업무일 때만 숨기세요.\n숨긴 업무는 [＋ 업무 추가] 창 맨 아래에서 되살릴 수 있습니다.'),
          onConfirm: function () {
            var c = cfgW();
            if (t.custom) c.custom = c.custom.filter(function (x) { return x.id !== t.id; });
            else if (c.hidden.indexOf(t.id) < 0) c.hidden.push(t.id);
            S.commit(); UI.toast(t.custom ? '삭제했습니다.' : '숨겼습니다.'); App.router.refresh();
          }
        });
      },
      acAdd: function (cat) {

            { name: 'day', label: '기한 (일)', type: 'number', min: 1, max: 31, hint: '매월 · 정해진 달일 때 그 달 며칠까지' },
            { name: 'months', label: '정해진 달', placeholder: '예) 7,9', hint: '주기가 “정해진 달만”일 때 쉼표로' },
            { name: 'link', label: '바로 갈 화면', type: 'select', options: [{ value: '', label: '(없음)' }, { value: 'jagum', label: '자금일보 확인' }, { value: 'payments', label: '수납 · 미납' }, { value: 'expenses', label: '지출 관리' }, { value: 'reports', label: '정산 리포트' }, { value: 'assets', label: '자산 현황' }] },
            { name: 'detail', label: '설명', type: 'textarea', full: true }
          ].concat(hiddenN ? [{ name: 'unhide', label: '숨긴 기본 업무', type: 'checkbox', checkLabel: '숨긴 기본 업무 ' + hiddenN + '개 되살리기 (업무 이름은 비워도 됨)', full: true }] : []),
          onSubmit: function (v) {
            var c = cfgW();
            if (v.unhide) { c.hidden = []; if (!v.title) { S.commit(); UI.toast('숨긴 업무를 되살렸습니다.', 'ok'); App.router.refresh(); return; } }
            if (!v.title) return { title: '업무 이름을 넣어 주세요.' };
            var months = String(v.months || '').split(/[,\s·]+/).map(Number).filter(function (m) { return m >= 1 && m <= 12; });
            if (v.freq === 'months' && !months.length) return { months: '달을 하나 이상 넣어 주세요 (예: 7,9).' };
            c.custom.push({ id: 'custom:' + U.uid('t'), cat: v.cat, freq: v.freq, title: v.title, detail: v.detail, day: U.num(v.day) || 31,
              months: months, link: v.link || '', custom: true, createdAt: U.todayISO() });
            S.commit(); state.tab = v.cat; UI.toast('업무를 추가했습니다.', 'ok'); App.router.refresh();
          }
        });
      },
      acBldCat: function (id) {
        var b = S.building(id); if (!b) return;
        var auto = autoCat(b);
        UI.form({
          title: '회계 구분 — ' + b.name,
          values: { cat: (cfg().bcat || {})[id] || '' },
          fields: [{ name: 'cat', label: '구분', type: 'select', full: true,
            options: [{ value: '', label: '자동 (' + (auto ? CAT[auto].label : '분류 안 됨') + ')' }].concat(ASSET_CATS.map(function (k) { return { value: k.key, label: k.ico + ' ' + k.label }; })),
            hint: '자동 분류는 명의 · 종류 · 운영 형태로 정합니다. 맞지 않을 때만 직접 고르세요.' }],
          onSubmit: function (v) {

      },
      acBldEdit: function (id) { App.views.buildings.handlers.editBuilding(id); },
      acAcct: function (id) {

        UI.form({
          title: '계좌 — ' + a.name,
          values: a,
          fields: [
            { name: 'name', label: '계좌 표시명 (시트 "계좌" 칸과 같게)', required: true, full: true },
            { name: 'cat', label: '구분', type: 'select', full: true, options: ACCT_CATS },
            { name: 'buildingId', label: '주로 쓰는 물건', type: 'select', full: true,
              options: [{ value: '', label: '(여러 물건 · 지정 안 함)' }].concat(U.sortBy(heldBuildings(), function (b) { return b.name; }).map(function (b) { return { value: b.id, label: b.name }; })) },
            { name: 'note', label: '메모', type: 'textarea', full: true, placeholder: '예) 구분 자동 계산 대상(김해 지점) · 서버 연결 없음' },
            { name: 'del', label: '삭제', type: 'checkbox', checkLabel: '이 계좌를 목록에서 지우기', full: true }
          ],
          onSubmit: function (v) {
            if (v.del) c.accounts = c.accounts.filter(function (x) { return x.id !== id; });
            else { a.name = v.name; a.cat = v.cat; a.buildingId = v.buildingId; a.note = v.note; }
            S.commit(); UI.toast(v.del ? '계좌를 지웠습니다.' : '계좌를 저장했습니다.', 'ok'); App.router.refresh();
          }
        });
      },
      acAcctAdd: function () {
        UI.form({
          title: '계좌 추가',
          values: { cat: '' },
          fields: [
            { name: 'name', label: '계좌 표시명', required: true, full: true, placeholder: '예) 농협(대표님 개인)' },
            { name: 'cat', label: '구분', type: 'select', full: true, options: ACCT_CATS },
            { name: 'note', label: '메모', type: 'textarea', full: true }
          ],
          onSubmit: function (v) {
            var c = cfgW();
            c.accounts.push({ id: U.uid('acc'), name: v.name, cat: v.cat, buildingId: '', note: v.note });
            S.commit(); UI.toast('계좌를 추가했습니다.', 'ok'); App.router.refresh();
          }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 부동산팀 회계 — 매일 아침 자금일보 보고 · 현금영수증 발급 · 호텔·펜션 손익을 한 화면에서 본다.
   세 구글 시트를 드라이브에서 읽기만 한다(시트에 쓰지 않음 · 기존 시트는 건드리지 않음).
   - 자금일보: 「부동산 자금일보 보고양식」 날짜 탭(예: "11월 3일")의 건수 · 합계 · 사유/구분 빈칸
   - 현금영수증: 「현금영수증 번호 취합」 시트의 '번호 취합' 탭 — 손님 휴대폰번호는 이 화면에서만 보이고 앱 저장소에는 넣지 않는다
   - 호텔·펜션: 「호텔,펜션 월 매출·지출·손익」 시트의 지점별 월 매출 · 순이익 */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  var XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var DEFAULTS = {
    cashFileId: '1WXXETp40LxZTqZ7IN2NZjJ5o678sz5TVZHs9ETSgMv0',   // 현금영수증 번호 취합 (안효준 · 이동현)
    plFileId: '1_hL5GWoRgwFpWonj-AJzLTbcAmgqcbl1FaNeXfhQYEM'      // 호텔,펜션 월 매출·지출·손익
  };
  var JAGUM_DEFAULT = '1oZhlvCxenuM8LNQ4XoSrwa1zOPJMbTYHmqZVyi8Fvmk';
  var DONE = ['발급완료', '발급불필요'];

  var state = { tab: 'today', day: null, cashFilter: 'need', data: {}, busy: {}, error: {} };

  function conf() {
    var t = S.get().settings.teamacct || {};
    var j = S.get().settings.jagum || {};
    return { cashFileId: t.cashFileId || DEFAULTS.cashFileId, plFileId: t.plFileId || DEFAULTS.plFileId, jagumFileId: j.fileId || JAGUM_DEFAULT };
  }

  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = XLSX_URL; s.onload = function () { res(window.XLSX); };
      s.onerror = function () { rej({ message: '엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.' }); };
      document.head.appendChild(s);
    });
  }
  function driveReady() { return App.drive && App.drive.status && App.drive.status() === 'ready' && App.drive.download; }
  function book(fileId) {
    return Promise.all([loadXLSX(), App.drive.download(fileId, XLSX_MIME)]).then(function (r) {
      return r[0].read(r[1], { type: 'base64' });
    });
  }
  function rowsOf(wb, name) {
    var ws = wb.Sheets[name];
    return ws ? window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }) : null;
  }
  function str(v) { return typeof v === 'string' ? v.trim() : (v == null ? '' : String(v)); }
  /** 엑셀 날짜(숫자) · 문자열을 YYYY-MM-DD로 */
  function isoOf(v) {
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      var d = new Date(Math.round((v - 25569) * 86400000));
      return d.getUTCFullYear() + '-' + U.pad2(d.getUTCMonth() + 1) + '-' + U.pad2(d.getUTCDate());
    }
    var s = str(v).replace(/[./]/g, '-');
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
    return m ? m[1] + '-' + U.pad2(Number(m[2])) + '-' + U.pad2(Number(m[3])) : '';
  }

  function load(kind, force) {
    if (state.busy[kind] || (state.data[kind] && !force)) return;
    if (!driveReady()) { state.error[kind] = '드라이브 연동이 켜진 화면(claude.ai에서 연 대시보드)에서만 시트를 읽을 수 있습니다.'; return; }
    var cf = conf(), id = kind === 'today' ? cf.jagumFileId : kind === 'cash' ? cf.cashFileId : cf.plFileId;
    state.busy[kind] = true; state.error[kind] = '';
    book(id).then(function (wb) {
      state.data[kind] = kind === 'today' ? parseJagum(wb) : kind === 'cash' ? parseCash(wb) : parsePL(wb);
      state.data[kind].at = new Date();
    }, function (e) {
      state.error[kind] = (e && e.message) || '시트를 읽지 못했습니다.';
    }).then(function () { state.busy[kind] = false; App.router.refresh(); });
  }

  /* ---------- 자금일보 ---------- */
  function parseJagum(wb) {
    var year = U.todayISO().slice(0, 4), days = [];
    wb.SheetNames.forEach(function (name) {
      var m = /^(\d{1,2})월\s*(\d{1,2})일$/.exec(name.trim());
      if (!m) return;
      var iso = year + '-' + U.pad2(Number(m[1])) + '-' + U.pad2(Number(m[2]));
      if (iso > U.todayISO()) iso = (Number(year) - 1) + iso.slice(4);
      var data = rowsOf(wb, name), col = null, rows = [], total = null;
      data.forEach(function (r) {
        var cells = r.map(str);
        if (!col) {
          var ai = cells.indexOf('계좌');
          if (ai >= 0 && cells.indexOf('사유') >= 0) col = { acc: ai, who: cells.indexOf('거래처'), in: cells.indexOf('입금금액'), out: cells.indexOf('출금금액'), why: cells.indexOf('사유'), kind: cells.indexOf('구분') };
          return;
        }
        var acc = cells[col.acc];
        if (!acc) return;
        if (acc === '총계') { total = { in: U.num(r[col.in]), out: U.num(r[col.out]) }; return; }
        rows.push({ acc: acc, who: cells[col.who], in: U.num(r[col.in]), out: U.num(r[col.out]), why: cells[col.why], kind: col.kind >= 0 ? cells[col.kind] : '' });
      });
      days.push({ name: name, iso: iso, rows: rows, total: total });
    });
    days.sort(function (a, b) { return a.iso < b.iso ? 1 : -1; });
    return { days: days };
  }
  function isCash(r) { return r.in > 0 && (r.kind === '현금매출' || /숙박추가/.test(r.why) || r.why === '현금매출' || r.why === '계좌이체매출'); }
  function daySum(d) {
    var inS = U.sum(d.rows, function (r) { return r.in; }), outS = U.sum(d.rows, function (r) { return r.out; });
    var noWhy = d.rows.filter(function (r) { return !r.why; });
    var noKind = d.rows.filter(function (r) { return r.why && !r.kind; });
    var mismatch = d.total && (d.total.in !== inS || d.total.out !== outS);
    return { n: d.rows.length, in: inS, out: outS, noWhy: noWhy, noKind: noKind, cash: d.rows.filter(isCash), mismatch: mismatch };
  }
  function reportText(d, s) {
    var byAcc = U.groupBy(d.rows, function (r) { return r.acc; });
    var lines = ['[부동산 자금일보] ' + d.name + ' 거래 · ' + s.n + '건',
      '입금 ' + U.comma(s.in) + '원 / 출금 ' + U.comma(s.out) + '원'];
    Object.keys(byAcc).forEach(function (a) {
      var l = byAcc[a];
      lines.push('· ' + a + ' — 입금 ' + U.comma(U.sum(l, function (r) { return r.in; })) + ' / 출금 ' + U.comma(U.sum(l, function (r) { return r.out; })) + ' (' + l.length + '건)');
    });
    if (s.noWhy.length) lines.push('※ 사유 확인 중 ' + s.noWhy.length + '건');
    if (s.cash.length) lines.push('※ 현금매출 ' + s.cash.length + '건 ' + U.comma(U.sum(s.cash, function (r) { return r.in; })) + '원 — 현금영수증 발급 대상');
    return lines.join('\n');
  }
  function todayHTML() {
    var D = state.data.today;
    if (!D) return loadingHTML('today', '자금일보 시트');
    var want = U.addDays(U.todayISO(), -1);
    if (!state.day) state.day = (D.days.filter(function (d) { return d.iso <= want; })[0] || D.days[0] || {}).iso;
    var d = D.days.filter(function (x) { return x.iso === state.day; })[0];
    var recent = D.days.filter(function (x) { return x.iso <= U.todayISO(); }).slice(0, 10);
    var html = '';
    var hasWant = D.days.some(function (x) { return x.iso === want; });
    if (!hasWant) html += '<div class="nt-note"><b>!</b><div class="nt-note-text">어제(' + U.fmtDate(want) + ') 날짜 탭이 아직 없습니다. 은행 거래내역 파일을 Claude 대화에 올리면 탭에 넣어 드립니다.</div></div>';
    if (d) {
      var s = daySum(d), empty = !s.n;
      html += '<div class="grid grid-4">' +
        UI.stat(d.name + ' 거래', s.n + '건', empty ? '아직 비어 있음' : (s.mismatch ? '총계 행과 합계가 다름' : '총계 행과 일치'), empty || s.mismatch ? 'danger' : 'ok') +
        UI.stat('입금', U.wonShort(s.in), '', '') + UI.stat('출금', U.wonShort(s.out), '', '') +
        UI.stat('사유 빈칸', s.noWhy.length + '건', s.noKind.length ? '구분 빈칸 ' + s.noKind.length + '건' : '', s.noWhy.length ? 'danger' : 'ok') +
        '</div>';
      if (s.noWhy.length) {
        html += '<div style="margin-top:16px">' + UI.card('사유를 채워야 할 거래 ' + s.noWhy.length + '건',
          UI.table(['계좌', '거래처', { label: '입금', className: 'num' }, { label: '출금', className: 'num' }],
            s.noWhy.map(function (r) { return { cells: [U.esc(r.acc), U.esc(r.who), r.in ? U.comma(r.in) : '', r.out ? U.comma(r.out) : ''] }; })), '', true,
          '지난 탭에 같은 계좌 · 같은 거래처 선례가 있으면 Claude가 같은 사유를 제안합니다. 선례가 없으면 현재 담당자나 대표님께 확인하세요.') + '</div>';
      }
      if (!empty) {
        html += '<div style="margin-top:16px">' + UI.card('보고용 문구', '<textarea class="nt-text" id="ta-report" rows="' + Math.min(14, 4 + Object.keys(U.groupBy(d.rows, function (r) { return r.acc; })).length) + '" readonly>' + U.esc(reportText(d, s)) + '</textarea>',
          '<button class="btn btn-sm btn-primary" data-act="taCopy" data-id="ta-report">복사</button>') + '</div>';
        html += '<div style="margin-top:16px">' + UI.card(d.name + ' 거래 ' + s.n + '건',
          UI.table(['계좌', '거래처', { label: '입금', className: 'num' }, { label: '출금', className: 'num' }, '사유', '구분'],
            d.rows.map(function (r) {
              return { cells: [U.esc(r.acc), U.esc(r.who), r.in ? U.comma(r.in) : '', r.out ? U.comma(r.out) : '',
                r.why ? U.esc(r.why) : '<span class="badge badge-danger">빈칸</span>', r.kind ? U.esc(r.kind) : '<span class="t-faint">-</span>'] };
            })), '', true) + '</div>';
      }
    }
    html += '<div style="margin-top:16px">' + UI.card('최근 날짜 탭', UI.table(['날짜', { label: '건수', className: 'num' }, { label: '입금', className: 'num' }, { label: '출금', className: 'num' }, '사유 빈칸', '현금매출', ''],
      recent.map(function (x) {
        var s2 = daySum(x);
        return { cells: [U.esc(x.name), s2.n || '<span class="badge badge-warn">비어 있음</span>', U.comma(s2.in), U.comma(s2.out),
          s2.noWhy.length ? '<span class="badge badge-danger">' + s2.noWhy.length + '건</span>' : (s2.n ? '<span class="badge badge-ok">없음</span>' : ''),
          s2.cash.length ? s2.cash.length + '건' : '',
          '<button class="btn btn-sm btn-ghost" data-act="taDay" data-id="' + x.iso + '">보기</button>'] };
      })), '', true) + '</div>';
    return html;
  }

  /* ---------- 현금영수증 ---------- */
  function parseCash(wb) {
    var data = rowsOf(wb, '번호 취합') || rowsOf(wb, wb.SheetNames[wb.SheetNames.length - 1]) || [];
    var head = (data[0] || []).map(str), ix = function (k) { for (var i = 0; i < head.length; i++) if (head[i].indexOf(k) === 0) return i; return -1; };
    var c = { date: ix('입금일'), br: ix('지점'), acc: ix('계좌'), who: ix('입금자'), amt: ix('총거래'), sup: ix('공급가'), vat: ix('부가세'), ph: ix('휴대폰'), use: ix('용도'), src: ix('번호 받은'), st: ix('발급상태'), at: ix('발급일'), no: ix('승인'), memo: ix('메모') };
    var rows = [];
    data.slice(1).forEach(function (r, i) {
      var amt = U.num(r[c.amt]);
      if (!amt) return;
      rows.push({ line: i + 2, date: isoOf(r[c.date]), br: str(r[c.br]), acc: str(r[c.acc]), who: str(r[c.who]), amt: amt,
        sup: U.num(r[c.sup]) || amt - Math.floor(amt * 10 / 110), vat: U.num(r[c.vat]) || Math.floor(amt * 10 / 110),
        ph: str(r[c.ph]), use: str(r[c.use]), st: str(r[c.st]) || '미확인', at: isoOf(r[c.at]), memo: str(r[c.memo]) });
    });
    return { rows: rows };
  }
  function cashCalc(rows) {
    var today = U.todayISO();
    rows.forEach(function (r) { r.age = r.date ? U.diffDays(r.date, today) : 0; r.done = DONE.indexOf(r.st) >= 0; r.big = r.amt >= 100000; });
    var open = rows.filter(function (r) { return !r.done; });
    return {
      open: open,
      noPhone: open.filter(function (r) { return !r.ph; }),
      ready: open.filter(function (r) { return r.ph; }),
      bigLate: open.filter(function (r) { return r.big && r.age > 5; })
    };
  }
  function cashHTML() {
    var D = state.data.cash;
    if (!D) return loadingHTML('cash', '현금영수증 번호 취합 시트');
    var k = cashCalc(D.rows);
    var F = {
      need: ['처리 안 된 건', k.open], ready: ['번호 있음 · 발급 가능', k.ready], nophone: ['번호 없음', k.noPhone],
      big: ['10만 원 이상 · 5일 지남', k.bigLate], all: ['전체', D.rows]
    };
    var list = (F[state.cashFilter] || F.need)[1];
    var html = '<div class="grid grid-4">' +
      UI.stat('처리 안 된 건', k.open.length + '건', U.comma(U.sum(k.open, function (r) { return r.amt; })) + '원', k.open.length ? 'danger' : 'ok', '발급상태가 "발급완료" · "발급불필요"가 아닌 건입니다.') +
      UI.stat('번호 있음', k.ready.length + '건', '바로 발급 가능', '') +
      UI.stat('번호 없음', k.noPhone.length + '건', '이동현 사원 취합 대기', k.noPhone.length ? 'danger' : 'ok') +
      UI.stat('10만 원↑ · 5일 지남', k.bigLate.length + '건', U.comma(U.sum(k.bigLate, function (r) { return r.amt; })) + '원', k.bigLate.length ? 'danger' : 'ok', '숙박업은 현금영수증 의무발행업종으로 알려져 있어, 10만 원 이상 현금 거래는 5일 안에 발급해야 할 수 있습니다. 정확한 기준은 세무사 확인이 필요합니다.') +
      '</div>';
    html += '<div class="chips" style="padding:14px 0 6px">' + Object.keys(F).map(function (key) {
      return '<button class="chip' + (state.cashFilter === key ? ' active' : '') + '" data-act="taCash" data-id="' + key + '">' + F[key][0] + ' <span class="cnt">' + F[key][1].length + '</span></button>';
    }).join('') + '</div>';
    var up = k.ready.filter(function (r) { return list.indexOf(r) >= 0; });
    html += UI.card((F[state.cashFilter] || F.need)[0] + ' ' + list.length + '건',
      list.length ? UI.table(['입금일', '지점', '입금자', { label: '금액', className: 'num' }, '휴대폰번호', '용도', '발급상태', { label: '경과', className: 'num' }],
        U.sortBy(list, function (r) { return r.date; }, true).map(function (r) {
          return { cells: [U.fmtDate(r.date), U.esc(r.br), U.esc(r.who) + (r.memo ? '<div class="li-sub">' + U.esc(r.memo) + '</div>' : ''), U.comma(r.amt) + (r.big ? ' <span class="badge badge-warn">10만↑</span>' : ''),
            r.ph ? '<span class="mono">' + U.esc(r.ph) + '</span>' : '<span class="badge badge-danger">없음</span>',
            r.use === '1' ? '지출증빙' : r.ph ? '소득공제' : '',
            '<span class="badge ' + (r.done ? 'badge-ok' : r.st === '발급 대상' ? 'badge-info' : 'badge-muted') + '">' + U.esc(r.st) + '</span>',
            r.done ? '' : (r.age > 5 && r.big ? '<span class="t-danger">' + r.age + '일</span>' : r.age + '일')] };
        })) : UI.empty('해당하는 건이 없습니다'),
      up.length ? '<button class="btn btn-sm btn-primary" data-act="taUpload">홈택스 일괄발급용 복사 (' + up.length + '건)</button>' : '', true,
      '번호 · 발급상태는 「현금영수증 번호 취합」 시트에서 고칩니다. 이 화면은 시트를 읽어 보여 주기만 하고, 손님 번호를 앱 저장소에 남기지 않습니다.');
    return html;
  }
  function uploadTSV() {
    var k = cashCalc(state.data.cash.rows), F = { need: k.open, ready: k.ready, nophone: k.noPhone, big: k.bigLate, all: state.data.cash.rows };
    var list = (F[state.cashFilter] || k.open).filter(function (r) { return r.ph && !r.done; });
    var lines = ['용도구분\t발급수단번호\t총거래금액\t공급가액\t부가가치세\t입금일\t입금자명'];
    U.sortBy(list, function (r) { return r.date; }).forEach(function (r) {
      lines.push([r.use || (/^01/.test(r.ph) ? '0' : '1'), r.ph, r.amt, r.sup, r.vat, r.date, r.who].join('\t'));
    });
    return { text: lines.join('\n'), n: list.length };
  }

  /* ---------- 호텔 · 펜션 손익 ---------- */
  function monthTable(data, title) {
    var at = -1;
    for (var i = 0; i < data.length; i++) { if (str(data[i][0]) === '월') { at = i; break; } }
    if (at < 0) return null;
    var head = data[at].map(str).filter(function (h, i) { return i === 0 || h; });
    var rows = [];
    for (var j = at + 1; j < data.length; j++) {
      var m = str(data[j][0]);
      if (!m) break;
      rows.push(data[j].slice(0, head.length));
      if (/누계/.test(m)) break;
    }
    return { title: title, note: str((data[1] || [])[0]), head: head, rows: rows };
  }
  function parsePL(wb) {
    return {
      sales: monthTable(rowsOf(wb, '전체 매출') || [], '지점별 월 매출'),
      profit: monthTable(rowsOf(wb, '월 순이익') || [], '지점별 월 순이익')
    };
  }
  function tableOf(t) {
    if (!t) return UI.empty('시트에서 표를 찾지 못했습니다', '시트의 탭 이름이나 표 모양이 바뀌었는지 확인하세요.');
    return UI.table(t.head.map(function (h, i) { return i ? { label: h, className: 'num' } : h; }), t.rows.map(function (r) {
      var total = /누계/.test(str(r[0]));
      return { attrs: total ? ' style="font-weight:600"' : '', cells: r.map(function (v, i) {
        if (!i) return U.esc(str(v));
        if (v === '' || v == null) return '';
        var n = U.num(v);
        return n < 0 ? '<span class="t-danger">' + U.comma(n) + '</span>' : U.comma(n);
      }) };
    }));
  }
  function plHTML() {
    var D = state.data.pl;
    if (!D) return loadingHTML('pl', '호텔,펜션 월 매출·지출·손익 시트');
    var tot = D.sales && D.sales.rows.filter(function (r) { return /누계/.test(str(r[0])); })[0];
    var ptot = D.profit && D.profit.rows.filter(function (r) { return /누계/.test(str(r[0])); })[0];
    var html = '';
    if (tot && ptot) {
      var sH = D.sales.head, pH = D.profit.head;
      html += '<div class="grid grid-4">' +
        UI.stat('누계 매출', U.wonShort(tot[sH.indexOf('전체 합계')] || 0), '호텔 ' + U.wonShort(tot[sH.indexOf('호텔 합계')] || 0) + ' · 펜션 ' + U.wonShort(tot[sH.indexOf('펜션 합계')] || 0), '') +
        UI.stat('누계 순이익', U.wonShort(ptot[pH.length - 1] || 0), '대출이자 포함 · 투자 제외', U.num(ptot[pH.length - 1]) < 0 ? 'danger' : 'ok') +
        pH.slice(1, pH.length - 1).slice(0, 2).map(function (h, i) { return UI.stat(h + ' 순이익', U.wonShort(ptot[i + 1] || 0), '누계', U.num(ptot[i + 1]) < 0 ? 'danger' : ''); }).join('') +
        '</div>';
    }
    html += '<div style="margin-top:16px">' + UI.card(D.sales ? D.sales.title : '월 매출', tableOf(D.sales), '', true, D.sales ? D.sales.note : '') + '</div>';
    html += '<div style="margin-top:16px">' + UI.card(D.profit ? D.profit.title : '월 순이익', tableOf(D.profit), '', true, D.profit ? D.profit.note : '') + '</div>';
    html += '<p class="t-faint" style="font-size:12px;margin:12px 0 0">이 숫자는 「호텔,펜션 월 매출·지출·손익」 시트(다른 담당 자동 갱신)를 그대로 읽은 것입니다. 진행 중인 달은 지출이 다 들어오지 않아 순이익이 크게 보일 수 있습니다.</p>';
    return html;
  }

  /* ---------- 공통 ---------- */
  function loadingHTML(kind, label) {
    if (state.error[kind]) return UI.card('', '<div class="t-danger">' + U.esc(state.error[kind]) + '</div><div style="margin-top:10px"><button class="btn btn-sm" data-act="taReload">다시 읽기</button></div>');
    load(kind);
    if (state.error[kind]) return UI.card('', '<div class="t-danger">' + U.esc(state.error[kind]) + '</div>');
    return UI.card('', '<div class="t-faint">' + U.esc(label) + '을(를) 읽는 중…</div>');
  }
  function copyText(text, ok) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      var done = false; try { done = document.execCommand('copy'); } catch (e) { done = false; }
      document.body.removeChild(ta); UI.toast(done ? ok : '복사하지 못했습니다. 직접 선택해서 복사하세요.', done ? 'ok' : 'err');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { UI.toast(ok, 'ok'); }, fallback);
    else fallback();
  }
  function counts() {
    var out = {};
    if (state.data.today) {
      var want = U.addDays(U.todayISO(), -1), d = state.data.today.days.filter(function (x) { return x.iso === want; })[0];
      out.today = !d ? '!' : (daySum(d).noWhy.length || (daySum(d).n ? 0 : '!'));
    }
    if (state.data.cash) out.cash = cashCalc(state.data.cash.rows).bigLate.length || 0;
    return out;
  }

  function render(el) {
    var n = counts();
    var TABS = [['today', '🏦 오늘 자금일보'], ['cash', '🧾 현금영수증'], ['pl', '🏨 호텔 · 펜션 손익']];
    var tabs = '<div class="tabs">' + TABS.map(function (t) {
      return '<button class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-act="taTab" data-id="' + t[0] + '">' + t[1] + (n[t[0]] ? '<span class="cnt">' + n[t[0]] + '</span>' : '') + '</button>';
    }).join('') + '</div>';
    var at = state.data[state.tab] && state.data[state.tab].at;
    var meta = '<div class="tab-meta"><span class="m">' + (at ? '읽은 시각 <b>' + U.pad2(at.getHours()) + ':' + U.pad2(at.getMinutes()) + '</b>' : '') + '</span>' +
      '<span class="m t-dim">이 화면은 읽기만 합니다 · 자금일보 입력 · 수정은 <a class="go-link" href="#/jagumwrite">✏️ 자금일보 작성</a>에서</span></div>';
    var body = state.tab === 'cash' ? cashHTML() : state.tab === 'pl' ? plHTML() : todayHTML();
    el.innerHTML = tabs + meta + body;
  }

  App.views.teamacct = {
    title: '부동산팀 회계',
    desc: '매일 아침 자금일보 보고 · 현금영수증 발급 · 호텔·펜션 손익을 구글 시트에서 읽어 한 화면에 모읍니다.',
    actions: function () {
      return '<a class="btn" href="#/accounting">📒 회계 업무 점검</a><button class="btn btn-primary" data-act="taReload">↻ 시트 다시 읽기</button>';
    },
    render: render,
    _book: book, _parseJagum: parseJagum, _parseCash: parseCash, _parsePL: parsePL, _cashCalc: cashCalc, _state: state,
    handlers: {
      taTab: function (id) { state.tab = id; App.router.refresh(); },
      taDay: function (id) { state.day = id; App.router.refresh(); window.scrollTo(0, 0); },
      taCash: function (id) { state.cashFilter = id; App.router.refresh(); },
      taReload: function () { state.error[state.tab] = ''; state.data[state.tab] = null; load(state.tab, true); App.router.refresh(); },
      taCopy: function (id) { var t = document.getElementById(id); if (t) copyText(t.value, '보고 문구를 복사했습니다.'); },
      taUpload: function () {
        var u = uploadTSV();
        if (!u.n) { UI.toast('번호가 있는 미처리 건이 없습니다.', 'err'); return; }
        copyText(u.text, u.n + '건을 복사했습니다. 현금영수증 일괄발급 엑셀 양식에 붙여 넣으세요.');
      }
    }
  };
})(window.App);

</script>
<script>
/* 사업자등록 정보 — 법인 본점 · 지점 · 개인사업자 · 관리단 · 거래처의 사업자등록증 내용을 한곳에 모아
   상호 · 별칭 · 번호(하이픈 없이 쳐도 됨) · 대표자 · 소재지로 바로 찾는다. 번호 칸은 눌러서 복사한다.
   자료는 bizreg 컬렉션(클라우드)에 저장되고, 화면 위 '번호 · 이름 찾기'에서도 함께 찾는다. */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var TYPES = ['법인 본점', '법인 지점', '개인사업자', '고유번호 단체', '외부 거래처'];
  var state = { q: '', type: '', tab: 'reg' };
  var digits = function (s) { return String(s || '').replace(/\D/g, ''); };

  // bizreg 컬렉션에 사업자(kind 없음)와 계좌 · 인증서(kind: 'acct')를 함께 담는다
  function all() { return S.get().bizreg || []; }
  function list() { return all().filter(function (r) { return r.kind !== 'acct'; }); }
  function accts() { return all().filter(function (r) { return r.kind === 'acct'; }); }

  function match(r, q) {
    q = String(q || '').trim();
    if (!q) return true;
    var dq = digits(q), plain = q.replace(/[\s-]/g, '');
    if (dq.length >= 3 && dq.length === plain.length) {
      return (digits(r.regNo) + ' ' + digits(r.corpNo) + ' ' + digits(r.accountNo)).indexOf(dq) >= 0;
    }
    var hay = [r.type, r.group, r.name, r.alias, r.regNo, r.ceo, r.corpNo, r.address, r.memo, r.branch, r.bank, r.accountNo, r.use, r.cert].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function search(q) { return list().filter(function (r) { return match(r, q); }); }
  function searchAccts(q) { return accts().filter(function (r) { return match(r, q); }); }

  function copyText(text, ok) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      var done = false; try { done = document.execCommand('copy'); } catch (e) { done = false; }
      document.body.removeChild(ta); UI.toast(done ? ok : '복사하지 못했습니다. 직접 선택해서 복사하세요.', done ? 'ok' : 'err');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { UI.toast(ok, 'ok'); }, fallback);
    else fallback();
  }

  function numBtn(v, label) {
    if (!v || v === '-') return '<span class="t-faint">-</span>';
    return '<button class="btn btn-sm btn-ghost mono" style="padding:2px 6px" data-act="brCopy" data-id="' + U.esc(v) + '" title="' + U.esc(label) + ' 복사">' + U.esc(v) + '</button>';
  }
  function badge(t) {
    var cls = t === '법인 본점' ? 'badge-info' : t === '법인 지점' ? 'badge-ok' : t === '개인사업자' ? 'badge-warn' : 'badge-muted';
    return '<span class="badge ' + cls + '">' + U.esc(t || '-') + '</span>';
  }

  /** 검색어 · 구분에 맞는 표만 만든다 — 입력창은 다시 그리지 않아 한글 조합이 깨지지 않는다 */
  function acctHTML() {
    var rows = accts().filter(function (r) { return match(r, state.q); });
    rows = rows.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    var prev = null;
    var body = rows.length ? UI.table(['지점 · 사업장', '은행', '계좌', '용도', '인증서', ''], rows.map(function (r) {
      var first = r.branch !== prev; prev = r.branch;
      return { attrs: first ? ' style="border-top:2px solid var(--line-strong)"' : '', cells: [
        first ? '<b>' + U.esc(r.branch || '') + '</b>' : '<span class="t-faint">〃</span>',
        U.esc(r.bank || ''),
        numBtn(r.accountNo, '계좌번호') + (r.main ? ' <span class="badge badge-info">메인</span>' : ''),
        U.esc(r.use || '') + (r.memo ? '<div class="t-warn" style="font-size:12px;color:var(--warn)">' + U.esc(r.memo) + '</div>' : ''),
        r.cert ? '🔐 ' + U.esc(r.cert) : '<span class="t-faint">-</span>',
        '<button class="btn btn-sm btn-ghost" data-act="brEdit" data-id="' + U.esc(r.id) + '">수정</button>' +
          '<button class="btn btn-sm btn-ghost btn-danger" data-act="brDel" data-id="' + U.esc(r.id) + '">삭제</button>'
      ] };
    })) : UI.empty(accts().length ? '찾는 계좌가 없습니다' : '등록된 계좌가 없습니다', '');
    return UI.card('계좌 ' + rows.length + '개', body, '', true,
      '지점마다 쓰는 은행 · 계좌 · 용도와 인터넷뱅킹 인증서 이름입니다. 계좌번호를 누르면 복사됩니다. 비밀번호는 여기에 적지 않습니다.');
  }

  function resultsHTML() {
    if (state.tab === 'acct') return acctHTML();
    var all = list();
    var rows = all.filter(function (r) { return (!state.type || r.type === state.type) && match(r, state.q); });
    var order = {}; TYPES.forEach(function (t, i) { order[t] = i; });
    rows = rows.slice().sort(function (a, b) {
      return (order[a.type] == null ? 9 : order[a.type]) - (order[b.type] == null ? 9 : order[b.type]) ||
        String(a.group || '').localeCompare(String(b.group || '')) || String(a.name || '').localeCompare(String(b.name || ''));
    });
    var body = rows.length ? UI.table(['구분', '상호 · 별칭', '사업자등록번호', '대표자', '법인등록번호', '소재지', ''], rows.map(function (r) {
      return { cells: [
        badge(r.type) + (r.group && r.group !== r.type ? '<div class="t-faint" style="font-size:11px;margin-top:2px">' + U.esc(r.group) + '</div>' : ''),
        '<b>' + U.esc(r.name || '') + '</b>' + (r.alias ? '<div class="t-dim" style="font-size:12px">' + U.esc(r.alias) + '</div>' : '') +
          (r.memo ? '<div class="t-faint" style="font-size:11px">' + U.esc(r.memo) + '</div>' : ''),
        numBtn(r.regNo, '사업자등록번호'),
        U.esc(r.ceo || '-'),
        numBtn(r.corpNo, '법인등록번호'),
        '<span style="font-size:12px;white-space:normal">' + U.esc(r.address || '-') + '</span>',
        '<button class="btn btn-sm btn-ghost" data-act="brEdit" data-id="' + U.esc(r.id) + '">수정</button>' +
          '<button class="btn btn-sm btn-ghost btn-danger" data-act="brDel" data-id="' + U.esc(r.id) + '">삭제</button>'
      ] };
    })) : UI.empty(all.length ? '찾는 사업자가 없습니다' : '등록된 사업자가 없습니다', all.length ? '검색어를 줄이거나 구분을 "전체"로 바꿔 보세요.' : '오른쪽 위 "＋ 사업자 추가"로 넣으세요.');
    return UI.card('사업자 ' + rows.length + '곳', body, '', true,
      '번호 칸을 누르면 복사됩니다. 화면 위 "번호 · 이름 찾기"에서도 사업자번호 · 상호로 찾을 수 있습니다.');
  }

  function render(el) {
    var all = list();
    var tabs = '<div class="tabs">' + [['reg', '🪪 사업자등록', all.length], ['acct', '🏦 계좌 · 인증서', accts().length]].map(function (t) {
      return '<button class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-act="brTab" data-id="' + t[0] + '">' + t[1] + '<span class="cnt">' + t[2] + '</span></button>';
    }).join('') + '</div>';
    var counts = {};
    all.forEach(function (r) { counts[r.type] = (counts[r.type] || 0) + 1; });
    var chips = '<div class="chips" style="padding:0 0 12px">' +
      '<button class="chip' + (!state.type ? ' active' : '') + '" data-act="brType" data-id="">전체 <span class="cnt">' + all.length + '</span></button>' +
      TYPES.filter(function (t) { return counts[t]; }).map(function (t) {
        return '<button class="chip' + (state.type === t ? ' active' : '') + '" data-act="brType" data-id="' + U.esc(t) + '">' + U.esc(t) + ' <span class="cnt">' + counts[t] + '</span></button>';
      }).join('') + '</div>';
    var search = '<div class="filters" style="margin-bottom:12px"><input id="br-q" type="search" autocomplete="off" style="flex:1;min-width:0;font-size:15px;padding:9px 12px" ' +
      'placeholder="' + (state.tab === 'acct' ? '지점 · 은행 · 계좌번호(숫자만 쳐도 됨) · 용도 · 인증서 — 예) 거제, 638006, 한전' : '상호 · 별칭 · 사업자번호(숫자만 쳐도 됨) · 대표자 · 주소 — 예) 김해, 43585, 한집 201') + '" value="' + U.esc(state.q) + '"></div>';
    el.innerHTML = tabs + search + (state.tab === 'acct' ? '' : chips) + '<div id="br-res">' + resultsHTML() + '</div>';
    var inp = el.querySelector('#br-q'), res = el.querySelector('#br-res');
    if (!inp) return;
    function update() { state.q = inp.value; res.innerHTML = resultsHTML(); }
    inp.addEventListener('input', function (e) { if (!e.isComposing) update(); });
    inp.addEventListener('compositionend', update);
    inp.addEventListener('keyup', function (e) { if (!e.isComposing && state.q !== inp.value) update(); });
  }

  function acctForm(rec) {
    rec = rec || { kind: 'acct' };
    UI.form({
      title: rec.id ? '계좌 수정 — ' + (rec.branch || '') : '계좌 추가',
      values: rec,
      fields: [
        { name: 'branch', label: '지점 · 사업장', required: true },
        { name: 'bank', label: '은행', required: true },
        { name: 'accountNo', label: '계좌번호', required: true },
        { name: 'use', label: '용도' },
        { name: 'cert', label: '인증서 이름', hint: '인증서 비밀번호는 적지 마세요.' },
        { name: 'memo', label: '메모 (출금 항목 등)', full: true }
      ],
      onSubmit: function (v) {
        S.upsert('bizreg', Object.assign({}, rec, v, { kind: 'acct', order: rec.order || (accts().length + 1) * 10 }));
        UI.toast('저장했습니다.', 'ok'); App.router.refresh();
      }
    });
  }

  function form(rec) {
    if ((rec && rec.kind === 'acct') || (!rec && state.tab === 'acct')) return acctForm(rec);
    rec = rec || {};
    UI.form({
      title: rec.id ? '사업자 수정 — ' + (rec.name || '') : '사업자 추가',
      values: rec,
      fields: [
        { name: 'type', label: '사업자 구분', type: 'select', options: TYPES.map(function (t) { return { value: t, label: t }; }), required: true },
        { name: 'group', label: '법인 / 관리 그룹', placeholder: '예) (주)옆커폰 · 개인사업자 · 외부 거래처' },
        { name: 'name', label: '등록 상호', required: true },
        { name: 'alias', label: '사업장 · 별칭', placeholder: '예) 김해점 · 한집 201호' },
        { name: 'regNo', label: '사업자등록 · 고유번호', placeholder: '000-00-00000' },
        { name: 'ceo', label: '대표자' },
        { name: 'corpNo', label: '법인등록번호', placeholder: '000000-0000000 (법인만)' },
        { name: 'address', label: '소재지 (사업장 주소)', full: true },
        { name: 'memo', label: '메모', full: true, placeholder: '출처 · 확인할 것' }
      ],
      onSubmit: function (v) {
        var out = Object.assign({}, rec, v);
        S.upsert('bizreg', out);
        UI.toast('저장했습니다.', 'ok'); App.router.refresh();
      }
    });
  }

  App.views.bizreg = {
    title: '사업자등록 정보',
    desc: '사업자등록증 내용과 지점별 은행 계좌 · 용도 · 인터넷뱅킹 인증서를 찾아보고 번호를 바로 복사합니다.',
    search: search, searchAccts: searchAccts,
    actions: function () { return '<button class="btn btn-primary" data-act="brAdd">＋ ' + (state.tab === 'acct' ? '계좌 추가' : '사업자 추가') + '</button>'; },
    render: render,
    handlers: {
      brTab: function (id) { state.tab = id === 'acct' ? 'acct' : 'reg'; App.router.refresh(); },
      brType: function (id) { state.type = id || ''; App.router.refresh(); },
      brCopy: function (id) { copyText(id, id + ' 복사했습니다.'); },
      brAdd: function () { form(null); },
      brDel: function (id) {
        var r = all().filter(function (x) { return x.id === id; })[0]; if (!r) return;
        UI.confirm({ title: r.kind === 'acct' ? '계좌 삭제' : '사업자 정보 삭제', message: '"' + (r.name || (r.branch + ' ' + r.accountNo)) + '" 정보를 지울까요?', confirmLabel: '삭제', danger: true,
          onConfirm: function () { S.remove('bizreg', id); UI.toast('지웠습니다.', 'ok'); App.router.refresh(); } });
      },
      brEdit: function (id) { var r = all().filter(function (x) { return x.id === id; })[0]; if (r) form(r); },
      brGo: function (id, el) { state.q = id || ''; state.type = ''; state.tab = el && el.getAttribute('data-tab') === 'acct' ? 'acct' : 'reg'; UI.close(); App.router.go('bizreg'); App.router.refresh(); }
    }
  };
})(window.App);

</script>
<script>
/* 계좌 자동이체 — 은행 거래내역에서 매달 빠져나가는 출금(자동이체 · 자동납부 · 보험 · 통신 · 대출 · 지방세 등)을
   계좌별로 묶어 보여 준다. 주택관리 돈(🏠)과 계좌 회계(👤 대표님 개인 · ❓ 미분류)를 나눠 본다.
   자료는 autopay 컬렉션: type 'account'(계좌 한 건) + type 'auto'(반복 출금 한 건, months = { 'YYYY-MM': 금액 }).
   은행 원본 파일은 저장하지 않고, 합계만 남긴다. 구분 · 물건 · 메모는 화면에서 고친다. */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var SIDES = [
    ['house', '🏠 주택관리', 'badge-ok'],
    ['unknown', '❓ 미분류 · 확인 필요', 'badge-warn'],
    ['personal', '👤 대표님 개인 · 회계', 'badge-muted']
  ];
  var SIDE = {}; SIDES.forEach(function (s) { SIDE[s[0]] = s; });
  var state = { tab: 'list', side: '', acct: '', live: true, ym: '' };

  function all() { return S.get().autopay || []; }
  function accounts() { return all().filter(function (r) { return r.type === 'account'; }); }
  function autos() {
    return all().filter(function (r) { return r.type === 'auto' && (!state.acct || r.acct === state.acct); });
  }
  function account(id) { return accounts().filter(function (a) { return a.id === id; })[0] || null; }
  /** 통장 조회 끝 날짜 기준 두 달 안에 나간 적이 있으면 '지금도 나가는 것' */
  function isLive(r) {
    var a = account(r.acct), end = (a && a.to) || U.todayISO();
    return U.diffDays(r.last, end) <= 62;
  }
  function sideBadge(s) { var d = SIDE[s] || SIDE.unknown; return '<span class="badge ' + d[2] + '">' + d[1] + '</span>'; }
  function bName(id) { var b = id && S.building(id); return b ? b.name : ''; }
  function months(rows) {
    var set = {};
    rows.forEach(function (r) { Object.keys(r.months || {}).forEach(function (m) { set[m] = 1; }); });
    return Object.keys(set).sort();
  }

  function filtered() {
    return autos().filter(function (r) {
      return (!state.side || (r.side || 'unknown') === state.side) && (!state.live || isLive(r));
    });
  }

  function chips(list) {
    var cnt = {}; list.forEach(function (r) { var s = r.side || 'unknown'; cnt[s] = (cnt[s] || 0) + 1; });
    return '<div class="chips" style="padding:0 0 12px">' +
      '<button class="chip' + (!state.side ? ' active' : '') + '" data-act="apSide" data-id="">전체 <span class="cnt">' + list.length + '</span></button>' +
      SIDES.map(function (s) {
        return '<button class="chip' + (state.side === s[0] ? ' active' : '') + '" data-act="apSide" data-id="' + s[0] + '">' + s[1] + ' <span class="cnt">' + (cnt[s[0]] || 0) + '</span></button>';
      }).join('') +
      '<label class="check" style="margin-left:8px"><input type="checkbox" data-act="apLive"' + (state.live ? ' checked' : '') + '> 지금도 나가는 것만</label></div>';
  }

  function listHTML() {
    var base = autos().filter(function (r) { return !state.live || isLive(r); });
    var rows = filtered();
    var order = { house: 0, unknown: 1, personal: 2 };
    rows = rows.slice().sort(function (a, b) {
      return (order[a.side || 'unknown'] - order[b.side || 'unknown']) || (a.day || 0) - (b.day || 0);
    });
    var monthly = U.sum(rows.filter(isLive), function (r) { return r.lastAmount; });
    var body = rows.length ? UI.table(['구분', '출금 이름', { label: '매월', className: 'num' }, { label: '최근 금액', className: 'num' }, '기간', '물건 · 메모', ''], rows.map(function (r) {
      var b = bName(r.buildingId);
      return { cells: [
        sideBadge(r.side) + (r.cat ? '<div class="t-faint" style="font-size:11px;margin-top:2px">' + U.esc(r.cat) + '</div>' : ''),
        '<b>' + U.esc(r.name) + '</b><div class="t-faint" style="font-size:11px">' + U.esc(r.kind || '') + (account(r.acct) ? ' · ' + U.esc(account(r.acct).label) : '') + '</div>',
        (r.day ? r.day + '일' : '-'),
        U.won(r.lastAmount),
        '<span class="mono" style="font-size:12px">' + U.fmtDate(r.first) + ' ~ ' + U.fmtDate(r.last) + '</span><div class="t-faint" style="font-size:11px">' + (r.count || 0) + '회' + (isLive(r) ? '' : ' · 지금은 안 나감') + '</div>',
        (b ? '🏢 ' + U.esc(b) : (r.side === 'house' ? '<span style="color:var(--warn)">물건 미확인</span>' : '')) +
          (r.memo ? '<div style="font-size:12px;white-space:normal;min-width:240px;max-width:380px;color:var(--muted)">' + U.esc(r.memo) + '</div>' : ''),
        '<button class="btn btn-sm btn-ghost" data-act="apEdit" data-id="' + U.esc(r.id) + '">분류</button>'
      ] };
    })) : UI.empty(all().length ? '해당하는 출금이 없습니다' : '아직 정리된 계좌가 없습니다', all().length ? '구분을 "전체"로 바꾸거나 "지금도 나가는 것만"을 끄세요.' : '은행 거래내역 파일을 대화에 올려 주시면 정리해 넣습니다.');
    return chips(base) + UI.card('반복 출금 ' + rows.length + '건' + (monthly ? ' · 지금 나가는 것 최근 금액 합계 ' + U.won(monthly) : ''), body, '', true,
      '같은 이름으로 여러 번 나간 출금을 한 줄로 묶었습니다. "분류"를 눌러 주택관리 · 개인 구분과 물건을 고칠 수 있습니다. 주택관리 돈은 지출 관리 장부에 따로 넣습니다.');
  }

  function monthHTML() {
    var list = autos();
    var ms = months(list);
    if (!ms.length) return UI.empty('월별로 볼 자료가 없습니다', '');
    if (!state.ym || ms.indexOf(state.ym) < 0) state.ym = ms[ms.length - 1];
    var sel = '<div class="filters" style="margin-bottom:12px"><select id="ap-ym">' + ms.slice().reverse().map(function (m) {
      return '<option value="' + m + '"' + (m === state.ym ? ' selected' : '') + '>' + U.fmtMonth(m) + '</option>';
    }).join('') + '</select></div>';
    var rows = list.filter(function (r) { return r.months && r.months[state.ym] && (!state.side || (r.side || 'unknown') === state.side); });
    var tot = {}; list.forEach(function (r) { var v = r.months && r.months[state.ym]; if (v) tot[r.side || 'unknown'] = (tot[r.side || 'unknown'] || 0) + v; });
    var stats = '<div class="grid grid-3" style="margin-bottom:14px">' + SIDES.map(function (s) {
      return UI.stat(s[1], U.wonShort(tot[s[0]] || 0), U.fmtMonth(state.ym) + ' 출금');
    }).join('') + '</div>';
    var sideChips = '<div class="chips" style="padding:0 0 12px">' +
      '<button class="chip' + (!state.side ? ' active' : '') + '" data-act="apSide" data-id="">전체</button>' +
      SIDES.map(function (s) { return '<button class="chip' + (state.side === s[0] ? ' active' : '') + '" data-act="apSide" data-id="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>';
    rows = rows.slice().sort(function (a, b) { return (a.day || 0) - (b.day || 0); });
    var body = rows.length ? UI.table(['구분', '출금 이름', { label: '금액', className: 'num' }, '물건 · 메모'], rows.map(function (r) {
      var b = bName(r.buildingId);
      return { cells: [sideBadge(r.side), '<b>' + U.esc(r.name) + '</b><div class="t-faint" style="font-size:11px">' + U.esc(r.kind || '') + ' · 매월 ' + (r.day || '-') + '일 무렵</div>',
        U.won(r.months[state.ym]),
        (b ? '🏢 ' + U.esc(b) : '') + (r.memo ? '<div style="font-size:12px;white-space:normal;min-width:240px;max-width:380px;color:var(--muted)">' + U.esc(r.memo) + '</div>' : '')] };
    })) : UI.empty('이 달에는 해당 출금이 없습니다', '');
    return sel + stats + sideChips + UI.card(U.fmtMonth(state.ym) + ' 반복 출금 ' + rows.length + '건 · ' + U.won(U.sum(rows, function (r) { return r.months[state.ym]; })), body, '', true,
      '달을 고르면 그달 실제로 빠져나간 금액만 보여 줍니다. 🏠 주택관리만 골라 지출 장부와 맞춰 보세요.');
  }

  function acctHead() {
    var acs = accounts();
    if (!acs.length) return '';
    var a = account(state.acct);
    var pick = acs.length > 1 ? '<div class="chips" style="padding:0 0 10px">' +
      '<button class="chip' + (!state.acct ? ' active' : '') + '" data-act="apAcct" data-id="">모든 계좌</button>' +
      acs.map(function (x) { return '<button class="chip' + (state.acct === x.id ? ' active' : '') + '" data-act="apAcct" data-id="' + U.esc(x.id) + '">' + U.esc(x.label) + '</button>'; }).join('') + '</div>' : '';
    var info = (a ? [a] : acs).map(function (x) {
      return '<div class="m">🏦 <b style="font-family:inherit">' + U.esc(x.bank + ' ' + x.accountNo) + '</b> ' + U.esc(x.owner || '') +
        ' · ' + U.esc(x.use || '') + ' · 조회 ' + U.fmtDate(x.from) + ' ~ ' + U.fmtDate(x.to) + '</div>';
    }).join('');
    return pick + '<div class="tab-meta">' + info + '</div>';
  }

  function render(el) {
    var nUnk = autos().filter(function (r) { return (r.side || 'unknown') === 'unknown'; }).length;
    var tabs = '<div class="tabs">' + [['list', '🔁 자동이체 목록', ''], ['month', '📅 월별 보기', ''], ['check', '☑️ 미분류 확인', nUnk]].map(function (t) {
      return '<button class="tab' + (state.tab === t[0] ? ' active' : '') + '" data-act="apTab" data-id="' + t[0] + '">' + t[1] + (t[2] !== '' ? '<span class="cnt">' + t[2] + '</span>' : '') + '</button>';
    }).join('') + '</div>';
    el.innerHTML = tabs + acctHead() + (state.tab === 'month' ? monthHTML() : state.tab === 'check' ? checkHTML() : listHTML());
    var ym = el.querySelector('#ap-ym');
    if (ym) ym.addEventListener('change', function () { state.ym = ym.value; App.router.refresh(); });
  }

  /* ---------- 미분류 확인 체크리스트 ----------
     확인되는 대로 체크 → 구분 · 물건 · 지출 분류를 고르고, 주택관리면 통장 출금(tx)을 지출 장부에 넣는다.
     이미 장부에 같은 물건 · 같은 금액 · 6일 안의 지출이 있으면 그 달은 건너뛴다. */
  function inLedger(bid, date, amount) {
    return S.get().expenses.some(function (x) {
      return x.buildingId === bid && U.num(x.amount) === amount && Math.abs(U.diffDays(x.date, date)) <= 6;
    });
  }
  function checkHTML() {
    var list = autos().filter(function (r) { return (r.side || 'unknown') === 'unknown'; });
    var done = autos().filter(function (r) { return r.confirmedAt; });
    list = list.slice().sort(function (a, b) { return (isLive(b) - isLive(a)) || (b.lastAmount - a.lastAmount); });
    var rows = list.map(function (r) {
      var a = account(r.acct);
      return '<label class="list-item" style="cursor:pointer;align-items:flex-start">' +
        '<input type="checkbox" data-act="apCheck" data-id="' + U.esc(r.id) + '" style="width:18px;height:18px;margin-top:3px;flex:none">' +
        '<div class="li-main"><div class="li-title">' + U.esc(r.name) + ' <span class="mono" style="font-weight:600">' + U.won(r.lastAmount) + '</span>' +
        (isLive(r) ? ' <span class="badge badge-warn">지금도 나감</span>' : ' <span class="badge badge-muted">지금은 안 나감</span>') + '</div>' +
        '<div class="li-sub">' + U.esc(a ? a.label : '') + ' · 매월 ' + (r.day || '-') + '일 무렵 · ' + U.fmtDate(r.first) + ' ~ ' + U.fmtDate(r.last) + ' · ' + (r.count || 0) + '회' +
        (r.tx ? ' · 통장 합계 ' + U.won(U.sum(r.tx, function (t) { return t[1]; })) : '') + '</div>' +
        (r.memo ? '<div class="li-sub" style="color:var(--muted)">' + U.esc(r.memo) + '</div>' : '') + '</div></label>';
    }).join('');
    var body = rows || UI.empty('미분류가 없습니다', '모두 확인했습니다.');
    var doneHTML = done.length ? UI.card('확인 끝난 항목 ' + done.length + '건', done.map(function (r) {
      var b = bName(r.buildingId);
      return '<div class="list-item"><div class="li-main"><div class="li-title">✅ ' + U.esc(r.name) + ' ' + sideBadge(r.side) + (b ? ' 🏢 ' + U.esc(b) : '') + '</div>' +
        '<div class="li-sub">' + U.fmtDate(r.confirmedAt) + ' 확인' + (r.ledgerAdded ? ' · 지출 장부 ' + r.ledgerAdded + '건 추가' : '') + (r.ledgerLinked ? ' · ' + r.ledgerLinked + '건 물건 연결' : '') + (r.memo ? ' · ' + U.esc(r.memo) : '') + '</div></div>' +
        '<button class="btn btn-sm btn-ghost" data-act="apEdit" data-id="' + U.esc(r.id) + '">분류</button></div>';
    }).join(''), '', true) : '';
    return UI.card('아직 어디 돈인지 모르는 출금 ' + list.length + '건', body, '', true,
      '확인되면 체크하세요. 구분 · 물건을 고르고, 주택관리면 통장 출금 내역을 지출 장부에 바로 넣을 수 있습니다. 장부에 이미 있는 달은 건너뜁니다.') +
      (doneHTML ? '<div style="height:14px"></div>' + doneHTML : '');
  }
  function confirmItem(r) {
    var opts = [{ value: '', label: '(고르세요)' }].concat(U.sortBy(S.get().buildings, function (b) { return b.name; }).map(function (b) {

    UI.form({
      title: '확인 — ' + r.name,

      fields: [
        { name: 'side', label: '확인 결과', type: 'select', required: true, options: [
          { value: 'house', label: '🏠 주택관리 돈 (물건 고르기)' }, { value: 'personal', label: '👤 대표님 개인 · 회계 돈' }] },
        { name: 'buildingId', label: '물건 (주택관리일 때)', type: 'select', options: opts },
        { name: 'cat', label: '이름 · 분류', placeholder: '예) 군산 수도요금 · 김제 대출' },
        { name: 'ecat', label: '지출 장부 분류', type: 'select', options: cats },
        { name: 'memo', label: '확인한 내용 (누가 · 언제)', full: true, required: true, placeholder: '예) 11/10 대표님 확인 — 군산 공용 수도' },
        { name: 'addLedger', label: '지출 장부', type: 'checkbox', checkLabel: '주택관리면 통장 출금 ' + tx.length + '건을 지출 장부에 넣기 (이미 있는 달은 건너뜀)', full: true },
        { name: 'range', label: '넣을 기간', type: 'select', options: [{ value: 'all', label: '통장 전체 ' + tx.length + '건' }, { value: '2026', label: '2026년만 ' + y26 + '건' }] }

            var loose = S.get().expenses.filter(function (x) {
              return !x.buildingId && U.num(x.amount) === t[1] && Math.abs(U.diffDays(x.date, t[0])) <= 6;
            })[0];
            if (loose) { loose.buildingId = v.buildingId; loose.memo = (loose.memo || '') + ' · [물건 연결: 사용자 확인 ' + today + ']'; linked++; return; }
            S.get().expenses.push({ id: U.uid('exp'), createdAt: today, date: t[0], amount: t[1], buildingId: v.buildingId,
              category: v.ecat || '기타', method: '자동이체',
              memo: (v.cat || r.name) + ' (' + (a ? a.label : '') + ' 자동이체 "' + r.name + '" · 사용자 확인 ' + today + ')' });

        }
        S.upsert('autopay', Object.assign({}, r, { side: v.side, buildingId: v.side === 'house' ? v.buildingId : '', cat: v.cat || r.cat || '',
          memo: v.memo + (r.memo ? ' · (이전 메모) ' + r.memo : ''), confirmedAt: today, ledgerAdded: added, ledgerLinked: linked }));
        UI.toast('확인 처리했습니다.' + (added ? ' 지출 장부에 ' + added + '건 넣었습니다.' : '') + (linked ? ' 이미 있던 ' + linked + '건은 물건만 연결했습니다.' : ''), 'ok');
        App.router.refresh();
      }

  }

  function edit(r) {
    var opts = [{ value: '', label: '(물건 없음 · 미확인)' }].concat(U.sortBy(S.get().buildings, function (b) { return b.name; }).map(function (b) {
      return { value: b.id, label: b.name + (S.isDisposed(b) ? ' (넘긴 물건)' : '') };
    }));
    UI.form({
      title: '분류 — ' + r.name,
      values: { side: r.side || 'unknown', buildingId: r.buildingId || '', cat: r.cat || '', memo: r.memo || '' },
      fields: [
        { name: 'side', label: '구분', type: 'select', options: SIDES.map(function (s) { return { value: s[0], label: s[1] }; }), required: true },

        { name: 'cat', label: '분류', placeholder: '예) 관리비 · 재산세 · 보험 · 카드' },
        { name: 'memo', label: '메모', full: true, hint: '확인한 내용과 출처(누가 · 언제)를 함께 적어 두세요.' }
      ],
      onSubmit: function (v) {
        S.upsert('autopay', Object.assign({}, r, v));
        UI.toast('저장했습니다.', 'ok'); App.router.refresh();
      }

  }

  App.views.autopay = {
    title: '계좌 자동이체',
    desc: '통장에서 매달 빠져나가는 출금을 계좌별로 모아 주택관리 돈과 대표님 개인 · 회계 돈을 나눠 봅니다.',
    render: render,
    summary: function () {
      var u = autos().filter(function (r) { return (r.side || 'unknown') === 'unknown' && isLive(r); }).length;
      return { unknown: u };
    },
    handlers: {
      apTab: function (id) { state.tab = id === 'month' || id === 'check' ? id : 'list'; App.router.refresh(); },
      apCheck: function (id, el) {
        if (el) el.checked = false;
        var r = all().filter(function (x) { return x.id === id; })[0]; if (r) confirmItem(r);
      },
      apSide: function (id) { state.side = id || ''; App.router.refresh(); },
      apAcct: function (id) { state.acct = id || ''; App.router.refresh(); },
      apLive: function (id, el) { state.live = !!(el && el.checked); App.router.refresh(); },
      apEdit: function (id) { var r = all().filter(function (x) { return x.id === id; })[0]; if (r) edit(r); }
    }
  };
})(window.App);

</script>
<script>
/* 자금일보 작성 — 「부동산 자금일보 보고양식」 구글 시트의 날짜 탭을 대시보드에서 바로 읽고 고친다.
   시트가 원본이다. 대시보드는 따로 복사본을 두지 않고, 열 때마다 시트에서 읽고 저장하면 시트에 바로 쓴다.
   그래서 구글 시트에서 고친 것도, 대시보드에서 고친 것도 어디서 열든 같은 내용이 보인다.
   - 날짜 탭 형식: B~G열 = 계좌 / 거래처 / 입금금액 / 출금금액 / 사유 / 구분, 4행 머리글, 맨 아래 B열 '총계' 행
   - 저장 직전에 시트를 다시 읽어, 그사이 시트에서 바뀐 칸이 있으면 쓰지 않고 다시 불러온다(덮어쓰기 방지)
   - 오늘 탭이 없으면 가장 최근 날짜 탭을 복사해 내용만 비운 새 탭을 만든다(다른 탭은 건드리지 않음) */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;
  App.views = App.views || {};

  var SERVER = 'Google Sheets';
  var DEFAULT_ID = '1oZhlvCxenuM8LNQ4XoSrwa1zOPJMbTYHmqZVyi8Fvmk';
  var COLS = ['계좌', '거래처', '입금금액', '출금금액', '사유', '구분'];
  var DEADLINE = '11:00';

  var mcp = null, mcpState = 'init';       // init | ready | none
  var st = { tabs: null, tab: '', grid: null, accts: [], kinds: [], busy: '', error: '', at: null, extra: 5, pending: {} };

  function fileId() { var j = S.get().settings.jagum || {}; return j.fileId || DEFAULT_ID; }
  function q(t) { return "'" + String(t).replace(/'/g, "''") + "'"; }

  /* ---------- 커넥터 ---------- */
  function connect() {
    if (mcpState !== 'init') return Promise.resolve(mcpState === 'ready');
    if (!window.claude || typeof window.claude.use !== 'function') { mcpState = 'none'; return Promise.resolve(false); }

      function () { mcpState = 'none'; return false; });
  }
  function explain(err) {
    var c = err && err.code;
    if (c === 'needs_reauth') return 'Google Sheets 연결이 만료되었습니다. claude.ai 설정 → 커넥터에서 Google Sheets를 다시 연결해 주세요.';
    if (c === 'server_not_connected' || c === 'selection_required') return 'Google Sheets 커넥터가 연결되어 있지 않습니다. claude.ai 설정 → 커넥터에서 Google Sheets를 추가(또는 선택)해 주세요.';
    if (c === 'not_granted' || c === 'not_in_manifest') return 'Google Sheets 사용을 허용하지 않았습니다. 다시 시도하면 허용 여부를 묻습니다.';
    if (c === 'blocked_by_policy' || c === 'approval_required') return '조직 정책으로 이 페이지에서 Google Sheets 호출이 막혀 있습니다.';
    if (c === 'server_unavailable' || c === 'rate_limited') return 'Google Sheets가 잠시 응답하지 않습니다. 잠시 후 다시 시도해 주세요.';
    if (c === 'tool_error') return '시트가 오류를 돌려주었습니다: ' + (err.message || '') + ' (편집 권한 · 탭 이름을 확인하세요)';
    if (c === 'conflict') return err.message;

  }
  function payload(res) {
    var p = res && res.payload;

  }
  /** 읽기 — 재시도 가능한 오류만 한 번 더 */
  function read(tool, input) {
    return mcp.callTool(SERVER, tool, input, { cache: false }).catch(function (err) {
      if (err && err.retryable) {
        return new Promise(function (r) { setTimeout(r, Math.min(err.retryAfterMs || 1500, 60000) + Math.random() * 500); })
          .then(function () { return mcp.callTool(SERVER, tool, input, { cache: false }); });

    }).then(payload);
  }
  /** 쓰기 — 결과가 애매해도 자동으로 다시 쓰지 않는다 */
  function write(tool, input) { return mcp.callTool(SERVER, tool, input).then(payload); }
  function values(range) { return read('get_values', { spreadsheetId: fileId(), range: range }).then(function (p) { return p.values || []; }); }

  /* ---------- 날짜 탭 ---------- */
  function tabISO(title) {
    var m = /^(\d{1,2})월\s*(\d{1,2})일$/.exec(String(title).trim());
    if (!m) return '';
    var t = U.today(), y = t.getFullYear(), mo = Number(m[1]);
    if (mo > t.getMonth() + 2) y -= 1;                       // 1월에 보는 12월 탭은 작년
    return y + '-' + U.pad2(mo) + '-' + U.pad2(Number(m[2]));
  }
  function todayTitle() { var t = U.today(); return (t.getMonth() + 1) + '월 ' + t.getDate() + '일'; }

  function loadTabs() {
    return read('get_spreadsheet', { spreadsheetId: fileId(), fields: ['sheets.properties.sheetId', 'sheets.properties.title', 'sheets.properties.index'] })
      .then(function (p) {
        st.tabs = (p.sheets || []).map(function (s) { var x = s.properties || {}; return { id: x.sheetId, title: x.title, index: x.index, iso: tabISO(x.title) }; })
          .filter(function (t) { return t.iso; }).sort(function (a, b) { return a.iso < b.iso ? 1 : -1; });
        if (!st.tab || !st.tabs.some(function (t) { return t.title === st.tab; })) {
          var today = st.tabs.filter(function (t) { return t.title === todayTitle(); })[0];
          st.tab = (today || st.tabs[0] || {}).title || '';
        }
      });
  }
  function loadLists() {
    if (st.accts.length && st.kinds.length) return Promise.resolve();
    return Promise.all([values("'통장정보'!B5:B30"), values("'구분목록'!A1:A60")]).then(function (r) {
      st.accts = r[0].map(function (x) { return String(x[0] || '').trim(); }).filter(Boolean);
      st.kinds = r[1].map(function (x) { return String(x[0] || '').trim(); }).filter(Boolean);
    });
  }
  /** 탭 내용을 읽어 칸 배열로 만든다. 총계 행 위까지가 입력 칸이다. */
  function readGrid(title) {
    return values(q(title) + '!B1:G200').then(function (v) {
      var total = -1;
      for (var i = 4; i < v.length; i++) if (String((v[i] || [])[0] || '').replace(/\s/g, '') === '총계') { total = i + 1; break; }
      if (total < 0) throw { code: 'tool_error', message: '"' + title + '" 탭에서 총계 행을 찾지 못했습니다.' };
      var rows = [];
      for (var r = 5; r < total; r++) {
        var x = v[r - 1] || [];
        rows.push({ row: r, cells: [0, 1, 2, 3, 4, 5].map(function (c) { return String(x[c] == null ? '' : x[c]).trim(); }) });
      }
      var t = v[total - 1] || [];
      return { title: title, total: total, rows: rows, sheetIn: U.num(t[2]), sheetOut: U.num(t[3]) };
    });
  }
  function load(force) {
    if (st.busy) return;
    st.busy = 'load'; st.error = ''; App.router.refresh();
    connect().then(function (ok) {
      if (!ok) throw { code: 'none', message: '이 화면은 claude.ai에서 대시보드를 열었을 때만 구글 시트에 연결됩니다.' };
      return Promise.all([loadTabs(), loadLists()]);
    }).then(function () {
      if (!st.tab) throw { code: 'tool_error', message: '날짜 탭(예: "11월 5일")을 찾지 못했습니다.' };
      return readGrid(st.tab);
    }).then(function (g) { st.grid = g; st.at = new Date(); st.extra = 5; }, function (e) { st.error = explain(e); })
      .then(function () { st.busy = ''; if (App.router.current() === 'jagumwrite') App.router.refresh(); });
  }

  /* ---------- 화면 ---------- */
  function filled(c) { return c.some(function (x) { return x !== ''; }); }
  function deadlineHTML() {
    var now = new Date(), p = DEADLINE.split(':'), dl = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +p[0], +p[1]);
    var left = Math.round((dl - now) / 60000);
    var hasToday = st.tabs && st.tabs.some(function (t) { return t.title === todayTitle(); });
    var msg = left > 0 ? '오늘 마감 ' + DEADLINE + '까지 ' + (left >= 60 ? Math.floor(left / 60) + '시간 ' : '') + (left % 60) + '분 남음' : '오늘 마감 ' + DEADLINE + ' 지남';
    return '<div class="nt-note" style="margin-bottom:12px"><b>⏰</b><div class="nt-note-text">' + msg +
      (st.tabs ? (hasToday ? ' · 오늘 탭 「' + todayTitle() + '」 있음' : ' · 오늘 탭 「' + todayTitle() + '」이 아직 없습니다') : '') + '</div>' +
      (st.tabs && !hasToday ? '<button class="btn btn-sm btn-primary" data-act="jwNewTab">＋ 오늘 탭 만들기</button>' : '') + '</div>';
  }
  function opt(list, v) {
    var has = !v || list.indexOf(v) >= 0;
    return '<option value=""></option>' + (has ? '' : '<option selected>' + U.esc(v) + '</option>') +
      list.map(function (x) { return '<option' + (x === v ? ' selected' : '') + '>' + U.esc(x) + '</option>'; }).join('');
  }
  function gridHTML() {
    var g = st.grid;
    var used = g.rows.filter(function (r) { return filled(r.cells); });
    var lastUsed = used.length ? used[used.length - 1].row : 4;
    var show = g.rows.filter(function (r) { return r.row <= lastUsed + st.extra; });
    var inS = U.sum(used, function (r) { return r.cells[2]; }), outS = U.sum(used, function (r) { return r.cells[3]; });
    var noWhy = used.filter(function (r) { return !r.cells[4]; }).length, noKind = used.filter(function (r) { return !r.cells[5]; }).length;
    var totOk = inS === g.sheetIn && outS === g.sheetOut;
    var P = st.pending, val = function (r, c, v) { var k = r + ':' + c; return P[k] != null ? P[k] : v; };
    var nPend = Object.keys(P).length;
    var inp = function (r, c, v, num) {
      v = val(r, c, v);
      return '<input class="inline-input jw-in" data-r="' + r + '" data-c="' + c + '" value="' + U.esc(v) + '"' +
        (num ? ' inputmode="numeric" style="width:110px;text-align:right"' : ' style="width:' + (c === 1 ? 150 : 140) + 'px;font-family:inherit"') + '>';
    };
    var sel = function (r, c, v, list) { v = val(r, c, v); return '<select class="inline-input jw-in" data-r="' + r + '" data-c="' + c + '" style="font-family:inherit;max-width:170px">' + opt(list, v) + '</select>'; };
    var body = '<div class="table-wrap"><table><thead><tr><th>행</th>' + COLS.map(function (c, i) { return '<th' + (i === 2 || i === 3 ? ' class="num"' : '') + '>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      show.map(function (r) {
        var c = r.cells;
        return '<tr><td class="t-faint mono">' + r.row + '</td><td>' + sel(r.row, 0, c[0], st.accts) + '</td><td>' + inp(r.row, 1, c[1]) + '</td><td class="num">' + inp(r.row, 2, c[2], true) +
          '</td><td class="num">' + inp(r.row, 3, c[3], true) + '</td><td>' + inp(r.row, 4, c[4]) + '</td><td>' + sel(r.row, 5, c[5], st.kinds) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    var more = lastUsed + st.extra < g.total - 1 ? '<button class="btn btn-sm" data-act="jwMore">빈 줄 더 보기</button>' : '<span class="t-faint" style="font-size:12px">총계 행(' + g.total + '행) 위까지 다 보이는 중</span>';
    var stats = '<div class="grid grid-4" style="margin-bottom:14px">' +
      UI.stat('작성한 줄', used.length + '줄', g.title) +
      UI.stat('입금 합계', U.comma(inS), '시트 총계 ' + U.comma(g.sheetIn), totOk ? 'ok' : 'danger') +
      UI.stat('출금 합계', U.comma(outS), '시트 총계 ' + U.comma(g.sheetOut), totOk ? 'ok' : 'danger') +
      UI.stat('빈칸', (noWhy + noKind) + '칸', '사유 ' + noWhy + ' · 구분 ' + noKind, noWhy + noKind ? 'danger' : 'ok') + '</div>';
    var warn = totOk ? '' : '<div class="nt-note" style="margin-bottom:12px"><b>!</b><div class="nt-note-text">시트 총계와 줄 합계가 다릅니다.' +
      (lastUsed > 45 ? ' 총계 수식이 45행까지만 더하는 탭이 있습니다(=SUM(D5:D45)) — 46행 아래 줄이 빠졌는지 시트에서 확인하세요.' : ' 저장하지 않은 수정이 있거나 시트 수식을 확인해야 합니다.') + '</div></div>';
    return stats + warn + UI.card('「' + g.title + '」 탭 — 고친 뒤 "시트에 저장"', body,
      more + (nPend ? '<button class="btn btn-ghost" data-act="jwDiscard">고친 것 취소</button>' : '') + '<button class="btn btn-primary" data-act="jwSave">💾 시트에 저장' + (nPend ? ' (' + nPend + '칸)' : '') + '</button>', true,
      '구글 시트의 이 탭을 그대로 보여 줍니다. 칸을 고치고 "시트에 저장"을 누르면 바뀐 줄만 시트에 씁니다. 저장 직전에 시트를 다시 읽어, 그사이 시트에서 누가 고친 칸이 있으면 덮어쓰지 않고 다시 불러옵니다.');
  }
  function render(el) {

<script>

   호텔 매출관리표(거제 · 군위 · 김해)의 예약을 찾아 붙이고, 발급할 휴대폰번호와 발급상태를 관리한다.
   - 자료: cashrcpt 컬렉션. 한 건 = 통장 입금 한 줄(자금일보 날짜 탭 기준). 손님 휴대폰번호는 이 대시보드에만 둔다
     (자금일보 시트는 링크 공유라 번호를 쓰지 않는다 · 사용자 11/06).
   - 짝짓기는 입금자명 = 예약자 이름일 때만. 금액까지 같으면 '금액 일치', 이름만 같으면 '이름만 일치'.
