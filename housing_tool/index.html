      noPhone: open.filter(function (r) { return !r.phone; }),
      noRes: list.filter(function (r) { return r.res && (r.res.how === 'none' || r.res.how === 'nosheet'); }),
      late: open.filter(function (r) { return r.amt >= 100000 && U.diffDays(r.date, today) > 5; }),
      done: list.filter(function (r) { return r.st === '발급완료'; })
    };
  }
  function resCell(r) {
    var x = r.res || {}, h = HOW[x.how] || HOW.none;
    var s = '<div style="white-space:normal;min-width:240px;max-width:380px"><span class="badge ' + h[1] + '">' + h[0] + '</span>';
    if (x.stay) s += '<div class="t-small">' + U.esc(x.stay.slice(5).replace('-', '/')) + ' ' + U.esc(x.room || '') + ' · ' + U.esc(x.ota || '') + ' · ' + U.esc(x.name || '') +
      (x.extra ? ' · 추가비용 ' + U.comma(x.extra) : '') + (x.pay ? ' · 결제상태 "' + U.esc(x.pay) + '"' : '') + '</div>';
    if (x.note) s += '<div class="t-small t-dim">' + U.esc(x.note) + '</div>';
    return s + '</div>';
  }
  function phoneCell(r) {
    if (r.phone) return '<b>' + U.esc(r.phone) + '</b>' + (r.use ? '<div class="t-small t-dim">' + U.esc(r.use) + '</div>' : '');
    var p = r.res && r.res.phone;
    if (p && isSafeNo(p)) return '<span class="badge badge-warn">실제 번호 필요</span><div class="t-small t-dim">예약 번호 ' + U.esc(p) + ' (OTA 안심번호)</div>';
    return '<span class="badge badge-warn">번호 없음</span>';
  }
  function listHTML(list) {
    if (!list.length) return UI.empty('해당하는 입금이 없습니다', '');
    return UI.table(['발행', '입금일', '입금자', { label: '금액', className: 'num' }, '예약 대조 (매출관리표)', '발급 번호', '발급상태', ''],
      U.sortBy(list, function (r) { return r.date + (r.seq || 0); }).map(function (r) {
        var v = vat(r.amt), s = STM[r.st] || STM['미발급'];
        var done = r.st === '발급완료', skip = r.st === '발급불필요';
        return { attrs: done ? ' style="background:var(--ok-bg, rgba(46,160,67,.06))"' : '', cells: [
          '<label class="check" title="' + (skip ? '발급 불필요로 처리된 건' : done ? '체크를 풀면 미발급으로 돌아갑니다' : '현금영수증을 발행했으면 체크') + '">' +
            '<input type="checkbox" data-act="crDone" data-id="' + U.esc(r.id) + '" style="width:20px;height:20px"' + (done ? ' checked' : '') + (skip ? ' disabled' : '') + '></label>',
          U.esc(U.fmtDate(r.date)),
          '<b>' + U.esc(r.who) + '</b><div class="t-small t-dim">' + U.esc(r.branch || '') + ' · ' + U.esc(r.acct) + '</div><div class="t-small t-dim">' + U.esc(r.why || '') + '</div>',
          U.comma(r.amt) + '<div class="t-small t-dim">공급 ' + U.comma(v[0]) + '</div><div class="t-small t-dim">부가세 ' + U.comma(v[1]) + '</div>',
          resCell(r),
          phoneCell(r),
          '<span class="badge ' + s[2] + '">' + s[1] + '</span>' + (r.issuedAt ? '<div class="t-small t-dim">' + U.esc(U.fmtDate(r.issuedAt)) + (r.apprNo ? ' · ' + U.esc(r.apprNo) : '') + '</div>' : '') +
            (r.memo ? '<div class="t-small t-dim" style="white-space:normal;max-width:200px">' + U.esc(r.memo) + '</div>' : ''),
          '<button class="btn btn-sm btn-ghost" data-act="crEdit" data-id="' + U.esc(r.id) + '">처리</button>'
        ] };
      }));
  }
  function render(el) {
    var k = counts();
    var F = { open: ['발급할 것', k.open], noPhone: ['번호 필요', k.noPhone], noRes: ['예약 못 찾음 · 매출표 없음', k.noRes], done: ['발급완료', k.done], all: ['전체', k.list] };
    if (!F[st.filter]) st.filter = 'open';
    var stats = '<div class="grid grid-4">' +
      UI.stat('발급할 것', k.open.length + '건', U.comma(U.sum(k.open, function (r) { return r.amt; })) + '원', k.open.length ? 'danger' : 'ok', '발급상태가 "미발급" · "확인 필요"인 입금입니다.') +
      UI.stat('번호 필요', k.noPhone.length + '건', 'OTA 안심번호 · 번호 없음', k.noPhone.length ? 'danger' : 'ok', '현금영수증은 손님 실제 휴대폰번호(또는 사업자번호)로 발급합니다. OTA 안심번호(050x)는 쓸 수 없습니다.') +
      UI.stat('예약 못 찾음', k.noRes.length + '건', '입금자명이 매출표에 없음', k.noRes.length ? 'danger' : 'ok', '입금자명과 같은 예약자가 매출관리표(입금 달 · 다음 달)에 없거나, 그 지점 매출표가 드라이브 폴더에 없습니다.') +
      UI.stat('10만 원↑ · 5일 지남', k.late.length + '건', U.comma(U.sum(k.late, function (r) { return r.amt; })) + '원', k.late.length ? 'danger' : 'ok', '숙박업은 현금영수증 의무발행업종으로 알려져 있어 10만 원 이상 현금 거래는 5일 안에 발급해야 할 수 있습니다. 정확한 기준은 세무사 확인이 필요합니다.') +
      '</div>';
    var chips = '<div class="chips" style="padding:14px 0 6px">' + Object.keys(F).map(function (key) {
      return '<button class="chip' + (st.filter === key ? ' active' : '') + '" data-act="crFilter" data-id="' + key + '">' + F[key][0] + ' <span class="cnt">' + F[key][1].length + '</span></button>';
    }).join('') + '</div>';
    var last = all().reduce(function (m, r) { return r.date > m ? r.date : m; }, '');
    var meta = '<div class="tab-meta"><span class="m">입금: <a class="go-link" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/' + JAGUM_ID + '/edit">자금일보 ↗</a> 날짜 탭 (' + U.fmtDate(FROM) + '~' + (last ? U.fmtDate(last) : '') + ')</span>' +
      '<span class="m">예약: 드라이브 「호텔 매출 관리표」 거제 · 군위 · 김해</span>' +
      '<span class="m t-dim">손님 번호는 이 대시보드에만 저장 (자금일보 시트에는 쓰지 않음)</span></div>';
    var act = '<button class="btn btn-sm" data-act="crScan"' + (st.busy ? ' disabled' : '') + '>' + (st.busy ? '읽는 중…' : '🔄 새 입금 찾기') + '</button> ' +
      '<button class="btn btn-sm btn-ghost" data-act="crCopy">📋 발급 목록 복사</button>';
    el.innerHTML = stats + chips + meta +
      (st.error ? '<div class="nt-note"><b>!</b><div class="nt-note-text">' + U.esc(st.error) + '</div></div>' : '') +
      (st.log ? '<div class="t-dim" style="margin:6px 0">' + U.esc(st.log) + '</div>' : '') +
      UI.card(F[st.filter][0] + ' ' + F[st.filter][1].length + '건', listHTML(F[st.filter][1]), act, true,
        '자금일보 구분 "현금매출" 또는 사유 "숙박추가요금 · 계좌이체매출 · 현금매출"인 입금입니다. 처리 버튼으로 번호 · 발급상태 · 발급일을 적습니다.');
  }

  /* ---------- 처리(번호 · 발급상태) ---------- */
  function edit(r) {
    var resPh = r.res && r.res.phone && !isSafeNo(r.res.phone) ? r.res.phone : '';
    UI.form({
      title: '현금영수증 — ' + r.who + ' ' + U.comma(r.amt) + '원 (' + U.fmtDate(r.date) + ')',
      values: { phone: r.phone || resPh, use: r.use || '소득공제', st: r.st || '미발급', issuedAt: r.issuedAt || '', apprNo: r.apprNo || '', memo: r.memo || '' },
      fields: [
        { name: 'phone', label: '발급 번호 (휴대폰 · 사업자번호)', placeholder: '010-0000-0000', hint: resPh ? '매출관리표 예약 번호를 넣어 두었습니다. 손님에게 받은 번호가 다르면 고치세요.' : '매출표 번호가 없거나 OTA 안심번호입니다. 손님에게 받은 번호를 넣으세요.' },
        { name: 'use', label: '용도', type: 'select', options: [{ value: '소득공제', label: '소득공제(개인)' }, { value: '지출증빙', label: '지출증빙(사업자)' }] },
        { name: 'st', label: '발급상태', type: 'select', required: true, options: ST.map(function (s) { return { value: s[0], label: s[1] }; }) },
        { name: 'issuedAt', label: '발급일', type: 'date' },
        { name: 'apprNo', label: '승인번호', placeholder: '홈택스 · 단말기 승인번호' },
        { name: 'memo', label: '메모', full: true, placeholder: '예) 11/10 손님 문자로 번호 받음 · 자진발급' }
      ],
      onSubmit: function (v) {
        if (v.st === '발급완료' && !v.issuedAt) return { issuedAt: '발급완료면 발급일을 넣어 주세요.' };
        if (v.st === '발급완료' && !v.phone) return { phone: '발급한 번호를 넣어 주세요. (자진발급이면 010-000-1234)' };
        S.upsert('cashrcpt', Object.assign({}, r, v, { updatedAt: U.todayISO() }));
        UI.toast('저장했습니다.', 'ok'); App.router.refresh();
      }
    });
  }
  function copyList() {
    var list = counts().open.filter(function (r) { return r.phone; });
    if (!list.length) { UI.toast('번호가 있는 미발급 건이 없습니다.', 'warn'); return; }
    var lines = ['입금일\t지점\t입금자\t총금액\t공급가액\t부가세\t번호\t용도'];
    U.sortBy(list, function (r) { return r.date; }).forEach(function (r) {
      var v = vat(r.amt); lines.push([r.date, r.branch, r.who, r.amt, v[0], v[1], r.phone, r.use || '소득공제'].join('\t'));
    });
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { UI.toast(list.length + '건 복사했습니다.', 'ok'); }, function () { UI.toast('복사하지 못했습니다.', 'err'); });
  }

  /* ---------- 새 입금 찾기 (Google Sheets 커넥터, 읽기만) ---------- */
  function connect() {
    if (mcpState !== 'init') return Promise.resolve(mcpState === 'ready');
    if (!window.claude || typeof window.claude.use !== 'function') { mcpState = 'none'; return Promise.resolve(false); }
    return window.claude.use('mcp').then(function (m) { mcp = m; mcpState = m ? 'ready' : 'none'; return !!m; }, function () { mcpState = 'none'; return false; });
  }
  function payload(res) { var p = res && res.payload; if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { /* 원문 */ } } return p || {}; }
  function read(tool, input) { return mcp.callTool(SERVER, tool, input, { cache: false }).then(payload); }
  function q(t) { return "'" + String(t).replace(/'/g, "''") + "'"; }
  function values(id, range) { return read('get_values', { spreadsheetId: id, range: range }).then(function (p) { return p.values || []; }); }
  function tabIso(title) {
    var m = /^(\d{1,2})월\s*(\d{1,2})일$/.exec(str(title)); if (!m) return '';
    var y = +FROM.slice(0, 4), mo = +m[1];
    if (mo < +FROM.slice(5, 7)) y++;   // 11월부터 시작 → 1~10월 탭은 다음 해
    return y + '-' + U.pad2(mo) + '-' + U.pad2(+m[2]);
  }
  function isCashRow(why, kind, amt) {
    return amt > 0 && (kind === '현금매출' || /숙박추가|계좌이체매출|현금매출/.test(why));
  }
  // 매출표 한 달 치 예약 [{stay, room, ota, name, phone, extra, pay}]
  function resRows(sheet, ym, cache) {
    var k = sheet.id + ym; if (cache[k]) return cache[k];
    var mo = +ym.slice(5, 7), p;
    if (sheet.kind === 'geoje') p = values(sheet.id, q(U.pad2(mo) + '월상세') + '!A10:L250').then(function (v) {
      return v.filter(function (r) { return r[5]; }).map(function (r) { return { stay: str(r[0]), room: str(r[2]), ota: str(r[4]), name: str(r[5]), phone: str(r[6]), extra: num(r[9]), pay: str(r[11]) }; });
    });
    else if (sheet.kind === 'gunwi') p = values(sheet.id, q(mo + '월예약') + '!A6:L60').then(function (v) {
      return v.filter(function (r) { return r[4]; }).map(function (r) { return { stay: str(r[0]), room: '독채', ota: str(r[3]), name: str(r[4]), phone: str(r[5]), extra: num(r[8]), total: num(r[9]), pay: str(r[10]) }; });
    });
    else p = Promise.resolve(null);   // 김해 일별 탭은 연락처가 없어 자동 대조하지 않는다
    cache[k] = p.catch(function () { return []; });
    return cache[k];
  }
  function matchRes(item, sheet, cache) {
    if (!sheet) return Promise.resolve({ how: 'nosheet', note: '이 지점 매출관리표가 드라이브 「호텔 매출 관리표」 폴더에 없음 — 예약 확인 필요' });
    if (sheet.kind === 'gimhae') return Promise.resolve({ how: 'nosheet', note: '김해 매출표는 연락처 칸이 없어 직접 확인 필요' });
    var ym = item.date.slice(0, 7), next = U.addMonths ? U.addMonths(ym, 1) : ym;
    return Promise.all([resRows(sheet, ym, cache), resRows(sheet, next, cache)]).then(function (two) {
      var rows = [].concat(two[0] || [], two[1] || []), name = cleanName(item.who);
      var hits = rows.filter(function (x) { return x.name === name; });
      if (!hits.length) return { how: 'none', note: '입금자명 "' + item.who + '"과 같은 예약자가 ' + sheet.name + ' ' + ym + '·' + next + '에 없음' };
      var exact = hits.filter(function (x) { return x.extra === item.amt || x.total === item.amt; });
      var h = (exact[0] || hits[0]);
      return { how: exact.length ? 'amount' : 'name', file: sheet.name, stay: h.stay, room: h.room, ota: h.ota, name: h.name, phone: h.phone, extra: h.extra || 0, pay: h.pay,
        note: exact.length ? '' : '매출표 추가비용(' + (h.extra ? U.comma(h.extra) : '빈칸') + ')과 입금액이 다름 — 매출표 기재 확인' };
    });
  }
  function scan() {
    st.busy = 'scan'; st.error = ''; st.log = ''; App.router.refresh();
    var have = {}; all().forEach(function (r) { have[keyOf(r)] = 1; });
    var added = [], cache = {};
    connect().then(function (ok) {
      if (!ok) throw { message: '이 화면에서 Google Sheets 커넥터를 쓸 수 없습니다. claude.ai에서 대시보드를 열어 주세요.' };
      return read('get_spreadsheet', { spreadsheetId: JAGUM_ID, fields: ['sheets.properties.title'] });
    }).then(function (p) {
      var tabs = (p.sheets || []).map(function (s) { return s.properties.title; })
        .map(function (t) { return { t: t, iso: tabIso(t) }; }).filter(function (x) { return x.iso && x.iso >= FROM && x.iso <= U.todayISO(); });
      var chain = Promise.resolve();
      tabs.forEach(function (tb) {
        chain = chain.then(function () { return values(JAGUM_ID, q(tb.t) + '!B5:G120'); }).then(function (v) {
          var seq = {};
          return v.reduce(function (c, r) {
            var acc = str(r[0]), who = str(r[1]), amt = num(r[2]), why = str(r[4]), kind = str(r[5]);
            if (!acc || acc === '총계' || !isCashRow(why, kind, amt)) return c;
            var sk = acc + who + amt; seq[sk] = (seq[sk] || 0) + 1;
            var item = { date: tb.iso, acct: acc, who: who, amt: amt, why: why, kind: kind, seq: seq[sk] - 1 };
            if (have[keyOf(item)]) return c;
            var b = branchOf(acc);
            return c.then(function () { return matchRes(item, b[2], cache); }).then(function (res) {
              var rent = /월세|임대료/.test(why);
              added.push(Object.assign(item, { id: U.uid('cr'), branch: b[1] || acc, src: '자금일보 「' + tb.t + '」', res: res,
                phone: res.phone && !isSafeNo(res.phone) ? res.phone : '', use: '소득공제',
                st: rent || res.how === 'none' || res.how === 'nosheet' ? '확인필요' : '미발급',
                memo: rent ? '사유가 주택 월세 — 현금영수증 대상인지 확인 필요' : '', createdAt: U.todayISO() }));
            });
          }, Promise.resolve());
        });
      });
      return chain.then(function () { return tabs.length; });
    }).then(function (n) {
      added.forEach(function (r) { S.get().cashrcpt.push(r); });
      if (added.length) S.commit();
      st.log = '자금일보 날짜 탭 ' + n + '개를 읽었습니다. 새 현금 입금 ' + added.length + '건' + (added.length ? '을 더했습니다.' : '은 없습니다.');
    }).catch(function (e) {
      st.error = '읽지 못했습니다: ' + ((e && e.message) || e) + ' (자동으로 다시 시도하지 않습니다)';
    }).then(function () { st.busy = ''; App.router.refresh(); });
  }

  App.views.cashrcpt = {
    title: '현금영수증 대조',
    desc: '자금일보 현금 입금을 호텔 매출관리표 예약과 맞춰 보고, 발급 번호 · 발급상태를 관리합니다 (2026년 11월부터).',
    render: render,
    summary: function () { return { open: counts().open.length }; },
    handlers: {
      crFilter: function (id) { st.filter = id; App.router.refresh(); },
      crDone: function (id, el) {
        var r = all().filter(function (x) { return x.id === id; })[0]; if (!r) return;
        var on = !!(el && el.checked);
        if (on && !r.phone) {
          if (el) el.checked = false;
          UI.toast('발급 번호가 없습니다. 번호를 넣고 발급완료로 저장해 주세요.', 'warn');
          edit(Object.assign({}, r, { st: '발급완료', issuedAt: r.issuedAt || U.todayISO() }));
          return;
        }
        var today = U.todayISO();
        S.upsert('cashrcpt', Object.assign({}, r, on
          ? { st: '발급완료', issuedAt: r.issuedAt || today, checkedAt: today }
          : { st: '미발급', issuedAt: '', checkedAt: '' }, { updatedAt: today }));
        UI.toast(on ? r.who + ' ' + U.comma(r.amt) + '원 — 발급완료로 표시했습니다 (발급일 ' + U.fmtDate(r.issuedAt || today) + ').' : r.who + ' — 미발급으로 되돌렸습니다.', 'ok');
        App.router.refresh();
      },
      crEdit: function (id) { var r = all().filter(function (x) { return x.id === id; })[0]; if (r) edit(r); },
      crScan: function () { if (!st.busy) scan(); },
      crCopy: copyList
    }
  };
})(window.App = window.App || {});

</script>
<script>
/* 라우터 · 앱 부트스트랩 */
(function (App) {
  var U = App.util, S = App.store, UI = App.ui;

  var ROUTES = ['dashboard', 'handover', 'jagumwrite', 'transfer', 'teamacct', 'cashrcpt', 'accounting', 'bizreg', 'autopay', 'notices', 'smshistory', 'salemsg', 'buildings', 'contracts', 'renewal', 'assets', 'payments', 'jagum', 'expenses', 'reports', 'sheetexport', 'settings'];
  var current = 'dashboard';
  // 왼쪽 메뉴를 주택관리 / 계좌 · 회계로 나눠 보여 준다. 고른 쪽은 이 기기에만 기억한다.
  var MODE_KEY = 'zipkeeper.navMode', mode = 'house';
  try { mode = localStorage.getItem(MODE_KEY) === 'acct' ? 'acct' : 'house'; } catch (e) { mode = 'house'; }
  var MODE_HOME = { house: 'dashboard', acct: 'jagumwrite' };
  function routeMode(r) {
    var a = navEl && navEl.querySelector('a[data-route="' + r + '"]');
    return a ? a.getAttribute('data-mode') : 'both';
  }
  function applyMode() {
    Array.prototype.forEach.call(navEl.querySelectorAll('[data-mode]'), function (el) {
      var m = el.getAttribute('data-mode');
      el.hidden = !(m === 'both' || m === mode);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode-btn]'), function (b) {
      var on = b.getAttribute('data-mode-btn') === mode;
      b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  function setMode(m, go) {
    mode = m === 'acct' ? 'acct' : 'house';
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) { /* 기억 못 해도 화면은 동작 */ }
    applyMode();
    if (go && routeMode(current) !== mode && routeMode(current) !== 'both') location.hash = '#/' + MODE_HOME[mode];
  }
  var viewEl, titleEl, descEl, actionsEl, navEl, sidebar;

  function routeFromHash() {
    var h = String(location.hash || '').replace(/^#\/?/, '').replace(/^!\//, '').split('?')[0];
    return ROUTES.indexOf(h) >= 0 ? h : 'dashboard';
  }

  function render(preserveFocus) {
    var focusId = null, selStart = null;
    if (preserveFocus && document.activeElement && document.activeElement.id) {
      focusId = document.activeElement.id;
      try { selStart = document.activeElement.selectionStart; } catch (e) { selStart = null; }
    }

    var view = App.views[current];
    titleEl.textContent = view.title;
    descEl.textContent = view.desc || '';
    actionsEl.innerHTML = view.actions ? view.actions() : '';
    view.render(viewEl);

    var owner = S.get().settings.ownerName;
    document.getElementById('storage-note').textContent =
      (owner ? owner + ' 님 · ' : '') + (App.sync ? App.sync.statusText() : '이 브라우저에만 저장됩니다');

    Array.prototype.forEach.call(navEl.querySelectorAll('a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-route') === current);
    });
    try { navBadges(); } catch (e) { /* 배지는 보조 정보 */ }

    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) {
        el.focus();
        if (selStart != null && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selStart); } catch (e) { /* noop */ }
        }
      }
    }
  }

  /** 메뉴 옆 숫자 — 지금 챙길 건수 */
  function navBadges() {
    var V = App.views, out = {};
    var ho = V.handover && V.handover.summary ? V.handover.summary() : null;
    if (ho && ho.urgent) out.handover = [ho.urgent, ''];
    var acs = V.accounting && V.accounting.summary ? V.accounting.summary() : null;
    if (acs && acs.missed) out.accounting = [acs.missed, ''];
    else if (acs && acs.today) out.accounting = [acs.today, 'warn'];
    if (V.notices && V.notices.todayCount) { var n = V.notices.todayCount(); if (n) out.notices = [n, 'warn']; }
    var rn = V.renewal && V.renewal.summary ? V.renewal.summary() : null;
    if (rn && (rn.late || rn.window)) out.renewal = [rn.late + rn.window, rn.late ? '' : 'warn'];
    if (V.jagum && V.jagum.pending && V.jagum.pending()) out.jagum = ['!', 'info'];
    var aps = V.autopay && V.autopay.summary ? V.autopay.summary() : null;
    if (aps && aps.unknown) out.autopay = [aps.unknown, 'warn'];
    var trs = V.transfer && V.transfer.summary ? V.transfer.summary() : null;
    if (trs && trs.open) out.transfer = [trs.open, 'warn'];
    var crs = V.cashrcpt && V.cashrcpt.summary ? V.cashrcpt.summary() : null;
    if (crs && crs.open) out.cashrcpt = [crs.open, 'warn'];
    var late = {};
    App.billing.unpaidInvoices().forEach(function (inv) { if (App.billing.overdueDays(inv) >= 15) late[inv.contractId] = 1; });
    var lc = Object.keys(late).length; if (lc) out.payments = [lc, ''];
    Array.prototype.forEach.call(navEl.querySelectorAll('[data-badge]'), function (el) {
      var v = out[el.getAttribute('data-badge')];
      el.hidden = !v;
      if (v) { el.textContent = v[0]; el.className = 'nav-badge' + (v[1] ? ' ' + v[1] : ''); }
    });
  }

  function navigate() {
    var next = routeFromHash();
    current = next;
    // 다른 쪽 화면으로 바로 가면(링크 · 검색) 메뉴도 그쪽으로 바꾼다
    var rm = routeMode(next);
    if (rm !== 'both' && rm !== mode) setMode(rm, false);
    window.scrollTo(0, 0);
    sidebar.classList.remove('open');
    render();
  }

  function handleAction(act, id, target, e) {
    var view = App.views[current];
    var fn = view.handlers && view.handlers[act];
    if (!fn) {
      // 다른 화면에서 정의한 공용 동작(예: 대시보드의 수납 처리) 보조 탐색
      var names = ROUTES.concat(Object.keys(App.views).filter(function (k) { return ROUTES.indexOf(k) < 0; }));
      for (var i = 0; i < names.length; i++) {
        var v = App.views[names[i]];
        if (v && v.handlers && v.handlers[act]) { fn = v.handlers[act]; break; }
      }
    }
    if (!fn) return;
    e.preventDefault();
    fn(id, target, e);
  }

  function boot() {
    viewEl = document.getElementById('view');
    titleEl = document.getElementById('page-title');
    descEl = document.getElementById('page-desc');
    actionsEl = document.getElementById('page-actions');
    navEl = document.getElementById('nav');
    sidebar = document.getElementById('sidebar');

    UI.init();
    S.load();

    document.body.addEventListener('click', function (e) {
      var target = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!target) return;
      handleAction(target.getAttribute('data-act'), target.getAttribute('data-id'), target, e);
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-mode-btn]'), function (b) {
      b.addEventListener('click', function () { setMode(b.getAttribute('data-mode-btn'), true); });
    });
    applyMode();

    document.getElementById('menu-btn').addEventListener('click', function () {
      sidebar.classList.toggle('open');
    });

    window.addEventListener('hashchange', navigate);

    if (!location.hash) location.hash = '#/' + MODE_HOME[mode];
    navigate();

    if (App.sync) App.sync.connect();
    if (App.drive) App.drive.connect().then(function (ok) {
      // 클라우드 데이터가 먼저 내려온 뒤에 비교해야 하므로 잠시 기다린다
      if (ok) setTimeout(App.drive.autoCheck, 4000);
    });
    // 클라우드 데이터가 내려온 뒤 최신 상태를 백업 대상으로 잡는다.
    if (App.autoBackup) setTimeout(App.autoBackup.init, 5000);
  }

  App.router = {
    refresh: function (preserveFocus) { render(preserveFocus); },
    go: function (route) { location.hash = '#/' + route; },
    current: function () { return current; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.App);

</script>
</body>
</html>
