    // 초기 구현에서 클라우드 설정에 저장했을 수 있는 비밀문구를 이 브라우저로 옮긴 뒤 제거한다.
    var stored = S.get().settings && S.get().settings.autoBackup;
    if (stored && stored.token) {
      if (!localToken()) setLocalToken(stored.token);
      delete stored.token;
      S.commit();
    }
    S.subscribe(schedule);
    schedule();
  }

  App.autoBackup = {
    init: init,
    sendNow: function () { return send('manual'); },
    configured: configured,
    token: localToken,
    setToken: setLocalToken,
    status: function () { return { busy: busy, pending: pending }; }
  };
})(window.App);

</script>
<script>
/* 공통 UI — 모달, 폼, 토스트, 확인창 */
(function (App) {
  var U = App.util;

  var backdrop, titleEl, bodyEl, footEl, closeBtn, toastWrap, tipEl;
  var onCloseHook = null;

  /* ---------- 도움말 말풍선 ---------- */
  /** 물음표 아이콘. 마우스를 올리거나(PC) 누르면(모바일) 설명이 뜬다. */
  function help(text) {
    return '<span class="help" tabindex="0" role="button" aria-label="도움말: ' + U.esc(text) + '"' +
      ' data-help="' + U.esc(text) + '">?</span>';
  }

  function showTip(target) {
    var text = target.getAttribute('data-help');
    if (!text) return;
    tipEl.textContent = text;
    tipEl.hidden = false;
    var r = target.getBoundingClientRect();
    var t = tipEl.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
    var top = r.bottom + 8;
    if (top + t.height > window.innerHeight - 8) top = Math.max(8, r.top - t.height - 8);
    tipEl.style.left = left + 'px';
    tipEl.style.top = top + 'px';
  }

  function hideTip() { if (tipEl) tipEl.hidden = true; }

  function initTips() {
    tipEl = document.createElement('div');
    tipEl.className = 'tip';
    tipEl.hidden = true;
    document.body.appendChild(tipEl);

    function target(e) { return e.target.closest ? e.target.closest('[data-help]') : null; }
    document.addEventListener('mouseover', function (e) { var t = target(e); if (t) showTip(t); });
    document.addEventListener('mouseout', function (e) { if (target(e)) hideTip(); });
    document.addEventListener('focusin', function (e) { var t = target(e); if (t) showTip(t); });
    document.addEventListener('focusout', hideTip);
    document.addEventListener('click', function (e) {
      var t = target(e);
      if (!t) { hideTip(); return; }
      // 모바일에서는 탭 한 번에 mouseover와 click이 함께 나므로 토글하지 않고 항상 연다.
      // (다른 곳을 누르거나 Esc를 누르면 닫힌다)
      e.preventDefault();
      showTip(t);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); });
    window.addEventListener('scroll', hideTip, true);
    window.addEventListener('resize', hideTip);
  }

  function init() {
    backdrop = document.getElementById('modal-backdrop');
    titleEl = document.getElementById('modal-title');
    bodyEl = document.getElementById('modal-body');
    footEl = document.getElementById('modal-foot');
    closeBtn = document.getElementById('modal-close');
    toastWrap = document.getElementById('toast-wrap');

    initTips();
    closeBtn.addEventListener('click', close);
    backdrop.addEventListener('mousedown', function (e) {
      if (e.target === backdrop) close();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !backdrop.hidden) close();
    });
  }

  function open(opts) {
    titleEl.textContent = opts.title || '';
    bodyEl.innerHTML = opts.body || '';
    footEl.innerHTML = '';
    (opts.buttons || []).forEach(function (b) {
      var btn = document.createElement('button');
      btn.className = 'btn ' + (b.className || '');
      btn.textContent = b.label;
      btn.addEventListener('click', b.onClick);
      footEl.appendChild(btn);
    });
    onCloseHook = opts.onClose || null;
    backdrop.hidden = false;
    var first = bodyEl.querySelector('input, select, textarea');
    if (first) setTimeout(function () { first.focus(); }, 30);
    return { body: bodyEl, foot: footEl };
  }

  function close() {
    backdrop.hidden = true;
    bodyEl.innerHTML = '';
    footEl.innerHTML = '';
    if (onCloseHook) { var f = onCloseHook; onCloseHook = null; f(); }
  }

  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    toastWrap.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .3s';
      setTimeout(function () { el.remove(); }, 320);
    }, 2600);
  }

  function confirm(opts) {
    open({
      title: opts.title || '확인',
      body: '<p style="margin:0;white-space:pre-line">' + U.esc(opts.message || '') + '</p>',
      buttons: [
        { label: opts.cancelLabel || '취소', onClick: close },
        {
          label: opts.confirmLabel || '확인',
          className: opts.danger ? 'btn-danger' : 'btn-primary',
          onClick: function () { close(); opts.onConfirm && opts.onConfirm(); }
        }
      ]
    });
  }

  /* ---------- 폼 ---------- */
  function fieldHTML(f, value) {
    var id = 'f_' + f.name;
    var req = f.required ? ' <span class="req">*</span>' : '';
    var html = '<div class="field' + (f.full ? ' full' : '') + '" data-field="' + f.name + '">';
    html += '<label for="' + id + '">' + U.esc(f.label) + req + '</label>';

    var v = value == null ? '' : value;
    if (f.type === 'select') {
      html += '<select id="' + id + '" name="' + f.name + '">';
      (f.options || []).forEach(function (o) {
        var val = typeof o === 'string' ? o : o.value;
        var lab = typeof o === 'string' ? o : o.label;
        html += '<option value="' + U.esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + U.esc(lab) + '</option>';
      });
      html += '</select>';
    } else if (f.type === 'textarea') {
      html += '<textarea id="' + id + '" name="' + f.name + '">' + U.esc(v) + '</textarea>';
    } else if (f.type === 'checkbox') {
      html += '<label class="check"><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (v ? ' checked' : '') + '> ' + U.esc(f.checkLabel || '') + '</label>';
    } else if (f.type === 'money') {
      html += '<input type="text" inputmode="numeric" data-money="1" id="' + id + '" name="' + f.name + '" value="' + (v === '' ? '' : U.comma(v)) + '" placeholder="0">';
    } else {
      var type = f.type || 'text';
      var attrs = '';
      if (type === 'number') attrs += ' inputmode="numeric"';
      if (f.min != null) attrs += ' min="' + f.min + '"';
      if (f.max != null) attrs += ' max="' + f.max + '"';
      if (f.placeholder) attrs += ' placeholder="' + U.esc(f.placeholder) + '"';
      html += '<input type="' + type + '" id="' + id + '" name="' + f.name + '" value="' + U.esc(v) + '"' + attrs + '>';
    }
    if (f.hint) html += '<span class="hint">' + f.hint + '</span>';
    html += '<span class="err" hidden></span></div>';
    return html;
  }

  function bindMoneyInputs(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-money]'), function (input) {
      input.addEventListener('input', function () {
        var caretFromEnd = input.value.length - input.selectionStart;
        var raw = input.value.replace(/[^0-9-]/g, '');
        input.value = raw === '' ? '' : U.comma(raw);
        var pos = Math.max(0, input.value.length - caretFromEnd);
        try { input.setSelectionRange(pos, pos); } catch (e) { /* noop */ }
      });
    });
  }

  function readForm(root, fields) {
    var out = {};
    fields.forEach(function (f) {
      var el = root.querySelector('[name="' + f.name + '"]');
      if (!el) return;
      if (f.type === 'checkbox') out[f.name] = el.checked;
      else if (f.type === 'money' || f.type === 'number') out[f.name] = U.num(el.value);
      else out[f.name] = el.value.trim();
    });
    return out;
  }

  function showErrors(root, errors) {
    Array.prototype.forEach.call(root.querySelectorAll('.field .err'), function (e) {
      e.hidden = true; e.textContent = '';
    });
    Object.keys(errors || {}).forEach(function (name) {
      var wrap = root.querySelector('[data-field="' + name + '"] .err');
      if (wrap) { wrap.textContent = errors[name]; wrap.hidden = false; }
    });
  }

  /**
   * 폼 모달을 연다.
   * onSubmit(values) 이 문자열 키의 오류 객체를 반환하면 폼을 닫지 않는다.
   */
  function form(opts) {
    var fields = opts.fields || [];
    var values = opts.values || {};
    var html = '<form class="form-grid" id="modal-form">';
    fields.forEach(function (f) { html += fieldHTML(f, values[f.name]); });
    html += '</form>';

    var refs = open({
      title: opts.title,
      body: html,
      buttons: [
        { label: '취소', onClick: close },
        { label: opts.submitLabel || '저장', className: 'btn-primary', onClick: submit }
      ]
    });

    var formEl = refs.body.querySelector('#modal-form');
    bindMoneyInputs(formEl);
    formEl.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    formEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); submit(); }
    });
    if (opts.onRender) opts.onRender(formEl, function () { return readForm(formEl, fields); });

    function submit() {
      var vals = readForm(formEl, fields);
      var errors = {};
      fields.forEach(function (f) {
        if (f.required && (vals[f.name] === '' || vals[f.name] == null)) errors[f.name] = '필수 항목입니다.';
      });
      if (Object.keys(errors).length) { showErrors(formEl, errors); return; }
      var res = opts.onSubmit ? opts.onSubmit(vals, formEl) : null;
      if (res && typeof res === 'object') { showErrors(formEl, res); return; }
      close();
    }
  }

  /* ---------- 렌더 헬퍼 ---------- */
  function empty(title, desc, actionHTML) {
    return '<div class="empty"><strong>' + U.esc(title) + '</strong>' +
      (desc ? '<div>' + U.esc(desc) + '</div>' : '') +
      (actionHTML ? '<div style="margin-top:14px">' + actionHTML + '</div>' : '') + '</div>';
  }

  /** go: 누르면 갈 곳 — 'payments', 'payments:unpaid' 처럼 화면[:탭] (dNav 처리) */
  function stat(label, value, sub, cls, helpText, go) {
    return '<div class="card stat' + (go ? ' stat-link" data-act="dNav" data-id="' + U.esc(go) + '" role="link" tabindex="0' : '') + '">' +
      '<div class="stat-label">' + U.esc(label) + (helpText ? help(helpText) : '') + '</div>' +
      '<div class="stat-value ' + (cls || '') + '">' + value + '</div>' +
      (sub ? '<div class="stat-sub">' + sub + '</div>' : '') +
      '</div>';
  }

  function card(title, bodyHTML, headActionsHTML, tight, helpText) {
    return '<div class="card">' +
      (title ? '<div class="card-head"><h3>' + U.esc(title) + (helpText ? help(helpText) : '') + '</h3>' +
        '<div class="spacer"></div>' + (headActionsHTML || '') + '</div>' : '') +
      '<div class="card-body' + (tight ? ' tight' : '') + '">' + bodyHTML + '</div></div>';
  }

  function table(headers, rows) {
    if (!rows.length) return '';
    // rt: 휴대폰 폭에서는 한 줄을 카드 한 장으로 보여 준다 (칸 제목은 data-label)
    var html = '<div class="table-wrap"><table class="rt"><thead><tr>';
    headers.forEach(function (h) {
      var label = typeof h === 'string' ? h : h.label;
      var cls = typeof h === 'string' ? '' : (h.className || '');
      html += '<th class="' + cls + '">' + U.esc(label) + '</th>';
    });
    html += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr' + (r.attrs || '') + '>' + r.cells.map(function (c, i) {
        var h = headers[i];
        var cls = typeof h === 'string' ? '' : (h.className || '');
        var label = typeof h === 'string' ? h : (h && h.label) || '';
        return '<td class="' + cls + '" data-label="' + U.esc(label) + '"><div class="rt-v">' + c + '</div></td>';
      }).join('') + '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  /** 검색칸 입력 — 한글 조합 중(ㅎ→하→한)에는 기다렸다가 글자가 완성되면 fn(value)를 부른다.
      조합 중에 화면을 다시 그리면 "한집"이 "ㅎㅏㄴㅈㅣㅂ"처럼 낱자로 흩어진다. */
  function onType(input, fn, delay) {
    if (!input) return;
    var composing = false, t = null;
    function fire() { clearTimeout(t); t = setTimeout(function () { fn(input.value); }, delay || 0); }
    input.addEventListener('compositionstart', function () { composing = true; clearTimeout(t); });
    input.addEventListener('compositionend', function () { composing = false; fire(); });
    input.addEventListener('input', function (e) { if (composing || e.isComposing) return; fire(); });
  }

  /** 위임 방식 클릭 핸들러: data-act 속성 사용 */
  function delegate(root, handlers) {
    root.addEventListener('click', function (e) {
      var target = e.target.closest('[data-act]');
      if (!target || !root.contains(target)) return;
      var act = target.getAttribute('data-act');
      if (handlers[act]) {
        e.preventDefault();
        handlers[act](target.getAttribute('data-id'), target, e);
      }
    });
  }

  App.ui = {
    init: init, open: open, close: close, toast: toast, confirm: confirm, form: form,
    empty: empty, stat: stat, card: card, table: table, delegate: delegate, help: help, hideTip: hideTip,
    bindMoneyInputs: bindMoneyInputs, onType: onType
  };
})(window.App);

</script>
<script>
/* 대시보드 */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var state = { bld: '', mode: 'tenant' };   // 미납 표: 건물 필터 · 보기 모드(tenant|building)

  /** 누르면 그 계약 · 청구서 · 건물로 바로 가는 글자 */
  function go(act, id, label, cls) {
    if (!id) return '<span class="' + (cls || '') + '">' + U.esc(label) + '</span>';
    return '<a href="#" class="go-link ' + (cls || '') + '" data-act="' + act + '" data-id="' + U.esc(id) + '">' + U.esc(label) + '</a>';
  }

  function render(el) {
    var cm = U.currentMonth();
    var today = U.todayISO();
    var stats = B.monthStats(cm);
    var occ = B.occupancy();
    var exp = B.expectedMonthly();
    var unpaid = B.unpaidInvoices();
    var expiring = B.expiring(60);
    var st = S.get();

    if (!st.units.length) {
      el.innerHTML = UI.empty(
        '아직 등록된 호실이 없습니다',
        '건물과 호실을 먼저 등록하면 계약·수납 관리를 시작할 수 있습니다.',
        '<a class="btn btn-primary" href="#/buildings">건물 등록하러 가기</a> ' +
        '<button class="btn" data-act="seed">샘플 데이터로 둘러보기</button>'
      );
      return;
    }

    /* ── 미납을 임차인(계약) 단위로 묶는다 ── */
    var byContract = {};
    unpaid.forEach(function (inv) {
      var k = inv.contractId;
      if (!byContract[k]) byContract[k] = { first: inv, months: 0, amount: 0, last: '', overdue: 0 };
      var g = byContract[k];
      g.months++;
      g.amount += B.remaining(inv);
      if (inv.ym < g.first.ym) g.first = inv;
      g.overdue = Math.max(g.overdue, B.overdueDays(inv));
      (inv.payments || []).forEach(function (p) { if (p.date > g.last) g.last = p.date; });
    });
    var groups = U.sortBy(Object.keys(byContract).map(function (k) { return byContract[k]; }),
      function (g) { return g.amount; }, true);
    var late = groups.filter(function (g) { return g.overdue >= 15; });
    var lateSum = U.sum(late, function (g) { return g.amount; });

    /* ── 1. 오늘 챙길 일 ── */
    var todo = [];
    var ho = App.views.handover ? App.views.handover.summary() : null;
    if (ho && ho.open) {
      todo.push({ cls: ho.urgent ? 'danger' : 'warn',
        text: '📋 <b>인수인계 점검</b> 남은 항목 ' + ho.open + '건' + (ho.urgent ? ' · <span class="t-danger">급함 ' + ho.urgent + '건</span>' : ''),
        sub: '대출 만기 · 미납 · 계약서 · 관리표 확인 사항', action: '<a class="btn btn-sm" href="#/handover">점검표 열기</a>' });
    }
    var ac = App.views.accounting ? App.views.accounting.summary() : null;
    if (ac && (ac.missed || ac.today || ac.unclassified)) {
      todo.push({ cls: ac.missed ? 'danger' : 'warn',
        text: '📒 <b>회계 업무</b> 오늘 남은 일 ' + ac.today + '건' + (ac.missed ? ' · <span class="t-danger">누락 ' + ac.missed + '건</span>' : '') +
          (ac.unclassified ? ' · 분류 확인 ' + ac.unclassified + '건' : ''),
        sub: '법인주택 · 건물 · 개인주택 · 호텔 · 펜션 · 자금일보', action: '<a class="btn btn-sm" href="#/accounting">점검표 열기</a>' });
    }
    if (late.length) {
      todo.push({ cls: 'danger',
        text: '🚨 <b>15일 이상 연체</b> 임차인 ' + late.length + '명 · ' + U.wonShort(lateSum),
        sub: late.slice(0, 4).map(function (g) { var c = S.contract(g.first.contractId) || {}; return go('dCtr', c.id, S.unitLabel(g.first.unitId) + ' ' + (c.tenantName || '')); }).join(' · ') + (late.length > 4 ? ' 외 ' + (late.length - 4) + '명' : ''),
        action: '<a class="btn btn-sm" href="#/payments">미납 보기</a>' });
    }
    if (expiring.length) {
      todo.push({ cls: 'warn',
        text: '📅 <b>60일 내 만기</b> ' + expiring.length + '건',
        sub: expiring.slice(0, 4).map(function (c) { return go('dCtr', c.id, S.unitLabel(c.unitId) + ' ' + c.tenantName) + ' (D-' + U.diffDays(today, c.endDate) + ')'; }).join(' · ') + (expiring.length > 4 ? ' 외 ' + (expiring.length - 4) + '건' : ''),
        action: '<a class="btn btn-sm" href="#/contracts">계약 보기</a>' });
    }
    if (!stats.count) {
      todo.push({ cls: 'info', text: '🧾 <b>' + U.fmtMonth(cm) + ' 청구서</b>가 아직 없습니다',
        sub: '진행중 계약 ' + S.activeContracts().length + '건 기준으로 한 번에 만듭니다', action: '<button class="btn btn-sm btn-primary" data-act="gen">청구서 생성</button>' });
    }
    var rn = App.views.renewal ? App.views.renewal.summary() : null;
    if (rn && (rn.late || rn.window)) {
      todo.push({ cls: rn.late || rn.soon ? 'danger' : 'warn',
        text: '🔁 <b>계약 만기 통지</b> ' + (rn.late ? '<span class="t-danger">기한 지남 ' + rn.late + '건</span> · ' : '') + '지금 통지할 계약 ' + rn.window + '건',
        sub: '통지 없이 기한이 지나면 같은 조건으로 묵시적 갱신됩니다 · ' + rn.list.slice(0, 4).map(function (x) { return go('dCtr', x.c.id, S.unitLabel(x.c.unitId) + ' ' + (x.c.tenantName || '')); }).join(' · ') + (rn.list.length > 4 ? ' 외 ' + (rn.list.length - 4) + '건' : ''),
        action: '<a class="btn btn-sm" href="#/renewal">연장 여부 정리</a>' });
    }
    var jg = App.views.jagum && App.views.jagum.pending();
    if (jg) {
      todo.push({ cls: 'info', text: '🏦 <b>자금일보 확인</b> ' + jg.label + '분',
        sub: '누르면 부동산 자금일보 시트에서 월세 입금(성주 · 중산점 · 유천점)을 찾아 장부에 바로 넣습니다',
        action: '<button class="btn btn-sm btn-primary" data-act="jgImport">가져오기</button>' });
    }
    if (App.drive && App.drive.status() === 'ready') {
      var d = App.drive.last();
      if (d.busy) todo.push({ cls: 'info', text: '☁️ 구글 드라이브 확인 중…', sub: '', action: '' });
      else if (d.error) todo.push({ cls: 'danger', text: '⚠️ <b>드라이브 연동 오류</b>', sub: U.esc(d.error), action: '<button class="btn btn-sm" data-act="driveCheck">다시 시도</button>' });
      else if (d.plan && d.plan.count) {
        var pl = d.plan;
        todo.push({ cls: 'info', text: '☁️ <b>구글 드라이브에 새 내용</b> ' + pl.count + '건',
          sub: [pl.paymentsNew.length ? '입금 ' + pl.paymentsNew.length : '', pl.contractsNew.length ? '계약 ' + pl.contractsNew.length : '',
                pl.contractsChanged.length ? '변경 ' + pl.contractsChanged.length : '', pl.expensesNew.length ? '지출 ' + pl.expensesNew.length : ''].filter(Boolean).join(' · '),
          action: '<button class="btn btn-sm btn-primary" data-act="drivePreview">내용 보고 적용</button>' });
      }
    }
    var todoHTML = todo.length ? todo.map(function (t) {
      return '<div class="todo-row ' + t.cls + '"><span class="todo-dot"></span><div class="li-main"><div>' + t.text + '</div>' +
        (t.sub ? '<div class="li-sub">' + t.sub + '</div>' : '') + '</div>' + (t.action || '') + '</div>';
    }).join('') : '<div class="t-faint" style="padding:4px 0">오늘 챙길 일이 없습니다. 미납·만기·드라이브 새 내용이 생기면 여기에 뜹니다.</div>';

    var html = UI.card('✅ 오늘 챙길 일', todoHTML, '<span class="t-faint" style="font-size:12px">' + U.fmtDate(today) + '</span>', false,
      '급한 순서로 보여줍니다. 인수인계 급한 항목, 15일 이상 연체, 60일 내 만기, 드라이브에 새로 적힌 내용이 있으면 한 줄씩 뜹니다. 없으면 비어 있습니다.');

    /* ── 2. 요약 타일 ── */
    var totalUnpaid = U.sum(unpaid, function (i) { return B.remaining(i); });
    html += '<div class="grid grid-4" style="margin-top:16px">';
    html += UI.stat('이번 달 청구', U.wonShort(stats.billed),
      stats.count ? U.fmtMonth(cm) + ' · ' + stats.count + '건' : '계약 기준 예상 ' + U.wonShort(exp.rent + exp.maintenance),
      '', '이번 달 청구서의 합계입니다. 0원이면 아직 청구서를 만들지 않은 것이니 “청구서 생성”을 누르세요. 진행중 계약대로 한 번에 만들어집니다.', 'payments:month');
    html += UI.stat('이번 달 수납', U.wonShort(stats.collected),
      '<div class="progress" style="margin:4px 0 3px"><span style="width:' + Math.min(100, stats.rate) + '%"></span></div>수납률 ' + stats.rate + '%',
      stats.rate >= 100 ? 'ok' : '',
      '이번 달 청구분 중 실제로 들어온 돈입니다. 막대는 청구액 대비 진행률이고, 아래 미납 표에서 “수납”을 누르면 바로 올라갑니다.', 'payments:month');
    html += UI.stat('미납 총액', U.wonShort(totalUnpaid),
      '임차인 ' + groups.length + '명 · 15일 이상 연체 ' + late.length + '명', totalUnpaid ? 'danger' : '',
      '지난달까지 포함한 전체 미납 잔액입니다. 이번 달 청구서가 막 나온 상태라 납부일 전인 것도 잠시 포함됩니다.', 'payments:unpaid');
    html += UI.stat('입주', occ.occupied + '<span class="t-faint" style="font-size:14px;font-weight:500"> / ' + occ.total + '실</span>',
      '입주율 ' + occ.rate + '% · 공실 ' + occ.vacant + '실', '',
      '오늘 기준 진행중 계약이 있는 임대 호실 수입니다. 숙박업 객실은 빠집니다. 계약 기간이 끝나면 자동으로 공실로 잡히니 재계약을 하셨다면 계약 상세에서 기간을 늘려 주세요.', 'buildings');
    html += '</div>';

    /* ── 3. 미납 · 연체 (임차인별 / 건물별 두 가지로 본다) ── */
    var perBld = {};
    groups.forEach(function (g) {
      var u = S.unit(g.first.unitId);
      var bid = u ? u.buildingId : '';
      var r = perBld[bid] || (perBld[bid] = { count: 0, amount: 0, months: 0, late: 0, top: null });
      r.count++;
      r.amount += g.amount;
      r.months += g.months;
      if (g.overdue >= 15) r.late++;
      if (!r.top || g.amount > r.top.amount) r.top = g;
    });
    // 미납액이 큰 건물부터 본다 (임차인 목록 정렬과 같은 기준)
    var bldIds = U.sortBy(Object.keys(perBld), function (k) { return -perBld[k].amount; });
    if (state.bld && !perBld[state.bld]) state.bld = '';

    var chips = '<div class="chips">' +
      '<button class="chip' + (state.bld ? '' : ' active') + '" data-act="unpaidBld" data-id="">전체 <span class="cnt">' + groups.length + '</span></button>' +
      bldIds.map(function (k) {
        var b = S.building(k);
        return '<button class="chip' + (state.bld === k ? ' active' : '') + '" data-act="unpaidBld" data-id="' + k + '">' +
          U.esc(b ? b.name : '미지정') + ' <span class="cnt">' + perBld[k].count + '</span></button>';
      }).join('') + '</div>';

    var shown = groups.filter(function (g) {
      if (!state.bld) return true;
      var u = S.unit(g.first.unitId);
      return u && u.buildingId === state.bld;
    });
    var unpaidRows = shown.slice(0, 8).map(function (g) {
      var c = S.contract(g.first.contractId) || {};
      var od = g.overdue;
      return {
        cells: [
          go('dCtr', c.id, S.unitLabel(g.first.unitId), 't-strong') +
          '<div class="t-faint" style="font-size:12px">' + App.views.notices.tenantLink(c) + (c.tenantPhone ? ' · ' + U.phone(c.tenantPhone) : '') + '</div>',
          U.fmtMonth(g.first.ym) + (g.months > 1 ? '<div class="t-faint" style="font-size:12px">외 ' + (g.months - 1) + '개월</div>' : ''),
          od >= 15 ? '<span class="t-danger t-strong">' + od + '일</span>' : (od ? od + '일' : '<span class="t-faint">기한 전</span>'),
          '<span class="mono t-strong' + (od >= 15 ? ' t-danger' : '') + '">' + U.comma(g.amount) + '</span>',
          g.last ? U.fmtDate(g.last) : '<span class="t-faint">없음</span>',
          '<button class="btn btn-sm" data-act="ntQuick" data-id="' + U.esc(c.id || '') + '">✉️ 문자</button> ' +
          '<button class="btn btn-sm btn-primary" data-act="settle" data-id="' + g.first.id + '">수납</button>'
        ]
      };
    });

    /* 건물별 보기 — 건물 한 곳이 한 줄. 누르면 그 건물의 임차인 목록으로 넘어간다. */
    var bldRows = bldIds.map(function (k) {
      var b = S.building(k);
      var r = perBld[k];
      var tc = r.top ? (S.contract(r.top.first.contractId) || {}) : {};
      return {
        cells: [
          '<button class="btn btn-sm btn-ghost" data-act="unpaidDrill" data-id="' + k + '" style="padding:0;font-weight:600">' +
            U.esc(b ? b.name : '미지정') + '</button>',
          '<span class="mono">' + r.count + '</span>',
          '<span class="mono">' + r.months + '</span>',
          r.late ? '<span class="mono t-danger t-strong">' + r.late + '</span>' : '<span class="mono t-faint">0</span>',
          '<span class="mono t-strong' + (r.late ? ' t-danger' : '') + '">' + U.comma(r.amount) + '</span>',
          r.top ? '<span class="t-faint" style="font-size:12px">' + U.esc(S.unitLabel(r.top.first.unitId)) +
            ' ' + U.esc(tc.tenantName || '') + ' · ' + U.comma(r.top.amount) + '</span>' : '<span class="t-faint">-</span>',
          '<button class="btn btn-sm" data-act="unpaidDrill" data-id="' + k + '">임차인 보기</button>'
        ]
      };
    });
    if (bldRows.length > 1) {
      bldRows.push({
        attrs: ' style="background:var(--surface-2);font-weight:600"',
        cells: ['합계', '<span class="mono">' + groups.length + '</span>',
          '<span class="mono">' + U.sum(groups, function (g) { return g.months; }) + '</span>',
          '<span class="mono">' + late.length + '</span>',
          '<span class="mono">' + U.comma(totalUnpaid) + '</span>', '', '']
      });
    }

    var unpaidHTML;
    if (!groups.length) {
      unpaidHTML = '<div class="empty"><strong>미납 없음</strong><div>모든 청구서가 수납 완료되었습니다.</div></div>';
    } else if (state.mode === 'building') {
      unpaidHTML = UI.table(['건물', { label: '임차인', className: 'num' }, { label: '미납 개월', className: 'num' },
        { label: '15일↑ 연체', className: 'num' }, { label: '미납 합계', className: 'num' },
        { label: '최다 미납', className: 'hide-m' }, { label: '', className: 'actions' }], bldRows);
    } else {
      unpaidHTML = chips + UI.table(['호실 · 임차인', { label: '미납 시작', className: 'hide-m' }, '경과',
        { label: '미납 합계', className: 'num' }, { label: '최근 입금', className: 'hide-m' },
        { label: '', className: 'actions' }], unpaidRows) +
        (shown.length > 8 ? '<div class="t-faint" style="padding:8px 16px;font-size:12px">상위 8명만 표시 · 나머지 ' + (shown.length - 8) + '명은 수납·미납 화면에서</div>' : '');
    }

    var unpaidActions =
      '<button class="btn btn-sm' + (state.mode === 'tenant' ? ' btn-primary' : '') + '" data-act="unpaidMode" data-id="tenant">임차인별</button>' +
      '<button class="btn btn-sm' + (state.mode === 'building' ? ' btn-primary' : '') + '" data-act="unpaidMode" data-id="building">건물별</button>' +
      '<a class="btn btn-sm" href="#/payments">전체 보기</a>';

    html += '<div style="margin-top:16px">' +
      UI.card('💸 미납 · 연체', unpaidHTML, unpaidActions, true,
        '두 가지로 볼 수 있습니다. “임차인별”은 임차인 한 명으로 묶어 미납 합계가 큰 순서이고, 건물 칩을 누르면 그 건물만 봅니다. ' +
        '“건물별”은 건물 한 곳이 한 줄로, 미납 임차인 수·미납 개월·15일 이상 연체 인원·미납 합계를 함께 보여줍니다. ' +
        '건물 이름이나 “임차인 보기”를 누르면 그 건물의 임차인 목록으로 넘어갑니다. ' +
        '경과는 가장 오래된 청구서의 납부기한 기준이고 15일 이상이면 빨갛게 표시합니다. “수납”은 가장 오래된 미납분부터 입금 창을 엽니다.') + '</div>';

    /* ── 4. 이번 달 입금 | 공실 (건물별) ── */
    var pays = [];
    st.invoices.forEach(function (inv) { (inv.payments || []).forEach(function (p) { pays.push({ inv: inv, p: p }); }); });
    pays = U.sortBy(pays, function (r) { return r.p.date; }, true);
    var thisMonth = pays.filter(function (r) { return String(r.p.date).slice(0, 7) === cm; });
    var payList = thisMonth.length ? thisMonth : pays;
    var payTitle = thisMonth.length ? U.fmtMonth(cm) + ' 입금 (' + thisMonth.length + '건 · ' + U.wonShort(U.sum(thisMonth, function (r) { return r.p.amount; })) + ')' : '최근 입금';
    var recentHTML = payList.length ? payList.slice(0, 7).map(function (r) {
      return '<div class="list-item" style="padding-left:0;padding-right:0">' +
        '<div class="li-main"><div class="li-title">' + go('dInv', r.inv.id, S.unitLabel(r.inv.unitId)) + ' <span class="t-faint">· ' + U.fmtMonth(r.inv.ym) + '분</span></div>' +
        '<div class="li-sub">' + U.fmtDate(r.p.date) + (r.p.method ? ' · ' + U.esc(r.p.method) : '') + '</div></div>' +
        '<span class="mono t-strong">' + U.won(r.p.amount) + '</span></div>';
    }).join('') + (!thisMonth.length ? '<div class="t-faint" style="font-size:12px;margin-top:6px">이번 달 입금이 아직 없어 최근 입금을 보여줍니다.</div>' : '')
      : '<div class="t-faint">입금 내역이 없습니다.</div>';

    var vacBy = U.groupBy(occ.vacantUnits, function (u) { return u.buildingId; });
    var vacIds = U.sortBy(Object.keys(vacBy), function (k) { return -vacBy[k].length; });
    var vacantHTML = vacIds.length ? vacIds.map(function (k) {
      var b = S.building(k);
      var names = U.sortBy(vacBy[k], function (u) { return u.name; }).map(function (u) { return U.esc(u.name); });
      return '<div class="vac-group"><div class="vac-head">' + (b ? go('dBld', k, b.name, 't-strong') : '<span class="t-strong">미지정</span>') +
        '<span class="badge badge-warn">' + names.length + '실</span></div>' +
        '<div class="vac-units">' + names.join('<span class="t-faint"> · </span>') + '</div></div>';
    }).join('') : '<div class="t-faint">공실이 없습니다. 전 호실 임대 중입니다.</div>';

    html += '<div class="grid grid-2" style="margin-top:16px">' +
      UI.card(payTitle, recentHTML, '<a class="btn btn-sm" href="#/payments">수납 관리</a>', false,
        '이번 달에 입금일이 찍힌 기록입니다. 잘못 넣었다면 수납·미납에서 그 청구서의 상세를 열어 삭제할 수 있습니다.') +
      UI.card('🚪 공실 ' + occ.vacant + '실', vacantHTML, '<a class="btn btn-sm" href="#/buildings">건물 · 호실</a>', false,
        '진행중 계약이 없는 임대 호실을 건물별로 묶었습니다. 새 임차인이 들어오면 임대차 계약에서 등록하면 자동으로 빠집니다. 부동산에 내놓을 때는 자산 현황 아래 문자 양식을 쓰세요.') +
      '</div>';

    /* ── 5. 자산 한 줄 요약 ── */
    var bs = st.buildings.filter(function (b) { return !S.isDisposed(b); });
    var rentalBs = bs.filter(function (b) { return !S.isLodging(b); });
    var lodgingN = bs.length - rentalBs.length;
    var loanInt = U.sum(bs, function (b) { return b.loanInterest; });
    var strip = [
      ['보유 물건', bs.length + '건', '임대 ' + rentalBs.length + (lodgingN ? ' · 숙박업 ' + lodgingN : '')],
      ['보증금 총액', U.wonShort(exp.deposit), '진행중 계약 기준'],
      ['대출 잔액', U.wonShort(U.sum(bs, function (b) { return b.loanAmount; })), '전체 물건'],
      ['월 대출이자', U.wonShort(loanInt), '임대 물건 ' + U.wonShort(U.sum(rentalBs, function (b) { return b.loanInterest; }))]
    ].map(function (r) {
      return '<div><div class="t-faint" style="font-size:12px">' + r[0] + '</div><div class="t-strong mono" style="font-size:17px">' + r[1] + '</div>' +
        '<div class="t-faint" style="font-size:11.5px">' + r[2] + '</div></div>';
    }).join('');
    html += '<div style="margin-top:16px">' + UI.card('💎 자산 요약', '<div class="grid grid-4" style="gap:12px">' + strip + '</div>',
      '<a class="btn btn-sm" href="#/assets">자산 현황</a>', false,
      '보유 물건 전체의 보증금·대출·월 이자입니다. 물건별 취득가·순현금 같은 상세는 자산 현황 화면에 있습니다.') + '</div>';

    /* ── 6. 부동산 문자 양식 ── */
    if (st.templates.length) {
      var tplHTML = '<div class="row">' + st.templates.map(function (t, i) {
        return '<button class="btn btn-sm" data-act="showTemplate" data-id="' + i + '">' +
          U.esc(t.title) + '</button>';
      }).join('') + '</div>';
      html += '<div style="margin-top:16px">' +
        UI.card('✉️ 부동산 문자 양식 ' + st.templates.length + '개', tplHTML,
          '<a class="btn btn-sm" href="#/assets">자산 현황</a>', false,
          '부동산에 보낼 매도·임대 문자 양식입니다. 누르면 전문이 열리고, "전체 선택"을 누른 뒤 복사(Ctrl+C)해서 문자나 카카오톡에 붙여 넣으면 됩니다.') +
        '</div>';
    }

    el.innerHTML = html;
  }

  App.views.dashboard = {
    title: '대시보드',
    desc: '이번 달 수납 현황과 챙겨야 할 일을 한눈에 봅니다.',
    actions: function () {
      return '<button class="btn" data-act="goPayments">수납 관리</button>' +
        '<button class="btn btn-primary" data-act="gen">이번 달 청구서 생성</button>' +
        UI.help('이번 달에 유효한 계약을 모두 찾아 청구서를 한 번에 만듭니다. 이미 만들어 둔 청구서는 그대로 두니 여러 번 눌러도 안전합니다. 계약 시작·종료가 걸친 달은 일수만큼 나눠 계산합니다.');
    },
    render: render,
    handlers: {
      gen: function () {
        var cm = U.currentMonth();
        var r = App.billing.generateMonth(cm);
        UI.toast(r.created
          ? U.fmtMonth(cm) + ' 청구서 ' + r.created + '건을 생성했습니다.'
          : '새로 생성할 청구서가 없습니다. (이미 ' + r.skipped + '건 존재)', r.created ? 'ok' : '');
        App.router.refresh();
      },
      settle: function (id) {
        var inv = S.invoice(id);
        if (!inv) return;
        App.views.payments.openSettle(id);
      },
      goPayments: function () { location.hash = '#/payments'; },
      dNav: function (id, target, e) {
        if (e && e.target.closest('.help')) return;
        var parts = String(id).split(':');
        if (parts[0] === 'payments' && parts[1]) App.views.payments.handlers.tabPay(parts[1]);
        location.hash = '#/' + parts[0];
        window.scrollTo(0, 0);
      },
      dCtr: function (id) { App.views.contracts.handlers.detail(id); },
      dInv: function (id) { App.views.payments.handlers.detail(id); },
      dBld: function (id) { App.views.buildings.detail(id); },
      unpaidBld: function (id) { state.bld = id || ''; App.router.refresh(); },
      unpaidMode: function (id) { state.mode = id === 'building' ? 'building' : 'tenant'; App.router.refresh(); },
      unpaidDrill: function (id) { state.bld = id || ''; state.mode = 'tenant'; App.router.refresh(); },
      driveCheck: function () { App.drive.checkAndPreview(); },
      drivePreview: function () { App.drive.preview(); },
      seed: function () {
        UI.confirm({
          title: '샘플 데이터 불러오기',
          message: '연습용 샘플 데이터(건물 2개, 호실 8개, 계약 7건, 최근 6개월 청구·수납 내역)를 불러옵니다.\n기존 데이터는 모두 대체됩니다.',
          confirmLabel: '불러오기',
          onConfirm: function () { S.seedSample(); UI.toast('샘플 데이터를 불러왔습니다.', 'ok'); App.router.refresh(); }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 건물 · 호실 관리 */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var DISPOSE = ['매각', '이전', '타인 소유'];

  /** 대출 계좌 목록 (은행 조회 화면 기준) */
  function loansHTML(b) {
    var ls = b.loans || [];
    if (!ls.length) return '';
    var rows = ls.map(function (l) {
      var sub = [l.product, l.rate ? l.rate + '%' : '',
        U.num(l.monthly) ? '월 ' + U.comma(U.num(l.monthly)) + '원(' + (l.repay || '') + (l.payDay ? ', 매월 ' + l.payDay + '일' : '') + ')' : '',
        l.due ? '만기 ' + U.fmtDate(l.due) : '', l.autoAcct ? '출금 ' + l.autoAcct : ''].filter(Boolean);
      return '<div style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px">' +
        '<div style="display:flex;gap:8px;align-items:baseline"><b>' + U.esc(l.bank || '') + '</b>' +
        '<span class="mono">' + U.esc(l.acct || '') + '</span>' + (l.unit ? '<span class="badge badge-muted">' + U.esc(l.unit) + '</span>' : '') +
        '<span class="spacer" style="flex:1"></span><span class="mono t-strong">' + U.comma(U.num(l.balance)) + '원</span></div>' +
        '<div class="t-faint" style="font-size:12px;margin-top:2px">' + U.esc(sub.join(' · ')) +
        (U.num(l.amount) && U.num(l.amount) !== U.num(l.balance) ? ' · 원금 ' + U.comma(U.num(l.amount)) : '') + '</div></div>';
    }).join('');
    var checked = ls.map(function (l) { return l.checkedAt || ''; }).sort().pop();
    return '<h3 style="margin:18px 0 8px;font-size:13px">대출 계좌 (' + ls.length + '건' + (checked ? ' · ' + U.fmtDate(checked) + ' 은행 조회 기준' : '') + ')</h3>' + rows;
  }

  function buildingOptions() {
    return S.get().buildings.map(function (b) { return { value: b.id, label: b.name }; });
  }

  function buildingForm(id) {
    var b = id ? S.building(id) : null;
    var values = Object.assign({}, b || {});
    values.agentsText = ((b && b.agents) || []).map(function (a) {
      return [a.name, a.phone].filter(Boolean).join(',');
    }).join('\n');
    UI.form({
      title: b ? '물건 정보 수정' : '물건 추가',
      values: values,
      fields: [
        { name: 'name', label: '건물명', required: true, placeholder: '예) 행복빌라' },
        { name: 'kind', label: '종류', type: 'select', options: ['주택', '오피스텔', '아파트', '상가', '모텔', '호텔', '펜션', '기타'] },
        { name: 'operation', label: '운영 형태', type: 'select', options: [{ value: '', label: '종류에 따라 (모텔·호텔·펜션은 숙박)' }, { value: '임대', label: '임대 (월세·전세)' }, { value: '숙박', label: '숙박업 운영' }],
          hint: '숙박업은 입주·공실·월 임대료 집계에서 빠집니다.' },
        { name: 'owner', label: '명의', type: 'select', options: ['개인', '법인', '옆커폰', '옆커호텔', ''] },
        { name: 'status', label: '보유 상태', type: 'select', options: [{ value: '', label: '보유 중' }].concat(DISPOSE.map(function (s) { return { value: s, label: s }; })),
          hint: '보유 중이 아니면 입주 · 공실 · 대출 집계에서 빠지고 목록 아래 “매각 · 이전”에 모입니다. 진행 중인 계약은 넘긴 날로 종료해 주세요.' },
        { name: 'statusDate', label: '매각 · 이전일', type: 'date' },
        { name: 'caseNo', label: '사건번호', placeholder: '예) 2022타경461' },
        { name: 'brand', label: '운영 브랜드 · 지점', placeholder: '예) 브라운도트 포항죽도점 (숙박업)' },
        { name: 'address', label: '소재지', full: true, placeholder: '예) 부산광역시 수영구 호암로9번길 13' },
        { name: 'area', label: '면적', placeholder: '예) 15.3㎡ (4.6평)' },
        { name: 'bidDate', label: '취득일', type: 'date' },
        { name: 'appraisal', label: '감정가', type: 'money' },
        { name: 'bidPrice', label: '취득가(낙찰·매매)', type: 'money' },
        { name: 'loanBank', label: '대출 은행' },
        { name: 'loanAmount', label: '대출 원금', type: 'money' },
        { name: 'loanInterest', label: '월 대출이자', type: 'money' },
        { name: 'loanDue', label: '대출 만기일', type: 'date', hint: '만기 90일 전부터 인수인계 점검에 표시됩니다.' },
        { name: 'estSale', label: '예상 매매가', type: 'money' },
        { name: 'docUrl', label: '계약서 폴더 링크', full: true, placeholder: 'https://drive.google.com/...' },
        { name: 'agentsText', label: '중개사 연락처', type: 'textarea', full: true,
          hint: '한 줄에 하나씩 <b>상호,연락처</b> 형식으로 적습니다.' },
        { name: 'memo', label: '메모', type: 'textarea', full: true, hint: '관리 특이사항 등' }
      ],
      onSubmit: function (v) {
        v.agents = String(v.agentsText || '').split('\n')
          .map(function (line) { return line.trim(); }).filter(Boolean)
          .map(function (line) {
            var p = line.split(',');
            return { name: (p[0] || '').trim(), phone: (p[1] || '').trim(), memo: (p[2] || '').trim() };
          });
        delete v.agentsText;
        S.upsert('buildings', Object.assign({ id: b ? b.id : null }, v));
        UI.toast('건물을 저장했습니다.', 'ok');
        App.router.refresh();
      }
    });
  }

  function unitForm(id, prefillBuildingId) {
    var u = id ? S.unit(id) : null;
    var st = S.get();
    if (!st.buildings.length) {
      UI.toast('건물을 먼저 등록해 주세요.', 'err');
      return;
    }
    UI.form({
      title: u ? '호실 수정' : '호실 추가',
      values: u || { buildingId: prefillBuildingId || st.buildings[0].id, type: st.settings.unitTypes[0] },
      fields: [
        { name: 'buildingId', label: '건물', type: 'select', required: true, options: buildingOptions() },
        { name: 'name', label: '호실명', required: true, placeholder: '예) 201호' },
        { name: 'floor', label: '층', type: 'number' },
        { name: 'area', label: '전용면적 (㎡)', type: 'number' },
        { name: 'type', label: '유형', type: 'select', options: st.settings.unitTypes },
        { name: 'maintenanceFee', label: '기본 관리비', type: 'money', hint: '계약 등록 시 기본값으로 사용됩니다.' },
        { name: 'holder', label: '관리 구분', type: 'select', full: true,
          options: [{ value: '', label: '본사 관리 (기본)' }, { value: '지사장', label: '지사장 보유 — 통계에서 제외' }],
          hint: '지사장 보유로 두면 입주·공실·월 임대료·미납 집계에서 빠지고 “별도 관리”에서만 보입니다.' },
        { name: 'memo', label: '메모', type: 'textarea', full: true }
      ],
      onSubmit: function (v) {
        S.upsert('units', Object.assign({ id: u ? u.id : null }, v));
        UI.toast('호실을 저장했습니다.', 'ok');
        App.router.refresh();
      }
    });
  }

  function detail(id) {
    var b = S.building(id);
    if (!b) return;
    var units = S.unitsOf(id);
    var held = S.heldUnits(id);
    var occupied = units.filter(function (u) { return !!S.activeContract(u.id); }).length;
    var rent = U.sum(units, function (u) {
      var c = S.activeContract(u.id);
      return c ? U.num(c.rent) + U.num(c.maintenanceFee) : 0;
    });
    var deposit = U.sum(units, function (u) {
      var c = S.activeContract(u.id);
      return c ? U.num(c.deposit) : 0;
    });
    var interest = U.num(b.loanInterest);

    var info = [
      ['보유 상태', b.status
        ? '<span class="badge badge-muted">' + U.esc(b.status) + '</span>' + (b.statusDate ? ' ' + U.fmtDate(b.statusDate) : '') +
          ' <span class="t-faint" style="font-size:12px">· 보유 물건 집계에서 제외</span>'
        : '<span class="badge badge-ok">보유 중</span>'],
      ['명의 · 종류', [b.owner, b.kind].filter(Boolean).join(' · ') || '-'],
      ['사건번호', b.caseNo || '-'],
      ['운영', (S.isLodging(b) ? '<span class="badge badge-warn">숙박업</span> ' : '<span class="badge badge-ok">임대</span> ') + U.esc(b.brand || '')],
      ['소재지', U.esc(b.address || '-')],
      ['면적', b.area || '-'],
      ['취득일', b.bidDate ? U.fmtDate(b.bidDate) : '-'],
      ['감정가', U.num(b.appraisal) ? U.won(b.appraisal) : '-'],
      ['취득가', U.num(b.bidPrice) ? U.won(b.bidPrice) : '-'],
      ['대출', U.num(b.loanAmount)
        ? U.won(b.loanAmount) + (b.loanBank ? ' · ' + U.esc(b.loanBank) : '') +
          (interest ? '<div class="t-faint" style="font-size:12px">월 이자 ' + U.won(interest) + '</div>' : '') +
          (b.loanDue ? '<div class="t-faint" style="font-size:12px">만기 ' + U.fmtDate(b.loanDue) +
            (b.loanDue < U.todayISO() ? ' <span class="badge badge-danger">지남</span>' : '') + '</div>' : '')
        : '-'],
      ['예상 매매가', U.num(b.estSale) ? U.won(b.estSale) : '-'],
      ['호실 · 입주', units.length ? (occupied + ' / ' + units.length + '실 (공실 ' + (units.length - occupied) + ')') : '-'],
      ['별도 관리', held.length
        ? held.length + '실 <span class="t-faint">(' + U.esc(held[0].holder) + ' 보유 · 위 집계에서 제외)</span>'
        : '<span class="t-faint">없음</span>'],
      ['월 임대료', U.won(rent) + (interest ? ' <span class="t-faint">(이자 차감 후 ' + U.won(rent - interest) + ')</span>' : '')],
      ['보증금 합계', U.won(deposit)]
    ];

    var body = '<div style="display:grid;grid-template-columns:104px 1fr;gap:8px 12px;font-size:13px">' +
      info.map(function (r) { return '<div class="t-faint">' + r[0] + '</div><div>' + r[1] + '</div>'; }).join('') +
      '</div>';

    body += loansHTML(b);
    if (b.docUrl) {
      body += '<div style="margin-top:12px"><a class="btn btn-sm" href="' + U.esc(b.docUrl) +
        '" target="_blank" rel="noopener">임대차계약서 폴더 열기 ↗</a></div>';
    }
    if (b.memo) {
      body += '<div style="margin-top:12px;padding:10px;background:var(--surface-2);border-radius:8px;font-size:13px;white-space:pre-line">' +
        U.esc(b.memo) + '</div>';
    }
    var agents = S.agentsOf(id).concat(b.agents || []);
    body += '<h3 style="margin:18px 0 8px;font-size:13px">중개사 연락처 (' + agents.length + '곳)' +
      (agents.length ? ' <button class="btn btn-sm" id="agent-copy" style="margin-left:6px">📇 휴대폰 번호 복사 · 문자 발송용</button>' : '') + '</h3>';
    if (agents.length) {
      body += '<input id="agent-q" class="inline-input" type="search" placeholder="상호 · 중개사명 검색" style="width:100%;margin-bottom:8px">';
      body += '<div class="table-wrap" style="max-height:280px;overflow-y:auto"><table class="rt"><tbody id="agent-rows">' +
        agents.map(function (a) {
          var phone = a.mobile || a.phone || a.tel || '';
          return '<tr data-k="' + U.esc(((a.name || '') + ' ' + (a.agent || '')).toLowerCase()) + '">' +
            '<td data-label=""><div class="rt-v">' + U.esc(a.name) + (a.agent ? '<div class="t-faint" style="font-size:11px">' + U.esc(a.agent) + '</div>' : '') + '</div></td>' +
            '<td class="mono" data-label="연락처"><div class="rt-v">' + U.esc(U.phone(phone)) + '</div></td>' +
            '<td class="t-faint" style="font-size:11px" data-label="주소"><div class="rt-v">' + U.esc(a.addr || a.memo || '') + '</div></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      body += '<div class="t-faint" style="font-size:13px">등록된 중개사가 없습니다.</div>';
    }

    var opened = UI.open({
      title: b.name,
      body: body,
      buttons: [
        { label: '닫기', onClick: UI.close },
        { label: '정보 수정', className: 'btn-primary', onClick: function () { UI.close(); buildingForm(id); } }
      ]
    });

    var ac = opened.body.querySelector('#agent-copy');
    if (ac) ac.addEventListener('click', function () { UI.close(); App.views.salemsg.agentsModal([id], b.name); });
    var q = opened.body.querySelector('#agent-q');
    if (q) q.addEventListener('input', function () {
      var v = q.value.trim().toLowerCase();
      Array.prototype.forEach.call(opened.body.querySelectorAll('#agent-rows tr'), function (tr) {
        tr.hidden = !!v && tr.getAttribute('data-k').indexOf(v) < 0;
      });
    });
  }

  function unitRows(units) {
    return units.map(function (u) {
      var c = S.activeContract(u.id);
      var statusHTML = c
        ? '<span class="badge badge-ok">임대중</span>'
        : '<span class="badge badge-warn">공실</span>';
      var last = !c ? U.sortBy(S.contractsOfUnit(u.id).filter(function (x) { return x.endDate; }), function (x) { return x.endDate; }, true)[0] : null;
      var tenant = c
        ? App.views.notices.tenantLink(c) + ' ' + App.views.contracts.changeBadge(c) + '<div class="t-faint" style="font-size:12px">' +
          (c.rent ? '월세 ' + U.wonShort(c.rent) : c.type) +
          (c.endDate ? ' · ~' + U.fmtDate(c.endDate) : ' · 기간 미정(갱신 중)') + '</div>'
        : (last ? '<span class="t-faint">' + U.esc(last.tenantName) + ' ' + U.fmtDate(last.endDate) + ' ' + U.esc(last.endReason || '종료') + '</span>' : '<span class="t-faint">-</span>');
      return {
        cells: [
          '<span class="t-strong">' + U.esc(u.name) + '</span>',
          u.floor ? u.floor + '층' : '<span class="t-faint">-</span>',
          u.area ? u.area + '㎡' : '<span class="t-faint">-</span>',
          U.esc(u.type || '-'),
          '<span class="mono">' + (U.num(u.maintenanceFee) ? U.comma(u.maintenanceFee) : '-') + '</span>',
          statusHTML,
          tenant,
          '<button class="btn btn-sm" data-act="changeTenant" data-id="' + u.id + '">임차인 변경</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="unitHistory" data-id="' + u.id + '">이력</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="editUnit" data-id="' + u.id + '">수정</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="delUnit" data-id="' + u.id + '">삭제</button>'
        ]
      };
    });
  }

  /* 휴대폰 폭에서 보이는 한 줄 목록 — 누르면 호실 상세가 열린다 */
  function unitListHTML(units) {
    return '<div class="ulist">' + units.map(function (u) {
      var c = S.activeContract(u.id);
      var last = !c ? U.sortBy(S.contractsOfUnit(u.id).filter(function (x) { return x.endDate; }), function (x) { return x.endDate; }, true)[0] : null;
      var sub = c ? U.esc(c.tenantName || '') + (c.rent ? ' · 월세 ' + U.wonShort(c.rent) : '') + (c.endDate ? ' · ~' + U.fmtDate(c.endDate) : ' · 갱신 중')
                  : (last ? U.esc(last.tenantName) + ' ' + U.fmtDate(last.endDate) + ' 종료' : '');
      return '<div class="urow" role="button" tabindex="0" data-act="unitDetail" data-id="' + u.id + '">' +
        '<span class="urow-name">' + U.esc(u.name) + '</span>' +
        (c ? '<span class="badge badge-ok">임대중</span>' : '<span class="badge badge-warn">공실</span>') +
        '<span class="urow-sub">' + sub + '</span>' +
        '<span class="urow-go">상세 ›</span></div>';
    }).join('') + '</div>';
  }

  function unitDetail(id) {
    var u = S.unit(id);
    if (!u) return;
    var b = S.building(u.buildingId);
    var c = S.activeContract(u.id);
    var kv = function (k, v) { return '<div class="nt-kv"><span>' + k + '</span><b style="font-family:var(--font-ui);font-weight:500">' + v + '</b></div>'; };
    var body = kv('상태', c ? '<span class="badge badge-ok">임대중</span>' : '<span class="badge badge-warn">공실</span>') +
      kv('층', u.floor ? u.floor + '층' : '-') + kv('면적', u.area ? u.area + '㎡' : '-') + kv('유형', U.esc(u.type || '-')) +
      kv('기본 관리비', U.num(u.maintenanceFee) ? U.comma(u.maintenanceFee) + '원' : '-');
    if (c) {
      body += kv('임차인', App.views.notices.tenantLink(c) + (c.tenantPhone ? ' · ' + U.esc(U.phone(c.tenantPhone)) : '')) +
        kv('보증금 / 월세', U.comma(c.deposit || 0) + ' / ' + U.comma(c.rent || 0)) +
        kv('계약 기간', U.fmtDate(c.startDate) + ' ~ ' + (c.endDate ? U.fmtDate(c.endDate) : '미정(갱신 중)'));
    }
    if (u.memo) body += '<div class="nt-note" style="margin:12px 0 0"><b>메모</b><span class="nt-note-text">' + U.esc(u.memo) + '</span></div>';
    body += '<div class="row" style="margin-top:14px">' +
      '<button class="btn btn-sm btn-primary" data-act="changeTenant" data-id="' + u.id + '">임차인 변경</button>' +
      '<button class="btn btn-sm" data-act="unitHistory" data-id="' + u.id + '">이력</button>' +
      '<button class="btn btn-sm" data-act="editUnit" data-id="' + u.id + '">수정</button>' +
      (c ? '<button class="btn btn-sm" data-act="dCtr" data-id="' + c.id + '">계약 상세</button>' : '') +
      '<button class="btn btn-sm btn-ghost" data-act="delUnit" data-id="' + u.id + '">삭제</button></div>';
    UI.open({ title: (b ? b.name + ' ' : '') + u.name, body: body, buttons: [{ label: '닫기', onClick: UI.close }] });
  }

  var state = { tab: '', q: '' };

  function render(el) {
    var st = S.get();
    if (!st.buildings.length) {
      el.innerHTML = UI.empty('등록된 건물이 없습니다', '건물을 등록한 뒤 호실을 추가하세요.',
        '<button class="btn btn-primary" data-act="addBuilding">건물 추가</button>');
      return;
    }

    var rows = st.buildings.map(function (b) {
      var us = U.sortBy(S.unitsOf(b.id), function (u) { return (u.floor || 0) * 10000 + u.name; });
      var occupied = us.filter(function (u) { return !!S.activeContract(u.id); }).length;
      return {
        b: b, units: us, occupied: occupied, lodging: S.isLodging(b),
        monthly: U.sum(us, function (u) {
          var c = S.activeContract(u.id);
          return c ? U.num(c.rent) + U.num(c.maintenanceFee) : 0;
        })
      };
    });
    rows = U.sortBy(rows, function (r) { return -r.units.length; });
    var held = U.sortBy(S.heldUnits(), function (u) { return S.unitLabel(u.id); });
    var goneRows = rows.filter(function (r) { return S.isDisposed(r.b); });
    rows = rows.filter(function (r) { return !S.isDisposed(r.b); }).concat(goneRows);
    var keptRows = rows.filter(function (r) { return !S.isDisposed(r.b); });
    var lodgingRows = U.sortBy(keptRows.filter(function (r) { return r.lodging; }), function (r) { return -U.num(r.b.bidPrice); });
    var rentalRows = keptRows.filter(function (r) { return !r.lodging; });
    var FIXED = ['all', 'lodging', 'held'];
    if (FIXED.indexOf(state.tab) < 0 && !S.building(state.tab)) state.tab = rentalRows.length ? rentalRows[0].b.id : 'all';
    if (state.tab === 'held' && !held.length) state.tab = 'all';
    // 숙박업 물건을 개별 탭으로 고르면 숙박업 탭으로 보낸다
    if (FIXED.indexOf(state.tab) < 0 && S.isLodging(S.building(state.tab))) state.tab = 'lodging';

    /* 왼쪽 목록: 임대 건물은 한 줄씩, 숙박업 물건은 한 줄로 모은다 */
    var q = state.q.trim().toLowerCase();
    var hit = function (r) {
      if (!q) return true;
      return ((r.b.name || '') + ' ' + (r.b.address || '')).toLowerCase().indexOf(q) >= 0;
    };
    var shownRental = rentalRows.filter(hit);
    var listHTML =
      '<aside class="blist">' +
      '<div class="blist-search"><input id="b-q" type="search" placeholder="건물 이름 · 주소 검색" value="' + U.esc(state.q) + '"></div>' +
      '<div class="blist-scroll">' +
      (q ? '' :
        '<button class="bitem' + (state.tab === 'all' ? ' active' : '') + '" data-act="tabBuilding" data-id="all">' +
        '<span class="bitem-name">전체 요약</span><span class="bitem-cnt">' + keptRows.length + '건</span></button>') +
      (shownRental.length ? '<div class="blist-head">임대 물건 ' + shownRental.length + '</div>' : '') +
      shownRental.map(function (r) {
        var vac = r.units.length - r.occupied;
        return '<button class="bitem' + (state.tab === r.b.id ? ' active' : '') +
          '" data-act="tabBuilding" data-id="' + r.b.id + '">' +
          '<span class="bitem-name">' + U.esc(r.b.name) + '</span>' +
          (r.units.length ? '<span class="bitem-cnt">' + r.occupied + '/' + r.units.length + '</span>' : '') +
          (vac > 0 ? '<span class="bitem-vac" title="공실 ' + vac + '실">' + vac + '</span>' : '') +
          '</button>';
      }).join('') +
      (lodgingRows.filter(hit).length
        ? '<div class="blist-head">숙박업 운영</div>' +
          '<button class="bitem' + (state.tab === 'lodging' ? ' active' : '') +
          '" data-act="tabBuilding" data-id="lodging"><span class="bitem-name">숙박업 물건</span>' +
          '<span class="bitem-cnt">' + lodgingRows.length + '건</span></button>'
        : '') +
      (held.length && !q
        ? '<div class="blist-head">별도 관리</div>' +
          '<button class="bitem' + (state.tab === 'held' ? ' active' : '') +
          '" data-act="tabBuilding" data-id="held"><span class="bitem-name">지사장 보유분</span>' +
          '<span class="bitem-cnt">' + held.length + '실</span></button>'
        : '') +
      (goneRows.filter(hit).length
        ? '<div class="blist-head">매각 · 이전 ' + goneRows.filter(hit).length + '</div>' +
          goneRows.filter(hit).map(function (r) {
            return '<button class="bitem' + (state.tab === r.b.id ? ' active' : '') +
              '" data-act="tabBuilding" data-id="' + r.b.id + '" style="opacity:.7">' +
              '<span class="bitem-name">' + U.esc(r.b.name) + '</span>' +
              '<span class="bitem-cnt">' + U.esc(r.b.status) + '</span></button>';
          }).join('')
        : '') +
      (q && !shownRental.length && !lodgingRows.filter(hit).length && !goneRows.filter(hit).length
        ? '<div class="blist-empty">검색 결과가 없습니다.</div>' : '') +
      '</div></aside>';

    /** 왼쪽 목록 + 오른쪽 본문을 함께 그리고 검색창을 연결한다 */
    function paint(mainHTML) {
      el.innerHTML = '<div class="bsplit">' + listHTML + '<div class="bmain">' + mainHTML + '</div></div>';
      var qEl = document.getElementById('b-q');
      if (!qEl) return;
      UI.onType(qEl, function (v) { state.q = v; App.router.refresh(true); });
    }

    var html = '';

    /* 별도 관리 (지사장 보유분 등) */
    if (state.tab === 'held') {
      var holders = {};
      held.forEach(function (u) { holders[u.holder] = (holders[u.holder] || 0) + 1; });
      var occ = held.filter(function (u) { return !!S.activeContract(u.id); }).length;
      html += '<div class="tab-meta">' +
        '<span class="m t-dim">지사장님이 보유·관리하는 호실입니다. 대표님 통계(입주·공실·월 임대료·미납·청구서 생성)에서 모두 빠지며, 여기서만 따로 봅니다.</span>' +
        '<span class="m">호실<b>' + held.length + '</b></span>' +
        '<span class="m">임대중<b>' + occ + '</b></span>' +
        '<span class="m">공실<b>' + (held.length - occ) + '</b></span>' +
        Object.keys(holders).map(function (h) {
          return '<span class="badge badge-info">' + U.esc(h) + ' ' + holders[h] + '실</span>';
        }).join('') +
        '</div>';
      var hrows = held.map(function (u) {
        var c = S.activeContract(u.id);
        var b2 = S.building(u.buildingId);
        return { cells: [
          U.esc(b2 ? b2.name : '-'),
          '<span class="t-strong">' + U.esc(u.name) + '</span>',
          u.floor ? u.floor + '층' : '<span class="t-faint">-</span>',
          '<span class="badge badge-info">' + U.esc(u.holder) + '</span>',
          c ? '<span class="badge badge-ok">임대중</span>' : '<span class="badge badge-warn">공실</span>',
          c ? App.views.notices.tenantLink(c) + '<div class="t-faint" style="font-size:12px">' +
              (c.rent ? '월세 ' + U.wonShort(c.rent) : c.type) + '</div>'
            : '<span class="t-faint">-</span>',
          '<span class="t-dim" style="font-size:12px;white-space:normal;min-width:220px">' + U.esc(u.memo || '') + '</span>',
          '<button class="btn btn-sm" data-act="changeTenant" data-id="' + u.id + '">임차인 변경</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="unitHistory" data-id="' + u.id + '">이력</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="editUnit" data-id="' + u.id + '">수정</button>'
        ] };
      });
      html += UI.card('', UI.table(['건물', '호실', '층', '보유', '상태', '임차인', '메모',
        { label: '', className: 'actions' }], hrows), '', true);
      html += '<p class="t-faint" style="font-size:12px;margin:12px 0 0">호실을 본사 관리로 되돌리려면 그 호실의 <b>수정</b>에서 “관리 구분”을 <b>본사 관리</b>로 바꾸면 됩니다.</p>';
      paint(html);
      return;
    }

    /* 숙박업 탭 */
    if (state.tab === 'lodging') {
      var rooms = U.sum(lodgingRows, function (r) { return r.units.length || U.num(r.b.unitCount); });
      html += '<div class="tab-meta">' +
        '<span class="m t-dim">월세 임대가 아니라 숙박업으로 운영하는 물건입니다. 입주·공실·월 임대료 집계에서 빠지며, 여기서는 자산 정보만 관리합니다.</span>' +
        '<span class="m">물건<b>' + lodgingRows.length + '</b></span>' +
        '<span class="m">객실<b>' + rooms + '</b></span>' +
        '<span class="m">취득가<b>' + U.wonShort(U.sum(lodgingRows, function (r) { return r.b.bidPrice; })) + '</b></span>' +
        '<span class="m">대출<b>' + U.wonShort(U.sum(lodgingRows, function (r) { return r.b.loanAmount; })) + '</b></span>' +
        '<span class="m">월 이자<b>' + U.wonShort(U.sum(lodgingRows, function (r) { return r.b.loanInterest; })) + '</b></span>' +
        '</div>';
      var lbody = lodgingRows.map(function (r) {
        var b = r.b;
        return { cells: [
          '<span class="t-strong">' + U.esc(b.name) + '</span>' +
            (b.caseNo ? '<div class="t-faint" style="font-size:11px">' + U.esc(b.caseNo) + '</div>' : ''),
          '<span class="badge badge-muted">' + U.esc(b.kind || '숙박') + '</span>',
          b.owner ? U.esc(b.owner) : '-',
          b.brand ? U.esc(b.brand) : '<span class="t-faint">-</span>',
          '<span class="mono">' + ((r.units.length || U.num(b.unitCount)) || '<span class="t-faint">-</span>') + '</span>',
          '<span class="t-dim" style="font-size:12px">' + U.esc(b.address || '-') + '</span>',
          '<span class="mono">' + (U.num(b.bidPrice) ? U.comma(b.bidPrice) : '-') + '</span>',
          '<span class="mono">' + (U.num(b.loanAmount) ? U.comma(b.loanAmount) : '-') +
            (b.loanBank ? '<div class="t-faint" style="font-size:11px">' + U.esc(b.loanBank) + '</div>' : '') + '</span>',
          '<span class="mono">' + (U.num(b.loanInterest) ? U.comma(b.loanInterest) : '-') + '</span>',
          '<span class="t-dim" style="font-size:12px;white-space:normal;min-width:220px">' + U.esc(b.memo || '') + '</span>',
          '<button class="btn btn-sm btn-ghost" data-act="detailBuilding" data-id="' + b.id + '">자산 정보</button>' +
          '<button class="btn btn-sm btn-ghost" data-act="editBuilding" data-id="' + b.id + '">수정</button>'
        ] };
      });
      html += UI.card('', UI.table(['물건', '종류', '명의', '운영 브랜드 · 지점', { label: '객실', className: 'num' }, '소재지',
        { label: '취득가', className: 'num' }, { label: '대출', className: 'num' }, { label: '월 이자', className: 'num' },
        '메모', { label: '', className: 'actions' }], lbody), '', true);
      paint(html);
      return;
    }

    if (state.tab === 'all') {
      var sum = { units: 0, occupied: 0, monthly: 0 };
      var body = rentalRows.concat(lodgingRows).map(function (r) {
        sum.units += r.units.length; sum.occupied += r.occupied; sum.monthly += r.monthly;
        var vac = r.units.length ? Math.round((r.units.length - r.occupied) / r.units.length * 1000) / 10 : null;
        if (r.lodging) { sum.units -= r.units.length; sum.occupied -= r.occupied; }
        return { cells: [
          '<button class="btn btn-sm btn-ghost" data-act="tabBuilding" data-id="' + (r.lodging ? 'lodging' : r.b.id) + '" ' +
            'style="padding:0;font-weight:600">' + U.esc(r.b.name) + '</button>' +
          (r.b.caseNo ? '<div class="t-faint" style="font-size:11px">' + U.esc(r.b.caseNo) + '</div>' : ''),
          (r.b.kind ? '<span class="badge badge-muted">' + U.esc(r.b.kind) + '</span>' : '-') +
            (r.lodging ? ' <span class="badge badge-warn">숙박</span>' : ''),
          r.b.owner ? U.esc(r.b.owner) : '-',
          '<span class="t-dim" style="font-size:12px">' + U.esc(r.b.address || '-') + '</span>',
          r.lodging ? '<span class="t-faint">객실 ' + (r.units.length || U.num(r.b.unitCount) || 0) + '</span>'
            : r.units.length ? (r.occupied + ' / ' + r.units.length) : '<span class="t-faint">-</span>',
          r.lodging || vac === null ? '<span class="t-faint">-</span>' : vac + '%',
          '<span class="mono">' + (r.monthly ? U.comma(r.monthly) : '-') + '</span>',
          '<button class="btn btn-sm btn-ghost" data-act="detailBuilding" data-id="' + r.b.id + '">자산 정보</button>'
        ] };
      });
      body.push({ attrs: ' style="background:var(--surface-2);font-weight:600"',
        cells: ['합계', '', '', '', sum.occupied + ' / ' + sum.units, '',
                '<span class="mono">' + U.comma(sum.monthly) + '</span>', ''] });
      html += UI.card('', UI.table(['건물', '종류', '명의', '소재지', '입주/호실',
        { label: '공실률', className: 'num' }, { label: '월 임대료', className: 'num' },
        { label: '', className: 'actions' }], body), '', true);
      paint(html);
      return;
    }

    /* 건물 하나 */
    var r = rows.filter(function (x) { return x.b.id === state.tab; })[0];
    var b = r.b;
    html += '<div class="tab-meta">' +
      '<span class="m t-dim">' + U.esc(b.address || '주소 미등록') + '</span>' +
      (b.kind ? '<span class="badge badge-muted">' + U.esc(b.kind) + '</span>' : '') +
      (b.owner ? '<span class="badge badge-info">' + U.esc(b.owner) + '</span>' : '') +
      (b.status ? '<span class="badge badge-danger">' + U.esc(b.status) + (b.statusDate ? ' ' + U.fmtDate(b.statusDate) : '') + ' · 집계 제외</span>' : '') +
      (r.lodging ? '<span class="badge badge-warn">숙박업 운영</span>' : '') +
      '<span class="m">' + (r.lodging ? '객실' : '호실') + '<b>' + (r.units.length || U.num(b.unitCount) || 0) + '</b></span>' +
      (r.lodging || b.status ? '' :
        '<span class="m">임대중<b>' + r.occupied + '</b></span>' +
        '<span class="m">공실<b>' + (r.units.length - r.occupied) + '</b></span>' +
        '<span class="m">월 임대료<b>' + U.wonShort(r.monthly) + '</b></span>') +
      (U.num(b.loanInterest) ? '<span class="m">월 이자<b>' + U.wonShort(b.loanInterest) + '</b></span>' : '') +
      (S.heldUnits(b.id).length
        ? '<span class="m">별도 관리<b>' + S.heldUnits(b.id).length + '</b>' +
          ' <button class="btn btn-sm btn-ghost" data-act="tabBuilding" data-id="held" style="padding:0 4px">보기</button></span>'
        : '') +
      '<div class="spacer"></div>' +
      '<span class="tab-actions">' +
      '<button class="btn btn-sm" data-act="addUnit" data-id="' + b.id + '">＋ 호실</button>' +
      '<button class="btn btn-sm" data-act="detailBuilding" data-id="' + b.id + '">자산 정보</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="editBuilding" data-id="' + b.id + '">수정</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="delBuilding" data-id="' + b.id + '">삭제</button>' +
      '</span></div>';

    var headers = ['호실', '층', '면적', '유형', { label: '기본 관리비', className: 'num' },
                   '상태', '임차인', { label: '', className: 'actions' }];
    html += UI.card('', r.units.length
      ? '<div class="hide-m">' + UI.table(headers, unitRows(r.units)) + '</div><div class="only-m">' + unitListHTML(r.units) + '</div>'
      : UI.empty('등록된 호실이 없습니다',
          U.num(b.unitCount) ? '관리표상 ' + U.num(b.unitCount) + '개 호실 물건입니다. 호실을 추가하면 임대 관리를 시작할 수 있습니다.'
                             : '이 건물에 호실을 추가해 주세요.',
          '<button class="btn btn-primary" data-act="addUnit" data-id="' + b.id + '">＋ 호실 추가</button>'),
      '', true);
    if (b.memo) {
      html += '<div class="card" style="margin-top:16px"><div class="card-body t-dim" style="font-size:13px;white-space:pre-line">' +
        U.esc(b.memo) + '</div></div>';
    }
    paint(html);
  }

  App.views.buildings = {
    title: '건물 · 호실',
    desc: '보유 건물과 호실을 등록하고 공실 여부를 확인합니다.',
    actions: function () {
      return '<button class="btn" data-act="addUnit">＋ 호실 추가</button>' +
        '<button class="btn btn-primary" data-act="addBuilding">＋ 건물 추가</button>';
    },
    render: render,
    detail: detail,
    handlers: {
      addBuilding: function () { buildingForm(null); },
      detailBuilding: function (id) { detail(id); },
      tabBuilding: function (id) { state.tab = id; App.router.refresh(); window.scrollTo(0, 0); },
      editBuilding: function (id) { buildingForm(id); },
      delBuilding: function (id) {
        var b = S.building(id);
        var units = S.unitsOf(id, true);
        UI.confirm({
          title: '건물 삭제',
          danger: true,
          confirmLabel: '삭제',
          message: '"' + b.name + '"을(를) 삭제하면 소속 호실 ' + units.length + '개와 그 계약·청구 내역이 함께 삭제됩니다.\n되돌릴 수 없습니다.',
          onConfirm: function () {
          S.removeBuilding(id);
          if (state.tab === id) state.tab = '';
          UI.toast('삭제했습니다.');
          App.router.refresh();
        }
        });
      },
      addUnit: function (id) { unitForm(null, id); },
      changeTenant: function (id) { App.views.contracts.changeTenant(id); },
      unitDetail: function (id) { unitDetail(id); },
      unitHistory: function (id) { App.views.contracts.unitHistory(id); },
      editUnit: function (id) { unitForm(id); },
      delUnit: function (id) {
        var u = S.unit(id);
        var cs = S.contractsOfUnit(id);
        UI.confirm({
          title: '호실 삭제',
          danger: true,
          confirmLabel: '삭제',
          message: '"' + S.unitLabel(id) + '"을(를) 삭제합니다.' +
            (cs.length ? '\n연결된 계약 ' + cs.length + '건과 청구 내역도 함께 삭제됩니다.' : ''),
          onConfirm: function () { S.removeUnit(id); UI.toast('삭제했습니다.'); App.router.refresh(); }
        });
      }
    }
  };
})(window.App);

</script>
<script>
/* 임대차 계약 관리 */
(function (App) {
  var U = App.util, S = App.store, B = App.billing, UI = App.ui;
  App.views = App.views || {};

  var filter = { buildingId: '', status: 'active', q: '', change: '' };

  function contractStatus(c) {
    var today = U.todayISO();
    if (c.startDate > today) return 'scheduled';
    if (c.endDate && c.endDate < today) return 'ended';
    return 'active';
  }

  var ST_LABEL = { active: '진행중', ended: '만료', scheduled: '예정' };
  var ST_BADGE = { active: 'badge-ok', ended: 'badge-muted', scheduled: 'badge-info' };

  /* 변경 구분: 이 계약이 어떻게 시작됐는지 / 어떻게 끝났는지 */
  var CHANGE_TYPES = ['신규', '승계', '재계약'];
  var END_REASONS = ['', '만료', '퇴실', '승계', '명도', '기타'];
  var CHANGE_BADGE = { '신규': 'badge-info', '승계': 'badge-warn', '재계약': 'badge-ok' };
  var END_BADGE = { '만료': 'badge-muted', '퇴실': 'badge-muted', '승계': 'badge-warn', '명도': 'badge-danger', '기타': 'badge-muted' };

  function changeBadge(c) {
    var out = '';
    if (c.changeType) out += '<span class="badge ' + (CHANGE_BADGE[c.changeType] || 'badge-muted') + '">' + U.esc(c.changeType) + '</span> ';
    if (c.endReason && c.endDate) out += '<span class="badge ' + (END_BADGE[c.endReason] || 'badge-muted') + '">' + U.esc(c.endReason) + (c.endReason === '승계' ? ' 인계' : '') + '</span>';
    return out;
  }

  function unitOptions() {
    return U.sortBy(S.get().units, function (u) { return S.unitLabel(u.id); })
      .map(function (u) {
        var c = S.activeContract(u.id);
        return { value: u.id, label: S.unitLabel(u.id) + (c ? ' (임대중 · ' + c.tenantName + ')' : ' (공실)') };
      });
  }

  function contractForm(id, preset) {
    var c = id ? S.contract(id) : null;
    var st = S.get();
    if (!st.units.length) { UI.toast('호실을 먼저 등록해 주세요.', 'err'); return; }

    var defaults = {
      type: '월세', changeType: '신규',
      payDay: st.settings.defaultPayDay,
      startDate: U.todayISO(),
      endDate: U.addDays(U.addMonthsDate(U.todayISO(), 24), -1)
    };

    UI.form({
      title: c ? '계약 수정' : (preset ? '재계약 등록' : '계약 등록'),
      submitLabel: '저장',
      values: c || Object.assign(defaults, preset || {}),
      fields: [
        { name: 'unitId', label: '호실', type: 'select', required: true, options: unitOptions(), full: true },
        { name: 'tenantName', label: '임차인', required: true },
        { name: 'tenantPhone', label: '연락처', type: 'tel', placeholder: '010-0000-0000' },
        { name: 'type', label: '계약 형태', type: 'select', options: ['월세', '전세', '반전세', '단기임대'] },
        { name: 'payDay', label: '납부일', type: 'number', min: 1, max: 31, hint: '매월 며칠에 납부하는지 (예: 25)' },
        { name: 'deposit', label: '보증금', type: 'money' },
        { name: 'rent', label: '월세', type: 'money', hint: '전세면 0으로 둡니다.' },
        { name: 'maintenanceFee', label: '월 관리비', type: 'money' },
        { name: 'startDate', label: '계약 시작일', type: 'date', required: true },
        { name: 'endDate', label: '계약 만료일', type: 'date', required: true, full: true },
        { name: 'changeType', label: '변경 구분', type: 'select', options: CHANGE_TYPES,
          hint: '신규 입주인지, 앞 임차인에게서 승계했는지, 같은 임차인 재계약인지' },
        { name: 'endReason', label: '종료 사유', type: 'select',
          options: END_REASONS.map(function (r) { return { value: r, label: r || '(진행 중 · 미정)' }; }),
          hint: '계약이 끝났을 때만 고릅니다' },
        { name: 'memo', label: '메모', type: 'textarea', full: true, hint: '특약사항, 중개사, 계좌 등' }
      ],
      onRender: function (formEl) {
        var unitSel = formEl.querySelector('[name="unitId"]');
        var feeInput = formEl.querySelector('[name="maintenanceFee"]');
        unitSel.addEventListener('change', function () {
          var u = S.unit(unitSel.value);
          if (u && U.num(u.maintenanceFee) && !U.num(feeInput.value)) {
            feeInput.value = U.comma(u.maintenanceFee);
          }
        });
      },
      onSubmit: function (v) {
        var errors = {};
        if (v.endDate && v.startDate && v.endDate < v.startDate) errors.endDate = '만료일이 시작일보다 빠릅니다.';
        var overlap = S.contractsOfUnit(v.unitId).filter(function (o) {
          if (c && o.id === c.id) return false;
          return o.startDate <= v.endDate && (!o.endDate || o.endDate >= v.startDate);
        });
        if (overlap.length) {
          errors.unitId = '같은 기간에 이미 계약이 있습니다 (' + overlap[0].tenantName + ' · ~' + U.fmtDate(overlap[0].endDate) + ').';
        }
        if (Object.keys(errors).length) return errors;

        S.upsert('contracts', Object.assign({ id: c ? c.id : null }, v, { payDay: U.num(v.payDay) || 1 }));
        UI.toast('계약을 저장했습니다.', 'ok');
        App.router.refresh();
      }
    });
  }

  function detail(id) {
    var c = S.contract(id);
    if (!c) return;
    var invoices = U.sortBy(
      S.get().invoices.filter(function (i) { return i.contractId === id; }),
      function (i) { return i.ym; }, true
    );
    var billed = U.sum(invoices, function (i) { return i.total; });
    var paid = U.sum(invoices, function (i) { return B.paidAmount(i); });
    var offset = U.sum(invoices, function (i) { return B.offsetAmount(i); });
    var prev = c.prevContractId ? S.contract(c.prevContractId) : null;
    var next = S.get().contracts.filter(function (o) { return o.prevContractId === c.id; })[0] || null;

    var rows = invoices.slice(0, 24).map(function (inv) {
      return { cells: [
        U.fmtMonth(inv.ym),
        U.fmtDate(inv.dueDate),
        '<span class="mono">' + U.comma(inv.total) + '</span>',
        '<span class="mono">' + U.comma(B.paidAmount(inv)) + '</span>',
        B.statusBadge(inv) + B.offsetBadge(inv)
      ] };
    });

    var info = [
      ['호실', S.unitLabel(c.unitId)],
      ['임차인', App.views.notices.tenantLink(c) + (c.tenantPhone ? ' · ' + U.phone(c.tenantPhone) : '')],
      ['계약 형태', c.type],
      ['계약 기간', U.fmtDate(c.startDate) + ' ~ ' + U.fmtDate(c.endDate) +
        (contractStatus(c) === 'active' && c.endDate ? ' (D-' + U.diffDays(U.todayISO(), c.endDate) + ')' : '')],
      ['보증금', U.won(c.deposit)],
      ['월세 / 관리비', U.won(c.rent) + ' / ' + U.won(c.maintenanceFee)],
      ['납부일', '매월 ' + (c.payDay || 1) + '일'],
      c.noBilling ? ['청구서', '<span class="badge badge-muted">만들지 않음</span> ' + U.esc(c.noBillingNote || '')] : null,
      ['누적 청구 / 수납', U.won(billed) + ' / ' + U.won(paid) +
        (billed ? ' (' + U.pct(paid, billed) + '%)' : '') +
        (offset ? '<div style="margin-top:3px"><span class="badge badge-special">보증금 상계 ' + U.won(offset) + '</span> <span class="t-faint" style="font-size:12px">수납액 중 통장 입금이 아닌 보증금 상계분 · 실제 입금 ' + U.won(paid - offset) + '</span></div>' : '')],
      ['변경 구분', (changeBadge(c) || '<span class="t-faint">-</span>') +
        (prev ? '<div class="t-faint" style="font-size:12px;margin-top:3px">이전 임차인 ' + U.esc(prev.tenantName) + ' (' + U.fmtDate(prev.startDate) + ' ~ ' + U.fmtDate(prev.endDate) + ')</div>' : '') +
        (next ? '<div class="t-faint" style="font-size:12px;margin-top:3px">다음 임차인 ' + U.esc(next.tenantName) + ' (' + U.fmtDate(next.startDate) + ' ~)</div>' : '')]
    ];

    var body = '<div style="display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px">' +
      info.filter(Boolean).map(function (r) {
        return '<div class="t-faint">' + r[0] + '</div><div>' + r[1] + '</div>';
      }).join('') + '</div>' +
      (c.memo ? '<div style="margin-top:12px;padding:10px;background:var(--surface-2);border-radius:8px;font-size:13px;white-space:pre-line">' + U.esc(c.memo) + '</div>' : '') +
      ((c.receipts || []).length ? '<h3 style="margin:18px 0 8px;font-size:13px">입금 기록 (청구서 없음)</h3>' +
        UI.table(['입금일', { label: '금액', className: 'num' }, '메모'], U.sortBy(c.receipts, function (p) { return p.date; }, true).map(function (p) {
          return { cells: ['<span class="mono">' + U.fmtDate(p.date) + '</span>', '<span class="mono">' + U.comma(p.amount) + '</span>',
            '<span class="t-faint" style="font-size:12px;white-space:normal">' + U.esc(p.memo || '') + '</span>'] };
        })) : '') +
      '<h3 style="margin:18px 0 8px;font-size:13px">청구 · 수납 이력</h3>' +
      (rows.length
        ? UI.table(['청구월', '납부기한', { label: '청구액', className: 'num' }, { label: '수납액', className: 'num' }, '상태'], rows)
        : '<div class="t-faint" style="font-size:13px">청구 내역이 없습니다.</div>');

    UI.open({
      title: '계약 상세',
      body: body,
      buttons: [
        { label: '호실 이력', onClick: function () { UI.close(); unitHistory(c.unitId); } },
        { label: '임차인 변경', onClick: function () { UI.close(); changeTenant(c.unitId); } },
        { label: '재계약', onClick: function () {
          UI.close();
          contractForm(null, {
            unitId: c.unitId, tenantName: c.tenantName, tenantPhone: c.tenantPhone,
            type: c.type, deposit: c.deposit, rent: c.rent, maintenanceFee: c.maintenanceFee,
            payDay: c.payDay, changeType: '재계약', prevContractId: c.id,
            startDate: U.addDays(c.endDate, 1),
            endDate: U.addDays(U.addMonthsDate(U.addDays(c.endDate, 1), 24), -1)
          });
        } },
        { label: '수정', className: 'btn-primary', onClick: function () { UI.close(); contractForm(id); } }
      ]
    });
  }

  /**
   * 임차인 변경 마법사 — 한 호실에서 앞 계약을 끝내고 새 계약을 만드는 일을 한 화면에서 처리한다.
   * 승계: 앞 임차인이 나가고 새 임차인이 바로 이어 들어옴 / 신규: 공실이었거나 앞 계약이 이미 끝난 뒤 새로 들어옴 / 퇴실: 나가고 공실
   */
  function changeTenant(unitId) {
    var st = S.get();
    var u = S.unit(unitId);
    if (!u) return;
    var cur = S.activeContract(unitId) || U.sortBy(S.contractsOfUnit(unitId).filter(function (c) { return !c.endDate || c.endDate >= U.todayISO(); }), function (c) { return c.startDate; }, true)[0] || null;
    var today = U.todayISO();
    var defaults = {
      changeType: cur ? '승계' : '신규',
      oldEnd: cur ? today : '',
      oldReason: '승계',
      startDate: U.addDays(today, 1),
      endDate: U.addDays(U.addMonthsDate(U.addDays(today, 1), 12), -1),
      type: '월세', payDay: cur ? cur.payDay : st.settings.defaultPayDay,
      deposit: cur ? cur.deposit : '', rent: cur ? cur.rent : '', maintenanceFee: cur ? cur.maintenanceFee : U.num(u.maintenanceFee) || '',
      prorateLast: true
    };
    var fields = [];
    if (cur) {
      fields.push(
        { name: 'changeType', label: '변경 구분', type: 'select', full: true,
          options: [{ value: '승계', label: '승계 — ' + cur.tenantName + ' 님이 나가고 새 임차인이 이어서 입주' },
                    { value: '신규', label: '신규 입주 — 앞 계약을 끝내고 새로 계약' },
                    { value: '퇴실', label: '퇴실만 — ' + cur.tenantName + ' 님 계약 종료, 공실로' }] },
        { name: 'oldEnd', label: cur.tenantName + ' 님 계약 종료일', type: 'date', required: true,
          hint: '보통 새 임차인 입주 전날입니다. 이 날짜로 앞 계약이 끝나고 마지막 달 청구서가 일할 계산됩니다.' },
        { name: 'oldReason', label: '종료 사유', type: 'select', options: ['승계', '퇴실', '만료', '명도', '기타'] },
        { name: 'prorateLast', label: '마지막 달 청구서', type: 'checkbox', checkLabel: '종료일까지 일수로 다시 계산 (달력 기준 1일~종료일 · 이미 낸 달은 그대로 둠)',
          hint: '납부일 주기(예: 4일~다음 달 3일)로 정산하려면 저장 후 수납·미납에서 그 청구서 금액을 직접 고치세요.' },
        { name: 'settle', label: '정산 메모', type: 'textarea', full: true,
          placeholder: '예) 보증금 200만 중 미납 공제 후 반환액과 날짜, 청소비·공과금 정산 내용' }
      );
    } else {
      fields.push({ name: 'changeType', label: '변경 구분', type: 'select', full: true,
        options: [{ value: '신규', label: '신규 입주 — 공실에 새 임차인' }] });
    }
    fields.push(
      { name: 'tenantName', label: '새 임차인', required: false },
      { name: 'tenantPhone', label: '연락처', type: 'tel', placeholder: '010-0000-0000' },
      { name: 'type', label: '계약 형태', type: 'select', options: ['월세', '전세', '반전세', '단기임대'] },
      { name: 'payDay', label: '납부일', type: 'number', min: 1, max: 31 },
      { name: 'deposit', label: '보증금', type: 'money' },
      { name: 'rent', label: '월세', type: 'money' },
      { name: 'maintenanceFee', label: '월 관리비', type: 'money' },
      { name: 'startDate', label: '새 계약 시작일', type: 'date' },
      { name: 'endDate', label: '새 계약 만료일', type: 'date' },
      { name: 'memo', label: '새 계약 메모', type: 'textarea', full: true, hint: '특약, 계약금 수령일, 중개사 등' }
    );

    UI.form({
      title: '임차인 변경 — ' + S.unitLabel(unitId) + (cur ? ' (현재 ' + cur.tenantName + ')' : ' (공실)'),
      submitLabel: '변경 저장',
      values: defaults,
      fields: fields,
      onRender: function (formEl) {
        // 퇴실만 고르면 새 계약 칸을 숨긴다
        var sel = formEl.querySelector('[name="changeType"]');
        var newFields = ['tenantName', 'tenantPhone', 'type', 'payDay', 'deposit', 'rent', 'maintenanceFee', 'startDate', 'endDate', 'memo'];
        function sync() {
          var leaving = sel && sel.value === '퇴실';
          newFields.forEach(function (n) { var f = formEl.querySelector('[data-field="' + n + '"]'); if (f) f.hidden = leaving; });
          var reason = formEl.querySelector('[name="oldReason"]');
          if (reason && sel) reason.value = sel.value === '승계' ? '승계' : (sel.value === '퇴실' ? '퇴실' : reason.value);
        }
        if (sel) { sel.addEventListener('change', sync); sync(); }
        var oldEnd = formEl.querySelector('[name="oldEnd"]'), start = formEl.querySelector('[name="startDate"]'), end = formEl.querySelector('[name="endDate"]');
        if (oldEnd && start) oldEnd.addEventListener('change', function () {
          if (!oldEnd.value) return;
          start.value = U.addDays(oldEnd.value, 1);
          end.value = U.addDays(U.addMonthsDate(start.value, 12), -1);
        });
        if (start && end) start.addEventListener('change', function () { if (start.value) end.value = U.addDays(U.addMonthsDate(start.value, 12), -1); });
      },
      onSubmit: function (v) {
        var errors = {};
        var leaving = v.changeType === '퇴실';
        if (cur && !v.oldEnd) errors.oldEnd = '종료일을 넣어 주세요.';
        if (cur && v.oldEnd && v.oldEnd < cur.startDate) errors.oldEnd = '앞 계약 시작일보다 빠릅니다.';
        if (!leaving) {
          if (!v.tenantName) errors.tenantName = '새 임차인 이름을 넣어 주세요.';
